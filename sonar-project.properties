# SonarQube Cloud - single project spanning both languages in this monorepo.
#
# ONE project, not two. The frontend and the backend are halves of one product and share
# vocabulary across the client/server seam; splitting them into two Sonar projects would put
# the two sides of every contract in two different dashboards with two different New Code
# baselines, which is the opposite of what this repo needs.
#
# Repo is PUBLIC, so the SonarQube Cloud free tier applies with NO lines-of-code cap. The 50k
# LOC limit people remember is the *private*-repo free tier. This project measures ~185k raw
# lines in sonar.sources alone, so on a private repo it would not have fit.

sonar.projectKey=yatishpatil101_Learning
sonar.organization=yatishpatil101
sonar.projectName=Draazy
sonar.projectVersion=0.1.0

# UTF-8 is the repo's actual encoding. Stating it matters on Windows, where a scanner left to
# guess picks the console codepage (cp1252) and turns every em-dash in a comment into mojibake
# before the rules ever see it.
sonar.sourceEncoding=UTF-8


# ---------------------------------------------------------------------------------------------
# Sources and tests
# ---------------------------------------------------------------------------------------------
# Production code. e2e/ and backend/src/test are NOT here - they are in sonar.tests below, where
# Sonar applies the test-specific rule set instead of the production one. Listing a test tree as
# a source is a common misconfiguration: it reports assertions as duplicated code and demands
# production-grade error handling from fixtures.
sonar.sources=frontend/src,backend/src/main/java

sonar.tests=backend/src/test,e2e


# ---------------------------------------------------------------------------------------------
# Java analysis - REQUIRES compiled bytecode
# ---------------------------------------------------------------------------------------------
# WITHOUT sonar.java.binaries POINTING AT REAL .class FILES, SONARJAVA SKIPS THE MODULE AND
# REPORTS ZERO JAVA ISSUES - which is indistinguishable from "the Java is clean". The CI job
# therefore compiles before it scans; see the `sonar` job in .github/workflows/ci.yml.
#
# The path is `target-cli`, not `target`, because backend/.mvn/maven.config applies
# -DbuildDirName=target-cli to every command-line Maven build. `target` belongs to the VS Code
# Java language server and is deliberately not shared. Change one, change the other.
sonar.java.binaries=backend/target-cli/classes
sonar.java.test.binaries=backend/target-cli/test-classes

# Third-party jars, populated by `mvn dependency:copy-dependencies` in the CI job. Without them
# SonarJava cannot resolve types it does not own, and silently downgrades or drops every rule
# that needs a resolved type - a partial analysis that still reports "success".
sonar.java.libraries=backend/target-cli/deps/*.jar
sonar.java.test.libraries=backend/target-cli/deps/*.jar

sonar.java.source=25


# ---------------------------------------------------------------------------------------------
# Exclusions - one reason each
# ---------------------------------------------------------------------------------------------
sonar.exclusions=\
  backend/target/**,\
  backend/target-*/**,\
  frontend/dist/**,\
  frontend/public/**,\
  graphify-out/**,\
  e2e/playwright-report/**,\
  e2e/test-results/**,\
  **/node_modules/**,\
  frontend/src/data/societies-rera.js

# backend/target/            VS Code Java language server output (redhat.java, JDK 21). Generated
#                            .class files plus generated MapStruct/Lombok sources.
# backend/target-*/          every command-line build lane. A glob, not a list, because these are
#                            created on demand - target-cli is the default from .mvn/maven.config,
#                            target-sv2 and target-sa are parallel lanes, and the next one will
#                            appear without anyone editing this file. backend/.gitignore treats
#                            them as a family (/target-*) for the same reason.
# frontend/dist/              Vite build output: minified bundles, regenerated every build.
# frontend/public/            static assets shipped verbatim; not compiled, not reviewed as code.
# graphify-out/               generated knowledge-graph blobs, git-ignored, multi-MB, machine paths.
# e2e/playwright-report/      generated HTML run reports, plus inlined copies of trace data.
# e2e/test-results/           generated per-run artifacts: screenshots, videos, traces.
# node_modules/               third-party dependencies; not our code and not ours to fix.
# societies-rera.js           182 KB of minified RERA data on 4 lines. Sonar would report it as
#                             one enormous unmaintainable expression, which is true and useless -
#                             it is generated data, not logic. Excluded so its noise cannot bury
#                             real findings in the same directory.
#
# NOT A CONTRADICTION with sonar.java.binaries above, which points inside backend/target-cli:
# sonar.exclusions filters SOURCE files out of sonar.sources and sonar.tests. Binaries are read
# through their own property and are unaffected, so the bytecode is still analysed while the
# generated sources sitting beside it are not.


# ---------------------------------------------------------------------------------------------
# Coverage - DELIBERATELY UNCONFIGURED
# ---------------------------------------------------------------------------------------------
# NEITHER REPORT EXISTS TODAY, so neither path is set. Verified 2026-08-30:
#   - Java: backend/pom.xml declares no jacoco-maven-plugin, so no jacoco.xml is ever produced,
#     despite a real ~2,266-test suite. sonar.coverage.jacoco.xmlReportPaths would point at a
#     file that never appears.
#   - JS:   frontend/package.json has no test script and no runner (no vitest, jest, c8 or nyc),
#     so there is no lcov.info to report. The only JS tests in the repo are Playwright e2e specs,
#     which exercise the app through a browser and produce no per-line coverage by default.
#
# A path to a non-existent report is worse than no path: the scanner logs a warning nobody reads
# and Sonar shows 0.0% coverage, which reads as "untested" rather than "unmeasured". Wire these
# only in the same change that starts producing the reports:
#   sonar.coverage.jacoco.xmlReportPaths=backend/target-cli/site/jacoco/jacoco.xml
#   sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
