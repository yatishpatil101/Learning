name: CI

# Five jobs, deliberately split.
#
# `checks` is the fast gate: lint, i18n/help content checks, build, and the bundle
# budget. It finishes in a couple of minutes and catches most breakage, so it is
# what a contributor watches while a PR is open.
#
# `e2e` is the slow gate. It needs a browser download and starts the Vite dev
# server (the config does that itself via `webServer` whenever BASE_URL is unset),
# so it is kept separate rather than bolted onto `checks` — a lint error should not
# wait behind a browser install to be reported.
#
# It runs `playwright.nobackend.config.js` only. The default config became the live
# suite when the mock provider was deleted, and this runner has no Postgres and no
# Spring Boot process, so pointing CI at the default would fail every spec for a
# reason that has nothing to do with the change under test. Standing the live lane
# up in CI is tracked in tasks/todo.md under hardening; until then CI's e2e signal
# is honestly narrow rather than dishonestly broad.
#
# `lighthouse` is not a gate at all. It records mobile performance numbers against a
# production build and always passes; the reasoning is on the job itself.
#
# `backend` runs the Maven suite. It is new, and it is the only job here that covers
# Java at all — until it existed the ~2,266-test suite ran on developer machines and
# gated nothing. It needs a PostgreSQL service container; the reasoning is on the job.
#
# `sonar` is analysis, not a gate. Its quality gate is scoped to new code in the
# SonarQube Cloud UI and is deliberately not a required check while the backend
# migration is in flight. See docs/migration/06-code-quality.md §3.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Cancel it
# rather than paying for both; `main` is excluded so pushed history always has a
# completed run against it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pin one Node major for every job. The repo declares no `engines`, so without
  # this the runner's default silently decides, and a bump would land as an
  # unexplained CI failure rather than a deliberate change.
  NODE_VERSION: '22'

jobs:
  checks:
    name: Lint, content checks, build, size budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it fails when package.json and the
      # lockfile disagree, which is the check we want in CI.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Each step is named and separate so the failing gate is visible from the
      # job list without opening logs. `npm run check` bundles lint + i18n + help,
      # but bundling them here would collapse three distinct failure modes into
      # one red X.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: i18n key and locale checks
        working-directory: frontend
        run: npm run check:i18n

      - name: Help content check
        working-directory: frontend
        run: npm run check:help

      - name: Build
        working-directory: frontend
        run: npm run build

      # Must run after the build — it measures dist/. This is the regression gate
      # for the bundle work: the budget is 560 KB with a 180 KB target, and the
      # script exits non-zero when the entry chunks exceed it.
      - name: Bundle size budget
        working-directory: frontend
        run: npm run check:size

  e2e:
    name: Playwright (no-backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `needs: checks`. The suites test different things, and making e2e wait
    # on lint just delays the slowest signal for the sake of tidiness.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # The dev server the tests drive lives in frontend/, and the Playwright config
      # starts it with `npm --prefix ../frontend run dev`, so both installs are
      # required even though the specs live in e2e/.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # Chromium only: the one project this config defines is Desktop Chrome, so
      # downloading Firefox and WebKit would add minutes for browsers nothing uses.
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run no-backend specs
        working-directory: e2e
        run: npm run test:nobackend

      # `always()`, not `failure()`: the HTML report is the artifact you want when
      # a run is flaky-but-green just as much as when it is red.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nobackend
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile, record-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # THIS JOB HAS NO BUDGETS, AND THAT IS ON PURPOSE — DELIBERATE, NOT FORGOTTEN.
    #
    # The stated mobile performance targets were, until this job existed, verified by
    # nothing: `check:size` counts the bytes on the critical path, which is a good
    # proxy and a real gate, but it cannot see a slow font swap, a layout shift, or
    # main-thread work after the bytes land. This measures the outcome those bytes are
    # a proxy for.
    #
    # It measures and it never fails. A single Lighthouse run on a shared runner
    # carries several points of score movement on byte-identical code — the runner's
    # CPU is not ours and its speed varies between machines and neighbours. A
    # threshold tight enough to catch a genuine 200 ms LCP regression is therefore
    # also loose enough to redden an innocent PR, and a gate that people learn to
    # re-run until it goes green is worse than no gate: it costs minutes, teaches the
    # team that CI lies, and stops anyone reading the number it was protecting.
    #
    # So the first job of this job is to earn the right to have a budget. Every run
    # appends its numbers to the step summary along with the Lighthouse version,
    # Chrome version and the runner's CPU benchmark index, so that after a few dozen
    # runs the *spread* is known rather than guessed. Turning this into a gate means:
    # (1) read the recorded spread on main, (2) set a threshold outside it — a p75
    # over several runs, not a single reading, (3) add the assertion step, and
    # (4) mark it required. Doing (3) before (1) is how the flaky-gate story starts.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A production build, not the dev server. The dev server ships unminified
      # modules over hundreds of requests and no service worker, so measuring it would
      # produce numbers that describe a machine no user has.
      - name: Build
        working-directory: frontend
        run: npm run build

      # `vite preview` serves dist/ and, because appType defaults to 'spa', falls back
      # to index.html for extensionless paths — which is what makes the deep link to
      # /property/P5000 resolve instead of 404ing.
      #
      # --strictPort matters: without it Vite silently moves to 4174 when 4173 is
      # taken, and the readiness poll below would then spend its full minute failing
      # against an empty port with no hint as to why. --host 127.0.0.1 pins the
      # interface so the poll and Lighthouse cannot disagree over localhost/::1.
      #
      # The trailing `&` outlives the step: GitHub does not reap background processes
      # between steps in the same job, and the runner tears the whole VM down at the
      # end, so no explicit shutdown step is needed. Output is redirected to a file
      # rather than inherited — a backgrounded process holding the step's stdout pipe
      # open is the classic way an Actions step finishes its work and then hangs.
      - name: Serve production build
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sfo /dev/null http://127.0.0.1:4173/; then
              echo "preview server up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not come up on 127.0.0.1:4173" >&2
          cat /tmp/preview.log >&2
          exit 1

      # Pinned Lighthouse version, mobile emulation, three routes. Writes the metric
      # table to $GITHUB_STEP_SUMMARY so the result is readable from the run page
      # without downloading the artifact below.
      - name: Measure
        run: node .github/lighthouse/run-lighthouse.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouse/
          retention-days: 30

  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE ~2,266-TEST JAVA SUITE HAS NEVER GATED ANYTHING UNTIL THIS JOB. It ran only on
    # developer machines, which means the largest test asset in the repo protected nothing
    # that a pull request had to pass.
    #
    # Baseline recorded 2026-08-30 on feature/backend-integration, before this job existed:
    # 2266 run, 3 failures, 0 errors, 4 skipped. All three are architecture-guard tests that
    # were ALREADY red locally, not regressions introduced by adding CI:
    #
    #   ServiceSizeGuardTest.servicesStayUnderTheSplitTrigger
    #       PropertyVerificationService.java is 461 lines against a 450 limit (over by 11).
    #   SpecCoverageTest.noUndeclaredRoutes
    #       six routes are served but absent from punenest-api.yaml - the /me/lead-notes and
    #       /me/photo-requests families.
    #   ErasureCoverageTest.everyPersonalDataColumnIsClassified
    #       three columns on managed_property_rent_receipts (landlord_name, tenant_name,
    #       property_address) are unclassified for erasure.
    #
    # This job is a REAL GATE, so it is red until those three are resolved. That is the
    # intended reading: each one is a guard the team wrote deliberately and then outgrew
    # without CI to say so. If you need it advisory while they are fixed, add
    # `continue-on-error: true` to this job - and delete it again once green, because a job
    # that can never fail is a job nobody reads.
    services:
      # The suite runs against a real PostgreSQL. Testcontainers is unavailable in the
      # authoring environment (org sign-in enforcement), so backend/src/test/resources/
      # application.properties points at a plain local server and Flyway builds the schema.
      # The service container reproduces exactly that: same database name, user and password
      # as the defaults in that file, so no TEST_DB_* override is needed.
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: punenest_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the health check the job races the database: Maven starts, Flyway dials a
        # port that is listening but not yet accepting, and every test fails at context load
        # for a reason that looks like a schema problem.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Zulu 25 to match JAVA_HOME on the development machines and the <java.version>25 in
      # pom.xml. A lower JDK does not merely warn here - the build sets release 25 and fails.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      # Output lands in backend/target-cli, not backend/target: backend/.mvn/maven.config
      # applies -DbuildDirName=target-cli to every command-line build. Nothing here overrides
      # it, so the path stays identical to a local run - and identical to the
      # sonar.java.binaries path in sonar-project.properties, which reads this directory.
      - name: Run backend test suite
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Surefire XML is the only place a failure's assertion message survives; the console log
      # truncates. `always()` because this artifact matters most on the red runs.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target-cli/surefire-reports/
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Analysis only - this job never blocks a merge. The quality gate is configured in the
    # SonarQube Cloud UI as Clean as You Code (new code only) and is deliberately NOT marked
    # a required check while the backend migration is in flight. See docs/migration/06-code-quality.md.
    #
    # `pull_request`, never `pull_request_target`. pull_request_target runs the BASE branch's
    # workflow with repository secrets available to a fork's code, which is the standard way
    # SONAR_TOKEN gets exfiltrated. The condition below drops fork PRs entirely: a fork cannot
    # read SONAR_TOKEN anyway, so without it every external contribution fails this job with an
    # authentication error that looks like the contributor's fault.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # SHALLOW CLONE BREAKS BLAME, AND BLAME IS WHAT DECIDES WHAT COUNTS AS NEW CODE.
          # With the default depth of 1 every line looks like it was authored in the scanned
          # commit, so the entire legacy codebase is attributed to the current pull request and
          # the Clean as You Code gate fails on issues nobody in that PR wrote.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      # SONARJAVA READS BYTECODE, NOT SOURCE. If backend/target-cli/classes is missing or
      # empty the Java module is skipped and the dashboard shows zero Java issues, which is
      # indistinguishable from clean Java. So the compile is a hard prerequisite of the scan,
      # not an optimisation.
      #
      # -DskipTests on purpose: the `backend` job above owns the test signal. Running the suite
      # twice would double the slowest job in CI to produce the same red X, and this job has no
      # database service to run it against.
      - name: Compile backend (required for Java analysis)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests test-compile

      # sonar.java.libraries needs the actual jars. Without them SonarJava cannot resolve any
      # type it does not own and quietly drops the rules that depend on resolution - a thinner
      # analysis that still reports success.
      - name: Collect dependency jars for type resolution
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress dependency:copy-dependencies -DoutputDirectory=target-cli/deps -DincludeScope=test

      # Fails loudly rather than letting the scan report a clean Java module from an empty
      # directory. This is the single check that distinguishes "Java analysed and found
      # nothing" from "Java was never analysed".
      - name: Verify Java binaries resolved
        run: |
          count=$(find backend/target-cli/classes -name '*.class' | wc -l)
          echo "compiled classes: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::backend/target-cli/classes contains no .class files - Sonar would silently skip Java analysis and report it as clean." >&2
            exit 1
          fi

      # All configuration lives in sonar-project.properties at the repo root; this action reads
      # it. SONAR_TOKEN is a repository secret - it is never written to a file in this repo and
      # must be rotated in the SonarQube Cloud UI if it is ever pasted anywhere else.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
