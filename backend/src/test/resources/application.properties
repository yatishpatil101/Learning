# Test datasource: the local PostgreSQL service + a throwaway `punenest_test` database.
# Docker/Testcontainers is unavailable in this environment (org sign-in enforcement), so tests run
# against a real local Postgres. Flyway builds the schema; Hibernate only validates the mapping,
# so a green boot proves entities match the migrations.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/punenest_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# One connection pool per *cached Spring context*, and there is one context per distinct set of
# property overrides — so the suite's connection use is (contexts × pool size), not (pool size).
# At Hikari's default of 10 the fourth context to appear tipped the local Postgres over its
# max_connections and every test in it failed with "sorry, too many clients already": a failure
# that looks like a bug in whichever test class was added last and is in fact a property of the
# suite as a whole. Four is ample — no test in this suite runs anything concurrently, so the true
# requirement is one connection plus headroom for Flyway and the validation pass at boot.
spring.datasource.hikari.maximum-pool-size=4

# Schema only — never the demo seed.
#
# NOTE: the line that actually enforces this lives in `application-dev.properties` **in this
# directory**, not here. The test run activates the `dev` profile (below), and a profile-specific
# file outranks a plain one whichever source set it comes from — so main's
# `application-dev.properties`, which adds `classpath:db/seed`, beats this file. Setting the
# property here as well is harmless and states the intent; deleting the profile-specific twin is
# what breaks it. `TestDatabaseIsolationTest` fails if either goes missing.
spring.flyway.locations=classpath:db/migration

# NOTE: this file *shadows* src/main/resources/application.properties rather than merging with it —
# same filename, test classpath first — so anything the tests must exercise has to be repeated here.
# The page-size ceiling is one of those: without it the tests would prove a cap that production has
# and the test run does not.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Repeated from main for the reason above, and this one is load-bearing in an unusual way: MockMvc
# ignores the context path entirely, so the ~700 HTTP tests neither need it nor notice it missing.
# Only ApiContextPathTest starts a real container, and without this line it would assert against a
# server the test run had configured differently from every deployment — proving the opposite of
# what it claims. If this ever has to be deleted, delete that test too rather than leaving it green.
server.servlet.context-path=/api

# Deterministic, keyless providers for the whole test run.
spring.profiles.active=dev

# Test-only JWT secret (never a real secret; prod reads JWT_SECRET from env).
punenest.security.jwt.secret=test-only-hs256-secret-key-that-is-long-enough-32b

# Test-only webhook signing key. Tests sign their own payloads with this via WebhookSignature,
# so signature verification is exercised for real rather than stubbed out.
punenest.webhooks.cashfree.secret=test-only-webhook-signing-secret

# Slice 10. This file shadows main, so the multipart ceilings must be repeated or the container
# would cap uploads at Boot's 1 MB default -- which trips before DocumentUploads.MAX_BYTES and
# would make the 10 MB rule the tests assert unreachable in the test run.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Uploaded bytes land here during the test run rather than in the developer's real storage dir.
punenest.storage.dir=${java.io.tmpdir}/punenest-test-storage

# D57. No background timer during the suite. The sweep would run on its own thread, outside the
# test's transaction, and expire rows a test had just seeded — a failure that would appear at random
# in whichever test happened to be running at the time. The lifecycle is proved by calling
# SubscriptionService.expireLapsed(now) directly with a fabricated instant, which is both
# deterministic and a stronger assertion than watching a clock.
punenest.billing.subscription-sweep.enabled=false

# D161. Same reasoning, for the sweep that retires abandoned checkouts across all four payment
# families. Its 5-minute initial delay means it would not in practice fire inside a suite run, but
# "in practice" is not a guarantee — a slow CI machine and a growing suite is all it would take, and
# the failure mode is a background thread cancelling a pending subscription, boost or rent payment
# that a test seeded a moment earlier. Each family's expireAbandonedCheckouts(cutoff) is called
# directly instead, with a fabricated instant.
punenest.payments.checkout-sweep.enabled=false

# D2. No write rate limit during the suite, for the same class of reason. MockMvc gives every request
# the same remote address and most of the suite is unauthenticated, so the ~700 HTTP tests present as
# a single caller and would exhaust any realistic budget — failing whichever test happened to run
# once the budget was spent, which is both random and unrelated to the code under test. The filter is
# proved by WriteRateLimitTest, which enables it with a budget of 2 and reaches it on purpose.
punenest.security.rate-limit.enabled=false

# MockMvc has no proxy in front of it, and this file replaces the main one wholesale on the test
# classpath rather than merging with it — so without this line every @SpringBootTest fails to start.
# That is the intended behaviour and worth stating: TrustedProxyConfig reads the property through
# @Value with no default precisely so a deploy cannot decline to answer the question, and the whole
# suite refusing to boot is the proof that the answer is genuinely mandatory.
punenest.security.trusted-proxies=none

