# Test datasource: the local PostgreSQL service + a throwaway `punenest_test` database.
# Docker/Testcontainers is unavailable in this environment (org sign-in enforcement), so tests run
# against a real local Postgres. Flyway builds the schema; Hibernate only validates the mapping,
# so a green boot proves entities match the migrations.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/punenest_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Deterministic, keyless providers for the whole test run.
spring.profiles.active=dev

# Test-only JWT secret (never a real secret; prod reads JWT_SECRET from env).
punenest.security.jwt.secret=test-only-hs256-secret-key-that-is-long-enough-32b

# Test-only webhook signing key. Tests sign their own payloads with this via WebhookSignature,
# so signature verification is exercised for real rather than stubbed out.
punenest.webhooks.cashfree.secret=test-only-webhook-signing-secret
