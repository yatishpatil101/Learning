# Test-run overrides for `local`, and the only place the demo seed can be turned off for the suite.
# A profile-specific file outranks a plain one regardless of source set, so main's
# application-local.properties (which adds db/seed) beats this directory's application.properties.
# Only a profile-specific file at the same tier wins. 126 assertions are exact row counts, and
# rollback isolates tests from each other, not from rows Flyway committed first.
spring.flyway.locations=classpath:db/migration
