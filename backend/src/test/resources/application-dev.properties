# Test-run overrides for the `dev` profile.
#
# WHY THIS FILE EXISTS — a Spring property-precedence trap, caught by TestDatabaseIsolationTest.
#
# The test run activates `dev` (see application.properties in this directory) to get the keyless,
# deterministic providers. `src/main/resources/application-dev.properties` adds the demo seed to the
# Flyway locations so a developer's local database comes up populated with 38 listings.
#
# The obvious defence — setting `spring.flyway.locations=classpath:db/migration` in the test's own
# `application.properties` — DOES NOT WORK, and fails in a way that looks like it should:
# **a profile-specific file outranks a non-profile-specific one, regardless of which source set it
# came from.** So main's `application-dev.properties` beat test's `application.properties`, the seed
# loaded, and the suite died in Flyway before a single test ran. Only a profile-specific file at the
# same precedence tier can override it, and that is this file.
#
# What is at stake: 126 assertions in the suite are exact counts — a test saves four listings and
# expects `totalElements == 2` after the approved/non-archived filter. 38 pre-seeded listings make
# every one of them fail. Transaction rollback isolates a test from other tests; it does nothing
# about rows Flyway committed before the suite started.
spring.flyway.locations=classpath:db/migration
