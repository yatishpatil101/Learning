spring.application.name=punenest-api
server.port=8080

# Every route in Routes.java is written relative to this prefix, and both api-standards.md §2 and
# Routes.java's own header have always said so. Until now nothing set it: the backend actually served
# `/auth/login`, and the arrangement only worked because the Vite dev proxy stripped `/api` before
# forwarding. That made the mismatch invisible in dev and fatal at deploy — pointing VITE_API_BASE at
# a real host would have requested `https://host/api/auth/login` against a server mapped at
# `/auth/login`, 404ing every call with nothing in the logs to explain it.
#
# Note this moves the infrastructure paths too: health is `/api/actuator/health` and Swagger UI is
# `/api/docs`. Deployment probes must use the prefixed paths.
server.servlet.context-path=/api

# Actuator: expose health + info for readiness/liveness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Local-development datasource. Every value is an env-overridable default so a developer can clone,
# start Postgres and boot — while CI/deployments override via DB_URL/DB_USER/DB_PASSWORD. The prod
# profile re-declares these as bare ${ENV} lookups so a missing secret fails the boot rather than
# silently falling back to these well-known local values.
#
# Deliberately NOT `punenest_test`: that database belongs to the test suite, which asserts exact
# row counts and so requires a schema Flyway built from empty. Sharing one database makes seeded
# dev data fail the tests. Dev data lives here; `punenest_test` stays throwaway.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/punenest}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the schema; Hibernate only validates the mapping against it, so a green boot proves
# the entities still match the migrations.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Schema + local demo data (tech-debt D81).
#
# `db/migration` is the schema and runs everywhere. `db/seed` holds R__dev_demo_data.sql -- 38
# listings, 78 users, and the conversations/visits that make the local app look like a product --
# and is deliberately declared *here*, in the base file, for the same reason the local datasource
# defaults are: this file is the local-development configuration, and prod overrides it.
#
# The alternative, putting it in application-dev.properties, was tried and is wrong: running the app
# locally activates **no profile at all** ("No active profile set, falling back to 1 default
# profile: default"), so the seed would silently never load and a developer would be told their
# database was populated when it was empty.
#
# Both overrides are load-bearing and both are enforced:
#   * application-prod.properties resets this to migration-only -- prod must never see demo data.
#   * src/test/resources/application-dev.properties does the same for the test run, where 126
#     assertions are exact counts. TestDatabaseIsolationTest fails if that slips.
#
# Listing `classpath:db/migration` explicitly is required, not decorative: setting this property
# replaces Flyway's default location rather than adding to it.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Page-size ceiling, matching the contract's `Size` parameter (`maximum: 100`).
#
# Spring's own default is 2000, which on a public unauthenticated endpoint such as `GET /properties`,
# `/societies` or `/reels` is a free amplification: one request, 2000 rows plus their joins. The
# contract already says 100, so the server was simply not enforcing a limit it had published.
# Set globally rather than per-controller — a cap that has to be remembered at every call site is a
# cap that will eventually be forgotten at one.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Dev-only HS256 signing key (must be >= 32 bytes). Prod overrides with a bare ${JWT_SECRET}.
punenest.security.jwt.secret=${JWT_SECRET:dev-only-hs256-secret-key-that-is-long-enough-32b}

# Static OpenAPI contract is served from classpath:/static/openapi/punenest-api.yaml
# Swagger UI renders it at /docs (see OpenApiDocsConfig).

# Cashfree webhook HMAC secret. Env-supplied; the fallback exists only so the mock DigiLocker flow
# is demoable with zero vendor keys. Prod overrides with a bare ${CASHFREE_WEBHOOK_SECRET} so a
# missing secret fails the boot instead of running on a publicly-known one.
punenest.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET:dev-webhook-secret}


# ---------------------------------------------------------------------------------------------
# Cashfree providers (KYC today; the payment rail lands in slice 6).
#
# Off by default, and deliberately not tied to the `prod` profile: "which environment is this"
# and "do we hold vendor credentials" are independent questions, and coupling them meant a
# developer with sandbox keys could never exercise the real client while production could never
# fall back to mocks. With the flag off, MockKycProvider / MockPaymentGateway are wired and no
# external call is possible - CashfreeClient is not even instantiated.
#
# The keys have NO committed default: unlike the webhook secret there is no demo value that could
# stand in, and a blank key would surface as a puzzling vendor 401 instead of an obvious local
# misconfiguration. CashfreeClient refuses to start if the flag is on and either key is missing.
punenest.providers.cashfree.enabled=${CASHFREE_ENABLED:false}
punenest.providers.cashfree.base-url=${CASHFREE_BASE_URL:https://sandbox.cashfree.com}
punenest.providers.cashfree.app-id=${CASHFREE_APP_ID:}
punenest.providers.cashfree.secret-key=${CASHFREE_SECRET_KEY:}
punenest.providers.cashfree.kyc-redirect-url=${CASHFREE_KYC_REDIRECT_URL:https://punenest.in/verify/complete}

# --- Document storage (slice 10) -------------------------------------------------------------
# Where MockFileStorage writes uploaded document bytes. A real deployment replaces the whole
# FileStorage bean with an object store; this exists so that in dev an upload is a real side
# effect rather than a URL-shaped fiction.
punenest.storage.dir=${STORAGE_DIR:${java.io.tmpdir}/punenest-storage}

# The container's multipart ceiling. Deliberately a little above DocumentUploads.MAX_BYTES (10 MB):
# our own check produces a 413 naming the limit, and we want that message rather than the
# container's, which trips before any of our code runs. The request cap leaves room for the
# category field and the multipart framing on top of one max-size file.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

