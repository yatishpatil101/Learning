spring.application.name=punenest-api
server.port=8080

# Actuator: expose health + info for readiness/liveness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Static OpenAPI contract is served from classpath:/static/openapi/punenest-api.yaml
# Swagger UI renders it at /docs (see OpenApiDocsConfig).
