spring.application.name=draazy-api

# The base every profile layers on, in the order a change travels: local -> e2e -> sandbox -> prod.
# What each tier is for, and which of them are standalone rather than deltas: docs/system/profiles.md.

# Cloud Run injects PORT; a container that ignores it fails its health check. 8080 keeps local dev working.
server.port=${PORT:8080}

# Routes.java is written relative to this: health is /api/actuator/health, Swagger UI /api/docs.
server.servlet.context-path=/api

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Env-overridable so a clone can boot; prod re-declares these bare so a missing secret fails the boot.
# Deliberately NOT `draazy_test` -- that database belongs to the Java suite's exact row counts.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/draazy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the schema; Hibernate only validates, so a green boot proves entities match migrations.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# OSIV off. No controller returns an entity, so a missed fetch is an exception, not a silent N+1.
spring.jpa.open-in-view=false

# Migrations only. The seed is named by application-local/-sandbox, so it must be asked for by name.
# Listing db/migration is required: setting this REPLACES Flyway's default location, it does not add.
spring.flyway.locations=classpath:db/migration

# Contract cap is 100; Spring's own default is 2000, which on public GET /properties is amplification.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Local-only HS256 signing key (must be >= 32 bytes). Prod overrides with a bare ${JWT_SECRET}.
draazy.security.jwt.secret=${JWT_SECRET:dev-only-hs256-secret-key-that-is-long-enough-32b}

# Two tabs waking together both refresh; the loser presents a token spent milliseconds ago.
draazy.security.jwt.refresh-grace=15s

# Defaults TRUE; the localhost affordance lives in application-local.properties and must be asked for.
# It also decides the cookie NAMES: on means `__Host-` prefixed, which requires Path=/ (so no `path`).
draazy.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# Lax is the design, not a default to tune: it is why /auth/refresh needs no CSRF token of its own.
draazy.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# Wrong guesses allowed against one login code before it is burned. Refused outside 1..20 at boot:
# 0 locks everyone out, and a large number stops the cap being a brute-force defence.
draazy.otp.max-verify-attempts=${DRAAZY_OTP_MAX_VERIFY_ATTEMPTS:3}

# Feeds CookieDeliveryCheck only. Blank locally, where the API is reached through the Vite proxy.
draazy.web.public-origin=${API_PUBLIC_ORIGIN:}

# Salt for referral fraud digests. Unsalted SHA-256 of an IPv4 is a rainbow table, not a hash.
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT:dev-only-referral-signal-salt}

# `%m %U %H` is %r minus the query string; %r would log ?token=... verbatim to a file.
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U %H" %s %b %D

# Cashfree webhook HMAC. The fallback only makes the mock flow demoable; prod overrides it bare.
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET:dev-webhook-secret}

# Off wires the mocks and CashfreeClient is never instantiated. Deliberately independent of profile:
# "which environment" and "do we hold vendor keys" are separate questions.
draazy.providers.cashfree.enabled=${CASHFREE_ENABLED:false}
draazy.providers.cashfree.base-url=${CASHFREE_BASE_URL:https://sandbox.cashfree.com}
draazy.providers.cashfree.app-id=${CASHFREE_APP_ID:}
draazy.providers.cashfree.secret-key=${CASHFREE_SECRET_KEY:}
draazy.providers.cashfree.kyc-redirect-url=${CASHFREE_KYC_REDIRECT_URL:https://draazy.in/verify/complete}

# Where MockFileStorage writes, so a local upload is a real side effect rather than a URL-shaped lie.
draazy.storage.dir=${STORAGE_DIR:${java.io.tmpdir}/draazy-storage}

# Cloudflare R2 (ADR-013). Off wires the local-disk mock (local) or the throwing stub (elsewhere).
draazy.providers.storage.enabled=${STORAGE_ENABLED:false}
draazy.providers.storage.endpoint=${R2_ENDPOINT:}
draazy.providers.storage.access-key-id=${R2_ACCESS_KEY_ID:}
draazy.providers.storage.secret-access-key=${R2_SECRET_ACCESS_KEY:}
draazy.providers.storage.public-bucket=${R2_BUCKET_PUBLIC:}
draazy.providers.storage.private-bucket=${R2_BUCKET_PRIVATE:}
draazy.providers.storage.public-base-url=${R2_PUBLIC_BASE_URL:}

# WhatsApp Cloud API login OTP (ADR-020). Off logs the code locally and throws everywhere else; the
# flag wins over the profile, and otp-template-name must be an APPROVED AUTHENTICATION template.
draazy.providers.whatsapp.enabled=${WHATSAPP_ENABLED:false}
draazy.providers.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
draazy.providers.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
draazy.providers.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
draazy.providers.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
draazy.providers.whatsapp.otp-template-name=${WHATSAPP_OTP_TEMPLATE_NAME:}
draazy.providers.whatsapp.otp-template-lang=${WHATSAPP_OTP_TEMPLATE_LANG:en_US}

# Outreach links are read on someone else's phone, and the request's own Host header is not trusted.
draazy.app.base-url=${APP_BASE_URL:https://draazy.com}

# Just above DocumentUploads.MAX_BYTES (10MB), so our 413 naming the limit wins over the container's.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Caps mutating requests per caller. Kept at production values locally: this protects the database
# and the queues, which exist locally too. A legitimate 429 means the number is wrong.
draazy.security.rate-limit.enabled=true
draazy.security.rate-limit.writes-per-window=120
draazy.security.rate-limit.window-seconds=60

# `memory` is correct for exactly one instance; a second silently multiplies the budget. `redis`
# selects the shared counter and refuses to start rather than falling back. Not selectable yet.
draazy.ratelimit.store=${RATELIMIT_STORE:memory}

# Turnstile, on the writes a stranger can reach only. Fails CLOSED: failing open would make the
# attacker's job "break the verifier", which is easier than solving the challenge.
draazy.security.turnstile.enabled=${TURNSTILE_ENABLED:false}
draazy.security.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
draazy.security.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
draazy.security.turnstile.connect-timeout-seconds=3
draazy.security.turnstile.read-timeout-seconds=5

# `none` means the socket address is the client's -- true locally, and wrong behind any load balancer,
# where one host would otherwise rate-limit the platform. Declared here so every profile has an answer.
draazy.security.trusted-proxies=none

# Disclosures, not switches. A structural zero and a measured zero render identically, so each stays
# false while the money path behind its figure does not exist, and the screen says so.
draazy.finance.refunds-measured=${FINANCE_REFUNDS_MEASURED:false}
draazy.finance.service-orders-counted=${FINANCE_SERVICE_ORDERS_COUNTED:false}

