        Recorded against the curator with the free text the owner had typed, which is the pair a
        later "why is my flat listed in Baner" needs.


        Carries `properties:write`, not `localities:write`. Filing a listing under an area that
        already exists is a change to the listing; only *minting* an area is a change to the
        catalogue. That distinction is load-bearing: the same `properties:write` is what
