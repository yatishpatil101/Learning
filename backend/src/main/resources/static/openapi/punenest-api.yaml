        listings with it. Answering 204 would tell the client the resource is gone when
        `listLocalitiesForOps` will still list it; returning the row says what actually happened.
        Idempotent. The live-listing count at the moment of retirement is written to the audit log —
        retiring an area with listings in it is usually right, but it must never be untraceable how
        many went dark.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The retired locality
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Locality' }
