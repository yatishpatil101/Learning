      description: >
        `execute` pseudonymises the identity root and sweeps the tables that duplicate identity
        outside it, in one transaction, and records what was removed and what was kept.
        `reject` refuses with a required reason - DPDP s.8(7) permits retention where another law
        requires it, so a subject with a live registered rent agreement or an unsettled payment is
        a case where the platform must say no and say why. Both are terminal.
      operationId: decideErasureRequest
      x-roles: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureDecision' }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '409':
          description: Already decided
  /admin/flatmate-reviews:
    get:
      tags: [Moderation]
      summary: Flatmate host-verification queue (ops)
      description: >
        Tenant-tier posts, contested addresses and flat splits whose parent listing is still
        pending. Owner-tier posts are vetted through the listing's own documents and never appear.
      operationId: listFlatmateReviews
      externalDocs: { description: Behaviour, url: docs/flows/ops/service-queues.md }
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateReview' }
  /admin/flatmate-reviews/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Decide a flatmate host verification
      description: A rejection requires a reason — the host is always told why.
      operationId: decideFlatmateReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateReview' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/flatmates/moderation:
    get:
      tags: [Moderation]
      summary: The flatmate moderation queue
      description: >
        What is waiting to be let out. Since D72 a seeker post, room or group starts `pending` and
        is invisible on every consumer surface until a moderator decides; this is where that backlog
        is seen. Oldest first, because a queue served newest-first starves the person who has been
        waiting longest.


        Distinct from `/admin/flatmate-reviews`, which is the **verification** queue — "has this
        host proved what they claimed". An unbadged post and an unvetted post are different things.


        One `kind` per call. Posts, rooms and groups are three tables with three shapes; a merged
        board could not page without either loading every pending row or reporting a total that is
        true of one table and false of the screen.


        The author's mobile is deliberately absent. Deciding whether a post may be published does
        not require ringing the person, and a number on every row of a paged staff screen is a bulk
        contact list one screenshot away from leaving the building.
      operationId: listFlatmateModerationQueue
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [post, room, group], default: post }
          description: Which board to page through.
        - name: modStatus
          in: query
          schema: { $ref: '#/components/schemas/FlatmateModStatus' }
          description: >
            Defaults to `pending`, which is the queue. Any other state is accepted so a team can
            review its own past decisions.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateModerationQueueItem' }
  /admin/flatmates/{id}/moderation:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Moderate a flatmate seeker post, room or group
      description: >
        Admin moderation axis only. It must never write a group application's owner decision, and
        a `flagged` / `removed` post must disappear from every consumer feed, the map and the alert
        matcher — not merely change a label.
      operationId: moderateFlatmatePost
      externalDocs: { description: Behaviour, url: docs/flows/admin/flatmates-moderation.md }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modStatus]
              properties:
                modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
                note: { type: string, description: Internal note, never exposed to consumers. Expected on flag/remove. }
      responses:
        '200': { description: Moderated }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/group-applications:
    get:
      tags: [Moderation]
      summary: Flatmate group applications
      operationId: listGroupApplications
      description: Newest first. Paged — a platform-wide board with no per-caller scoping.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/GroupApplication' }
  /admin/group-applications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Moderate a group application
      operationId: decideGroupApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modStatus]
              properties:
                modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
                note: { type: string }
      responses:
        '200':
          description: Moderated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
  # ============================================================
  # 5. LEADS & CONTACT (contact gate, enquiries, finalization)
  # ============================================================
  /contacts/status:
    get:
      tags: [Leads & Contact]
      summary: Check contact status for a property
      operationId: contactStatus
      parameters:
        - { name: propertyId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Contact status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactStatus' }
  /contacts/request:
    post:
      tags: [Leads & Contact]
      summary: Request owner's contact (requires sign-in)
      operationId: requestContact
      description: >
        Requires only a signed-in mobile-OTP account (L1) — identity verification is **not**
        a prerequisite (ADR-019). Returns `401` if unauthenticated. Returns
        `403 verification_required` **only** when the target owner has opted into
        "verified contact only" and the caller has no Verified badge (L2). Returns
        `422 contact_quota_exhausted` when the caller has used every owner contact their plan and
        referrals allow — see `GET /me/entitlements` (D31b).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequestCreate' }
      externalDocs:
        description: Contact-gate & leads flow (badge-not-gate)
        url: docs/flows/consumer/contact-gate-leads.md
      responses:
        '200':
          description: Requested — the owner is notified; contact unlocks now or on approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactStatus' }
              examples:
                approved:
                  summary: Contact approved
                  value: { status: approved, verifiedContactOnly: false, verificationRequired: false }
                pendingOwner:
                  summary: Awaiting owner approval
                  value: { status: pending, verifiedContactOnly: false, verificationRequired: false }
          links:
            checkStatus: { $ref: '#/components/links/CheckContactStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Owner accepts verified contacts only — earn the Verified badge to proceed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: verification_required, message: This owner only accepts verified contacts, status: 403 }
        # D31b. 422 rather than 403: a 403 invites clients to offer a login, and signing in again
        # does not conjure contacts. Not 429 either -- that promises the request works if you wait,
        # and this quota is a lifetime total rather than a window. Only a *new* owner costs a
        # contact; re-reading a request already open returns 200 after the allowance is gone.
        '422':
          description: No owner contacts left — subscribe or refer a friend to earn more.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: contact_quota_exhausted, message: You have used all 15 of your owner contacts. Subscribe for unlimited contacts, or refer a friend to earn more., status: 422 }
  /me/contact-requests:
    get:
      tags: [Leads & Contact]
      summary: View incoming contact requests (owner)
      operationId: myContactRequests
      description: >
        Newest first, owner-scoped. Paged: this collection grows with inbound demand rather than with
        the owner's own actions, so a popular listing is exactly what makes it large. Use
        `myPendingContactCount` for the "waiting on you" badge - counting one page under-reports.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ContactRequest' }
  /me/contact-requests/pending-count:
    get:
      tags: [Leads & Contact]
      summary: Count of contact requests awaiting the owner
      operationId: myPendingContactCount
      description: >
        The owner's "waiting on you" badge. Counted server-side because `myContactRequests` is paged:
        filtering one page client-side is the wrong number precisely for the owner who has enough
        leads to need the badge.
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { type: integer, example: 3 }
  /me/contact-requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Leads & Contact]
      summary: Approve / decline contact request
      operationId: respondContactRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
  # Slice-12 spec fix S45. `GET /enquiries` and the `Enquiry` schema were removed here,
  # executing the sunset this document wrote for itself in slice 4: "NOT IMPLEMENTED and will not
  # be. Sunset: remove from this spec once the admin lead views land." Those views shipped in
  # slice 8. Nothing in the platform writes an `enquiries` row -- the contact-request surface
  # (ADR-019) replaced it before either was implemented -- so the operation could only ever have
  # returned an empty page, which is a worse admin surface than none. V22 drops the table.
  /messages:
    get:
      tags: [Leads & Contact]
      summary: Current user's conversations (in-app inbox)
      operationId: myMessages
      description: >
        Most recent first. Paged: an owner's inbox grows with inbound enquiries rather than with
        their own activity, so it is demand-driven and uncapped.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Conversation' }
    post:
      tags: [Leads & Contact]
      summary: Start a conversation (e.g. owner-buyer chat after contact-gate)
      description: >-
        Requires an existing relationship: the caller holds an approved contact request against a
        listing the counterparty owns, or the counterparty holds one against a listing the caller
        owns. Staff and admin may always open a thread.


        Without that rule this operation is a mobile-enumeration oracle -- a distinguishable answer
        for "registered" and "not registered" turns the endpoint into a way to test a list of phone
        numbers against the user base, and an unsolicited-message channel to anyone whose number
        leaked from anywhere else. The refusal is therefore identical in both cases.
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        # Slice-12 spec fix S48. 200 as well as 201: starting a conversation that already exists
        # returns the existing one rather than forking the thread, and the status says which
        # happened. The 403 was undeclared and is the load-bearing rule of this operation -- see
        # the description above.
        '200':
          description: The conversation already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Leads & Contact]
      summary: Conversation detail with message thread
      operationId: getConversation
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/reply:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Send a message in a conversation
      operationId: replyConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        # Slice-12 spec fix S48: a conversation the caller is not a participant in is a 404, not a
        # 403 -- confirming that a thread exists is itself the disclosure.
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/attachments:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Upload an attachment for a conversation (multipart)
      operationId: attachToConversation
      description: >
        Step one of sending a file (D49). Stores and validates the bytes, and returns an id the
        caller then passes in `MessageCreate.attachments` on the reply. Two steps rather than one
        multipart reply so that the message and its files are never half-sent: an upload that is
        never referenced is an orphan nobody can read, whereas a message that referenced bytes that
        failed to store would render as text with a broken paperclip. Guarded by the conversation's
        own participant rule, so a non-participant gets 404 exactly as they do on the reply.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageAttachment' }
        '400': { description: No file, or too many already pending on this thread }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large (5 MB per file) }
        '415': { description: Unsupported media type, or the bytes disagree with the declared type }
  /messages/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Mark a conversation as read
      operationId: readConversation
      responses:
        '204': { description: Marked read }
        '404': { $ref: '#/components/responses/NotFound' }  # Slice-12 spec fix S48
  /me/finalization-requests:
    get:
      tags: [Leads & Contact]
      summary: Pending finalization requests (owner)
      operationId: myFinalizationRequests
      description: >
        Newest first, counterparty-scoped, pending only, paged. Every row is a proposal a buyer aimed
        at the caller, so the collection grows with inbound demand. No `sort` parameter: the order is
        fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FinalizationRequest' }
  /finalization/{propId}/request:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Leads & Contact]
      summary: Request to finalize deal (buyer, maker step)
      operationId: requestFinalization
      description: >
        Maker step of the maker-checker finalization (buyer). The owner then accepts
        (checker step) — the deal-verified moment (L3) where hard KYC / mobile-match may be
        required of both parties (ADR-009a/019). Track via `finalizationStatus`.
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizationCreate' }
      responses:
        '200':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
          links:
            trackStatus: { $ref: '#/components/links/FinalizationStatus' }
  /finalization/{propId}/status:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Leads & Contact]
      summary: My finalization status
      operationId: finalizationStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
    delete:
      tags: [Leads & Contact]
      summary: Cancel my finalization request (buyer)
      operationId: cancelFinalization
      responses:
        '204': { description: Cancelled }
  /finalization/requests/{reqId}/accept:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Accept finalization (owner, checker step)
      description: >
        Accepting closes the property's deal and auto-declines every other pending
        finalization request on it, in one transaction.

        NOT YET IMPLEMENTED: for rent deals this should also create a tenancy record.
        Deferred to the rent/tenancy slice, which owns the tenancy invariants -- writing
        tenancy rows from here would mean retrofitting rules onto rows this slice created.
      # Slice-4 spec fix S7. This used to require a FinalizationAccept body of
      # { accept: boolean, note: string }. Both fields were dead. `accept` is redundant and
      # actively ambiguous on an endpoint literally named /accept -- there is a sibling
      # /decline, so it is unclear what POST /accept with { accept: false } should mean, and
      # any answer is a trap. `note` had no column to land in and no client that sent it, so
      # the server would have accepted it and silently dropped it, which is worse than not
      # offering the field: the caller believes it was recorded. Removed rather than backed
      # with a migration, because nothing reads it.
      operationId: acceptFinalization
      responses:
        '200': { description: Accepted }
  /finalization/requests/{reqId}/decline:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Decline finalization (owner)
      operationId: declineFinalization
      responses:
        '200': { description: Declined }
  # ============================================================
  # 6. RENTALS & PAYMENTS (finance, rent, mandates, tenancies)
  # ============================================================
  /me/finances/{propId}/transactions:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Transactions list (owner)
      operationId: listTransactions
      # S25 (pagination pass): was a bare array. A property's ledger accrues rows on a schedule and
      # is never culled, so its size tracks how long the property has been held, not anything the
      # caller did -- api-standards.md §5.1 ("scope is not the test; growth is"). No `Sort`: the
      # order is fixed server-side (date desc, createdAt desc) and index-backed by
      # idx_transactions_property.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
    post:
      tags: [Rentals & Payments]
      summary: Add transaction
      operationId: addTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /me/finances/{propId}/transactions/{txnId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
      - { name: txnId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Rentals & Payments]
      summary: Update transaction
      operationId: updateTransaction
      # S19 (slice 5): this PATCH took TransactionCreate, whose `required: [type, amount, date]`
      # makes it a PUT wearing a PATCH's name - a client correcting a typo in `note` was obliged to
      # resend the type, amount and date, and any field it forgot to echo would be rejected or
      # silently reset. The mock has always sent a partial patch ({...txn, ...patch}), so the
      # contract as written could not express the call the UI actually makes. TransactionUpdate has
      # no required fields; an absent key means "leave it alone".
      #
      # The 200 also had no response body, so a client had no way to see the server's own view of
      # the row it had just changed (notably the re-derived recurrence) without re-listing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { description: No such transaction on this property }
    delete:
      tags: [Rentals & Payments]
      summary: Delete transaction
      operationId: deleteTransaction
      responses:
        '204': { description: Deleted }
  /me/finances/{propId}/basis:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Ownership basis
      operationId: getBasis
      responses:
        '200': { description: Basis, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipBasis' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Set ownership basis
      operationId: setBasis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipBasis' }
      responses:
        '200': { description: Saved }
  /me/finances/{propId}/summary:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Income / expense / net summary
      operationId: financeSummary
      # S18 (slice 5): the summary and cashflow reads took no window parameter, but the Finances
      # tab has always had a period selector (All time / This month / This quarter / This year) and
      # a 12-month chart. With no parameter the endpoint can only ever answer "all time", so the
      # selector would have had nothing to send and the server would have had to be re-specified
      # the first time anyone used it. The period is the client's question; the aggregate is the
      # server's answer, so the question belongs in the request.
      parameters:
        - name: period
          in: query
          description: >
            Window the totals are computed over. `year` is the Indian financial year (1 April -
            31 March), not the calendar year - that is the year an owner files against.
          schema: { type: string, enum: [all, month, quarter, year], default: all }
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSummary' } } } }
  /me/finances/{propId}/cashflow:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Monthly cashflow
      operationId: financeCashflow
      parameters:
        - name: months
          in: query
          description: How many months back to project, ending with the current month.
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200':
          description: Cashflow series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashflowPoint' }
  /me/finances/{propId}/dues:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Upcoming dues
      operationId: financeDues
      responses:
        '200':
          description: Dues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Due' }
  /me/rent-payments:
    get:
      tags: [Rentals & Payments]
      summary: My rent payments
      operationId: myRentPayments
      # S25 (pagination pass): was a bare array. A rent ledger grows a row a month for as long as the
      # tenancy runs -- time-driven, not action-driven (api-standards.md §5.1). No `Sort`: the order
      # is fixed server-side (dueDate desc, createdAt desc).
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/RentPayment' }
    post:
      tags: [Rentals & Payments]
      summary: Pay rent (tenant)
      operationId: payRent
      description: >
        Initiates a rent payment via the Cashfree Payment Gateway (ADR-017). The `201`
        records the payment as **pending**; its terminal state (`success` / `failed`) is
        confirmed asynchronously by Cashfree via the payment webhook (see `callbacks`).
        Treat the returned record as pending until the webhook confirms.
      externalDocs:
        description: Rent & tenancy payment flow
        url: docs/flows/consumer/rent-tenancy.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentPaymentCreate' }
      responses:
        '201':
          description: Payment initiated (pending until the webhook confirms).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentPayment' }
        # S23 (slice 6): the operation declared only 201/422 while the server also answers 404 and
        # 409. An undeclared status is worse than a wrong one -- a generated client has no branch
        # for it, so a stale-amount rejection surfaces to the tenant as an unhandled error rather
        # than "the rent changed, please confirm again".
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /me/rent-ledger:
    get:
      tags: [Rentals & Payments]
      summary: Received payments (owner)
      operationId: rentLedger
      # S25 (pagination pass): was a bare array, and this is the worst of the three -- an owner's
      # ledger spans every tenancy on every listing they have ever let, so it grows with portfolio
      # size *and* with time (api-standards.md §5.1). No `Sort`: order fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/RentPayment' }
  /me/rent-mandate:
    get:
      tags: [Rentals & Payments]
      summary: Current autopay mandate
      operationId: getMandate
      responses:
        '200': { description: Mandate, content: { application/json: { schema: { $ref: '#/components/schemas/RentMandate' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Set up autopay mandate
      operationId: setMandate
      # S22 (slice 6): the request body was the full `RentMandate`, i.e. the read shape -- exactly
      # the defect S11 fixed on PayoutAccount, and it lands harder here. `RentMandate` carries `id`,
      # `status` and `provider`, none of which a client may assert. A caller PUTting
      # `status: active` on a mandate they had revoked would be reactivating a standing instruction
      # against their own bank account without ever re-giving consent -- and `id` would let them
      # aim the write at somebody else's mandate entirely.
      #
      # Split into a write shape carrying only what a tenant decides: which tenancy, the ceiling
      # they authorise, the day of the month, and an optional pause/revoke. The response stays the
      # full read shape so the client can render the saved mandate without a second call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentMandateUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentMandate' }
        '404': { $ref: '#/components/responses/NotFound' }
        # S23: revoking is terminal and re-activation is refused -- both are 409, not 422.
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/payout-account:
    get:
      tags: [Rentals & Payments]
      summary: Payout account (owner)
      operationId: getPayoutAccount
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccount' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Set payout account (owner)
      operationId: setPayoutAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAccountUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccount' }
        # S23: the body is bean-validated (IFSC pattern, 9-18 digit account, holder required),
        # so 422 is reachable and must be declared.
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/tenancies:
    get:
      tags: [Rentals & Payments]
      summary: My active tenancies (as tenant)
      operationId: myTenancies
      responses:
        '200':
          description: Tenancies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenancy' }
  /tenancies:
    get:
      tags: [Rentals & Payments]
      summary: Tenancies in my properties (owner)
      operationId: ownerTenancies
      responses:
        '200':
          description: Tenancies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenancy' }
    # S9 (slice 5): POST /tenancies DELETED.
    #
    # It was summarised "(system, on deal finalization)" but carried no x-roles and accepted the
    # whole Tenancy schema -- id, owner, tenant, rent, deposit and status all client-supplied. As
    # written, any signed-in user could fabricate a tenancy on any property, naming themselves as
    # owner or tenant. Because `tenancies` is the parent of `rent_payments` and `rent_mandates`,
    # that manufactures a money-bearing relationship out of nothing: a forged tenancy is a claim on
    # somebody else's rent.
    #
    # "System" is not a role, so there was never a guard that could express the intent. The correct
    # mechanism is that no client creates a tenancy at all -- it is created transactionally inside
    # DealService when a *rent* deal closes (the side effect slice 4 deferred to Phase 5), where
    # the owner, tenant, rent and deposit are all already known and already authorised. See D1.
  /me/tenant-profile:
    get:
      tags: [Rentals & Payments]
      summary: My tenant profile
      operationId: getTenantProfile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/TenantProfile' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Update tenant profile
      operationId: updateTenantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantProfileUpdate' }
      responses:
        '200':
          description: Saved (returns computed score)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantProfile' }
  /tenant-profiles/{mobile}:
    parameters:
      - { name: mobile, in: path, required: true, schema: { $ref: '#/components/schemas/Mobile' } }
    get:
      tags: [Rentals & Payments]
      summary: View a tenant's profile (owner, only for a tenant you are actually dealing with)
      # S10 (slice 5). This carried no access rule at all while being keyed by mobile number.
      # Walking the 10-digit space would have returned name, occupation, income, occupant type and
      # trust score for every tenant on the platform -- a worse leak than the slice-4
      # finalization oracle, which only answered yes/no, and keyed by the exact identifier the
      # entire contact gate exists to protect.
      #
      # The legitimate use is narrow: an owner screening someone who has actually approached their
      # listing. So the caller must have a live relationship with that tenant -- an existing
      # tenancy, or an accepted contact request on one of the caller's properties. Anything else is
      # 404, never 403: confirming "that mobile exists but you may not see it" is itself the
      # enumeration answer we are refusing to give.
      description: >
        Requires an existing relationship between the caller and the tenant: a tenancy on one of
        the caller's properties, or an accepted contact request. Returns 404 -- never 403 -- when
        no such relationship exists, so the endpoint cannot be used to test whether a mobile number
        is registered.
      operationId: getTenantProfileByMobile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/TenantProfile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenant-profiles/verified:
    post:
      tags: [Rentals & Payments]
      summary: Which of these people are verified tenants (batch badge)
      # D114. The verified tick renders beside every row of a list -- every offer on a property,
      # every applicant, every reviewer -- and each row is about somebody else. Asking
      # /tenant-profiles/{mobile} per row is an N+1 on a render path, so the client had no server
      # answer at all and the badge stayed on localStorage, where it could only ever be wrong in
      # the direction of showing less than the truth.
      #
      # POST, for a read. The input is a list of mobile numbers and the method is chosen for where
      # the parameters end up: a query string carrying them would write the identifier the whole
      # contact gate exists to protect into access logs, proxy caches, browser history and Referer
      # headers. A body goes to none of those. Being a POST also puts it inside the platform write
      # rate limit without an exception being written anywhere.
      #
      # It answers one bit per entry and never a reason. "No such number", "registered but not
      # verified" and "not your business" are all `false` -- the same refusal shape S10 chose for
      # the single read, so this cannot be walked to discover which mobile numbers are registered.
      # The relationship guard is identical to S10's and is not relaxed: an entry is `true` only
      # where GET /tenant-profiles/{mobile} would have succeeded.
      #
      # `mobile` in each answer is the caller's own input echoed verbatim, so the response provably
      # cannot contain a number the caller did not already hold (D5/Q2).
      description: >
        Batch form of `GET /tenant-profiles/{mobile}` reduced to the verified badge. Requires the
        same relationship with each person -- a tenancy either way round, or an accepted contact
        request against one of the caller's listings -- and returns `false`, never an error or a
        reason, for every entry that does not qualify, is not registered, or holds no badge. The
        answer has the same length and order as `mobiles`, and each `mobile` is the string the
        caller supplied, unchanged. At most 50 entries; a larger batch is 400.
      operationId: tenantsVerified
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantVerifiedQuery' }
      responses:
        '200':
          description: One flag per supplied number, in the order supplied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantVerified' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /properties/{propId}/tenancy-declarations:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    # D194. Review eligibility is "completed a visit, or lived here", and only the visit half was
    # ever real: the tenancy half was decided client-side from a localStorage bucket nothing on the
    # live path writes, so against this API it was unconditionally false. The brokered half is fixed
    # by simply asking /me/tenancies. This is the other half, and it exists because most Indian
    # leases are signed off-platform -- the person best placed to review a flat is usually someone
    # whose tenancy this API has never seen.
    #
    # A declaration is NOT a tenancy and is deliberately a different resource. `tenancies` permits
    # one active row per property (a second would be a double-let, not a duplicate) and is the
    # parent of every rent payment; declarations are many-per-property, are about stays that have
    # usually ended, and must be revocable. Writing one into the other would both violate that index
    # and make a typed claim indistinguishable from a signed agreement at every later read.
    #
    # Only `confirmed` counts. A pending row is a stranger asserting something about somebody else's
    # flat; what turns it into evidence is the LISTING'S OWNER agreeing -- checked against the
    # owner_id copied off the listing, not against "is an identity-verified user", because "someone
    # real said yes" and "the landlord said yes" are different facts and only the second is about
    # this property.
    get:
      tags: [Rentals & Payments]
      summary: Stays claimed on this listing
      description: >
        Returns every declaration on the listing when the caller owns it -- the owner's inbox --
        and only the caller's own declaration otherwise. One route rather than two because the two
        sides read the same record and differ by a row filter, not by shape. Paged, because the
        owner's side is inbound demand: each row is written by a different stranger. A caller who
        does not own the listing has at most one row and always receives it on page 0.
      operationId: listTenancyDeclarations
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Declarations visible to the caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Rentals & Payments]
      summary: Declare that you lived in this listing
      description: >
        Creates a `pending` claim for the caller. 409 when the caller owns the listing, when a
        brokered tenancy already records the stay, or when the caller has already declared one --
        a second claim is the same claim again, which is what makes a revocation mean anything.
      operationId: declareTenancy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenancyDeclarationCreate' }
      responses:
        '201':
          description: Claim recorded, awaiting the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /tenancy-declarations/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Rentals & Payments]
      summary: Confirm a claimed stay (listing owner)
      description: >
        The owner agrees the stay happened, which is the moment the claim becomes evidence and the
        declarant becomes eligible to review the listing. Idempotent, and re-confirmable after a
        revocation. 404 -- never 403 -- for any caller who does not own the listing, so a
        declaration id is never confirmed to exist to a stranger.
      operationId: confirmTenancyDeclaration
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenancy-declarations/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Rentals & Payments]
      summary: Reject or withdraw a claimed stay (listing owner)
      # POST, not DELETE: the row survives. Eligibility stops either way, but "claimed, agreed,
      # withdrawn" is the trail an abuse investigation needs and a deleted row says nothing at all.
      # Keeping the row also holds the unique slot, so the claimant cannot simply declare again.
      description: >
        The owner disagrees with a claim, or takes back a confirmation they already gave. The
        declaration is retained in `revoked` state rather than deleted. 404 for any caller who does
        not own the listing.
      operationId: revokeTenancyDeclaration
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ============================================================
  # 7. DOCUMENTS
  # ============================================================
  /me/documents/{propId}:
    parameters: [ { $ref: '#/components/parameters/PropRef' } ]
    get:
      tags: [Documents]
      summary: Documents for property (owner)
      operationId: listDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Upload document (multipart)
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Sale Deed }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/{propId}/{docId}:
    parameters:
      - { $ref: '#/components/parameters/PropRef' }
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove document (owner)
      operationId: deleteDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/personal:
    get:
      tags: [Documents]
      summary: Personal KYC documents (owner)
      description: >-
        The caller's own KYC papers. `personal` is a literal segment that out-ranks the
        `{propId}` template, so a property can never be addressed here. Self-scoped; no `x-roles`.
      operationId: listPersonalDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Upload personal KYC document (multipart)
      operationId: uploadPersonalDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Aadhaar }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/personal/{docId}:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove personal KYC document (owner)
      operationId: deletePersonalDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/managed/{managedId}:
    parameters:
      - { name: managedId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Documents]
      summary: Documents for a managed property (owner)
      description: >-
        The papers on a property the caller tracks privately in the Owner Hub — a sale deed, an
        index-II, a society NOC — which may never have been listed. A separate vault from
        `/me/documents/{propId}`, not another way into it: those files are shareable with buyers
        through the request/grant flow and these are never shared. `managed` is a literal segment
        that out-ranks the `{propId}` template, so a property can never be addressed here.
        Self-scoped; no `x-roles`. Unknown or someone else's record answers `404`, never `403`.
      operationId: listManagedDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Upload managed-property document (multipart)
      description: >-
        Same allowlist, size cap and scanner pass as the listing vault. `propertyId` on the response
        carries the managed record's id, not a listing id.
      operationId: uploadManagedDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Sale Deed }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/managed/{managedId}/{docId}:
    parameters:
      - { name: managedId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove managed-property document (owner)
      description: >-
        Deleting the managed record itself also removes its papers, because the foreign key
        cascades; this route is for removing one file while keeping the record.
      operationId: deleteManagedDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/photos:
    post:
      tags: [Listings]
      summary: Upload a listing photo (multipart)
      description: >-
        Store one image in the public bucket and return its permanent CDN URL, which the client puts
        into a listing's `images`. Unscoped by property: in the create-listing wizard the photos are
        chosen before the property exists. Image-only (JPEG, PNG, WebP, HEIC or AVIF) because the
        object is world-readable — no PDF and no SVG. Self-scoped; no `x-roles`.
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/requests:
    get:
      tags: [Documents]
      summary: Buyer document-access requests (owner inbox)
      operationId: myDocumentRequests
      description: >
        Newest first, owner-scoped, paged. Every row is written by a prospective *buyer* asking to
        see the paperwork, so the list grows with demand for the listing rather than with anything
        its owner did. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentRequest' }
  /me/document-requests:
    get:
      tags: [Documents]
      summary: My document-access requests (requester)
      operationId: myDocumentAsks
      description: >
        Newest first, requester-scoped, paged — the buyer's half of `/me/documents/requests`. A
        sibling path rather than a member of `/me/documents`, because everything under that prefix
        is scoped to listings the caller *owns* and this is scoped to rows the caller *wrote*.

        `shareToken` is always `null` here, even on an approved request. It is the owner's
        forwardable credential; echoing it on a list endpoint would mean one leaked page of JSON
        unlocks every vault the buyer has ever been let into. The signed-in buyer reads `status`,
        `expiresAt` and `sharedDocumentCount`, then opens
        `/me/document-requests/{reqId}/documents` with their JWT instead.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentRequest' }
  /me/document-requests/{reqId}/documents:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    get:
      tags: [Documents]
      summary: Documents my granted request unlocked (requester)
      operationId: myGrantedDocuments
      description: >
        The same documents `/documents/shared` returns, reached by a different proof. That route is
        anonymous and authenticated by an unguessable token in a URL fragment, because its audience
        is a lawyer or a banker with no account here. This one is authenticated by the caller's JWT,
        because its audience is the buyer who wrote the request and is already signed in.

        It exists because `shareToken` is owner-facing by contract: a grant only reached the buyer
        if the owner forwarded the link, so a buyer whose owner never did saw the status `granted`
        and had no way to open anything. The fix is not to hand the buyer the token — that would
        make their own request list a bearer credential — but to give them a read that needs no
        forwardable credential at all.

        Requester-scoped: `reqId` is accepted only once the row's requester is the caller. A request
        against a listing the caller *owns* is a 404 here too; those files are at
        `/me/documents/{propId}`, and a second door into them would be a second authorisation rule
        to keep correct.

        Unknown, foreign, never-granted and lapsed all answer 404 — deliberately not the opaque 401
        `/documents/shared` uses. That opacity exists so an anonymous prober cannot learn whether a
        token was ever real; there is nothing to conceal from a caller already authenticated as the
        one person entitled to know.
      responses:
        '200':
          description: The documents this grant unlocked. Empty if the owner granted a category
            they have not uploaded a file for.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '404': { description: Unknown, not the caller's, not granted, or lapsed }
  /documents/requests:
    post:
      tags: [Documents]
      summary: Request document access (buyer)
      operationId: requestDocumentAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequestCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRequest' }
  /me/documents/requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Documents]
      summary: Grant / decline document access (owner)
      operationId: respondDocumentRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
  /documents/shared:
    get:
      tags: [Documents]
      summary: View shared documents via link token
      description: |
        Public but token-scoped. The `X-Share-Token` header IS the authorisation — there is no
        session, and the link is meant to be forwarded to a lawyer or a bank officer who has no
        PuneNest account.

        Treat it as a bearer credential: whoever holds the string can read the owner's title deeds
        until the grant expires (7 days from the grant). It must never be written to an access log,
        an error report or an analytics event.

        **The token is a header, never a query parameter (D42).** It used to be `?token=…`, which
        made every share link itself a bearer credential — copied into browser history and
        bookmarks, written to any proxy or CDN access log, and forwarded verbatim when the recipient
        pasted it into a chat. The query parameter has been removed outright rather than deprecated:
        no client had ever built a link carrying one, so there was no compatibility window, and a
        still-live bearer-in-URL path is the vulnerability rather than a migration aid. A stale
        `?token=…` URL fails closed with the same 401 as any other bad credential.

        The intended caller is the web client's `/shared-documents` route, which carries the token
        in the URL **fragment** and puts it on this header. A fragment is never transmitted to a
        server, so it cannot appear in an access log or in `Referer`.

        Server-side the older defences still stand behind it: the container access-log pattern is
        pinned to exclude query strings and responses carry `Referrer-Policy: no-referrer`.
        Every failure — missing, unknown, declined, expired — is the same 401, deliberately, so the
        endpoint cannot be used as an oracle for which tokens were ever real.
      security: []
      operationId: getSharedDocuments
      parameters:
        - name: X-Share-Token
          in: header
          required: true
          schema: { type: string }
          description: Bearer credential for one grant. Do not log, store or forward.
      responses:
        '200':
          description: Shared documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ============================================================
  # 8. SERVICES & SUPPORT (tickets, support, workflows, agreements)
  # ============================================================
  /tickets:
    get:
      tags: [Services & Support]
      summary: All service requests (admin/staff)
      operationId: listTickets
      x-roles: [staff, admin]
      parameters:
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
    # Deliberately NO x-roles (slice-11 S43): a customer raising a request is the point of the
    # queue, exactly as with POST /reports. Only reading and working the queue is staff-only.
    post:
      tags: [Services & Support]
      summary: Create service request
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
      # Debt D47. The 201 returned `Ticket`, which carries `notes` -- "Internal staff notes" by its
      # own description -- to the one caller on this path who is not staff: the raiser. It read empty
      # only because a ticket cannot have a note in the transaction that created it. The response is
      # now `CustomerTicket`, the same object with no `notes` property, so the guarantee is in the
      # schema rather than in the timing.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerTicket' }
  /tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Services & Support]
      summary: Update ticket (admin/staff)
      operationId: updateTicket
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
  /tickets/{id}/notes:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Add internal note (admin/staff)
      operationId: addTicketNote
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  by: { type: string }
                  text: { type: string }
                  at: { type: string, format: date-time }
  /support/tickets:
    get:
      tags: [Services & Support]
      # Slice-12 spec fix S47. Was "My support tickets (all for admin)" -- one operation with two
      # growth profiles. For a customer the collection grows with their own activity, so
      # `api-standards.md` 5.1 says bare array; for an admin it grows with the platform, which the
      # same rule says must be a `PageEnvelope`. Serving both from one operation means either an
      # admin reading every support conversation on the platform -- names, mobiles, message bodies
      # -- in a single unbounded response, or a shape that changes with the caller's role. Narrowed
      # to the caller's own tickets. Ops triage already has its own paginated, team-scoped board at
      # `GET /tickets`; a platform-wide support view belongs under `/admin/` when it is needed.
      summary: My support tickets
      operationId: listSupportTickets
      responses:
        '200':
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportTicket' }
    post:
      tags: [Services & Support]
      summary: Create support ticket
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
  /support/tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Support ticket detail with messages
      operationId: getSupportTicket
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Reply to support ticket
      operationId: replySupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        # Slice-12 spec fix S46. Was a bare `'201': Replied`, so a client had no way to render the
        # message it had just sent without re-fetching the whole ticket. Same defect class as S44.
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      # D50. Was "clear the raiser's flag", and a staff caller reached it successfully and changed
      # nothing, because there was only one flag and it was not theirs. Now clears whichever side of
      # the two-sided read model belongs to the caller -- `unread` for the raiser, the desk's own
      # signal for staff and admin -- and never the other side's.
      summary: Mark support ticket read (the caller's own side)
      operationId: markSupportTicketRead
      responses:
        '204': { description: Marked }
        '404': { $ref: '#/components/responses/NotFound' }  # Slice-12 spec fix S48
  /support/tickets/{id}/attachments:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload an attachment for a support ticket (multipart)
      operationId: attachToSupportTicket
      description: >
        Step one of sending a file on a ticket (D49); the returned id goes in
        `MessageCreate.attachments` on the reply. Same two-step shape and the same limits as the
        conversation surface. Guarded by the ticket's own rule -- the raiser or ops -- so an operator
        can attach a screenshot back to the customer, and anyone else gets 404.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageAttachment' }
        '400': { description: No file, or too many already pending on this ticket }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large (5 MB per file) }
        '415': { description: Unsupported media type, or the bytes disagree with the declared type }
  /admin/support-tickets:
    get:
      tags: [Services & Support]
      # D51. S47 narrowed `GET /support/tickets` to the caller's own tickets for every role, because
      # one operation cannot be a bare array for a customer and a page envelope for an admin, and
      # "every support conversation on the platform" unpaged is a PII export whoever asks. That left
      # ops with no support overview at all. This is the operation S47's note said would be needed:
      # under /admin, paged, and a summary rather than the threads.
      #
      # Staff as well as admin, unlike /admin/audit-log: staff have always been able to read and
      # answer any ticket at GET /support/tickets/{id}, so withholding only the index would leave
      # them able to act on tickets they cannot find.
      summary: Platform-wide support queue (paged)
      operationId: adminSupportTickets
      x-roles: [staff, admin]
      parameters:
        - name: awaitingReply
          in: query
          schema: { type: boolean }
          description: >-
            Omit for everything. `true` narrows to tickets whose newest message is from the customer
            and nobody on the desk has read -- the working queue. `false` is the complement.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Support tickets, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminSupportTicket' }
  /service-waitlist:
    post:
      tags: [Services & Support]
      summary: Join the waitlist for a service that has not launched
      description: >
        "Tell me when this launches", from a stranger (D4). Anonymous, and the third unauthenticated
        body-write on the platform after `/cities/waitlist` and `/society-leads`.


        Answers 201 whether or not a row was written, and returns no body. An id would be a
        reference the caller can never resolve — it cannot read `GET /tickets` — and any
        acknowledgement that distinguished "recorded" from "already on the list" would confirm to a
        stranger whether the number they typed is registered. There is deliberately no `GET`: the
        rows are a page of unverified phone numbers, readable only by ops on the guarded ticket
        routes.


        There is no free-text field, also deliberately. `service` is a slug checked server-side, and
        the subject and team are derived from it, so nothing a stranger typed reaches a screen a
        person reads and acts on.
      security: []
      operationId: joinServiceWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceWaitlistJoin' }
      responses:
        '201': { description: Recorded, or silently deduplicated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: >
            Too many signups for this mobile within the hour. Capped against the table under an
            advisory lock rather than in memory, because a budget that resets on deploy is not a
            budget — and it is the only one of the three controls on this route (IP rate limit, bot
            challenge, per-mobile cap) that survives the other two being unconfigured.
  /demand-signals:
    post:
      tags: [Services & Support]
      summary: Record that somebody looked for a home the platform may not have
      description: >
        D10. What buyers and tenants asked for, as opposed to what owners listed. Three moments
        produce a signal: a search, a "notify me" submit, and a property view. The aggregate is the
        demand half of `GET /admin/supply-gap`.


        Anonymous, and that is the point rather than an oversight. Most of the people whose demand
        is worth measuring have no account yet - they are looking precisely because they have not
        found anything. A signal that only fired for signed-in visitors would report the population
        that already stayed, which is the one group the report does not need to hear from. When a
        session does exist the user id is attached, so repeat interest can be told apart from
        breadth of interest.


        There is deliberately no `GET`. A public read of this aggregate would let anyone enumerate,
        locality by locality, what PuneNest is short of - a competitor's market research budget
        handed over for free. The write is open and the read is guarded; the asymmetry is the
        design, not an omission.


        No contact detail is accepted or stored. The only reader is a count, so a mobile number
        here would be data held on people who never opened an account, for a report that cannot use
        it. Where a relationship does exist the contact already lives on `saved_searches` or
        `city_waitlist`.


        Answers 202 with no body. Nothing is created that the caller can later address, and the
        client must not wait on it: a failed analytics write must never break a search or a
        property page. Capped per IP by the platform write rate limit.
      security: []
      operationId: recordDemandSignal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemandSignalCreate' }
      responses:
        '202': { description: Accepted. No body, and no id - there is nothing to address later. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /service-requests:
    # Slice-11 spec fix S40. Two changes, one cause: without a list a staff member cannot find the
    # requests the five staff-only operations below act on, and "every service request on the
    # platform" is not a bare array -- it is the unbounded queue api-standards.md section 5.1 exists
    # to page. Scope is role-derived: a customer sees their own requests, staff/admin see the queue.
    get:
      tags: [Services & Support]
      summary: Service requests - own for a customer, the whole queue for staff/admin
      operationId: listServiceRequests
      parameters:
        - { name: type, in: query, schema: { type: string }, description: Service type, e.g. rent-agreement }
        - { name: status, in: query, schema: { type: string } }
        # D44. Ops only, and only an admin's choice reaches the query: a staff caller's desk is
        # pinned to their own account, so naming another desk here is a 403 rather than a filter
        # that quietly does something else. Ignored on a customer's own list.
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
        # D45. "Which request came off this board item" -- the direction of the ticket link that
        # ServiceRequest.ticketId does not serve.
        - { name: ticketId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Service requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceRequest' }
        # D67. Documented here and not on the role-guarded operations because this is the only route
        # whose refusals are new: it carries no `x-roles`, so before the permission map was wired
        # there was no way for an authenticated caller to be refused it at all. A staff or admin
        # caller whose bundle in `AdminSettings.permissions` omits `view_service_requests` is refused
        # the queue; a customer reading their own requests is never affected, because the capability
        # only governs the branch the role selects.
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Services & Support]
      summary: Create service request
      operationId: createServiceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/co-fill:
    post:
      tags: [Services & Support]
      summary: Create a co-filled request and invite the second party (requester only)
      operationId: createCoFillServiceRequest
      description: >
        `createServiceRequest` and `inviteServiceRequestParty` in one call, and deliberately not the
        same thing as calling them in sequence.


        The plain create opens a gateway order in the same transaction, because for a single-party
        service there is nothing to wait for. A rent agreement is two people's paperwork, and the
        requester paying before the tenant has even agreed to be on it is the wrong order of events:
        the money is committed against a matter that the other side may decline, and the customer's
        only exit from an abandoned order is `cancelServiceRequest`. So this route stops one step
        short. The request is priced and committed as `awaiting-payment` with **no** `payment_ref`
        -- invisible to the ops queue on exactly the same rule as any other unpaid rent agreement,
        but not yet bound to a gateway order -- and the invitation is recorded against it. Checkout
        is opened later, by the requester, through `openServiceRequestCheckout`.


        Only for priced services. If the type resolves to a free one there is no deferred checkout to
        defer and the composition has no meaning, so it is a `400` rather than a silently completed
        request that the invitee then finds already finished.


        The invitation half behaves exactly as `inviteServiceRequestParty` does, including V107's
        pending row: the counterparty does not need an account yet, and the invitation binds itself
        to theirs the first time they sign in on that number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoFillServiceRequestCreate' }
      responses:
        '201':
          description: >
            Created and awaiting payment, with the invitation recorded. `parties` carries the
            invited side; while the number belongs to nobody yet it reads `pending: true` with a
            masked `mobile` and no `party` name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '400':
          description: >
            Not a priced service type, or the role or mobile is not one this request can take. Also
            the answer if `request.details` carries identity numbers, on the same terms as the plain
            create.
        '409':
          description: >
            The number is the requester's own, or the side is already spoken for. Reported against
            the whole call: the request is rolled back with the invitation, so a co-fill that could
            not name its counterparty does not leave an orphaned unpaid row behind.
  /service-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Service request detail with timeline
      operationId: getServiceRequest
      responses:
        '200':
          description: Service request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Services & Support]
      summary: Update status (staff)
      operationId: updateServiceRequestStatus
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Add message to service request
      operationId: addServiceRequestMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestMessage' }
  /service-requests/{id}/docs:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload / update document on request
      operationId: addServiceRequestDoc
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category: { type: string }
                file: { type: string, format: binary }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
  /service-requests/{id}/checklist:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Document checklist for a request
      operationId: getServiceRequestChecklist
      description: >
        The named paperwork this request needs and how much of it has arrived. Readable by the
        requester or by the desk the request is on; anyone else gets `404`, because which service
        requests exist is not a fact this API confirms to people who are not on them.

        Derived at read time from the request's own documents — there is no checklist table and no
        status a desk ticks by hand, so an item is "done" if and only if a file exists under its
        `id` as the upload `category`. That is also how a client satisfies one: POST the file to
        `/service-requests/{id}/docs` with `category` set to the item `id`. Documents filed under
        anything else (the desk's `draft` and `final-document`, the `service-request` default) are
        on the request but are not checklist items and are not counted.

        Read-only, and deliberately carries no URLs: item completion is a fact about the request,
        while the bytes stay behind `getServiceRequest`, where the vault's own read rules live.
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestChecklist' }
        '404': { description: No such request, or not the caller's }
  /service-requests/{id}/identities:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    # D151. A Leave & License names each party by PAN and Aadhaar, so the drafting desk needs both.
    # They used to travel inside `details`, which is plaintext jsonb echoed verbatim on every staff
    # read including the paged queue -- a bulk identity dump. `details` now refuses them (400) and
    # this is the replacement: written by the requester, readable by the one staff member the
    # request is assigned to, audited on every read and refusal, and blanked when the request
    # reaches a terminal status.
    #
    # NOT the document vault, which is what the register first proposed. The vault answers reads
    # with a signed URL -- a credential that carries its own authority, cannot be pointed at one
    # operator, cannot refuse anybody, and whose use never reaches the server, so no read of it can
    # be recorded. "Only the assignee" and "every access audited" are the requirement, and neither
    # is expressible against a bearer URL.
    put:
      tags: [Services & Support]
      summary: Record the parties' identity numbers (requester only)
      operationId: putServiceRequestIdentities
      description: >
        Replaces the whole set. The wizard resubmits every party when the customer corrects one, so
        append semantics would leave the mistyped number behind under a shifted index. No role
        annotation: the guard is participant identity -- staff and admin are refused, because a desk
        that could write these could also invent them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestIdentities' }
      responses:
        '204':
          description: >
            Recorded. Deliberately empty -- echoing the numbers back onto a response nobody reads
            them from is the habit that made `details` a leak.
        '403':
          description: The caller is staff or admin; only the requester may record these
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: The request is completed or cancelled, so there is nothing left to draft from
    get:
      tags: [Services & Support]
      summary: Read the parties' identity numbers (assigned operator only)
      operationId: getServiceRequestIdentities
      x-roles: [staff, admin]
      description: >
        The role list is the outer guard, not the real one: the server refuses every staff member
        except the one the request is assigned to, admins included. An admin who needs the numbers
        assigns the request to themselves first -- two visible moves if somebody else already holds
        it, since there is no `assigned` -> `assigned` transition -- and each one is a timeline entry
        and an audit row. The control is accountability, not prohibition. Every call -- successful or
        refused -- is written to `audit_log`.
      responses:
        '200':
          description: The parties on this request, owner first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceRequestIdentity' }
        '403':
          description: The request is unassigned, or assigned to somebody else
        '404':
          description: No such request
  /service-requests/{id}/draft:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    # Slice-11 spec fix S41. The operation had no request body, so "share draft for review" shared
    # nothing -- the customer was asked to approve a document that was never transmitted. Multipart,
    # matching /final-doc, because a draft agreement is a file.
    post:
      tags: [Services & Support]
      summary: Share draft for review (staff)
      operationId: shareServiceRequestDraft
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                note: { type: string, maxLength: 500 }
                file: { type: string, format: binary }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}/draft/decision:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Approve / reject draft
      operationId: decideServiceRequestDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      # D152. Abandoning a payment modal is the most ordinary thing to do in a checkout, and it
      # used to be terminal: no webhook arrives, the row sits at awaiting-payment forever, the
      # one-open-order cap then refuses the next attempt, and status changes are staff-only. This
      # is the release valve. It is deliberately narrower than PATCH /status -- it is the only
      # transition a requester may make, and only out of awaiting-payment.
      summary: Cancel an unpaid request (requester only)
      operationId: cancelServiceRequest
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: The request is not awaiting payment, so there is nothing to release
  /service-requests/{id}/party-details:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    put:
      tags: [Services & Support]
      summary: Submit the invited party's half of the details (accepted invitee only)
      operationId: submitServiceRequestPartyDetails
      description: >
        The counterparty's one write on the agreement, and the reason co-fill is called co-fill.


        Before this route the invitee could read the matter and answer the invitation and nothing
        else, so a tenant's own particulars reached the desk by the requester typing them in on
        their behalf -- which is the same defect `putServiceRequestIdentities` exists to close on the
        identity numbers, one level up.


        **The guard is neither a role nor the requester, and it excludes both.** Staff are refused
        because a desk filling in a party's details makes a support action indistinguishable from
        that party's own statement. The requester is refused for the same reason from the other
        direction: they have `createServiceRequest` and their own `details`, and letting them post
        here would let one side of an agreement author the other side's half of it. Only somebody
        who holds an `accepted` invitation on this request may call it; a `pending` or merely
        `invited` party is refused, because accepting is the consent that makes them a party at all.


        `PUT`, and the body is merged rather than replacing the request's `details` wholesale --
        the two sides are filling different keys of one object and a replace would let whoever
        submits second erase the first. Within one side's own keys the last write wins, which is
        what a form being corrected needs.


        Only before checkout. Once `payment_ref` exists the priced matter is bound to a gateway
        order and the details it was priced from must stop moving; the requester reopens it by
        cancelling and starting again, which is a visible act rather than a silent edit under a
        pending payment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyDetailsUpdate' }
      responses:
        '200':
          description: >
            Merged. The whole request is returned rather than the details alone, so the submitting
            party sees the combined object they have just contributed to -- including the half the
            other side wrote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '403':
          description: >
            The caller is the requester, or has not accepted the invitation. Deliberately `403` and
            not `404`: the caller can see this request, so pretending it does not exist would be
            both false and useless -- what they need to be told is that accepting comes first.
        '404':
          description: No such request for this caller
        '409':
          description: >
            The request is no longer awaiting payment, or checkout is already open. The details it
            was priced from are settled at that point.
  /service-requests/{id}/checkout:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Open checkout on a deferred co-fill request (requester only)
      operationId: openServiceRequestCheckout
      description: >
        The second half of `createCoFillServiceRequest`: binds the gateway order that route
        deliberately did not open, once there is something to pay for.


        The requester's alone. Not ops -- they have no business starting a customer's payment -- and
        not the invited party, who did not agree to the price and is not the one being charged.
        Anyone else on the request is refused `403`; anyone not on it at all is refused `404`, on the
        same silence every customer-scoped read on this resource keeps.


        **Every invitation must be answered first.** At least one party has to have accepted -- there
        is no co-fill to pay for otherwise -- and none may still be outstanding. That second rule is
        the point of the whole deferral: paying while an invitation is unanswered is exactly the
        premature commitment the plain create makes, and it would leave the requester holding an
        order for a matter the other side can still decline. A requester who is tired of waiting
        withdraws the invitation (`withdrawServiceRequestParty`) and then opens checkout, which
        makes abandoning the counterparty a deliberate act rather than a timeout.


        Idempotent only in the sense that a second call while an order is already open is a `409`
        rather than a second order: the one-open-order rule is what stops a customer being charged
        twice for one agreement.
      responses:
        '200':
          description: >
            Checkout opened. The returned request carries the gateway reference the client hands to
            the payment sheet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '403':
          description: The caller is on this request but did not raise it
        '404':
          description: No such request for this caller
        '409':
          description: >
            Not awaiting payment, checkout already open, nothing payable, nobody has accepted yet,
            or an invitation is still outstanding. All five are "the request is not in a state where
            opening checkout means anything", which is what this file uses `409` for throughout.
  /service-requests/{id}/final-doc:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload final document (staff)
      operationId: uploadServiceRequestFinalDoc
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
  /service-requests/{id}/parties:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      # D121. A rent agreement is two people's paperwork, but every other route on this resource is
      # scoped to one requester, so the tenant had no way to see the request they are named on. This
      # is how the second side comes to exist. The mobile is resolved to an *account* and then
      # discarded -- the row keys on the invited user, never on the digits -- so a counterparty who
      # later changes their number does not silently lose access, and no contact detail is copied
      # into a second table for the erasure job to chase.
      summary: Invite the counterparty to co-fill (requester only)
      operationId: inviteServiceRequestParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestPartyInvite' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestParty' }
        '400':
          description: Not a role this request has, or not a mobile number
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: >
            No account holds that mobile, or the role is already taken, or that person is already on
            this request, or the request is finished. Deliberately not 404: the request exists and
            the caller can see it, so the thing that is missing is the invitee's account.
  /service-requests/{id}/parties/{partyId}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
      - name: partyId
        in: path
        required: true
        description: The invitation's own id, as returned by `inviteServiceRequestParty`.
        schema: { type: string }
    delete:
      tags: [Services & Support]
      summary: Withdraw an unanswered invitation (requester only)
      operationId: withdrawServiceRequestParty
      description: >
        Takes back an invitation nobody has answered, releasing the side so a mistyped number can be
        corrected.


        Not a convenience. `uq_service_request_parties_role` means one invitation spoken for the
        owner side is the owner side, so a wrong number leaves the requester unable to invite the
        person they meant *and* unable to open checkout, since `openServiceRequestCheckout` refuses
        while an invitation is outstanding. Before V107 a stranger would at least eventually decline
        their way out of it; a pending row addressed to a number belonging to nobody has no one who
        *can* answer, so without this route the requester would have been stuck behind the ninety-day
        expiry sweep.


        **Only while unanswered**, and only by the requester. An accepted party is on the matter and
        has been shown it -- removing them is not an edit to a form, and it is not something the
        other side gets to do quietly. A declined row stays for the reason it always has: so the
        requester can see they were turned down, rather than watching the invitation evaporate and
        wondering whether it was ever sent.


        The row is deleted rather than flagged, because releasing the side is the whole point and the
        unique index keys on the row's existence. The act is not lost: it is written to `audit_log`
        and appears on the request's own timeline.
      responses:
        '204':
          description: >
            Withdrawn. No body, for the reason `markServiceRequestRead` returns none -- the caller is
            undoing something, not reading. The remaining parties are on the request itself.
        '404':
          description: >
            No such request for this caller, or no such invitation on it. A stranger's request is
            invisible rather than forbidden, on the same terms as every other customer-scoped read
            here.
        '409':
          description: >
            The invitation has already been accepted or declined, so there is nothing left to take
            back.
  /service-requests/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      # D121. `markServiceRequestRead` was a client-side no-op -- the unread badge lived in the
      # browser, so it cleared on one device and stayed lit on the next, and ops could not tell a
      # customer who had not read the draft note from one who was ignoring it.
      #
      # Receipts are taken by *side*, not by individual: reading as the customer clears the ops
      # messages and nothing else. A co-fill counterparty must not be able to mark the requester's
      # own messages as seen by the requester.
      summary: Mark the other side's messages read
      operationId: markServiceRequestRead
      responses:
        '204':
          description: >
            Recorded. No body: the caller already holds the thread, and returning it would make an
            idempotent bookkeeping call look like a read of the conversation.
        '404':
          description: No such request for this caller
  /me/service-request-invites:
    get:
      tags: [Services & Support]
      # D121. Addressed to the invited account, never to a link. The prototype mailed an invite id
      # over WhatsApp, which made a forwarded message enough to read a rent, a deposit and two sets
      # of identity documents.
      summary: My outstanding co-fill invitations
      operationId: myServiceRequestInvites
      responses:
        '200':
          description: >
            Pending invitations only, newest first. Unpaged -- the list is bounded by how many
            agreements one person is mid-way through arranging. Once accepted, the request itself
            appears in GET /service-requests and the invitation stops being the interesting object.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceRequestParty' }
  /me/service-request-invites/{partyId}:
    parameters:
      - name: partyId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Services & Support]
      summary: Accept or decline a co-fill invitation
      operationId: decideServiceRequestInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteDecision' }
      responses:
        '200':
          description: Answered. Accepting is what widens the caller's read scope to the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestParty' }
        '404':
          description: >
            No such invitation for this caller. Somebody else's is invisible, not forbidden --
            including to an admin, since answering on another person's behalf is the one thing this
            flow must not permit.
        '409':
          description: Already answered
  /me/rent-agreements:
    get:
      tags: [Services & Support]
      summary: My rent agreements
      operationId: myRentAgreements
      responses:
        '200':
          description: Agreements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RentAgreement' }
    post:
      tags: [Services & Support]
      summary: Create rent-agreement record
      operationId: createRentAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentAgreementCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentAgreement' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/owner-kyc:
    get:
      tags: [Services & Support]
      summary: Owner KYC data
      operationId: getOwnerKyc
      responses:
        '200': { description: KYC, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerKyc' } } } }
    put:
      tags: [Services & Support]
      summary: Save owner KYC
      operationId: saveOwnerKyc
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerKycUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerKyc' }
  # ============================================================
  # 9. BILLING & GROWTH (plans, boosts, orders, referrals)
  # ============================================================
  /plans:
    get:
      tags: [Billing & Growth]
      summary: Subscription plans catalog
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
  /me/subscription:
    get:
      tags: [Billing & Growth]
      summary: My current subscription
      operationId: getSubscription
      responses:
        '200': { description: Subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
    post:
      tags: [Billing & Growth]
      summary: Subscribe / upgrade plan
      operationId: subscribe
      description: >
        Subscribes to / upgrades a plan, collected via the Cashfree Payment Gateway
        (ADR-017). A priced plan returns a `pending` subscription carrying `paymentRef`
        (the gateway order id) and is activated by the payment webhook (see `callbacks`);
        a zero-price plan is `active` immediately.
      externalDocs:
        description: Plans, billing & referrals flow
        url: docs/flows/consumer/plans-billing-refer.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        # Slice-13 spec fix S50. Was `'402': Payment required` with no response body, so a
        # client told to pay was given nothing to pay with -- no order id, no session, no link.
        # The platform already has a working answer for this (`POST /me/rent-payments`): return
        # the resource in a not-yet-paid state carrying the gateway order id, and let the webhook
        # settle it. Applying the same shape here removes an unimplementable response and makes
        # the two money flows behave identically.
        '201':
          description: >
            Subscribed. `status` is `active` for a free plan and `pending` for a priced one,
            in which case `paymentRef` carries the gateway order id to hand to the checkout SDK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        # D160. One outstanding unpaid order per user: a priced plan is refused while the caller
        # already holds a `pending` subscription, because each one opens a live gateway order and
        # nothing else bounded the total (Idempotency-Key is optional, and the rate limit caps speed
        # rather than count). The held order is readable at GET /me/subscription, and the
        # abandoned-checkout sweep cancels it if the customer never returns, so the refusal is
        # temporary by construction.
        '409': { $ref: '#/components/responses/Conflict' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /boost-packs:
    get:
      tags: [Billing & Growth]
      summary: Listing boost packs catalog
      operationId: listBoostPacks
      security: []
      responses:
        '200':
          description: Packs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BoostPack' }
  /me/properties/{propId}/boost:
    parameters: [ { $ref: '#/components/parameters/PropRef' } ]
    get:
      tags: [Billing & Growth]
      summary: Boosts bought for a listing
      operationId: listListingBoosts
      description: >
        Every boost ever purchased for this listing, newest first, owner-scoped. Includes windows
        that never opened: a boost still `pending` is a payment that did not complete, which is the
        most useful thing this endpoint can tell an owner asking why nothing happened.
      responses:
        '200':
          description: Boosts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Boost' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Billing & Growth]
      summary: Boost a listing
      operationId: boostListing
      description: >
        Purchases a boost pack for a listing, collected via the Cashfree Payment Gateway
        (ADR-017). Returns a `pending` boost carrying `paymentRef`; the window opens when the
        payment webhook confirms the money (see `callbacks`).
      externalDocs:
        description: Plans, billing & referrals flow
        url: docs/flows/consumer/plans-billing-refer.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packId]
              properties:
                packId: { type: string }
      responses:
        '201':
          description: Boost applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Boost' }
        # D160. One outstanding unpaid order per *buyer*, not per listing: an owner is refused while
        # they already hold a `pending` boost on any of their listings. Scoping to the listing would
        # have let the bound grow with how many listings someone can create, which is not a bound.
        # The held order is readable at GET /me/properties/{propId}/boost and the abandoned-checkout
        # sweep expires it, so the refusal is temporary by construction.
        '409': { $ref: '#/components/responses/Conflict' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /service-catalog:
    get:
      tags: [Billing & Growth]
      summary: Paid services catalog (packing, painting, legal, etc.)
      operationId: listServiceCatalog
      security: []
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceOffering' }
  /me/service-orders:
    get:
      tags: [Billing & Growth]
      summary: My service orders
      operationId: listServiceOrders
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceOrder' }
    post:
      tags: [Billing & Growth]
      summary: Place service order
      operationId: createServiceOrder
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOrderCreate' }
      responses:
        '201':
          description: Ordered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
  # D58. The order lifecycle, which shipped with no operation at all: status and amount could only
  # be changed by hand-written SQL. Split across two paths because it is driven from two sides --
  # ops quotes and works the job, the customer accepts the price. `scheduled` is deliberately absent
  # from ServiceOrderStatusUpdate: it means the customer said yes, so ops cannot set it and accept
  # its own quote.
  /service-orders/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Billing & Growth]
      summary: Quote or advance a service order (staff)
      operationId: updateServiceOrderStatus
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOrderStatusUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        # The order is not in a state this move is legal from -- resending will not help.
        '409': { $ref: '#/components/responses/Conflict' }
        # `amount` missing on a quote, or sent with any other status.
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/service-orders/{id}/accept:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Accept the quote on my service order
      operationId: acceptServiceOrder
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
        # A staff caller. Ops sets the price and may not also agree to it.
        '403': { $ref: '#/components/responses/Forbidden' }
        # Somebody else's order is invisible, never forbidden.
        '404': { $ref: '#/components/responses/NotFound' }
        # The order has not been quoted yet, or has already moved on.
        '409': { $ref: '#/components/responses/Conflict' }
  /me/service-orders/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Cancel my service order
      operationId: cancelServiceOrder
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        # Work has started, or the order is already closed.
        '409': { $ref: '#/components/responses/Conflict' }
  /me/entitlements:
    get:
      tags: [Billing & Growth]
      summary: What I am entitled to (owner contacts, listing slots)
      operationId: getEntitlements
      # D31b. Until this endpoint existed the free tier's owner-contact quota was counted in the
      # browser's localStorage, by a module whose own header said it was not real security --
      # clearing site data reset it and a second browser never saw it. The referral bonus that
      # topped it up was computed the same way, which meant the platform's referral scheme paid a
      # reward the platform never granted.
      #
      # One endpoint for both halves on purpose: a caller's contact allowance and their listing
      # allowance are derived from the same subscription and the same referrals, so splitting them
      # would mean two round trips over the same rows and a window in which they could disagree.
      #
      # Deliberately separate from /me/subscription. That reports a purchase, including a pending
      # one still awaiting payment; this reports capability, which a pending purchase does not
      # confer. Same subject, different question.
      responses:
        '200': { description: Entitlements, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }
  /me/referrals:
    get:
      tags: [Billing & Growth]
      summary: My referral code + rewards
      operationId: getReferrals
      responses:
        '200': { description: Referrals, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } } }
  /referrals/redeem:
    post:
      tags: [Billing & Growth]
      summary: Redeem a referral code
      operationId: redeemReferral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                # D60. How the link reached this person, as the client observed it. Optional, and
                # unknown is the common case: a code dictated over a call carries no channel, and
                # an older client sends none. An unrecognised value is stored as unknown rather
                # than refused -- failing a real referral to protect an analytics field would be
                # the wrong trade on the one screen that exists to buy liquidity.
                shareChannel: { type: string, enum: [whatsapp, sms, email, copy, qr, other] }
      responses:
        '200': { description: Redeemed }
        '409': { description: Already redeemed / invalid }
  /referrals:
    get:
      tags: [Billing & Growth]
      summary: Referral review queue (admin/ops fraud desk)
      operationId: listReferrals
      # Slice-13 spec fix S53. The summary said "admin/ops" and nothing enforced it, so as
      # written this queue -- every referrer's and referred party's mobile number, plus the
      # fraud signals that say which of them we suspect -- was readable by any signed-in user.
      # The three decision endpoints below were open in the same way.
      x-roles: [staff, admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, qualified, rewarded, rejected, clawed-back] } }  # Slice-13 spec fix S52
        - { name: risk, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Referrals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Approve a referral (checker) - credits the referrer's reward ledger
      operationId: approveReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/reject:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Reject a referral (checker)
      operationId: rejectReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/clawback:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Claw back a released referral reward - debits the ledger
      operationId: clawbackReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Clawed back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  # ============================================================
  # 10. ENGAGEMENT (saved, alerts, reviews, flatmates, content)
  # ============================================================
  /me/saved:
    get:
      tags: [Engagement]
      summary: Saved properties
      operationId: listSaved
      description: >
        Newest-saved first. Paged: nothing caps how many listings a user may shortlist, and each row
        is a full PropertySummary.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged saved list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertySummary' }
  /me/saved/{propId}:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    put:
      tags: [Engagement]
      summary: Save a property
      operationId: savePropertyItem
      responses:
        '204': { description: Saved }
    delete:
      tags: [Engagement]
      summary: Unsave a property
      operationId: unsaveProperty
      responses:
        '204': { description: Removed }
  /me/flatmate-saves:
    get:
      tags: [Engagement]
      summary: Flatmate shortlist
      operationId: listFlatmateSaves
      description: >
        The caller's shortlisted rooms, groups and seeker posts, newest-saved first, as the same
        cards the flatmates feed renders. Heterogeneous like GET /flatmates/feed: discriminate by
        shape. A save whose target has since been deleted drops out of `content` while `total` still
        counts it -- the alternative is a page with holes in it.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged flatmate shortlist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/FlatmateSeekerPost'
                            - $ref: '#/components/schemas/FlatmateRoomFeed'
                            - $ref: '#/components/schemas/FlatmateGroupFeed'
  /me/flatmate-saves/keys:
    get:
      tags: [Engagement]
      summary: Flatmate shortlist keys
      operationId: listFlatmateSaveKeys
      description: >
        Every key the caller has saved, unpaged -- what the flatmates board needs to draw a bookmark
        filled or empty on any card it happens to show. Unpaged because a partial answer would render
        some of the caller's own saves as unsaved; bounded in practice by one person's taps, and by
        the row being two fields rather than a card.
      responses:
        '200':
          description: The caller's saved keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlatmateSaveKey' }
  /me/flatmate-saves/{kind}/{id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [room, group, post] }
        description: Which table `id` points at. In the path because the id alone does not say.
      - name: id
        in: path
        required: true
        description: The saved row's id -- a flatmate room, group or seeker post, per `kind`.
        schema: { type: string, format: uuid }
    put:
      tags: [Engagement]
      summary: Shortlist a flatmate post
      operationId: saveFlatmatePost
      responses:
        '204': { description: Saved }
        '400': { description: '`kind` is not one of room, group, post' }
        '404': { description: No row of that kind has that id }
    delete:
      tags: [Engagement]
      summary: Remove a flatmate post from the shortlist
      operationId: unsaveFlatmatePost
      responses:
        '204': { description: Removed }
        '400': { description: '`kind` is not one of room, group, post' }
  /me/saved-searches:
    get:
      tags: [Engagement]
      summary: Saved searches / alerts
      operationId: listSavedSearches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedSearch' }
    post:
      tags: [Engagement]
      summary: Create saved search / alert
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/saved-searches/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Change alert preferences on a saved search
      description: >
        Updates how the caller is alerted, not what is searched for. The query, filters and criteria
        are the identity of the alert — changing them replaces it rather than modifying it, so they
        are not accepted here. Turn alerts off with `alertFrequency: off`.
      operationId: updateSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Engagement]
      summary: Delete saved search
      operationId: deleteSavedSearch
      responses:
        '204': { description: Removed }
  /me/recent-searches:
    get:
      tags: [Engagement]
      summary: Recent searches ("resume your search" rail)
      description: >-
        The signed-in caller's last six searches, newest first. Self-scoped by the JWT; there is no
        account identifier in the path or the body of either operation, so no parameter exists that
        could be changed to read another user's history.


        Distinct from `/me/saved-searches` despite the name. A saved search is a standing instruction
        with an alert frequency that survives until the user deletes it; a recent search is a
        byproduct of navigating, silently evicted six searches later. Nothing here changes alert
        semantics.


        Anonymous visitors are not served: their trail stays in the browser.
      operationId: myRecentSearches
      responses:
        '200':
          description: Recent searches, newest first (at most 6)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentSearch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Engagement]
      summary: Record a search (idempotent by URL)
      description: >-
        Records a search the caller just ran, or moves an existing entry back to the top. `PUT`
        because it is idempotent: the same search recorded twice leaves one entry with a newer
        timestamp.


        Entries are de-duplicated by the **normalized URL**, never by label — the label is what the
        user read, the URL is what the search was, and two different searches can render the same
        chip. Normalization lowercases the path and sorts the query parameters, so `?deal=rent&loc=x`
        and `?loc=x&deal=rent` are one entry. The label of an existing entry is refreshed on a touch.


        `url` must be a relative URL on one of our own search pages (`/listings`, `/flatmates`).
        Absolute, protocol-relative (`//host/...`), backslash-smuggled, over-long and off-site URLs
        are rejected with 422: the stored value is handed back to the browser as a link the account's
        own UI invites the user to click, so a permissive rule here would be a stored redirect.


        `at` is always server-generated and is never accepted from the client — a client that could
        set it could pin an entry to the top of its own rail forever.


        Returns the caller's whole rail after the write, including any eviction past the cap of six.
      operationId: recordRecentSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecentSearchCreate' }
      responses:
        '200':
          description: The caller's rail after the write, newest first (at most 6)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentSearch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties/{propId}/reviews:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Engagement]
      summary: Reviews for a property/locality
      operationId: listReviews
      security: []
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
    post:
      tags: [Engagement]
      summary: Post a review
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
  /properties/{propId}/reviews/summary:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Engagement]
      summary: Rating summary for a property
      operationId: getReviewSummary
      security: []
      # D79: `listReviews` above is unpaged, and the reason it is allowed to be (D8.6) is that the
      # property page derives the star average, the 1-5 distribution and the per-aspect averages
      # from the whole array. That bound is real -- only someone with a completed visit or a
      # tenancy may review a listing, and the UNIQUE index allows each of them one -- but it makes
      # three displayed numbers depend on the list never being paged. Page it for any reason and
      # the page would go on rendering them, now silently describing page one.
      #
      # So the summary is served separately and computed in SQL. Purely additive: `listReviews`
      # keeps its exact response shape and stays unpaged, no client has to change, and paging that
      # list later becomes a decision instead of a regression.
      description: >
        Aggregate ratings for one listing, computed by the database over every published review --
        not over a page, and not by reducing the list client-side. Public for the same reason the
        list is: this is what an anonymous visitor is weighing up.
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reviews/{entityType}/{entityId}:
    parameters:
      - { name: entityType, in: path, required: true, schema: { type: string, enum: [society, locality, owner] } }
      - { name: entityId, in: path, required: true, schema: { type: string }, description: Slug or id of the target entity }
    get:
      tags: [Engagement]
      summary: Reviews for a society / locality / owner
      operationId: listEntityReviews
      security: []
      # S27 (slice 8): was a bare array. A popular locality's reviews are bounded only by the
      # city's user base -- platform-scale growth, so api-standards.md §5.1 says page it. No
      # `Sort`: the order is fixed server-side (newest first) and index-backed by
      # idx_reviews_target_created. The aggregate the UI needs (avg + count) is served by the
      # society / locality DETAIL endpoints, not by summing a page.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }
    post:
      tags: [Engagement]
      summary: Post a review for a society / locality / owner
      operationId: createEntityReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
  /reviews/{entityType}/{entityId}/summary:
    parameters:
      - { name: entityType, in: path, required: true, schema: { type: string, enum: [society, locality, owner] } }
      - { name: entityId, in: path, required: true, schema: { type: string }, description: Slug or id of the target entity }
    get:
      tags: [Engagement]
      summary: Rating summary for a society / locality / owner
      operationId: getEntityReviewSummary
      security: []
      # The counterpart of `getReviewSummary` for the three entity targets, and the more urgent
      # half of D79. `listEntityReviews` above is PAGED (S27), so every client reducing it into a
      # star average -- the society hub, the owner profile, the locality reviews block -- has been
      # averaging page one and rendering it as the rating. On the property side that was a latent
      # defect; here it has already happened.
      #
      # One operation for all three types rather than three, because ReviewTargetKey already
      # resolves (entityType, entityId) to the single canonical target_id the table stores, and the
      # aggregate takes target_type as a parameter. `property` is deliberately NOT accepted here --
      # the enum is the same disjoint one `listEntityReviews` declares, and the property summary
      # keeps its own path.
      description: >
        Aggregate ratings for one society, locality or owner, computed by the database over every
        published review -- not over a page. Public for the same reason the list is. 404 when the
        entity type is not one of the three, or when nothing of that kind exists under that
        identifier.
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---------------------------------------------------------------------------------------------
  # The /share-flat/* operations that used to sit here were removed when the flatmates backend
  # landed (V28). They were the legacy surface: listShareFlatPosts, createShareFlatPost and
  # shareFlatInterest, served by ShareFlatController over V7's share_flat_posts. Their data was
  # carried into flatmate_seeker_posts and flatmate_requests, the tables were dropped, and the
  # /flatmates/* operations below are now served for real rather than being a target contract.
  #
  # `/share-flat` remains a permanent client-side redirect to `/flatmates` in the frontend router;
  # nothing on the API answers that prefix any more.
  # ---------------------------------------------------------------------------------------------
  /flatmates/feed:
    get:
      tags: [Engagement]
      summary: Flatmates feed (tab-aware, mixed)
      description: >
        One feed per tab. `move-in` returns rooms plus groups that already hold an address;
        `team-up` returns solo seeker posts plus address-less groups. The list is sorted as one
        list — merging two pre-sorted lists would stack every room above every group.
      operationId: listFlatmateFeed
      security: []
      externalDocs: { description: Behaviour, url: docs/flows/consumer/flatmates.md }
      parameters:
        - { name: tab, in: query, schema: { $ref: '#/components/schemas/FlatmateTab' } }
        - { name: view, in: query, deprecated: true, description: Legacy tab alias; resolved to `tab`., schema: { $ref: '#/components/schemas/FlatmateTabLegacy' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string } }
        - { name: budget, in: query, description: Per-head ceiling. Rooms are matched on their best achievable per-person price, so a shareable room can surface under a lower budget., schema: { type: integer } }
        - { name: moveIn, in: query, schema: { $ref: '#/components/schemas/FlatmateMoveIn' } }
        - { name: gender, in: query, schema: { type: string, enum: [male, female] } }
        - { name: sharing, in: query, description: '`team-up` only.', schema: { type: string } }
        - { name: attachedBath, in: query, description: '`move-in` only.', schema: { type: boolean } }
        - { name: verifiedOnly, in: query, schema: { type: boolean } }
        - { name: habits, in: query, schema: { type: array, items: { type: string } } }
        - { name: near, in: query, description: 'Proximity centre as `lat,lng`.', schema: { type: string, example: '18.5590,73.7868' } }
        - { name: nearRadius, in: query, schema: { type: number, default: 5 } }
        - { name: nearMode, in: query, schema: { type: string, enum: [km, min], default: km } }
        - { name: sort, in: query, schema: { type: string, enum: [verified, match, budget-low, budget-high, new], default: verified } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/FlatmateSeekerPost'
                            - $ref: '#/components/schemas/FlatmateRoomFeed'
                            - $ref: '#/components/schemas/FlatmateGroupFeed'
  /flatmates/posts:
    get:
      tags: [Engagement]
      summary: Flatmate seeker posts
      operationId: listFlatmateSeekerPosts
      security: []
      parameters:
        - { name: locality, in: query, schema: { type: string } }
        - name: gender
          in: query
          description: Who the seeker will share with. Exact match; `any` is treated as no filter.
          schema: { type: string, enum: [any, male, female] }
        - name: flatPref
          in: query
          description: Who the seeker wants in the flat. Matches an `any` post as well; `any` request is no filter.
          schema: { type: string, enum: [any, women, men] }
        - name: roomPref
          in: query
          description: Whether the seeker wants a private room. Exact match; `any` is treated as no filter.
          schema: { type: string, enum: [any, private, shared] }
        - name: minBudget
          in: query
          description: Lowest monthly budget, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxBudget
          in: query
          description: Highest monthly budget, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateSeekerPost' }
    post:
      tags: [Engagement]
      summary: Create a flatmate seeker post
      description: Requires only an L1 signed-in account (ADR-019). One live post per identity.
      operationId: createFlatmateSeekerPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateSeekerPostCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '409': { description: A live post already exists for this identity (`already_live`) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/posts/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Update my flatmate seeker post
      operationId: updateFlatmateSeekerPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateSeekerPostCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Engagement]
      summary: Remove my flatmate seeker post
      description: Backs both "Delete" and "Mark filled".
      operationId: deleteFlatmateSeekerPost
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/posts/{id}/interest:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Express interest in a flatmate seeker post
      operationId: flatmatePostInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201': { description: Sent }
        '403': { description: The target opted into verified-only contact (`verification_required`) }
        '409': { description: Interest already expressed (`already_interested`) }
  /flatmates/posts/{id}/interests:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Engagement]
      summary: Who answered my flatmate post
      operationId: listFlatmatePostInterests
      description: >
        Newest first, paged, and readable only by the post's author. Each row carries the
        requester's name and the number they volunteered when they pressed "I'm interested" on
        this named post - the same row, and the same contact, that `listMyFlatmateRequests`
        already hands this caller; this read simply scopes it to one ad. Ownership is checked
        server-side on every call, so the id in the path grants nothing. Replies to an archived
        post are still returned: filling or removing the ad does not retract the leads it drew.
        No `sort` parameter - the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged replies to this post
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/flatmate-posts:
    get:
      tags: [Engagement]
      summary: My own flatmate ad
      operationId: listMyFlatmatePosts
      description: >
        The ad the caller wrote, as its author sees it -- the seeker counterpart of
        `listMyFlatmateRooms`, and for the same reason that route gives: this is not the public feed
        narrowed. `listFlatmateSeekerPosts` is hard-floored to approved rows and publishes no
        contact, so an author whose post is still in moderation cannot find it there, and could not
        recognise it if they could -- the feed masks `mobile` to null on every row.


        Without this route a client has no way to answer "have I posted?", which is a question the
        product asks on every render of the board: the author gets a banner instead of a card, and
        their own ad is excluded from the results so they cannot express interest in themselves.
        Both behaviours were unreachable over HTTP until this existed.


        Paged for consistency with its two `/me/flatmate-*` siblings, though **the envelope can only
        ever hold one row**: `createFlatmateSeekerPost` refuses a second live ad (`already_live`) and
        a partial unique index enforces it. Taken-down ads are excluded -- unlike the room route,
        which shows withdrawn rooms, because the question this answers is "is one of mine live right
        now" and an archived ad would answer it wrongly.


        The row carries the caller's own `mobile` unmasked. That is the same decision
        `createFlatmateSeekerPost` already returns and not a new one: a seeker post carries its
        author's number only ever back to that author.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: The caller's live ad, or an empty page when they have not posted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateSeekerPost' }
  /me/flatmate-rooms:
    get:
      tags: [Engagement]
      summary: Rooms I am hosting
      operationId: listMyFlatmateRooms
      description: >
        The host's own rooms, newest first -- the counterpart of the public feed, and the list the
        host dashboard is built from.


        Under `/me` rather than as a filter on `/flatmates/rooms`, because it is not the same
        resource narrowed: the public feed shows live rooms, and a host needs to see the ones they
        have withdrawn or filled as well. A `hostedByMe=true` parameter would have quietly changed
        what the feed's other filters mean.


        Paged, because nothing caps how many rooms one host may list.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: The caller's rooms, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRoom' }
  /flatmates/rooms/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    delete:
      tags: [Engagement]
      summary: Withdraw a room I am hosting
      operationId: withdrawFlatmateRoom
      description: >
        The host's own exit. 204 and no body, unlike `archiveListing` next door -- a withdrawn room
        leaves the host's dashboard entirely rather than reappearing on it in a different state, so
        there is nothing for the client to redraw.


        Only the host may do this, and a room belonging to somebody else is a `404` rather than a
        `403` for the same reason it is on listings: an id's existence is not something this route
        confirms to a caller with no relationship to it.


        Seats already taken and interest already expressed keep their references; what changes is
        that the room stops being offered.
      responses:
        '204':
          description: Withdrawn
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Engagement]
      summary: Edit a room I am hosting
      operationId: updateFlatmateRoom
      description: >
        The whole room, not a sparse patch -- the same body `createFlatmateRoom` takes. A partial
        body would make "absent" and "cleared" the same wire value for `note`, `deposit` and
        `availableFrom`, and a host clearing a note is a thing that has to be expressible.


        `PATCH` rather than `PUT` because the server still owns the fields the body never carries:
        the verification tier is re-derived from what the host can prove, the address fingerprint is
        recomputed, and the moderation state is re-decided.


        **An edit re-enters the trust ladder rather than always returning to `pending`.** A post
        whose visibility was granted by a moderator (`identity` tier) leaves the board and waits to
        be read again. A post that publishes on an approved title deed (`owner`) or a declared
        agreement (`tenant`) stays live, because no moderator approved its copy in the first place
        and there is nothing for the edit to invalidate. An edit that drops the property or retracts
        the agreement claim lowers the tier, and that lands it in the queue on its own.


        Rooms created by splitting a flat are refused with `409 (split_room)`: their address belongs
        to the parent listing, so the listing is what to edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateRoomCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/rooms:
    get:
      tags: [Engagement]
      summary: Flatmate rooms
      operationId: listFlatmateRooms
      security: []
      parameters:
        - { name: locality, in: query, schema: { type: string } }
        - name: gender
          in: query
          description: Who the room is offered to. Matches an `any` room as well; `any` request is no filter.
          schema: { type: string, enum: [any, male, female] }
        - name: food
          in: query
          description: Dietary preference. Matches an `any` room as well; `any` request is no filter.
          schema: { type: string, enum: [any, veg, nonveg] }
        - name: roomType
          in: query
          description: Private or shared occupancy of the room. Exact match.
          schema: { type: string, enum: ['Private room', 'Shared room'] }
        - name: furnishing
          in: query
          description: Furnishing level. Exact match.
          schema: { type: string, enum: [unfurnished, semi, furnished] }
        - name: bhk
          in: query
          description: Bedrooms in the flat; `4` means 4+. Exact match.
          schema: { type: string, enum: ['1', '2', '3', '4'] }
        - name: minBudget
          in: query
          description: Lowest rent for the room's price basis, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxBudget
          in: query
          description: Highest rent for the room's price basis, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: verifiedOnly
          in: query
          description: >
            Keep only rooms carrying the verified badge. Absent and `false` are the same thing -- no
            filter -- so a client that always sends the toggle's state needs no special case for off.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRoomFeed' }
    post:
      tags: [Engagement]
      summary: Post a spare room
      description: L1 signed-in. Runs the anti-broker guardrails; a hard block returns `409` with the eligibility result.
      operationId: createFlatmateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateRoomCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '409':
          description: Blocked by the host-eligibility guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/rooms/{id}/seats:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Reopen or close a room seat
      description: Seat-model rooms only. The verification tier is preserved, so a re-list needs no re-verification.
      operationId: setRoomSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatsOpen]
              properties:
                seatsOpen: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '409': { description: This room has no seat model (`not_seat_based`) }
  /flatmates/rooms/{id}/occupants:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Record how many people live in a room
      description: >
        Owner-split rooms only. The server clamps to `min(3, maxOccupants - siblings)` and echoes the
        clamped value, so a society cap can never be exceeded by editing one room.
      operationId: setRoomOccupants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occupants]
              properties:
                occupants: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated (clamped)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/rooms/{id}/agreement/reissue:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Reissue the flat's joint rent agreement
      description: >
        One agreement covers the owner and every flatmate in the flat, so a room changing hands
        invalidates it. Starts a fresh rent-agreement service request bound to the flat.
      operationId: reissueJointAgreement
      responses:
        '202': { description: Reissue started }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/groups:
    get:
      tags: [Engagement]
      summary: Flatmate groups
      operationId: listFlatmateGroups
      security: []
      parameters:
        - { name: locality, in: query, schema: { type: string } }
        - name: policy
          in: query
          description: Group join policy. Matches an open (`any`) group as well; `any` request is no filter.
          schema: { type: string, enum: [any, women, men] }
        - name: minRent
          in: query
          description: Lowest whole-flat rent, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxRent
          in: query
          description: Highest whole-flat rent, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: verifiedOnly
          in: query
          description: >
            Keep only groups the board counts as verified: the host holds `owner` tier, or every
            member carries a badge. Absent and `false` are the same thing -- no filter -- so a client
            that always sends the toggle's state needs no special case for off.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateGroupFeed' }
    post:
      tags: [Engagement]
      summary: Create a flatmate group
      description: L1 signed-in. The verification tier is derived server-side from role + proof; the client can never self-assign a host badge.
      operationId: createFlatmateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateGroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '409':
          description: Blocked by the host-eligibility guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    delete:
      tags: [Engagement]
      summary: Remove a group I created
      operationId: deleteFlatmateGroup
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Engagement]
      summary: Edit a group I created
      operationId: updateFlatmateGroup
      description: >
        The whole group, not a sparse patch -- the same body `createFlatmateGroup` takes, for the
        same reason the room edit takes a whole room: a partial body cannot distinguish an absent
        field from a cleared one.


        **`seatsTotal` moves here and only here.** `setGroupSeats` next door adjusts how many of the
        existing seats are open, which is the one-tap "a seat just went". This is the flat itself
        getting bigger or smaller. It cannot drop below the number of people already in the group --
        that is not an edit, it is an eviction, and no route means that.


        The verification tier, address fingerprint and moderation state are re-derived rather than
        accepted, and an edit re-enters the trust ladder rather than always returning to `pending`.
        See `updateFlatmateRoom` for what that means.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateGroupCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}/seats:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Reopen or close a group seat
      operationId: setGroupSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatsOpen]
              properties:
                seatsOpen: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/groups/{id}/owner-consent:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Request or confirm the flat owner's consent
      description: >
        Tenant replacement track. Called once without `otp` to send an OTP to the flat owner, then
        again with it to record an auditable consent. Consent is never client-asserted.
      operationId: requestOwnerConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerMobile]
              properties:
                ownerMobile: { $ref: '#/components/schemas/Mobile' }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200': { description: OTP sent, or consent recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/owner-consent:
    post:
      tags: [Engagement]
      summary: Request or confirm the flat owner's consent before the group exists
      description: >
        The group-less twin of `requestOwnerConsent`, for the moment the group form asks for
        consent — which is before there is a group to attach it to. Same two-call shape: once
        without `otp` to send the owner a code, again with it to record the consent. The row is
        keyed on (owner mobile, tenant), so `POST /flatmates/groups` reads it back at submit time
        rather than believing an `ownerConsent` flag from the client, which is ignored.
      operationId: requestStandaloneOwnerConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerMobile]
              properties:
                ownerMobile: { $ref: '#/components/schemas/Mobile' }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200': { description: OTP sent, or consent recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/rooms/{id}/interest:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Enquire about a room
      description: Carries the share intent, so the host learns how many people are moving in in the first line.
      operationId: flatmateRoomInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201': { description: Sent }
        '409': { description: Interest already expressed (`already_interested`) }
  /flatmates/groups/{id}/join:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Ask to join a group
      description: An open-policy group (`policy` = `any`) auto-accepts; every other policy creates a pending host-inbox request.
      operationId: flatmateGroupJoin
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201':
          description: Joined or requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRequest' }
        '409': { description: Group is full (`group_full`) or already requested (`already_interested`) }
  /flatmates/groups/{id}/apply:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Apply to a listing as a whole group
      description: >
        The group's host commits the group to one flat. Distinct from `flatmateGroupJoin`, which is a
        stranger asking to join the group: here the group already exists and moves as a unit, so the
        person who answers is the listing's owner, not the host.


        The path carries the group and the body the listing, because the group is what the caller
        must own. Applying twice to the same listing is `409 already_applied` rather than a second
        row — an owner's inbox is a queue of decisions, and the same group cannot be waiting on the
        same flat twice.
      operationId: applyGroupToListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId: { type: string, description: The flat the group wants. Required — there is no sensible listing to default to. }
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: This group has already applied to this listing (`already_applied`) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/flatmate-groups:
    get:
      tags: [Engagement]
      summary: My flatmate groups
      operationId: listMyFlatmateGroups
      description: >
        Groups the caller created, newest first, paged, **including their moderation state** — which
        is the difference from the public `GET /flatmates/groups`. A host has to be able to see that
        their own group is pending or rejected; the public feed deliberately shows neither, so
        without this route a host's group would simply vanish from their view with no explanation.


        Caller-scoped, so no role beyond being signed in. No `sort`: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateGroup' }
  /me/group-applications:
    get:
      tags: [Engagement]
      summary: Group applications on my listings (owner inbox)
      operationId: listMyGroupApplications
      description: >
        The mirror of `applyGroupToListing`: applications addressed to flats the caller owns, newest
        first, paged. Scoped by listing ownership rather than by who applied, so an owner sees every
        group waiting on them and never anybody else's queue.


        Separate from `listGroupApplications`, which is the admin moderation view over all of them.
        The two share a schema and no route, so no request is ambiguous about which axis it reads.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/GroupApplication' }
  /me/group-applications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Accept or decline a group's application to my listing
      operationId: decideMyGroupApplication
      description: >
        The owner's verdict, and **only** the owner's: `status` here is a different column from the
        `modStatus` that `decideGroupApplication` writes, so an admin can never answer on an owner's
        behalf and moderating a group can never look like accepting it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, declined] }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/flatmate-requests:
    get:
      tags: [Engagement]
      summary: My incoming flatmate requests (host inbox)
      operationId: listMyFlatmateRequests
      description: >
        Newest first, host-scoped, paged. The host writes none of these rows - each is a stranger
        answering their ad - so the inbox grows with the ad's reach. `status` filters before the
        page, so `totalElements` counts the matching requests rather than all of them. No `sort`
        parameter: the order is fixed server-side.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, declined] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRequest' }
  /me/flatmate-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Accept or decline an incoming flatmate request
      operationId: decideFlatmateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, declined] }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/flatmate-interests:
    get:
      tags: [Engagement]
      summary: Flatmate interests I have sent (seeker outbox)
      operationId: listMyFlatmateInterests
      description: >
        The mirror of `listMyFlatmateRequests`: the same table read from the other end, so the same
        row shape, the same fixed newest-first order and the same `status` filter. That inbox lists
        what strangers sent to this account's ads; this lists what this account sent to theirs.


        The button state on the flatmates board used to come from `localStorage`, which meant an ask
        made on a phone was invisible on a laptop and clearing site data made it invisible
        everywhere. This is the same fact read from the place that actually holds it.


        **Nothing travels back toward the host.** `requesterMobile` on these rows is the caller's own
        number, because the caller is the requester -- the host's number is not in this payload and
        is not in the inbox's either. Contact in this feature is one-directional by design: the host
        decides, and accepting is what hands over a number.


        Not filtered to targets that are still live. A room taken down after the ask is still
        something this person did, and hiding the row would only make it look like the ask failed.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, declined] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged interests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRequest' }
  /flatmates/{kind}/{id}/interest:
    parameters:
      - name: kind
        in: path
        required: true
        description: Which board the target lives on. `flatmate` is a seeker post, and is spelled that way because it is the literal stored in the column.
        schema: { type: string, enum: [flatmate, room, group] }
      - { $ref: '#/components/parameters/GenericId' }
    delete:
      tags: [Engagement]
      summary: Withdraw an interest I sent
      operationId: withdrawFlatmateInterest
      description: >
        **Keyed by the target, not by the request id.** At the moment the button is pressed the
        client is holding the card -- a kind and a target id -- and not the id of the row it created,
        possibly in another session. Deleting by request id would force a `listMyFlatmateInterests`
        fetch purely to translate identifiers on every press. The row is unique on
        `(kind, target_id, requester_id)` and the requester is the token, so the triple is exactly as
        precise as an id.


        **The row is deleted, not marked withdrawn.** That same unique index means a retained row
        would lock the requester out of ever asking again, turning an undo into a lockout.


        **Only while pending.** Once the host has answered, they have acted on it -- and on a group
        they may have given up a seat. That is a `409`, not a `403`: the row is the caller's, it is
        its state that refuses. Restricting it this way also keeps auto-accepted joins (`policy:
        any`) out of scope, so no seat ever has to be un-taken.


        **The rate-limit budget is not refunded.** The notification already went out; refunding it
        would make withdrawal the cheapest way to buy another send.
      responses:
        '204':
          description: Withdrawn
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /notifications:
    get:
      tags: [Engagement]
      summary: My notifications
      operationId: listNotifications
      # S27 (slice 8): was a bare array. Notifications accrue with time, per user, and nothing
      # culls them -- the clearest case of api-standards.md §5.1's "scope is not the test; growth
      # is". No `Sort`: newest-first is fixed server-side and index-backed by
      # idx_notifications_user_created (user_id, created_at DESC), added in V16.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
  /notifications/read:
    post:
      tags: [Engagement]
      summary: Mark notifications read (all or by ids)
      operationId: markNotificationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Marked }
  /notifications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    delete:
      tags: [Engagement]
      summary: Dismiss a notification
      description: >
        Removes one notification from the caller's inbox. Server-side and permanent, so a dismissal
        syncs across the user's devices (replacing the client-side tombstone the http provider kept
        while this endpoint did not exist). User-scoped: another user's id is 404, never 403.
      operationId: dismissNotification
      responses:
        '204': { description: Dismissed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/notification-preferences:
    # D94/D15. Every one of these settings used to live in one browser's localStorage, which meant
    # the server enforced none of them -- most visibly, quiet hours suppressed the alerts the client
    # derived and nothing else, so a notification the server wrote at 03:00 arrived at 03:00. The
    # field names and the nesting are the browser's existing document verbatim, so moving off
    # localStorage is a move rather than a transformation.
    get:
      tags: [Engagement]
      summary: My notification & communication preferences
      description: >
        Always 200. A user who has never saved settings has preferences -- they are the defaults --
        so this never 404s, and no client has to carry its own copy of those defaults to render the
        settings screen.
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Engagement]
      summary: Save notification & communication preferences
      description: >
        A whole-document write: the settings screen shows all six controls at once, so the client
        sends what it is looking at and every field is required. An omitted field is a 422 naming
        it, rather than a silent "keep" (which would make this a PATCH) or a silent "reset" (which
        would switch a user's match alerts back on because a serialiser dropped a false).
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /announcements:
    get:
      tags: [Engagement]
      summary: Active announcements (public)
      operationId: listAnnouncements
      security: []
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Announcement' }
  /services:
    get:
      tags: [Engagement]
      summary: Marketing services listing (CMS, public)
      operationId: listCmsServices
      security: []
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CmsService' }
  /faqs:
    get:
      tags: [Engagement]
      summary: FAQs (public)
      operationId: listFaqs
      security: []
      responses:
        '200':
          description: FAQs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Faq' }
  /banners:
    get:
      tags: [Engagement]
      summary: Homepage banners (public)
      operationId: listBanners
      security: []
      responses:
        '200':
          description: Banners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Banner' }
  # ============================================================
  # 11. ADMIN & ANALYTICS (KPIs, settings, audit, CMS, society leads)
  # ============================================================
  /admin/dashboard:
    get:
      tags: [Admin & Analytics]
      summary: Admin KPI dashboard
      operationId: adminDashboard
      # S28: The ops scorecard.
      x-roles: [staff, admin]
      responses:
        '200':
          description: KPIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKpis' }
  /admin/analytics:
    get:
      tags: [Admin & Analytics]
      summary: Analytics time series
      operationId: adminAnalytics
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      # S59: `metric` was a required free-text string, so every client guess was a syntactically
      # valid request and the server had to invent an answer for `metric=potato`. Enumerated to the
      # four series the platform can actually derive from its own tables. `revenue` is in whole
      # rupees; the other three are counts.
      # Defaults: `from` = 30 days ago, `to` = today. The range is capped server-side at 366
      # buckets - an unbounded date range on a grouped scan is a denial-of-service with a chart on it.
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [listings, users, deals, revenue] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnalyticsPoint' }
  /admin/analytics/traffic:
    get:
      tags: [Admin & Analytics]
      summary: Who arrived, from where, on what
      operationId: adminAnalyticsTraffic
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      description: >
        Built entirely from PuneNest's own `page_views` table. No third-party analytics tag is
        loaded on the site, so this is the only traffic picture that exists -- and it is the only
        one that can be, given the platform holds Indian users' browsing behaviour and shipping it
        to an ad network would be a disclosure nobody consented to.


        `sources` is derived from the referrer host, which means it is honest about its own limits:
        a visit with no referrer is `direct`, and `direct` therefore includes app switches, pasted
        links and stripped referrers as well as people typing the URL. It is not inflated to look
        better.


        `identity` splits sessions into anonymous and signed-in by week. That split, not the raw
        session count, is the number the funnel actually turns on.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: 'Window length; the response echoes the window it used in `days`, `from` and `to`.' }
      responses:
        '200':
          description: Traffic for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsTraffic' }
  /admin/analytics/engagement:
    get:
      tags: [Admin & Analytics]
      summary: How deep the visits went
      operationId: adminAnalyticsEngagement
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      description: >
        Session depth and bounce rate by week, plus the pages people actually reached.


        **`avgSessionMinutes` and `bounceRatePct` are nullable and are never zero-filled.** A week
        with too few sessions to average honestly returns null, and the chart draws a gap. Rounding
        thin data to `0.0` would put a line on the dashboard that reads as "engagement collapsed"
        when what happened is "nobody visited on the 2nd of January", and somebody would act on it.


        `topPages` reports `views` beside `anonViews` rather than one total, because a page that
        only signed-in users reach and a page that anonymous users bounce off are different problems
        with the same view count.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: Window length; echoed back in the response }
      responses:
        '200':
          description: Engagement for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsEngagement' }
  /admin/analytics/surfers:
    get:
      tags: [Admin & Analytics]
      summary: The anonymous-to-signed-in funnel
      operationId: adminAnalyticsSurfers
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      description: >
        The question this endpoint exists to answer: of the people who arrive without an account,
        how many end up with one, and where do the rest leave?


        `anonSharePct` and `conversionRatePct` are the headline pair, `weeks` is their trend, and
        `dropOff` names the paths people exit from -- which is the actionable half. A high exit
        share on a listing detail page means something quite different from a high exit share on the
        signup screen, and only the second is a funnel problem.


        Same self-hosted source as the other two analytics reads, with the same consequence: it sees
        what `POST /page-views` was told and nothing else, so a visitor who blocked the beacon is
        invisible here rather than estimated.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: Window length; echoed back in the response }
      responses:
        '200':
          description: The funnel for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsSurfers' }
  /admin/analytics/pricing:
    get:
      tags: [Admin & Analytics]
      summary: Asking prices against the market rate, by locality
      operationId: adminPricingInsights
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      description: >
        Where owners are asking more than the locality supports, and where PuneNest's own market
        rate has drifted from what listings actually say.


        `marketRatePerSqft` is the curated figure the platform publishes; `avgActualRatePerSqft` is
        what live listings average. The gap between the two is the point of the report -- a locality
        where they have separated is one where the curated number is now misleading buyers, and it
        is fixed by editing the locality, not by editing the listings.


        A **bare array**, not a page. It is one row per locality in Pune, the set is bounded by
        geography rather than by user behaviour, and paging a fixed-length report would only make it
        harder to sort in the client.
      responses:
        '200':
          description: One row per locality
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingInsightRow' }
  /admin/analytics/sla:
    get:
      tags: [Admin & Analytics]
      summary: Moderation turnaround against the promised target
      operationId: adminSlaSummary
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      description: >
        Whether the listing-review promise is being kept, and which listings are currently breaking
        it.


        The report deliberately looks in both directions. `avgHoursToReview`, `medianHoursToReview`
        and `slaRatePct` are history -- how the last window went. `pendingCount`,
        `pendingBreachingCount` and `worstPending` are the present, and they are the half an
        operator can still do something about: a queue that has already breached is a set of owners
        currently being let down, named individually so somebody can pick one up.


        Median beside mean because a single listing left for a fortnight drags the average past the
        target while most owners were served in an hour, and acting on that average would be acting
        on the wrong problem.


        **Nulls are serialised rather than omitted.** A window with nothing reviewed returns
        `avgHoursToReview: null`, not an absent key -- the dashboard needs to say "no data" and an
        omitted field is indistinguishable from a field the client forgot to read.
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer }, description: "Window on the decision instant; omitted means all time, which is the difference from the other analytics reads and is deliberate -- an SLA is a standing promise, not a monthly figure. Spelled the same way as on /admin/supply-gap so two adjacent tabs cannot name the same control differently." }
      responses:
        '200':
          description: SLA summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaSummary' }
  /admin/society-claims:
    get:
      tags: [Admin & Analytics]
      summary: Committees asking to run their own society page
      operationId: adminListSocietyClaims
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        **Oldest first**, unlike almost every other list on the platform. This is a work queue, not
        a feed: newest-first would bury the claim that has been waiting longest under the ones that
        arrived this morning, which is precisely backwards for the person working through it.


        A cross-society queue that starts from no society at all, which is why it lives under
        `/admin` rather than under `/societies/{slug}`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] }, description: Narrow the queue; omit for everything }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Claims, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyClaim' }
  /admin/society-claims/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Admin & Analytics]
      summary: Approve or reject one society claim
      operationId: adminDecideSocietyClaim
      # S28 + societies:write.
      x-roles: [staff, admin]
      description: >
        Approval is not a status change with a badge attached: it hands this person the residency
        register of a building and the power to take down what its residents post. That is why it is
        an operator's decision rather than an automatic one on any signal the claimant can produce.


        `PATCH` with the outcome in the body, not `/approve` and `/reject`, so the vocabulary stays
        enumerable in one place.


        A claim can be decided once. Re-deciding would rewrite `decidedBy` and `decidedAt` — losing
        the record of who handed the building over — and re-approving a rejected claim would pass the
        residency register to someone an operator had already turned down, so a decided claim answers
        `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyClaimDecision' }
      responses:
        '200':
          description: The decided claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyClaim' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/society-claims/{id}/certificate:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    get:
      tags: [Admin & Analytics]
      summary: Open the registration certificate attached to one claim
      operationId: adminGetSocietyClaimCertificate
      # S28 + societies:read — the same atom as the queue, deliberately not a third one.
      x-roles: [staff, admin]
      description: >
        A short-lived signed link to the scanned certificate a committee attached to its claim.


        **Keyed by the claim, not by the document.** There is no `/admin/documents/{id}` and there
        must not be: the vault this reads from holds Aadhaar, PAN, salary slips and agreements, so a
        route that accepted a document id would let any account holding `societies:read` read any
        user's KYC. The document id is read off the claim row — it never arrives from the client —
        and the vault then re-checks that the document belongs to the person who filed that claim.


        **Fetched on click, not with the queue.** The queue pages at twenty rows. Embedding a link
        per row would mint twenty expiring capabilities to serve the one an operator opens, cache
        nineteen of them in a response body, and write nineteen spurious rows into the reveal audit.
        One request, one link, one audit row.


        The link expires in minutes and is minted fresh per call, so it cannot be cached, stored or
        shared. Every call is a disclosure and is audited as `societyClaim.certificate.reveal`,
        alongside the contact reveals.


        A claim that does not exist, a claim with no certificate, and a certificate that no longer
        belongs to the claimant all answer `404`. Telling them apart would confirm to a staff
        account that a document exists which it is not allowed to see.
      responses:
        '200':
          description: A signed link, valid for minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyClaimCertificate' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/society-proposals:
    get:
      tags: [Admin & Analytics]
      summary: What the community has proposed about its societies
      operationId: adminListSocietyProposals
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        Society details, resident WhatsApp invites and corrected map pins, oldest first for the same
        work-queue reason as the claims queue.


        **This is the queue whose absence made all three features theatre.** The composer used to
        write proposals into the author's own browser storage, so this list was permanently empty
        however many residents filled the form in on theirs, and not one proposal has ever been
        applied. Reading it from the database is the fix.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] }, description: Narrow the queue; omit for everything }
        - { name: kind, in: query, schema: { type: string, enum: [details, whatsapp, location] }, description: Narrow to one proposal kind }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Proposals, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyProposal' }
  /admin/society-proposals/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Admin & Analytics]
      summary: Approve or reject one community proposal
      operationId: adminDecideSocietyProposal
      # S28 + societies:write.
      x-roles: [staff, admin]
      description: >
        **Approving writes the proposed value onto the society in the same transaction.** That is
        the whole mechanism -- there is no second "apply" step to forget, and no window in which a
        proposal reads `approved` while the society still shows the old builder name. Reject leaves
        the society untouched.


        Which fields move depends on `kind`: a `details` proposal fills the missing catalogue facts,
        `whatsapp` attaches the resident group invite, `location` moves the map coordinates. One
        route because the lifecycle is one lifecycle.


        A proposal is decided once. Deciding an already-decided proposal answers 409 rather than
        rewriting who decided it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyProposalDecision' }
      responses:
        '200':
          description: The decided proposal; on approval the society already carries the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/society-residents:
    get:
      tags: [Admin & Analytics]
      summary: Residency requests across every society
      operationId: adminListSocietyResidents
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        Every society's residency queue at once, oldest first for the same work-queue reason as the
        claims and proposals desks: the person who has waited longest is the one somebody is still
        waiting on.


        **The fourth queue on a console that already had three.** The only residency route was
        per-society, so the cross-society tab had nothing to read and stayed on the operator's own
        browser storage long after its neighbours moved to the database.


        Deliberately read-only. Deciding a request stays on
        `PATCH /societies/{slug}/residents/{residentId}`, which already admits staff and already
        owns the one-verified-resident-per-flat rule; every row here carries the slug that addresses
        it. A second decision route would be a second copy of that rule, and the copy not exercised
        by the committee's daily use is the one that drifts.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, verified, rejected] }, description: Narrow the queue; omit for everything including decided rows }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Residency requests from every society, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyResidentQueueRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/society-candidates:
    get:
      tags: [Admin & Analytics]
      summary: Member-added societies nobody has checked yet
      operationId: adminListSocietyCandidates
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        Everything `mintSociety` has created and no operator has confirmed, oldest first.


        The third queue that was permanently empty for the same reason as the proposals queue -- and
        the one whose emptiness meant **no member-added society has ever been verified**, so every
        one of them has been sitting in the directory unbadged since the day it was added.


        Rows are ordinary society records; `verifiedAt` being null is what puts them here.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Unverified societies, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Society' }
  /admin/society-candidates/{slug}/verify:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Admin & Analytics]
      summary: Confirm a member-added society is real
      operationId: adminVerifySocietyCandidate
      # S28 + societies:write.
      x-roles: [staff, admin]
      description: >
        Stamps `verifiedAt`, which is what the hub's trust badge and the directory's ordering both
        read. Until it is set, a member-added society is present but explicitly unvouched-for.


        **409 if it is already verified**, rather than a silent second success. Verification records
        who checked it and when; overwriting that with today's date because two operators opened the
        same queue would erase the only evidence that the first check happened.
      responses:
        '200':
          description: The verified society
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Society' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already verified -- the earlier check stands
  /admin/society-candidates/{slug}/duplicates:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin & Analytics]
      summary: Societies this candidate may already be a copy of
      operationId: adminListSocietyCandidateDuplicates
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        Ranked hints, strongest first, scored on shared distinctive name tokens plus a boost for
        sharing a locality. Verified targets sort ahead of unverified ones because a merge
        canonicalises *into* the trusted row.


        This was computed in the browser against a bundled file of 28 curated societies. Every
        duplicate this queue actually produces is a member-added row -- that is what a candidate is
        -- and not one of those was in the file, so a candidate that was a textbook duplicate of
        another candidate rendered "No obvious match". An operator reads that as "no duplicate
        exists" and verifies the junk row into a permanent one.


        **A hint, never an action.** Nothing merges here; the operator takes it to
        `/admin/society-merges` or ignores it. Merged-away societies are excluded, so a pair already
        dealt with does not come back asking to be dealt with again.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 6, minimum: 1, maximum: 25 }
          description: >
            How many hints to return -- a handful of chips, not a report. Out of range is refused
            with 400 rather than clamped: a caller asking for zero used to get one back, and a
            caller asking for a thousand got a silently different number, with nothing in the
            response saying so.
      responses:
        '200':
          description: Possible duplicates, strongest match first; empty when nothing resembles it
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocietyDuplicateSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/society-merges:
    get:
      tags: [Admin & Analytics]
      summary: Every society merge currently in force
      operationId: adminListSocietyMerges
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        Newest first, and deliberately the other way round from the four work queues beside it.
        Those are backlogs, where the oldest item is the one somebody is still waiting on. This is
        not a backlog: it is a record of decisions already taken, and the one an operator comes here
        to check is almost always the one just made — either their own, or the one that explains why
        a society they were about to merge has vanished.


        It is also what makes the undo usable rather than merely possible. A merged-away society is
        absent from the directory and its slug no longer resolves to itself, so this is the only
        surface on which a merge can be found in order to be reversed.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Merges in force, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyMerge' }
    post:
      tags: [Admin & Analytics]
      summary: Record that one society is a duplicate of another
      operationId: adminMergeSocieties
      # S28 + societies:write.
      x-roles: [staff, admin]
      description: >
        Auto-minting a society from four surfaces guarantees duplicates: "Kumar Pinnacle", "Kumar
        Pinnacle Phase 1" and "kumar pinacle" are three rows and one building, splitting its
        listings, followers and reviews across three cards. This is the operator's tool for saying
        which one is real.


        **A merge is a pointer, not a move.** Nothing is copied, rewritten or deleted: the duplicate
        keeps its listings, follows, reviews, residency records and claims, and the reads union them
        onto the survivor. That is what makes it undoable — rewriting `properties.society_id` onto
        the survivor would leave no record of which rows had moved, so the one ops action whose
        input is two rows differing by a typo would be the one with no undo.


        `201`, because a merge is a thing that now exists and can be listed and deleted, not a
        mutation of either society. Both slugs travel in the body rather than one in the path: they
        are the two halves of one statement, not subject and object, and putting either in the path
        would read as an edit of that society.


        `422` for merging a society into itself. `409` for either shape of chain — merging into a
        society that is itself merged away, or merging away one that has already absorbed others —
        and for losing the race to another operator working the same pair. Each `409` names the
        merge that has to be undone first, so the next action is one corrected request rather than
        an investigation. Chains are refused rather than collapsed because collapsing them is
        unrecoverable: once A is silently re-pointed from B to C, nothing records that the operator
        chose B.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyMergeCreate' }
      responses:
        '201':
          description: The merge that was recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyMerge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/society-merges/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin & Analytics]
      summary: Undo a society merge
      operationId: adminUndoSocietyMerge
      # S28 + societies:write.
      x-roles: [staff, admin]
      description: >
        Addressed by the slug of the society that was **merged away**, not the survivor's: a
        survivor can have absorbed several duplicates, and "undo the merge on this society" would
        then be ambiguous — and the ambiguity would resolve silently to the wrong one.


        This route is the reason a merge is a pointer. The operator's input is two societies that
        differ by a typo, so merging the wrong pair — or the right pair the wrong way round — is a
        mistake that will be made. Here it costs one request.


        `404` when the slug names a society that is not merged into anything: the resource being
        deleted is the merge, and there is no merge here to delete.
      responses:
        '204':
          description: The merge was undone; the society stands on its own again
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/societies/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin & Analytics]
      summary: One society as the back-office editor needs it
      operationId: adminGetSociety
      # S28 + societies:read.
      x-roles: [staff, admin]
      description: >
        The four public facts plus `adminNote`.


        It exists for the note. The other four are already on `SocietyResponse`, which the directory
        listing hands over in bulk, so a console that only needed those would not need this. The
        note is not on that payload and will not be: it is moderator prose about a named building
        and frequently about the people in it, and the anonymous directory is the last place it
        belongs. Without a route of its own the note is write-only — saved, then blank the next time
        the form is opened, which is precisely the failure the `localStorage` editor had.


        `societies:read` rather than `societies:write`, so an operator who cannot change the row can
        still read the note explaining why it was left alone. That is what the note is for; it is
        addressed to the next person to open this form.
      responses:
        '200':
          description: The society, including the internal note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyAdminView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin & Analytics]
      summary: Correct a society's own facts
      operationId: adminEditSociety
      # S28 + societies:write.
      x-roles: [staff, admin]
      description: >
        Registration, conveyance, the maintenance rate and the claim state, plus an internal note
        for whoever reads the row next.


        Replaces an editor that wrote to the browser's own `localStorage`. The form reported success
        and the correction reached nobody — not the directory, not the next operator, not the
        society's own committee — so a building's facts were whatever the machine you happened to be
        sitting at believed.


        Addressed by **slug**, which is this system's public alias for a society: it is what the
        directory link carries, what the operator arrived with, and the only handle that appears
        anywhere outside the database. The UUID is internal.


        `PATCH` with omitted-means-unchanged, because the four facts are corrected one at a time
        from different evidence — a conveyance deed says nothing about the maintenance rate — and a
        `PUT` would make every correction a full restatement, so a stale form would quietly revert
        the other three. `adminNote` is the one field where an explicit `null` is meaningful: it
        clears the note, which omission cannot express.


        Every edit is audited with the previous values, because this overwrites in place and an
        overwrite destroys the evidence that the old value was ever there.


        `422` when `maintenancePerSqft` is negative or above 100 — it is rupees per square foot,
        typically 1 to 8 in Pune, and the adjacent mental model is the monthly bill, so a four-digit
        figure is a units mistake rather than an expensive society. Also when `claimStatus` is not
        one of `unclaimed`, `pending`, `claimed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyAdminEdit' }
      responses:
        '200':
          description: The society as it now stands, including the internal note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyAdminView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/supply-gap:
    get:
      tags: [Admin & Analytics]
      summary: Where demand outruns supply, by locality
      operationId: adminSupplyGap
      # D10. A sibling of /admin/analytics rather than another `metric=` value on it, because this
      # is two quantities across a non-time dimension - a series of {date, value} points cannot
      # carry it without lying about one of them.
      #
      # This replaces a report that was assembled in the browser from localStorage, and therefore
      # described the searches performed by whichever administrator happened to be reading it.
      x-roles: [staff, admin]
      description: >
        Live approved listings against recorded demand signals, per locality, over a rolling
        window.


        `demand` is weighted, not a raw total: an alert counts 5, a search 2, a view 1. Somebody who
        left an alert has said they want to be told when something appears, which is a stronger
        statement than a page view. The weights are a judgement rather than a measurement, and they
        are applied on read - changing them re-scores the whole history rather than only what
        arrives afterwards.


        `gap` is `demand - supply` and is computed server-side so that one definition of the
        weighting exists in one place.


        Two rows are easy to miss and both are deliberate. A locality with listings and no demand
        still appears, with `demand` zero, because inventory nobody is asking for is a finding.
        And signals that carried no locality at all are reported together as a single row with no
        `localitySlug`, rather than being discarded - "people are looking, we do not know where"
        is information about the search UI, not noise.


        A locality that has demand but no row in the localities table is reported too, with
        `localityName` absent. That is somebody asking for somewhere PuneNest does not cover, which
        is the single most useful row here - and exactly the row a foreign key would have refused
        at write time.
      parameters:
        - name: days
          in: query
          description: >
            Rolling window in days, counted back from now. Capped at 365: an unbounded window over
            an append-only table is a full scan with a report on it.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: One row per locality with supply or demand, ordered by gap descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupplyGapRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/finance:
    get:
      tags: [Admin & Analytics]
      summary: Platform finance overview (revenue, payouts)
      operationId: adminFinance
      # S28: Revenue and settlement figures.
      x-roles: [admin]
      responses:
        '200':
          description: Finance overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFinance' }
  /admin/finance/series:
    get:
      tags: [Admin & Analytics]
      summary: Revenue per month, split by source
      operationId: adminFinanceSeries
      # S28: The revenue mix, which is why this carries the finance guard and not the staff one.
      description: >
        Monthly revenue for the finance console's stacked chart, oldest month first, ending with the
        current (partial) month.


        Every month in the window is returned, including months in which nothing was sold. A gap in
        a bar chart is not a visible gap - the neighbouring bars simply move up - so an omitted
        bucket reads as an unbroken run of trading months that did not happen.


        `services` is always `0`, and that is a measurement rather than a missing field. The
        marketplace takes no money through the gateway, so `service_orders.amount` is a quote and
        not a receipt; the field is carried, and paired with `serviceOrdersCounted` on
        `/admin/finance`, so the zero can say what it means instead of looking like a rendering
        fault. The day the marketplace settles through the gateway this field carries a number and
        the flag flips, with no shape change at either end.


        Not a metric on `/admin/analytics`, which already serves a revenue series: that operation is
        staff-visible and returns one total per bucket. Splitting it by source there would widen a
        staff-readable response to carry the revenue mix, which is precisely what `/admin/finance`
        is admin-only to prevent.
      x-roles: [admin]
      parameters:
        - name: months
          in: query
          description: >
            How many monthly buckets to return, counting back from and including the current month.
            Capped at 60 so that a hand-typed range cannot become a grouped scan of every settled
            payment since the platform opened.
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200':
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminFinanceSeriesPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/finance/transactions:
    get:
      tags: [Admin & Analytics]
      summary: The settlement ledger, paged
      operationId: adminFinanceTransactions
      # S28: Every recorded movement of money, with the counterparty's name.
      description: >
        Every movement of money the platform can evidence: a rent convenience fee, a paid
        subscription, a paid boost. Newest first.


        Deliberately not a list of everything that happened commercially. A closed deal and a
        service quote are business events with no receipt behind them, and a ledger that mixes the
        two cannot be reconciled against a bank statement, which is the only thing it is for.


        `amount` is **the platform's share**, never the gross - a rent row carries its convenience
        fee and not the rent, which belongs to the landlord and is merely passing through. It is
        never negative: there is no refund path, so a negative amount could only be a fabrication.


        `status` is derived. The three source tables speak three unrelated status vocabularies and
        none of them is about settlement - a `cancelled` subscription was still paid for, an
        `expired` boost was still bought - so the ledger reports the only question a finance reader
        is asking, which is whether the money arrived. `refunded` is deliberately absent from that
        vocabulary: offering a value no row can ever hold would contradict the `refundsMeasured`
        disclosure two panels away.
      x-roles: [admin]
      parameters:
        - name: kind
          in: query
          description: Narrow to one source. Omit for all three.
          schema: { type: string, enum: [rent_fee, subscription, featured] }
        - name: status
          in: query
          description: Narrow to one settlement state. Omit for all three.
          schema: { type: string, enum: [paid, pending, failed] }
        - name: q
          in: query
          description: >
            Case-insensitive substring of the counterparty's name. `%` and `_` are escaped, so an
            operator searching for a name containing one is not silently running a wildcard.
          schema: { type: string }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page of the ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminFinanceTransaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/settings:
    get:
      tags: [Admin & Analytics]
      summary: Platform settings
      operationId: getAdminSettings
      # S28: Platform configuration, including fees.
      # S68 (tech debt D66): the 200 carries a strong ETag over the whole document. It is a hash of
      # the stored content, not a row version, because this resource is the union of several
      # `settings` rows - a per-row counter could not describe "the document you were looking at".
      # A hash also makes a save that changes nothing leave the tag alone, which is what an entity
      # tag is supposed to mean.
      x-roles: [admin]
      responses:
        '200':
          description: Settings
          headers:
            ETag:
              description: >-
                Opaque version of the returned document. Send it back as `If-Match` on PUT to make
                the write conditional.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
    put:
      tags: [Admin & Analytics]
      summary: Update platform settings (merge)
      operationId: updateAdminSettings
      # S28: Changing platform fees and feature flags.
      # S60: MERGE, not replace, and the spec now says so. Every property of AdminSettings is
      # optional, so `{"flags":{"x":true}}` is a well-formed whole document - under replace
      # semantics the flags panel would silently wipe fees, permissions and custom roles, and the
      # platform would start charging its defaults. Objects are merged key by key; arrays and
      # scalars are replaced wholesale; a key that is absent is left alone.
      # S56: returns the stored document, because after clamping and merging what is stored is not
      # necessarily what was sent, and an admin editing money must be shown the result.
      # Every call writes an audit row (`settings.update`) naming the top-level keys touched.
      # S68 (tech debt D66): optional `If-Match`. The S60 merge stopped the flags panel from wiping
      # the fee table, but two admins editing the SAME key still last-write-wins and neither is
      # told. A precondition is the only thing that can detect that, because the server cannot tell
      # a deliberate overwrite from an ignorant one by looking at the body.
      # Optional rather than required: making it mandatory would break every existing caller and
      # turn a safety feature into an outage. A caller that omits it keeps today's behaviour and
      # accepts today's risk.
      x-roles: [admin]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            The ETag from a previous GET. If the stored document has changed since, the write is
            refused with 412 and nothing is written.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettings' }
      responses:
        '200':
          description: Saved
          headers:
            ETag:
              description: Version of the document as saved - use it for the next conditional write.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '412':
          description: >-
            Someone else changed the settings since the ETag was issued. Nothing was written; re-read
            and re-apply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            The body names a key this server stores but enforces nothing with, currently
            `customRoles` (D67/D13). Refused rather than dropped, and refused whole: accepting it
            with a 200 is how an administrator ends up believing a decorative control granted
            something. Nothing was written and no audit row was recorded - resend without the key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/cities/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Admin & Analytics]
      summary: Update one city's launch state
      operationId: adminUpdateCity
      # S28 (tech debt D192/D13): guarded by `settings:write`, the same atom as editing the platform
      # settings document — so an administrator narrowed by BackOfficeAccessService gets a 403 here
      # even though `x-roles` says admin.
      description: >-
        Admin-only control for whether a curated city is launched. This is deliberately separate from
        `PUT /admin/settings`: the settings document still owns map bounds and the blacklist, but the
        city roster and each city's `live` bit are served from the `cities` catalogue itself.
        Requires the `settings:write` permission in addition to the admin role. Every call writes a
        `city.update` audit row carrying `beforeLive` and `afterLive`, including when the value is
        unchanged. `slug` is matched exactly, as published by `GET /cities`.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityAdminUpdate' }
      responses:
        '204': { description: Saved }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/permission-catalogue:
    get:
      tags: [Admin & Analytics]
      summary: Every back-office permission the server enforces
      operationId: getPermissionCatalogue
      # S28 (tech debt D192/D13): guarded by `users:read`, the same atom as reading an account.
      description: >
        The vocabulary a Team & Access grid must render from, in the order it should be shown.
        Served rather than hard-coded in the console so a screen cannot offer a permission the
        server would ignore — that divergence is the whole of V61, where the client composed
        bundles from its own module keys, the server spoke a different vocabulary, and the document
        in between granted nothing while looking like policy. Every name here exists because a
        route is annotated with it.
      x-roles: [admin]
      responses:
        '200':
          description: The catalogue, in render order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BackOfficePermission' }
  /admin/message-templates:
    get:
      tags: [Admin & Analytics]
      summary: The approved copy staff may send to owners
      operationId: listMessageTemplates
      description: >
        Served rather than bundled into the console, for the same reason as the permission
        catalogue: a screen must not be able to offer a template the server would refuse. Outreach
        requests name a template by id and never carry a body, so this list *is* the set of things
        that can be said.


        Returned with `body` un-rendered, placeholders intact, so the console can show a live
        preview as the operator picks. The substitution itself happens server-side at send.


        Guarded on staff role alone, with no permission atom, and that is a considered omission
        rather than an oversight: this is copy. It names no owner, no listing and no account, so
        there is nothing here to grant access to. The atom lives on the endpoint that *sends*.


        Retired templates are withheld rather than deleted, because the messages already prepared
        from them stay readable in the outreach log and a dangling reference there would be worse
        than an unused row here.
      x-roles: [staff, admin]
      parameters:
        - name: channel
          in: query
          schema: { type: string, enum: [whatsapp, sms, email], default: whatsapp }
      responses:
        '200':
          description: Active templates for the channel, grouped by category then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MessageTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-log:
    get:
      tags: [Admin & Analytics]
      summary: Audit log (maker-checker trail)
      operationId: adminAuditLog
      # S28: Who watches the watchers: staff must not read the record of admin actions.
      x-roles: [admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        # Narrows the trail to one record. `entity=user` plus an id is how the user directory answers
        # "what has this platform done to this person" — without it the log is browsable only by
        # time, which serves the daily review and is useless for a case. Valid on its own: ids are
        # UUIDs, so `entity` would only restate what the id already implies.
        - { name: entityId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
  /admin/staff-activity:
    get:
      tags: [Admin & Analytics]
      summary: Back-office activity feed (who did what)
      operationId: adminStaffActivity
      # Same rows as /admin/audit-log, same table, same permission. A route that borrows another
      # module's data inherits that module's ceiling — serving this to staff would make `audit:read`
      # a lock on one of two doors into the record that exists to hold staff to account.
      x-roles: [admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        # Free text over actor name, action, entity and entity id. `%` and `_` are escaped server
        # side; a search for "100%" narrows rather than matching everything.
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Activity entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/StaffActivityEntry' }
  /admin/staff-activity/summary:
    get:
      tags: [Admin & Analytics]
      summary: Back-office activity totals, facets and leaderboard
      operationId: adminStaffActivitySummary
      # Takes the same filter set as the feed so a narrowed console gets a headline about what it is
      # showing. Aggregated in the database: a leaderboard folded from one page of a feed ranks the
      # page, not the team.
      x-roles: [admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Aggregates for the same window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffActivitySummary' }
  /admin/content/{type}:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
    get:
      tags: [Admin & Analytics]
      summary: List CMS content of a type (incl. archived)
      operationId: adminListContent
      # S28: CMS is an ops job.
      # S55: was `200: {description: Content items}` with no schema at all, and create/update took
      # `{type: object}`. Five operations with no contract is not a contract. Typed against
      # ContentItem / ContentItemWrite. Stays a bare array (api-standards.md 5.1: CMS is fixed
      # reference data), and includes archived rows because the ops screen has an Archived tab.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Content items, newest first, archived included
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentItem' }
    post:
      tags: [Admin & Analytics]
      summary: Create CMS content item
      operationId: adminCreateContent
      # S28: CMS is an ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemWrite' }
      responses:
        '201':
          description: Created
          # S56: was a bodiless 201. The ops screen renders the saved row straight from the
          # response; without a body it has to guess the server-assigned id and timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Admin & Analytics]
      summary: Update CMS content item
      operationId: adminUpdateContent
      # S28: CMS is an ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Admin & Analytics]
      summary: Archive content item (soft delete)
      operationId: adminArchiveContent
      # S28: CMS is an ops job.
      # S56: returns the item so the caller can see `archived: true` without a re-read.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Admin & Analytics]
      summary: Restore archived content item
      operationId: adminRestoreContent
      # S28: CMS is an ops job.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /society-leads:
    get:
      tags: [Admin & Analytics]
      summary: Society / builder B2B leads
      operationId: listSocietyLeads
      # S28: B2B pipeline. Anyone may submit a lead; only ops may read them.
      # S57: was an unpaged array of every lead on the platform, each carrying a name and a mobile
      # number - an unbounded response and a bulk contact export in one. Identical defect to S47 on
      # support tickets. Paged, with a status filter so the pipeline can be worked a column at a time.
      x-roles: [staff, admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, contacted, qualified, won, lost] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Leads, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyLead' }
    post:
      tags: [Admin & Analytics]
      summary: Submit society/builder enquiry (public)
      operationId: createSocietyLead
      # S28: deliberately NO x-roles. security: [] — public B2B lead capture; the submitter is not a user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyLeadCreate' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyLead' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /society-leads/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Admin & Analytics]
      summary: Update society lead (staff)
      operationId: updateSocietyLead
      # S28: Working the B2B pipeline.
      # S56: returns the lead so the board can re-render from the response.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyLead' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token issued by the Identity & Access domain. Send as
        `Authorization: Bearer <token>`. Short-lived (15 min); refresh via
        `/auth/refresh`. Claims carry `sub`, `role`, `mobileVerified`, and
        `aadhaarVerified` (an opt-in trust **badge**, not a gate — participation only
        needs `mobileVerified`); `staff` tokens also carry `team`.
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.punenest.in/.well-known/openid-configuration
      description: >
        Target-state federation. The modular monolith issues its own JWTs today;
        an external OIDC provider (Keycloak/Auth0) can be adopted without changing
        resource-server contracts.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`field,(asc|desc)`; repeatable for multi-sort.'
      schema: { type: string, example: createdAt,desc }
    PropertyId:
      name: id
      in: path
      required: true
      description: Property slug or id.
      schema: { type: string, example: 3bhk-koregaon-park-xf12 }
    PropertyUuid:
      name: id
      in: path
      required: true
      description: >
        The property's **id**, and only its id. A slug is rejected with 400.


        Spelled `id` like `PropertyId`, and sitting on paths that look exactly like the lenient
        ones, but `FlatSplitController` binds `@PathVariable UUID id` where every other
        `/properties/{id}/…` operation binds `String` and resolves either form. Only the two flat
        split operations and the room feed work this way.


        These paths carried `PropertyId` — "Property slug or id" — until it was checked. Nothing
        calls them yet, so the promise has never been tested by a client, which is the only reason
        it did not cost anything: the same false promise on `/me/saved/{propId}` produced a run of
        silent 400s. Documented before the first caller arrives rather than after.
      schema: { type: string, format: uuid, example: 51897b51-f1a2-56ce-9687-2be847ff4dee }
    PropId:
      name: propId
      in: path
      required: true
      description: >
        The property's **id**, and only its id. A slug is rejected.


        This is not the same token as `PropertyId` on `/properties/{id}`, which resolves either
        form. The two are distinguished here only by this sentence, because both are strings and
        a UUID and a slug are equally well-formed strings — which is exactly how a client came to
        address `PUT /me/saved/{propId}` with the slug it had been routing on. Every save answered
        400 and the optimistic control rolled itself back, so nothing was visible but a heart that
        filled for one frame.


        Two failure shapes exist behind this one parameter and callers should treat both as
        "wrong identifier": `SavedPropertyController`, `PropertyReviewController` and
        `TenancyDeclarationController` bind `@PathVariable UUID` and Spring answers **400** when
        conversion fails, while the deals, finalization and finances controllers bind `String`,
        hand-parse with `Ids.parseUuid(...).orElseThrow(NotFoundException::of)` and answer **404**.
        That inconsistency is recorded rather than papered over: documenting one status here would
        make this description wrong for eleven paths, and changing the server to agree is a
        behaviour change across seventeen operations, not a spec edit.
      schema: { type: string, format: uuid, example: 51897b51-f1a2-56ce-9687-2be847ff4dee }
    PropRef:
      name: propId
      in: path
      required: true
      description: >
        The property's id **or** its slug; both resolve. Spelled `propId` for continuity with the
        paths around it, but it accepts what `PropertyId` accepts.


        Only the owner-scoped document vault and the boost endpoints work this way, because their
        services resolve the token themselves — `DocumentService.ownedProperty` and
        `BoostService.ownedProperty` both try `Ids.parseUuid` first and fall back to
        `findBySlugAndOwner_Id`. Everything else under `{propId}` requires the id; see `PropId`.
      schema: { type: string, example: 3bhk-koregaon-park-xf12 }
    ContentType:
      name: type
      in: path
      required: true
      description: Which CMS list is being managed.
      schema: { type: string, enum: [announcements, services, faqs, banners] }
    GenericId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReqId:
      name: reqId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID to make unsafe money/booking operations retry-safe.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: bad_request, message: Invalid query parameter 'size', status: 400 }
    Unauthorized:
      description: Missing/invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthorized, message: Authentication required, status: 401 }
    Forbidden:
      description: Authenticated but not permitted (RBAC, or owner accepts verified contacts only).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: forbidden, message: You do not have permission to perform this action, status: 403 }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: Property not found, status: 404 }
    Conflict:
      description: >
        The request is well-formed but conflicts with current state -- a duplicate, or an
        illegal transition for the resource's present status. Distinct from `422`, which is a
        payload that failed validation on its own terms.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: conflict, message: Rent for this month is already paid or in progress, status: 409 }
    ValidationError:
      description: Semantic validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until retry is allowed. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: rate_limited, message: Too many requests, status: 429 }

  links:
    GetCurrentUser:
      operationId: getMe
      description: Fetch the freshly authenticated user's profile.
    PollKycBadge:
      operationId: getAadhaarStatus
      description: Poll the opt-in badge until `status` is `verified` or `failed`.
    CheckContactStatus:
      operationId: contactStatus
      description: Re-read the gate state for the property just requested.
      parameters:
        propertyId: $request.body#/propertyId
    CloseThisDeal:
      operationId: closeDeal
      description: After reserving, close the deal (sold/rented) for the same property.
      parameters:
        propId: $request.path.propId
    FinalizationStatus:
      operationId: finalizationStatus
      description: Track the maker-checker finalization for this property.
      parameters:
        propId: $request.path.propId
    RespondToOffer:
      operationId: respondOffer
      description: Owner accepts / declines / counters the submitted offer.
      parameters:
        id: $response.body#/id
  callbacks:
    DigilockerVerificationResult:
      'https://api.punenest.example/api/webhooks/cashfree/digilocker':
        post:
          summary: Cashfree posts the DigiLocker verification result here (async continuation).
          description: See `POST /webhooks/cashfree/digilocker` for signature verification and full semantics.
          requestBody:
            content:
              application/json:
                schema: { $ref: '#/components/schemas/DigilockerWebhook' }
          responses:
            '200': { description: Acknowledged }
    PaymentResult:
      'https://api.punenest.example/api/webhooks/cashfree/payment':
        post:
          summary: Cashfree posts the terminal payment result here (async continuation).
          description: See `POST /webhooks/cashfree/payment` for signature verification and full semantics.
          requestBody:
            content:
              application/json:
                schema: { $ref: '#/components/schemas/PaymentWebhook' }
          responses:
            '200': { description: Acknowledged }
  schemas:
    # ---- Common / primitives ----
    Error:
      type: object
      required: [error, message, status]
      properties:
        error: { type: string, description: Machine-readable code., example: not_found }
        message: { type: string, description: Human-readable detail. }
        status: { type: integer, description: HTTP status., example: 404 }
        traceId: { type: string, description: Correlation id for observability. }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: mobile }
                  message: { type: string, example: must be a 10-digit Indian mobile }
    PageEnvelope:
      type: object
      description: Envelope for paginated collections; `content` is supplied per endpoint.
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        sort: { type: string, example: createdAt,desc }
    Mobile:
      type: string
      pattern: '^[6-9][0-9]{9}$'
      description: >-
        An Indian mobile number. The pattern is the canonical stored and returned
        shape: ten digits, leading 6-9. On input the server is deliberately more
        tolerant (Q1) — it accepts spacing and a leading +91/0091/0 country code and
        normalises to these ten digits before storing. Anything that does not reduce
        to a valid ten-digit mobile is rejected with 422.
      example: '9876543210'
    Money:
      type: integer
      format: int64
      description: Amount in whole Indian rupees (INR). No decimals/paise.
      example: 2500000
    DealIntent:
      type: string
      description: Transaction intent.
      enum: [buy, rent]
    Furnishing:
      type: string
      enum: [unfurnished, semi-furnished, furnished]
    PropertyPossession:
      type: string
      description: >
        When the property can be occupied. Absent/null means "not stated", which is
        deliberately distinct from all three values — an unrecorded possession must not
        satisfy a `ready-to-move` search. Land and plot listings have no meaningful
        possession state and stay unset.
      enum: [ready-to-move, new-launch, under-construction]
    PropertyStatus:
      type: string
      enum: [pending, approved, rejected, flagged, archived, sold, rented]
      description: >
        Moderation state. `sold`/`rented` are terminal (D110): set when the listing's deal closes,
        they drop it from the approved-floored search but keep it reachable by direct link, badged.
    Role:
      type: string
      description: >
        Canonical auth role carried in the JWT `role` claim. Property seekers
        (buyers and tenants) share the single `buyer` role. `staff` are scoped
        further by `team`. Admin RBAC labels (e.g. manager/member) are
        permissions, not roles, and are not modelled here.
      enum: [buyer, owner, staff, admin]
    Team:
      type: string
      description: Ops team a staff member belongs to; scopes service-request and ticket routing.
      enum: [rental, legal, loans, interior, packers, valuation]
    Party:
      type: object
      description: |
        A platform user acting as a participant on an offer, visit, deal or finalization
        request. Always resolves to a registered account, so `id` is the user id.

        `mobile` is contact gated, and the gate is **not** the same on every surface, so do
        not build on a single rule:
          * a party always sees their own number in full, on every surface, at every status;
          * on **visits**, the listing owner also sees the visitor's number once the visit is
            `confirmed` (and so on `completed` / `no-show`, which only follow it). While it is
            merely `scheduled` the owner sees `98XXXXX210` — booking must not be a way to
            harvest a phone number. Rescheduling resets the status to `scheduled` and
            therefore re-masks it;
          * on **tenancy**, the counterparty sees `98XXXXX210` at every status;
          * **contact requests** and **conversations** reveal it once an approved contact
            request exists between the two parties.
        The safe assumption for a client is that the number is masked; treat a raw one as a
        bonus, never as a precondition, and never parse the mask for digits.

        This block previously said "masked until the owner has acted", which described no
        surface correctly. The visits rule above was then written down for years before it
        was implemented — a client that trusted it saw a reveal that never arrived.

        `verified` is stated by the server rather than derived from `mobile`: the mask is
        lossy, so a client matching `98XXXXX210` against a verified-user list can only ever
        answer false (tech-debt D114).
      properties:
        id:
          type: string
          readOnly: true
          description: User id of the participant. Server-assigned.
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { type: string, enum: [buyer, owner] }
        verified:
          type: boolean
          readOnly: true
          description: |
            Whether this party carries the Verified Tenant badge. Server-computed, and optional
            like every other property here: populated today on `Offer.from` and on the two
            `FinalizationRequest` parties, absent from the payloads that have no badge to show.
    # Slice-4 spec fix S6. Distinct from Party on purpose. An under-offer party is an
    # off-platform person the owner jotted down while the listing is reserved -- a free-text
    # name, a raw mobile and a private note. It has no account, so it has no `role` and no
    # contact gating, and it carries `note`/`at` which are meaningless on Offer.from or
    # Visit.visitor. Overloading Party would have leaked two optional fields into five
    # unrelated payloads. `id` is required by DELETE /me/deals/{propId}/parties/{partyId}
    # (see S5): without it the client can never learn what to delete.
    DealParty:
      type: object
      description: An off-platform interested party recorded by the owner on a reserved deal.
      required: [name]
      properties:
        id:
          type: string
          readOnly: true
          description: Server-assigned. Stable across edits, unlike the previous positional index.
        name: { type: string, maxLength: 120 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string, maxLength: 500 }
        at:
          type: string
          format: date-time
          readOnly: true
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        note: { type: string, maxLength: 500 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    UserBadgeRequest:
      type: object
      required: [granted, reason]
      properties:
        granted:
          type: boolean
          description: >
            Required, and deliberately has no default. Defaulting to `false` would mean a client that
            omitted the field asked to withdraw somebody's badge — the more destructive of the two
            outcomes, reached by saying nothing. Omitting it is 422.
        reason:
          type: string
          description: >
            Required in both directions. The badge is what buyers use to decide who to trust, so both
            halves of the decision have to be answerable later out of the audit log.
    UserFlagRequest:
      type: object
      required: [flagged]
      properties:
        flagged: { type: boolean }
        reason:
          type: string
          description: >
            Required when `flagged` is true, optional when lowering the flag. Expressed as a
            conditional rather than in `required` because a caller clearing a flag should not have to
            invent a reason for doing so; a raise without one is 422.
    UserTimelineEntry:
      type: object
      required: [kind, entityId, at]
      properties:
        kind:
          type: string
          enum: [account, enquiry, visit, service, listing, moderation]
          description: >
            What sort of event this is. The client picks the icon and the wording from this;
            `moderation` is an action a back-office colleague took against the account, everything
            else is something the person themselves did.
        entityId:
          type: string
          description: >
            The id of the thing that happened, so the console can link to it. For `account` and
            `moderation` this is the user's own id.
        at:
          type: string
          format: date-time
          description: >
            When it happened. For a visit this is when it was booked, not the slot it was booked
            for — the slot may be in the future, and a history that sorted by it would put next
            week's viewing above last week's enquiry.
        label:
          type: string
          description: >
            The source row's own name for itself — a property title, a service type, an audit
            action, or the person's role on the `account` entry. Not a sentence: the console is
            translated and the server does not own English.
        status:
          type: string
          description: >
            The source row's status where it has one. Absent for moderation entries, so the client
            can tell "no status" from "blank status".
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string }
    ServiceRequestPartyInvite:
      type: object
      required: [role, mobile]
      properties:
        role:
          type: string
          enum: [owner, tenant]
          description: Which side of the agreement the invitee is on. One of each, per request.
        mobile:
          type: string
          description: >
            The counterparty's registered mobile. Used once, to find their account, and then
            discarded -- it is not stored on the invitation. An unregistered number is a 409, not an
            invitation: there is nobody to authenticate as, and a token link addressed to a phone
            number is exactly the exposure this design refuses.
    InviteDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, decline] }
    PartyDetailsUpdate:
      type: object
      required: [details]
      description: >
        The accepted invitee's half of the agreement, submitted before checkout is opened.
      properties:
        details:
          type: object
          additionalProperties: true
          description: >
            Structured detail, merged into the request's own `details` -- the same free-shaped object
            `ServiceRequestCreate.details` carries, and subject to the same rules, including the
            refusal of `pan`/`aadhaar` at any depth. Identity numbers go to
            `PUT /service-requests/{id}/identities`, which is assignee-only and audited; this object
            is echoed verbatim on every read of the request by everybody on it.


            Free-shaped rather than a typed body per service because the fields a tenant fills differ
            by agreement and are the wizard's business, not the server's -- the same reasoning that
            left `details` open on creation. What the server owns is who may write it and when: the
            invitee, once accepted, and only while the request is still waiting for the requester to
            pay.
    ServiceRequestParty:
      type: object
      description: >
        One side of a co-filled service request (D121). Keyed on the invited *account* wherever
        there is one to key on, and carrying no contact detail of its own beyond the masked
        `mobile` that V107 made unavoidable — see that property for why the exception is narrow.


        Served in two places with two different jobs, which is why it carries more than the
        request's own view of it needs. Inside `ServiceRequest.parties` it tells the people already
        on the matter who else is on it and whether they have answered. On
        `GET /me/service-request-invites` it is the whole of what an invited person is shown
        *before* they accept, which is why `requestType` and `invitedBy` are here and why nothing
        about the agreement itself is: enough to decide, and not the paperwork.
      properties:
        id: { type: string }
        requestId: { type: string }
        # Echoed so /me/service-request-invites can say what the invitation is *for* without the
        # invitee having to fetch a request they cannot yet read.
        requestType: { type: string, example: rent-agreement }
        role: { type: string, enum: [owner, tenant] }
        status: { type: string, enum: [invited, accepted, declined] }
        party:
          type: [string, 'null']
          description: >
            Display name of the invited account. `null` while the invitation is still `pending` --
            there is no account to take a name from -- and also `null` if a once-claimed account has
            since been removed.
        # V107. The invitation may now be addressed to a number that has never registered, which
        # leaves the requester with no name to show for the side they just named. This is what they
        # have instead, and it exists only for as long as that is true.
        mobile:
          type: [string, 'null']
          example: 98XXXXX999
          description: >
            The invited number, **masked**, and present only while `pending` is true. Absent -- and
            discarded from the row in the same statement -- the moment the invitation is claimed by
            an account, because from then on `party` answers the question this was standing in for.


            Masked rather than whole because the reader of a `ServiceRequest` is whoever is on the
            matter, and the other side's full number is not theirs until that side has accepted.
            `ContactVisibility` governs that everywhere else on this platform and this is not an
            exception to it: enough of the number is shown to answer the only question the requester
            asks of it -- "is that the number I meant?" -- and no more.
        pending:
          type: boolean
          description: >
            True while the invitation is addressed to a number rather than to an account (V107).


            Deliberately **not** the same fact as `status: invited`, which means only "has not
            answered". A pending invitation has nobody who *could* answer yet; a claimed one has a
            person who has not. The two want different words in the interface -- "waiting for them to
            sign up" against "waiting for them to reply" -- and a client that collapses them will tell
            a requester to chase somebody who does not exist. A claimed-but-unanswered invitation is
            `pending: false, status: invited`.
        invitedBy: { type: [string, 'null'], description: Display name of the requester who sent it }
        createdAt: { type: string, format: date-time }
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
        # D49, implemented. Ids of attachments the caller already uploaded against *this* thread via
        # POST /messages/{id}/attachments or POST /support/tickets/{id}/attachments, and has not yet
        # sent. Ids, never URLs: a client-supplied location that the platform stores and re-serves is
        # a request-forgery surface, and the two-step exists so the bytes are validated and stored
        # before any message references them. An id that is not the caller's own, on this thread and
        # unsent, is a 404 - including the same id twice in one request, since the first use consumes
        # it. The cap is the same 5 the server enforces; the per-file size and type limits are on the
        # upload operation.
        attachments:
          type: array
          maxItems: 5
          items: { type: string, description: Attachment id from the upload operation }
    MessageAttachment:
      type: object
      description: >
        One file on a message. Only ever returned inside a message the reader is already entitled to
        see, on either the chat or the support surface.
      properties:
        id: { type: string }
        fileName: { type: string, description: Sanitised original name, safe to render }
        contentType: { type: string, description: The *sniffed* type, which is what was stored }
        sizeBytes: { type: integer, format: int64 }
        url:
          type: string
          format: uri
          description: >
            Signed download link, **minted for this read and short-lived**. Not an identifier and not
            a link to store - re-read the message to get a fresh one.
        uploadedAt: { type: string, format: date-time }
    Message:
      type: object
      properties:
        id: { type: string }
        authorId:
          type: string
          description: >
            Who wrote it. **Use this, not `author`, to decide whether a message is the reader's
            own.** `author` is a display name, and attributing by name works until two users share
            one - at which point a stranger's message renders on the reader's side of the thread.
        author: { type: [string, 'null'], description: Display name, absent if the account has none }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        # D49. Present on both handlers behind this schema - the conversation thread and the support
        # thread - which is why it could be added here rather than splitting the schema the way
        # ServiceRequestMessage below was split. Empty array when there are none, never absent.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/MessageAttachment' }
    # D121. The service-request thread only. Read receipts are a property of *that* desk — a
    # conversation and a support ticket carry their own unread models (`Conversation.unread`,
    # `SupportTicket.unread`), and all three surfaces map to different Java records, so widening
    # the shared `Message` would promise a field two of those handlers do not return.
    ServiceRequestMessage:
      type: object
      properties:
        id: { type: string }
        authorId:
          type: string
          description: >
            Who wrote it. **Use this, not `author`, to decide whether a message is the reader's
            own.** `author` is a display name, and attributing by name works until two users share
            one - at which point a stranger's message renders on the reader's side of the thread.
        author: { type: [string, 'null'], description: Display name, absent if the account has none }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        # When the other side read it, or null while it is still unread. Written by
        # POST /service-requests/{id}/read, per side rather than per reader -- so on a co-filled
        # request this means "somebody on the other side has seen it", not "everyone has".
        readAt: { type: [string, 'null'], format: date-time }
    # D53. The moderation view of a chat thread. Deliberately not `Conversation`: that shape is
    # reader-relative -- `counterpartyName` means "the other one" and only makes sense to someone
    # inside the thread -- and a moderator is in neither side of it. Naming both participants
    # absolutely is the whole difference, and it is why this is a separate schema rather than a
    # widened one.
    ModeratedParticipant:
      type: object
      description: One side of a moderated thread. No mobile number - a moderator has not passed the
        contact gate, and reading a reported chat is not a reason to hand over both parties' numbers.
      properties:
        id: { type: string, description: User id - correlate with the report and the message authors }
        name: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
    ModeratedMessage:
      type: object
      description: >
        One message as a moderator sees it. Shaped like `Message` but declared separately, so that
        anything a moderation view later needs cannot leak onto the participant read by accident.
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: [string, 'null'] }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        # A reported chat is very often reported *for* what was attached to it, so a moderation read
        # that returned only the text would answer the wrong question.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/MessageAttachment' }
    ModeratedConversation:
      type: object
      properties:
        id: { type: string }
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ModeratedParticipant' }
        propertyId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # The whole thread, unpaged: a moderator needs the context around the reported line, and a
        # message is capped at 4000 characters on write so a thread is bounded in practice.
        messages:
          type: array
          items: { $ref: '#/components/schemas/ModeratedMessage' }
    Conversation:
      type: object
      description: In-app chat thread between two parties, optionally about a listing.
      properties:
        id: { type: string }
        counterpartyName: { type: string }
        counterpartyRole: { $ref: '#/components/schemas/Role' }
        # Slice-12 spec fix S49. Masked or raw by the same ADR-019 rule the rest of the platform
        # uses, and the rule is not symmetric: an approved contact request reveals the *owner's*
        # number to the buyer who asked, never the buyer's number to the owner. So a buyer in a
        # conversation about a listing they were approved for sees a raw number, and the owner on
        # the other side of that same thread sees `98XXXXX210`. Being in a conversation is not
        # itself a reveal -- if it were, starting one would route around the contact gate.
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        propertyId: { type: [string, 'null'] }
        propertyTitle: { type: [string, 'null'] }
        lastMessage: { type: string, description: Preview of the most recent message }
        unread: { type: integer, description: Unread message count for the current user }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          description: Full thread; present on detail, omitted on list.
          items: { $ref: '#/components/schemas/Message' }
    ConversationCreate:
      type: object
      required: [body]
      description: >
        Address the thread by `counterpartyMobile`, or by `propertyId` alone — supply at least one.
        A buyer never holds the owner's raw mobile (it is masked for every non-owner), so the buyer
        side names the listing and the server derives the owner from it. Whether the two may message
        is decided by the approved contact request either way; naming a listing buys nothing on its
        own.
      properties:
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        propertyId: { type: string, description: 'Listing the chat is about; required when counterpartyMobile is omitted' }
        body: { type: string, maxLength: 4000 }

    # ---- Identity & Access ----
    LoginRequest:
      type: object
      required: [mobile]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        otp: { type: string, description: Required on the verify step., example: '123456' }
        password: { type: string, description: Optional password path. }
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    StaffInviteRedeem:
      # D206: the request that sets a back-office password. `password` is bounded at both ends and
      # the ceiling is not cosmetic - BCrypt silently ignores bytes past 72, so a longer secret
      # would not be the one the user typed, and a password that is quietly something else is worse
      # than a refusal. The floor is NIST 800-63B's guidance for a human-chosen secret carrying no
      # composition rules.
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: >
            The single-use invite delivered out of band to the account's holder. Opaque; clients
            must not parse it.
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, description: The rotating single-use refresh token issued by the previous auth call. }
    AuthResponse:
      type: object
      description: >
        Dual-shape response. `POST /auth/login` without an `otp` is the *send* step and returns
        only `{ "otpSent": true }` — no tokens. A completed verify / staff-login / refresh returns
        the token pair plus `user`. Absent fields are omitted, not null.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, default: Bearer }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }
        otpSent:
          type: boolean
          description: Present and `true` only on the OTP-send step; omitted on token-bearing responses.
          example: true
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/Role' }
        team: { $ref: '#/components/schemas/Team' }
        status: { type: string, enum: [active, suspended, archived] }
        verified: { type: boolean, description: 'Opt-in identity Verified badge (L2, ADR-019) — not required to participate.' }
        city: { type: string, example: Pune }
        mobileVerified: { type: boolean, description: Mobile-OTP (L1) — the floor for posting/enquiring/contacting. }
        aadhaarVerified: { type: boolean, description: 'Alias of the Verified badge (DigiLocker). A trust signal, never a gate.' }
        verifiedContactOnly: { type: boolean, description: Owner preference — accept contact requests from verified (L2) users only. }
        hideNumber: { type: boolean, description: 'Owner preference — stay masked even after approving a contact request. The approval grants the conversation, not the digits.' }
        listingsCount: { type: integer, description: Active listings (owners) }
        joinedAt: { type: string, format: date-time }
        lastActive: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string }
          description: >
            The caller's own resolved back-office permission atoms (`module:action`), and **only on
            `GET /auth/me`** — every other route serving this schema describes somebody else, and
            omits the key entirely. The admin console renders its navigation from these: an account
            has to know what it may do before it can draw a sidebar, and the route that answers
            "which atoms does account X hold" (`GET /users/{id}/permissions`) is deliberately
            admin-only, so a scoped manager has no other way to ask about itself.
            Resolved, not stored — the account's document intersected with its role baseline, i.e.
            what the server will actually honour. Present and possibly empty for `staff` and `admin`
            (empty means "scoped to nothing", which is a real state); absent for `buyer` and `owner`,
            who have no back-office baseline for the question to apply to.
            Advisory to the UI only. Every atom is enforced at its own route; hiding a tab is a
            courtesy, never the control.
        flagged:
          type: boolean
          description: >
            The internal review marker, and **only on the back-office user routes**
            (`GET /users`, `GET /users/{id}`, and the three that write it). Absent everywhere else,
            including `GET /auth/me` — it is a note between moderators about the account holder, and
            the route that serves them their own profile has no business carrying it. Absent is
            therefore meaningfully different from `false`: it means nobody asked.
            Flagging changes nothing the platform does. It is not a status; see `status` for the
            states that gate behaviour.
        flagReason:
          type: string
          description: >
            What was noticed. Present exactly when `flagged` is true — a flag without one is a smear
            the next moderator cannot act on, and the database enforces the same pairing. Cleared,
            not kept, when the flag is lowered: a reason left behind on an unflagged account reads
            as an accusation that was never withdrawn. The history is in the audit log.
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string, format: uri }
        city: { type: string, description: 'Home city. The profile form has always sent this; the contract lacked it, so it was accepted and silently dropped (D20).' }
        hideNumber: { type: boolean, description: 'Owner preference - stay masked even after approving a contact request; reach me in-app instead. Not a second gate: approval still unlocks the conversation (D5).' }

    # ---- Catalog & Search ----
    PropertySummary:
      type: object
      description: Lightweight card projection for search/lists (no gated contact).
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { type: string, example: apartment }
        bhk: { type: number, example: 3 }
        price: { $ref: '#/components/schemas/Money' }
        priceUnit: { type: string, enum: [total, per-month], example: per-month }
        area: { type: number, example: 1180 }
        areaUnit: { type: string, example: sqft }
        furnishing: { $ref: '#/components/schemas/Furnishing' }
        possession: { $ref: '#/components/schemas/PropertyPossession' }
        landUse:
          type: string
          enum: [residential, commercial, industrial, agricultural, mixed]
          nullable: true
        ageYears:
          type: integer
          minimum: 0
          nullable: true
        floor:
          type: integer
          nullable: true
        totalFloors:
          type: integer
          nullable: true
        facing:
          type: string
          nullable: true
        room:
          type: string
          enum: [single, shared]
          nullable: true
        tenants:
          type: array
          items: { type: string, enum: [family, bachelor-male, bachelor-female, company] }
        availableFrom:
          type: string
          enum: [now, '15', '30']
          nullable: true
        pets: { type: boolean }
        sharing:
          type: array
          items: { type: string, enum: [single, double, triple, four, five] }
        societyVerified: { type: boolean }
        conveyanceDone: { type: boolean }
        locality: { type: string, example: Koregaon Park }
        localitySlug:
          type: string
          example: koregaon-park
          description: >-
            Curated locality key (FK to Locality.slug) and the value the `locality` search filter
            matches on. `locality` above is the human display name and is NOT unique or stable —
            never key off it. Absent when the listing's locality could not be resolved to a curated
            locality (owner free-text that matched nothing); such listings are invisible to locality
            filters until curated during moderation.
        societySlug:
          type: string
          example: skyline-heights
          description: >-
            The society this home is actually in (FK to Society.slug), or absent when the owner
            never named one. The slug and not `society_id`, because the slug is the society's public
            key everywhere else — `GET /societies/{slug}`, the hub route, the client's own catalogue
            — so a UUID would tell a client that a society exists while giving it no way to name
            one. Carried on the card and not only on detail because a society filter and a
            "N homes in this building" count are computed over a page of results. Absent is a real
            and common answer and must be read as "not known", never as any particular society:
            before D19 the client filled the gap by hashing the listing id into a society list,
            which printed one real building's builder, tower count and occupancy under another
            building's listing.
        city: { type: string, example: Pune }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        coverImage: { type: string, format: uri }
        imageCount:
          type: integer
          minimum: 0
          description: >
            How many photos the listing has — the number, never the photos. The card surface only
            ever asks "is there enough here", and shipping five URLs per row on a hundred-row page
            to answer a yes/no is several times the payload for none of the benefit; search results
            never render a second photo. It exists because the reels feed requires three frames and
            had no other way to ask: it read `gallery.length` off a list row that has never carried
            `images`, so every listing scored zero and the feed was permanently empty. Clients that
            need the photos themselves read `GET /properties/{id}`.
        verified: { type: boolean }
        ownerVerified:
          type: boolean
          description: >
            The person who posted this listing has passed identity verification (Aadhaar/DigiLocker).
            Denormalised from the owner onto every listing they hold, so a card can show the trust
            signal without a second read. Carried on the **card**, not only on detail, because search
            results are where a buyer chooses what to open — a badge visible only after the click
            cannot influence the choice it exists to influence, which would make "verified owners get
            more enquiries" an unbacked promise. Distinct from `verified` (a moderator's verdict on
            the *listing*) and from `ownershipVerified` (a verdict on the *paperwork*): never collapse
            the three into one badge, or a listing will claim a check its owner never took.
        ownershipVerified:
          type: boolean
          description: >
            This listing's ownership paperwork has been verified and has not expired. Independent of
            `ownerVerified` — either can be true alone.
        postedByType: { type: string, enum: [owner, agent, builder] }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        dealStatus:
          type: string
          enum: [active, reserved, closed]
          description: >
            Deal outcome mirrored from the owner-scoped deal (D110), readable on public cards and
            detail. `reserved` badges a listing "under offer" while it stays `approved` and still
            takes offers; `closed` accompanies a terminal `sold`/`rented` status.
        boosted:
          type: boolean
          description: >
            The owner is paying to promote this listing (D59). Disclosure, not capability: a boosted
            listing is ranked above unboosted ones **only in the default order**, and an explicit
            `sort` (price/area/bhk) is honoured exactly, so paid placement can never silently
            override the order a buyer chose. Computed from the live promotion window at request
            time, so it is never stale. Clients should label these cards visibly.
        createdAt: { type: string, format: date-time }
        lastConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the owner last confirmed this listing is still available (`POST
            /me/listings/{id}/confirm-available`). The input to the freshness badge, and the only
            part of it that is stored rather than derived — everything else about staleness is a
            function of this instant and the clock, so an owner who answers the nudge is back to
            "active" immediately with nothing to recompute.


            `null` means nobody has ever confirmed this listing, which is different from confirming
            it long ago. Clients fall back to `createdAt` in that case, which is what the badge has
            always effectively shown; the distinction is kept in the field rather than erased by
            backfilling, so a listing whose owner answers stays distinguishable from one that has
            only ever been posted.
        featured:
          type: boolean
          description: >
            The platform is promoting this listing editorially. Distinct from `boosted`, which is
            paid: one is a curation decision, the other is an advertisement, and collapsing them
            would let money buy the appearance of editorial endorsement. Present on the card
            because that is where the badge renders — it was previously detail-only, so live search
            results carried no featured badge at all while mock ones did.
        qualityScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: >
            How complete this listing is, 0–100 — photos, description, verifications, the fields a
            buyer needs and the amenity list. Computed by the database as a generated column, so it
            can never disagree with the listing beneath it and never needs a recompute after an
            edit.


            It is served, and not merely used for ranking, because it is also what the owner's own
            dashboard shows them: the same number that decides where a listing places is the number
            they are asked to improve, and two separate figures for that would be an invitation to
            distrust both.


            `null` only on an instance that has been written but not read back; every read path
            returns a number. Absent rather than `0` in that case, because a zero on a complete
            listing is a wrong answer where no answer is an honest one.
        freshness:
          type: string
          enum: [active, aging, stale, dormant]
          description: >
            How recently the owner confirmed availability, derived from `lastConfirmedAt` (falling
            back to `createdAt`) against the server clock at request time.


            Derived per request and never stored: it is a function of the clock, so any persisted
            tier is correct only at the instant it was written. Sent alongside the timestamp rather
            than instead of it — the timestamp is what a card renders ("confirmed 2 days ago"), the
            tier is what decides tone and ranking. It is served rather than re-derived by each
            client because it also governs whether a listing is shown at all, and a visibility rule
            the browser evaluates is a rule anything reading the API directly does not have.
    Property:
      allOf:
        - $ref: '#/components/schemas/PropertySummary'
        - type: object
          properties:
            description: { type: string }
            deposit: { $ref: '#/components/schemas/Money' }
            maintenance: { $ref: '#/components/schemas/Money' }
            negotiable: { type: boolean }
            reraId: { type: string }
            carpetArea: { type: number }
            builtUpArea: { type: number }
            superBuiltUpArea: { type: number }
            floor: { type: integer }
            totalFloors: { type: integer }
            facing: { type: string }
            # --- detail tiles that had no source until V114 ---
            # Both were rendered by the detail page long before either had a column. Parking simply
            # showed an em dash. Bathrooms was worse: the browser substituted `bhk - 1` and printed
            # it as a fact, so absent must now stay absent rather than be filled in downstream.
            # Counts, not enums: `0` is a real answer (a shop has no bathroom, a flat may convey no
            # slot) and is not the same as omitted.
            bathrooms: { type: integer, minimum: 0 }
            parking: { type: integer, minimum: 0 }
            balconies: { type: integer, minimum: 0 }
            # --- search facets the results page has always offered (V95, D26) ---
            # Six of these were filtered on in the browser for the whole life of the feature with
            # no column behind them, so against this API they compared against `undefined` and the
            # filter returned an empty page. The seventh, `sharing`, had a column's worth of meaning
            # inferred out of the amenity list, so an honest PG that never worded an amenity that
            # way disappeared from the occupancy filter. They are declared rather than deleted
            # because each one answers a question a real seeker asks first.
            landUse:
              type: string
              enum: [residential, commercial, industrial, agricultural, mixed]
              nullable: true
              description: >
                Permitted zoning for a plot or farm land; `null` for anything with a building on it.
                A flat has no land use of its own, only the use its society was sanctioned for.
            ageYears:
              type: integer
              minimum: 0
              nullable: true
              description: >
                Age of the construction in years. `null` means the owner never said, which is
                emphatically not zero — a range filter that read unstated as brand-new would float
                every lazy listing above the honest ones. No upper bound: Pune has Peth houses older
                than any ceiling worth hard-coding.
            room:
              type: string
              enum: [single, shared]
              nullable: true
              description: >
                Flatmate room shape — a private room, or a bed in a shared room. `null` for
                everything that is not a flatmate share.
            sharing:
              type: array
              items: { type: string, enum: [single, double, triple, four, five] }
              description: >
                PG/hostel occupancy options. A list because one building almost always offers
                several at different rents, and a listing that could only claim one would have to be
                posted three times. Empty for anything that is not a PG.
            tenants:
              type: array
              items: { type: string, enum: [family, bachelor-male, bachelor-female, company] }
              description: >
                Who the owner will rent to. A list rather than a single value because "family or
                company, no bachelors" is the ordinary position and no enum expresses it.


                **Empty means no stated preference, and matches every `tenants` filter.** An owner
                who did not answer has not refused anybody; treating silence as refusal would hide
                most of the inventory from the filter meant to narrow it.
            availableFrom:
              type: string
              enum: [now, '15', '30']
              nullable: true
              description: >
                Move-in bucket. A bucket rather than a date because a date on a listing nobody edits
                is wrong within a fortnight, and wrong in the direction that wastes a tenant's visit.
                Filtering on it is cumulative — see the `availableFrom` query parameter.
            pets:
              type: boolean
              description: >
                Pets allowed. Not nullable: to a tenant with a dog, "unstated" and "no" are the same
                answer, because neither is worth the risk of moving in and being told to leave.
            amenities:
              type: array
              items: { type: string }
            images:
              type: array
              items: { type: string, format: uri }
            floorPlan: { type: string, format: uri }
            video: { type: string, format: uri }
            address: { type: string }
            pincode: { type: string }
            electricityMeterNo:
              type: string
              description: >-
                The unit's electricity meter number (V79). Present only on the owner's own
                `/me/listings` views and on the staff moderation surfaces; absent entirely from the
                public listing response, because a meter number names a live utility account and is
                one of the few values here a stranger could act on rather than merely read.
            views: { type: integer, description: Denormalized view counter }
            enquiries: { type: integer, description: Denormalized enquiry counter }
            featured: { type: boolean }
            flagReason: { type: [string, 'null'], description: Admin moderation flag; empty when unflagged }
            recheckPending:
              type: boolean
              description: >
                A stays-live moderation re-check is queued on this listing (Q14). Raised when the
                owner edits `price`, `furnishing` or `possession` on an approved listing: the edit
                is waiting for a moderator, but the listing keeps `status: approved` and stays in
                search. Distinct from a `pending` status, which is what the identity-changing
                foundation fields (`locality`/`propertyType`/`bhk`/`deal`) still cost. Cleared when
                a moderator sets any status on the listing, and superseded (dropped) if a later edit
                reverts it to `pending`.
            recheckReason:
              type: [string, 'null']
              example: price, furnishing
              description: >
                Which fields raised the pending re-check, accumulated across edits until a moderator
                clears it. Empty when `recheckPending` is false.
            recheckRequestedAt:
              type: [string, 'null']
              format: date-time
              description: >
                When the re-check was first queued — the queue's age. Set once, at the first
                unreviewed edit, and deliberately *not* refreshed by later ones, so an owner cannot
                edit their way back to the front of the queue. Absent when `recheckPending` is
                false. This is what makes the stays-live outcome auditable: `recheckPending` says a
                re-check is owed, only this says it has been owed for eleven days, and an undrained
                queue is otherwise indistinguishable from an empty one. Sort on it client-side —
                `sort` is clamped to the catalogue's shared whitelist (createdAt/price/area/bhk),
                and widening that would expose the column to the public search too.
            archived: { type: boolean, description: Soft-delete flag. A separate axis from status - always false on the public detail read; meaningful on /me/listings and /admin/properties. }
            societyVerified: { type: boolean }
            conveyanceDone: { type: boolean }
            docsCount: { type: integer }
            owner:
              type: object
              description: Owner summary; contact number masked unless the reader is entitled to it.
              properties:
                id: { type: string }
                name: { type: string }
                mobile:
                  type: string
                  description: >-
                    Masked (e.g. `98XXXXX210`) by default. Raw for a seeker who has passed the
                    contact gate on this listing, and raw on the moderation desk
                    (`listPropertiesForModeration` and the operations that return a listing from it)
                    for a caller holding `properties:read` — two different entitlements that happen
                    to render the same, which is why this is one field and not two.
                verified: { type: boolean }
            adminPipeline:
              type: object
              nullable: true
              description: >
                Admin post-on-behalf onboarding pipeline (staff-created listings).


                **Absent for every audience but staff.** This says which listings the platform
                manufactured rather than received, and names the staff member who did it — it is for
                the desk that does the work. Consumer and owner surfaces omit the key entirely
                rather than sending an empty object, because an empty object would still disclose
                that such a thing exists.


                Also absent, even for staff, on listings the owner posted themselves: there is no
                hand-back to report on, and an object of all-false flags would put the listing on the
                board as work that never completes.
              properties:
                postedByAdmin: { type: boolean }
                postedByStaff:
                  type: [string, 'null']
                  description: >
                    User id of the staff member who created the listing. An id rather than a name so
                    a colleague changing their display name does not silently rewrite history.
                pipelineStage:
                  type: [string, 'null']
                  enum: [contacted, info_collected, listed, docs_submitted, null]
                  description: >
                    How far the acquisition funnel has got — the work of turning a phone call into a
                    listing. Null when the listing was never the platform's to onboard.
                handbackMilestone:
                  type: [string, 'null']
                  enum: [photos_uploaded, aadhaar_verified, claim_sent, claimed, null]
                  description: >
                    How far the hand-back has got — the work of giving the listing to its owner.
                    Null until that starts. A second field rather than more values on
                    `pipelineStage`, because a listing is at a point on both axes at once: documents
                    in *and* photographs up is two facts, and one column could only remember
                    whichever was written last.
                claimLinkSent:
                  type: boolean
                  description: Derived — true once `handbackMilestone` has reached `claim_sent`.
                photosUploaded:
                  type: boolean
                  description: Derived — true once `handbackMilestone` has reached `photos_uploaded`.
                aadhaarVerified:
                  type: boolean
                  description: >
                    Derived — true once `handbackMilestone` has reached `aadhaar_verified`. The
                    three derived flags are not stored: each asks "has the hand-back got this far",
                    which the milestone already answers, and a second copy could only ever disagree
                    with it.
                reminderCount:
                  type: integer
                  description: >
                    How many chasers have gone to this owner: a count over the outbound messages
                    themselves, not a column, so it cannot drift from the messages actually
                    prepared. See `listOwnerOutreach` for what those messages were.


                    `0` on the response to `createListingOnBehalf`, which is correct rather than
                    unimplemented: nobody can have chased an owner about a listing that did not
                    exist a moment ago. Everywhere else this object appears, the count is real —
                    and everywhere it would not be, the whole object is absent instead.
    PropertyModerationSummary:
      type: object
      description: >
        Moderation KPI counts over the whole `properties` table. Every counter except `archived` is
        floored to un-archived rows.
      required: [total, approved, pending, flagged, featured, recheck, archived]
      properties:
        total:
          type: integer
          description: Every un-archived listing, `sold` and `rented` included — a closed deal is still inventory.
        approved: { type: integer, description: Live and in search. }
        pending:
          type: integer
          description: >
            Awaiting a first moderation decision. `pending` is the only spelling of that state;
            `PropertyStatus` has no `Under Review`.
        flagged: { type: integer, description: Taken out of search by a moderator. }
        featured: { type: integer, description: Promoted onto the home page. }
        recheck:
          type: integer
          description: >
            Approved listings with a stays-live re-check owed (Q14). Counted apart because these
            rows are live, un-archived and in search, so they raise none of the other counters —
            a moderator watching `pending` would never learn the queue existed.
        archived:
          type: integer
          description: Soft-deleted. The one counter that is not a subset of `total`.

    DuplicateClusterReport:
      type: object
      description: >
        One rendering of the duplicates desk. Not a page — see `truncated` for why a clustering
        cannot be paged the way a list can.
      required: [clusters, scanned, truncated]
      properties:
        clusters:
          type: array
          items: { $ref: '#/components/schemas/DuplicateCluster' }
          description: Derived clusters, dismissals already removed.
        scanned:
          type: integer
          description: How many signal-carrying listings were actually clustered.
        truncated:
          type: boolean
          description: >
            The scan hit its ceiling, so `clusters` is not the whole answer. Reported rather than
            swallowed because a truncated clustering degrades **silently**: a pair split by the
            ceiling does not render as a partial cluster, it vanishes, and the desk looks cleaner
            than the catalogue is.

    DuplicateCluster:
      type: object
      description: >
        One derived group of listings that look like the same doorway. Computed per request and not
        stored, so `id` is a signature over its members rather than a row id.
      required: [id, reason, sameOwner, listings]
      properties:
        id:
          type: string
          description: >
            SHA-256 over the members' sorted ids, lowercase hex. Doubles as the render key and as
            what a dismissal is recorded against — a derived cluster has no other stable identity,
            and keying on the member set is what makes a cluster that gained a member correctly
            come back unanswered.
          example: 3f2a9c1e7b40d85a6c1f0e2d9b7a4c83f15e6d2a90b3c47581ed6f2a3c9b0d41
        reason:
          type: string
          enum: [address, image, address+image]
          description: >
            Which arm fired. Sorted and joined, so the value is deterministic — an earlier
            derivation joined in encounter order and emitted both `address+image` and
            `image+address`, which the console had to carry two labels for.


            A cluster's reason is the union over its **pairs**, not a property of any one pair:
            {A,B} matching on address and {B,C} on photos yields one `address+image` cluster in
            which no single pair matched on both.
        sameOwner:
          type: boolean
          description: >
            Every listing here belongs to one account. Surfaced rather than filtered out, and
            labelled as such on the card: same-owner collisions are usually an owner who forgot they
            had already posted, which is a nudge rather than a moderation case.
        listings:
          type: array
          items: { $ref: '#/components/schemas/Property' }
          description: The members, newest first.

    DuplicateMergeRequest:
      type: object
      description: "\"Keep this one, archive the others.\""
      required: [keepId, dropIds]
      properties:
        keepId:
          type: string
          format: uuid
          description: The listing that stays live.
        dropIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: >
            The listings to archive. Named explicitly rather than inferred from the cluster: the
            operator's screen and the server's derivation are two moments apart, and a listing that
            joined in between is one they never saw.

    DuplicateDismissRequest:
      type: object
      description: "\"These are not the same flat.\""
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
          description: >
            The cluster's members as the operator saw them. The signature is derived from these
            rather than accepted from the caller, so the verdict is recorded against the set that
            was actually on screen.

    Locality:
      type: object
      properties:
        slug: { type: string, example: koregaon-park }
        name: { type: string, example: Koregaon Park }
        city: { type: string, example: Pune }
        listingCount: { type: integer }
        avgRentPsf: { type: number }
        avgBuyPsf: { type: number }
        ratePerSqft: { type: number, description: Avg buy rate (INR/sqft) }
        avgRent: { type: integer, description: Absolute avg monthly rent (INR) }
        demand: { type: integer, description: Demand index (0-100) }
        focus: { type: string, enum: [Buy, Rent, Both] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        active: { type: boolean, description: Shown on site }
    LocalityCreate:
      type: object
      required: [name, city]
      description: >
        Body of `createLocality`. Only `name` and `city` are required — they are the columns declared
        NOT NULL with no default, and everything else is a price signal that arrives weeks later.
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: >
            Optional. Coined from `name` when absent, using the same slugify the listing resolver
            runs. Immutable once set — it is the primary key three foreign keys point at.
        name: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 80 }
        avgRentPsf: { type: number, minimum: 0 }
        avgBuyPsf: { type: number, minimum: 0 }
        ratePerSqft: { type: number, minimum: 0 }
        avgRent: { type: integer, minimum: 0 }
        demand: { type: integer, minimum: 0, maximum: 100 }
        focus: { type: string, enum: [Buy, Rent, Both] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    LocalityUpdate:
      type: object
      description: >
        Body of `updateLocality`. Sparse — an omitted field is left alone. No `slug`: see
        `LocalityCreate`.
      properties:
        name: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 80 }
        avgRentPsf: { type: number, minimum: 0 }
        avgBuyPsf: { type: number, minimum: 0 }
        ratePerSqft: { type: number, minimum: 0 }
        avgRent: { type: integer, minimum: 0 }
        demand: { type: integer, minimum: 0, maximum: 100 }
        focus: { type: string, enum: [Buy, Rent, Both] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        active:
          type: boolean
          description: >
            False retires the locality. Nullable on purpose — a non-nullable boolean would default
            to false and turn every unrelated edit into a silent retirement.
    LocalityQueueEntry:
      type: object
      description: >
        One listing the catalogue could not file. Deliberately carries **no owner and no contact**:
        deciding which area a listing belongs to is a geography question that a name and a mobile
        number answer nothing about, and including them would make the curation console a second
        readable seller list gated on `properties:read`.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        locality:
          type: string
          nullable: true
          description: >
            The free text the owner typed — the thing that failed to resolve, and the single field
            that makes the row actionable. A curator with only a title and a pin is guessing.
        city: { type: string, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        status: { type: string, enum: [pending, approved, flagged] }
        localitySlug:
          type: string
          nullable: true
          description: >
            Null on every row read from the queue — that is what put it there. Populated on the row
            returned by `assignLocality`, which is the same row having just left the queue.
        createdAt: { type: string, format: date-time }
    LocalityQueueResponse:
      type: object
      required: [total, listings]
      description: >
        `total` is separate from `listings.length` because the array is capped at 200. Without it the
        console would render the cap as if it were the backlog, and an operator clearing 200 rows a
        day out of 900 would see the number never move and conclude the queue was broken rather than
        long.
      properties:
        total:
          type: integer
          description: Every listing awaiting a locality, uncapped.
        listings:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/LocalityQueueEntry' }
    LocalityAssign:
      type: object
      required: [slug]
      description: >
        Body of `assignLocality`. There is no dismiss counterpart on purpose: "reviewed, still has no
        locality" is precisely the state the queue exists to end, so an action that produced it would
        reduce the approval refusal back to the warning it replaced. The two honest ways out are to
        create the missing area with `createLocality` and then file the listing, or to reject the
        listing.
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: An existing, **active** locality. Retired ones are refused with 409.
    OnBehalfListingCreate:
      type: object
      required: [ownerMobile, listing]
      description: >
        Body of `createListingOnBehalf`. A wrapper around the ordinary `ListingCreate` rather than a
        parallel shape, so the listing an operator types and the listing an owner types are validated
        identically.
      properties:
        ownerMobile:
          $ref: '#/components/schemas/Mobile'
        ownerName:
          type: string
          maxLength: 120
          description: >
            Used only if the account has to be created. Ignored for an existing account — an
            operator's transcription of a name heard over the phone must not overwrite what the
            owner typed themselves.
        listing:
          $ref: '#/components/schemas/ListingCreate'
    OpsEnquiry:
      type: object
      description: >
        One contact request on the ops demand board. Not `ContactRequest`: that is the owner's view
        of their own inbox and reveals the requester's raw mobile once approved. Here the mobile is
        masked at every status — an operator is party to none of these conversations.
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyTitle: { type: string, nullable: true, description: Null if the listing is gone }
        locality: { type: string, nullable: true, description: Locality slug }
        requesterName: { type: string, nullable: true }
        requesterMobile: { type: string, nullable: true, description: 'Always masked (98XXXXX210)' }
        status: { type: string, enum: [pending, approved, declined] }
        createdAt: { type: string, format: date-time }
    OpsVisit:
      type: object
      description: One site visit on the ops demand board. Visitor mobile always masked.
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyTitle: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        visitorName: { type: string, nullable: true }
        visitorMobile: { type: string, nullable: true, description: 'Always masked' }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person, video] }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled] }
        createdAt: { type: string, format: date-time }
    OpsDeal:
      type: object
      description: >
        One deal on the ops demand board. `agreedPrice` and `closedAt` are null until the deal
        closes, so a GMV sum over this collection counts closed deals by construction.
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyTitle: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        deal: { $ref: '#/components/schemas/DealIntent' }
        counterpartyName:
          type: string
          nullable: true
          description: Null for an off-platform close against a number that belongs to no account
        counterpartyMobile: { type: string, nullable: true, description: 'Always masked' }
        agreedPrice: { type: integer, nullable: true, description: Whole INR, set on close }
        status: { type: string, enum: [active, reserved, closed] }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    LocalityDetail:
      allOf:
        - $ref: '#/components/schemas/Locality'
        - type: object
          properties:
            about: { type: string }
            connectivity: { type: array, items: { type: string } }
            highlights: { type: array, items: { type: string } }
            priceTrends:
              type: array
              items:
                type: object
                properties:
                  month: { type: string }
                  rentPsf: { type: number }
                  buyPsf: { type: number }
    Society:
      type: object
      properties:
        id: { type: string, example: S01 }
        slug: { type: string, example: kumar-pinnacle }
        name: { type: string }
        builder: { type: string }
        localitySlug: { type: string }
        lat: { type: number }
        lng: { type: number }
        year: { type: integer, description: Year built / possession }
        towers: { type: integer }
        units: { type: integer }
        occupancy: { type: number, description: Occupancy percentage (0-100) }
        maintenancePerSqft: { type: number }
        parkingRatio: { type: number }
        lifts: { type: integer }
        security:
          type: [string, 'null']
          example: 3-tier + CCTV
          description: >-
            Security arrangement, free text. Spec fix S25: was a boolean. "Gated", "3-tier + CCTV"
            and "Guard at gate only" are materially different to somebody choosing where to live,
            and a boolean discards that difference while pretending to answer the question.
        water: { type: string }
        power: { type: string }
        petPolicy: { type: string }
        vegPolicy: { type: string }
        rera: { type: [string, 'null'], description: MahaRERA registration id; empty if none }
        registration: { type: boolean, description: Society registered }
        conveyance: { type: boolean, description: Conveyance deed done }
        amenities: { type: array, items: { type: string } }
        source: { type: string, enum: [curated, rera, community], description: Origin of the record }
        mintOrigin:
          type: [string, 'null']
          enum: [demand, listing, null]
          description: >-
            Which human action minted this society: `demand` (a searcher looked for the building and
            the catalogue did not have it) or `listing` (somebody posting a flat could not find their
            society). A different axis from `source`, not an extension of it — `source` says where
            the record came from and is what a reader weighs for trustworthiness, `mintOrigin` says
            what somebody was doing when they added it, and is what ops reads to find demand nobody
            has served. Every row carrying one has `source: community`. Null means not recorded:
            true of curated and RERA rows, which nobody minted, and of every community row created
            before V108. Null must not be rendered as "from a listing".
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            When ops verified a community-created society record. Null while still pending, and
            null for curated/RERA-sourced rows that are verified by provenance.
        claimStatus: { type: string, enum: [unclaimed, pending, claimed], description: Community claim state }
        listingCount: { type: integer }
        followerCount: { type: integer }
        followedByMe: { type: boolean }
        avgRating:
          type: [number, 'null']
          description: >-
            Average published rating, computed on read. Null — not 0 — when the society has no
            reviews: no rating is not a rating of zero, and a card rendering 0.0 for an unreviewed
            society states something false about it. On the directory as well as the hub because
            the cards show a star; resolving it per card would be one request per row.
        reviewCount:
          type: integer
          description: >-
            How many published reviews the average is over. Without it the average is unreadable —
            4.9 from one review is not 4.9 from two hundred.
        createdAt:
          type: string
          format: date-time
          description: >-
            When the row appeared. Carried for the candidate queue, which is a backlog: "minted an
            hour ago" and "minted three weeks ago and still unverified" are the same row without it,
            and only the second is a problem.
    SocietyDetail:
      allOf:
        - $ref: '#/components/schemas/Society'
        - type: object
          properties:
            homes:
              type: array
              items: { $ref: '#/components/schemas/PropertySummary' }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/Review' }
    SocietyCreate:
      type: object
      description: >
        What a member supplies when the picker cannot find their building. Deliberately short: this
        is a form somebody fills in while trying to do something else, and every field beyond the
        name is one more reason to abandon the listing they came to post.
      required: [name]
      properties:
        name: { type: string, maxLength: 160, example: Kumar Pinnacle }
        localityLabel: { type: string, maxLength: 120, description: Human-readable locality as the member typed it }
        localitySlug: { type: string, maxLength: 120, description: 'Resolved locality slug, if the picker managed to match one' }
        lat: { type: [number, 'null'], description: Optional map pin; a missing pin does not block the mint }
        lng: { type: [number, 'null'] }
        mintOrigin:
          type: string
          enum: [demand, listing]
          description: >-
            Which surface the caller is on. Optional: omitting it defaults to `listing`, so a client
            shipped before this field keeps working. The default under-reports demand rather than
            inventing it, which is the safe direction — fabricated demand would send an operator to
            source inventory in a building nobody asked about. An unrecognised value is a 422 rather
            than a silent discard, because a value that never matches `demand` downstream would
            leave the building sitting in the ops queue looking like supply forever.
    SocietyMembership:
      type: object
      description: >
        Where one caller stands in one society. Every personal field is null for a signed-out
        reader; `verifiedResidents` is public regardless.
      properties:
        societySlug: { type: string }
        resident:
          oneOf:
            - $ref: '#/components/schemas/SocietyResident'
            - type: 'null'
          description: The caller's own residency row, at whatever status. Null if they have never asked.
        admin:
          type: boolean
          description: >
            True when this caller may review residency requests and remove community content here --
            that is, platform staff, or the person whose claim on this society was approved.
        claim:
          oneOf:
            - $ref: '#/components/schemas/SocietyClaim'
            - type: 'null'
          description: The society's live claim, if one exists. Null when nobody has claimed it.
        verifiedResidents:
          type: integer
          description: >
            How many residents the committee has verified. The number a prospective buyer reads to
            judge whether this hub is alive, so it is public.
    SocietyResident:
      type: object
      description: One person's claim to live in one flat, at whatever point of the review it has reached.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        name: { type: string, description: The requester's display name }
        mobile:
          type: [string, 'null']
          description: >
            Present to the committee reviewing the request and to the requester themselves;
            withheld otherwise.
        wing: { type: [string, 'null'], example: B }
        flat: { type: string, example: '1204' }
        unitKey:
          type: string
          description: >
            Wing and flat normalised into the key the society's uniqueness rule is enforced on, so
            `B/1204` and `b-1204` cannot both be verified.
        relation: { type: [string, 'null'], description: 'How they occupy it: owner, tenant, family' }
        status: { type: string, enum: [pending, verified, rejected] }
        assignedTo: { type: [string, 'null'], description: Which reviewer picked this up }
        flagged: { type: boolean, description: 'Marked for a closer look -- a second claim on an occupied flat, typically' }
        note: { type: [string, 'null'], description: "Free text from the requester, or the reviewer's reason" }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    SocietyResidentQueueRow:
      type: object
      description: >
        One residency request as the cross-society ops queue publishes it. Everything
        `SocietyResident` carries, plus the building's name: a row that says only "B/704, pending"
        is not a decision anybody can make, and an operator working every society at once cannot be
        expected to hold slug-to-name in their head.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        societyName: { type: string, description: The building, so the row can be judged without a second lookup }
        name: { type: string, description: The requester's display name }
        mobile: { type: [string, 'null'] }
        wing: { type: [string, 'null'], example: B }
        flat: { type: string, example: '1204' }
        unitKey: { type: string, description: Wing and flat normalised into the key uniqueness is enforced on }
        relation: { type: [string, 'null'], description: 'How they occupy it: owner, tenant, family' }
        status: { type: string, enum: [pending, verified, rejected] }
        assignedTo: { type: [string, 'null'], description: Which reviewer picked this up }
        flagged: { type: boolean, description: 'Marked for a closer look -- a second claim on an occupied flat, typically' }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    SocietyResidentRequest:
      type: object
      description: >
        Asking to be recognised as living in one flat. `flat` is the only required field because it
        is the only one the uniqueness rule needs; a society without wings should not have to invent
        one.
      required: [flat]
      properties:
        wing: { type: string, maxLength: 16, example: B }
        flat: { type: string, maxLength: 16, example: '1204' }
        relation: { type: string, maxLength: 16, example: owner }
        note: { type: string, maxLength: 500, description: Anything that helps the committee recognise you }
    SocietyResidentDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, maxLength: 16, enum: [verified, rejected] }
        note: { type: string, maxLength: 500, description: 'Why -- worth filling in on a rejection, since the requester may ask' }
    SocietyClaim:
      type: object
      description: A committee member's request to run their society's page.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        societyName: { type: string, description: Denormalised so the ops queue reads without a join }
        claimantName: { type: string }
        claimantMobile: { type: [string, 'null'], description: Present to staff and to the claimant; withheld otherwise }
        role: { type: [string, 'null'], example: Secretary }
        email: { type: [string, 'null'], format: email }
        note: { type: [string, 'null'] }
        registrationNo:
          type: [string, 'null']
          maxLength: 80
          description: >-
            The society's Maharashtra registration number, exactly as the claimant typed it and
            still unchecked. Free text on purpose: these numbers have no single format, and a
            pattern strict enough to be worth having would reject real societies.
        certificateDocumentId:
          type: [string, 'null']
          format: uuid
          description: >-
            A row in the claimant's own personal document vault holding the scanned registration
            certificate. Withheld from the public membership read — the proof is for the reviewer,
            not for every visitor to the hub.
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    SocietyClaimCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        role: { type: string, maxLength: 80, example: Secretary }
        email: { type: string, format: email, maxLength: 160 }
        note: { type: string, maxLength: 500, description: How an operator can confirm you are who you say }
        registrationNo:
          type: string
          maxLength: 80
          example: PNA/1234/2015
          description: Optional. The society's registration number, if you have it to hand
        certificateDocumentId:
          type: string
          format: uuid
          description: >-
            Optional. A document already uploaded to your own personal vault holding the scanned
            certificate. Optional because a claimant without the paperwork in front of them must
            still be able to file — a blocked funnel is worse than an unproven claim an operator
            can follow up.
    SocietyClaimDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, maxLength: 16, enum: [approved, rejected] }
        note: { type: string, maxLength: 500 }
    SocietyClaimCertificate:
      type: object
      description: >
        A minted, expiring link to one claim's certificate. Not a document record — deliberately no
        id, no storage key and no owner. The queue row already carries `certificateDocumentId`,
        which is what decides whether the button renders; echoing it beside a live link is the
        pairing that turns a leaked response body into a usable one.
      required: [url, fileName, mimeType, sizeBytes]
      properties:
        url:
          type: string
          format: uri
          description: >-
            Signed and short-lived. Must not be cached, logged or persisted — it is a capability on
            a private document, not an address.
        fileName: { type: string, example: reg-cert.pdf }
        mimeType: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64, example: 184320 }
    SocietyMerge:
      type: object
      description: >
        One duplicate society folded into the one that survives it. A pointer and not a move: every
        row referencing the duplicate stays where it is and the reads union the two together, which
        is what lets the merge be undone.
      required: [slug, name, intoSlug, intoName]
      properties:
        slug:
          type: string
          description: The society that was merged away. Absent from the directory while this stands.
        name: { type: string, example: Kumar Pinacle }
        intoSlug:
          type: string
          description: The society that survives, and the one this slug now resolves to.
        intoName: { type: string, example: Kumar Pinnacle }
        mergedAt: { type: string, format: date-time }
        mergedBy:
          type: string
          format: uuid
          description: >-
            The operator who recorded it. A merge with no signature is a decision nobody made, and
            on the day two operators disagree about which of two rows is the real society it is the
            only way to know who to ask.
    SocietyDuplicateSuggestion:
      type: object
      description: >
        One society a queued candidate might be a second copy of. A hint an operator reads, not a
        decision anything acts on -- the merge it points at is a separate, explicit call.
      required: [slug, name, verified, score]
      properties:
        slug: { type: string, example: kumar-pinnacle-wakad }
        name: { type: string, example: Kumar Pinnacle }
        localitySlug:
          type: string
          nullable: true
          description: Null for the many RERA rows that were imported without one.
        verified:
          type: boolean
          description: >-
            Curated, RERA, or a member-added society an operator has already confirmed. These sort
            first because a merge canonicalises *into* the trusted row; merging the good record into
            the junk one is the mistake the ordering exists to make unlikely.
        score:
          type: number
          format: double
          example: 0.75
          description: >-
            Shared distinctive name tokens over the distinct words in either name, plus 0.25 for
            sharing a locality. Not a probability, and deliberately on the wire rather than implied
            by the ordering -- a bare ranking hides how close second place was.
    SocietyMergeCreate:
      type: object
      required: [from, into]
      properties:
        from:
          type: string
          description: Slug of the duplicate — the society that stops standing on its own.
        into:
          type: string
          description: >-
            Slug of the survivor. Must not already be merged away itself: chains are refused rather
            than collapsed, because collapsing them cannot be undone.
    SocietyQuestion:
      type: object
      description: A question asked about a society, with its answers attached.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        authorName: { type: string }
        authorIsResident:
          type: boolean
          description: >
            The badge that carries the whole trust model of this tab. Neither asking nor answering
            requires a verified flat, so the reader is told who is speaking from inside the building
            and weighs it themselves.
        body: { type: string }
        createdAt: { type: string, format: date-time }
        answers:
          type: array
          items: { $ref: '#/components/schemas/SocietyAnswer' }
          description: Nested rather than fetched per question -- twenty questions would otherwise be twenty-one requests.
    SocietyAnswer:
      type: object
      properties:
        id: { type: string, format: uuid }
        questionId: { type: string, format: uuid }
        authorName: { type: string }
        authorIsResident: { type: boolean }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    SocietyPost:
      type: object
      description: >
        One field, shared by every free-text write on the society hub -- questions, answers and
        replies. Three schemas with the same single property would have been three places to change
        the length limit and two of them would eventually be missed.
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 600 }
    SocietyBoardItem:
      type: object
      description: One notice on the society's board.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        kind: { type: string, maxLength: 16, example: notice, description: 'notice, event, alert -- what the board renders it as' }
        title: { type: string }
        body: { type: [string, 'null'] }
        category: { type: [string, 'null'], maxLength: 40 }
        eventDate: { type: [string, 'null'], format: date, description: Set on an event; null on a plain notice }
        eventTime: { type: [string, 'null'], example: '18:30', description: 'Local time, no zone -- a society AGM is at half six in the building, wherever the reader is' }
        authorName: { type: string }
        authorIsResident: { type: boolean }
        canRemove:
          type: boolean
          description: >
            Whether **this** caller may delete it -- author, committee or staff. Computed
            server-side against the real rule, because a client guessing from a display name gets it
            wrong the moment two residents share one.
        createdAt: { type: string, format: date-time }
    SocietyBoardItemCreate:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, maxLength: 16, example: notice }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 800 }
        category: { type: string, maxLength: 40 }
        eventDate: { type: string, format: date }
        eventTime: { type: string, example: '18:30' }
    SocietyContribution:
      type: object
      description: One tip, trusted pick or photo on the community tab.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        kind: { type: string, maxLength: 16, example: tip, description: 'tip, referral, photo -- what the chips group on' }
        category: { type: [string, 'null'], maxLength: 40 }
        body: { type: [string, 'null'] }
        referralName: { type: [string, 'null'], description: The person being recommended }
        referralContact:
          type: [string, 'null']
          description: >
            **Withheld from a signed-out reader.** It is a third party's phone number and they never
            agreed to be on the open web; a signed-in caller is at least an account the platform can
            act against if it is misused.
        photoUrl: { type: [string, 'null'] }
        authorName: { type: string }
        authorIsResident: { type: boolean }
        helpfulCount: { type: integer }
        helpfulByMe: { type: boolean, description: Whether this caller has already voted; false for a signed-out reader }
        canRemove: { type: boolean, description: 'Author, committee or staff -- computed for this caller' }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          items: { $ref: '#/components/schemas/SocietyContributionReply' }
    SocietyContributionCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, maxLength: 16, example: tip }
        category: { type: string, maxLength: 40 }
        body: { type: string, maxLength: 600 }
        referralName: { type: string, maxLength: 80 }
        referralContact: { type: string, maxLength: 20, description: Accepted here because a recommendation nobody can act on is not one }
        photoUrl: { type: string, maxLength: 500 }
    SocietyContributionReply:
      type: object
      properties:
        id: { type: string, format: uuid }
        contributionId: { type: string, format: uuid }
        authorName: { type: string }
        authorIsResident: { type: boolean }
        body: { type: string }
        canRemove:
          type: boolean
          description: >
            Against the **reply's** own author, not the contribution's -- posting a tip does not
            grant the power to delete a correction to it.
        createdAt: { type: string, format: date-time }
    SocietyHelpful:
      type: object
      description: >
        Exactly what the helpful button draws, and nothing else. Returned by both the `PUT` and the
        `DELETE` so a vote never costs a re-read of the page it is on.
      properties:
        helpfulCount: { type: integer }
        helpfulByMe: { type: boolean }
    SocietyProposal:
      type: object
      description: >
        One community proposal about a society -- a missing detail, the resident WhatsApp invite, or
        a corrected map pin. Fields not relevant to this `kind` are null.
      properties:
        id: { type: string, format: uuid }
        societySlug: { type: string }
        societyName:
          type: string
          description: >
            The society's name as recorded, denormalised onto the proposal deliberately. This queue
            is cross-society and starts from no society at all, so without the name a client must
            either fetch every society the page mentions or reconstruct one from the slug -- and the
            ops console did the second, out of a bundled catalogue holding none of the member-added
            societies these proposals are mostly about.
        localitySlug:
          type: [string, 'null']
          description: Null for societies imported without one; the queue renders a dash.
        kind: { type: string, enum: [details, whatsapp, location] }
        status: { type: string, enum: [pending, approved, rejected] }
        builder: { type: [string, 'null'] }
        buildYear: { type: [integer, 'null'] }
        towers: { type: [integer, 'null'] }
        units: { type: [integer, 'null'] }
        maintenancePerSqft: { type: [number, 'null'] }
        amenities: { type: [array, 'null'], items: { type: string } }
        inviteUrl:
          type: [string, 'null']
          description: >
            The resident group invite. Reaches a verified resident of this society and staff; null
            for everybody else, approved or not -- an invite link is a door into a group of people
            who live somewhere.
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        placeId: { type: [string, 'null'], description: The map provider's id for the proposed pin }
        label: { type: [string, 'null'], description: 'Human-readable summary of what is being proposed, for the ops queue' }
        authorName: { type: string }
        authorIsResident: { type: boolean }
        decidedByName: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    SocietyProposalCreate:
      type: object
      description: >
        One body for three proposal kinds. Which fields are read depends on `kind`, and which caller
        may send it does too: a `details` proposal is open to anyone signed in, `whatsapp` and
        `location` need a verified flat.
      required: [kind]
      properties:
        kind: { type: string, maxLength: 16, enum: [details, whatsapp, location] }
        builder: { type: string, maxLength: 120 }
        buildYear: { type: integer, minimum: 1 }
        towers: { type: integer, minimum: 1 }
        units: { type: integer, minimum: 1 }
        maintenancePerSqft: { type: number, minimum: 0.0, maximum: 999.99 }
        amenities: { type: array, maxItems: 24, items: { type: string, maxLength: 60 } }
        inviteUrl: { type: string, maxLength: 300 }
        lat: { type: number, minimum: -90.0, maximum: 90.0 }
        lng: { type: number, minimum: -180.0, maximum: 180.0 }
        placeId: { type: string, maxLength: 300 }
    SocietyProposalDecision:
      type: object
      required: [status]
      properties:
        status:
          type: string
          maxLength: 16
          enum: [approved, rejected]
          description: Approving applies the proposed value to the society in the same transaction.
    SocietyProposals:
      type: object
      description: >
        The hub's one read for the whole proposal surface: what is outstanding, and whether a
        resident group exists at all.
      properties:
        pending:
          type: array
          items: { $ref: '#/components/schemas/SocietyProposal' }
          description: Every proposal awaiting a decision, whoever raised it.
        whatsappAvailable:
          type: boolean
          description: >
            Whether an approved resident group invite exists. Public, and the reason the pair is
            split: a signed-out visitor can be told the group is there and nudged to verify their
            flat, without being handed the door.
        whatsappJoinUrl:
          type: [string, 'null']
          description: The invite itself. Null unless the caller is a verified resident of this society.
    Reel:
      type: object
      properties:
        id: { type: string, example: RL1 }
        listingId: { type: string, description: FK to a property }
        title: { type: string }
        locality: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        deal: { $ref: '#/components/schemas/DealIntent' }
        poster: { type: string, description: Poster / thumbnail image url }
        video: { type: string, description: Video url }
        likes: { type: integer }
        views: { type: integer }
        tag: { type: string }
    City:
      type: object
      properties:
        slug: { type: string, example: pune }
        name: { type: string, example: Pune }
        live: { type: boolean }
        listingCount: { type: integer }
    CityWaitlistRequest:
      type: object
      required: [mobile, city]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        city: { type: string }
        email: { type: string, format: email }
    CityAdminUpdate:
      type: object
      required: [live]
      properties:
        live:
          type: boolean
          description: Whether the city is launched for shoppers.
    Fees:
      type: object
      description: Transparent fee/charges breakdown for a deal.
      properties:
        deal: { $ref: '#/components/schemas/DealIntent' }
        brokerage: { $ref: '#/components/schemas/Money' }
        platformFee: { $ref: '#/components/schemas/Money' }
        stampDuty: { $ref: '#/components/schemas/Money', description: 'Omitted when the duty is not a flat published figure and is computed per transaction instead — which is both deals: leave-and-licence duty is 0.25% of a consideration built from the rent, term and deposit, and sale duty is 5-7% of the higher of agreement value and ready reckoner rate. **Absent is not zero.** A client that renders a missing value as ₹0 is telling the customer the state waived a charge it did not.'}
        registration: { $ref: '#/components/schemas/Money', description: 'Omitted when the fee depends on the registering body (rent: ₹1,000 municipal / ₹500 rural). Present for `buy`, where it is 1% capped at ₹30,000. Absent is not zero.'}
        gst: { $ref: '#/components/schemas/Money' }
        notes: { type: string }
    # ---- Listings (owner) ----
    ListingCreate:
      type: object
      required: [title, deal, propertyType, price, locality, city]
      properties:
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { type: string }
        bhk: { type: number }
        price: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        maintenance: { $ref: '#/components/schemas/Money' }
        negotiable: { type: boolean }
        area: { type: number }
        areaUnit: { type: string, default: sqft }
        furnishing: { $ref: '#/components/schemas/Furnishing' }
        locality: { type: string }
        city: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        reraId: { type: string }
        possession: { $ref: '#/components/schemas/PropertyPossession' }
        amenities: { type: array, items: { type: string } }
        images: { type: array, items: { type: string, format: uri } }
        description: { type: string }
        # The four duplicate-detection inputs (V79). None is required: an owner in a society on a
        # bulk meter has no meter number, a plot has no floor, and a standalone building has no
        # society. The rule reads whichever of them are present and stays silent otherwise.
        address: { type: string, description: Street address; normalised server-side into a duplicate key }
        floor: { type: integer, description: Which floor the unit is on }
        societyId: { type: string, format: uuid, description: The society this unit sits in }
        electricityMeterNo:
          type: string
          description: >-
            The unit's electricity meter number. Write-mostly: the duplicate probe reads it
            server-side, and it is returned only to the listing's owner and to staff, never on the
            public listing response.
        # The detail answers the posting wizard has always collected. facing and totalFloors already
        # existed on the read side (`Property`) and were missing only here, which is why they read
        # back empty forever no matter what the owner typed. bathrooms and parking are new in V114.
        bathrooms: { type: integer, minimum: 0, description: Bathroom count. Omit rather than guess }
        parking: { type: integer, minimum: 0, description: Dedicated slots conveyed with the unit }
        balconies: { type: integer, minimum: 0, description: Balcony count }
        facing:
          type: string
          maxLength: 32
          description: >-
            Compass or outlook direction. Deliberately not an enum: the column has no CHECK and
            existing rows hold values the wizard's ten options do not cover, so constraining it here
            would reject bodies the database still accepts.
        totalFloors: { type: integer, minimum: 1, description: Floors in the building }
        ageYears:
          type: integer
          minimum: 0
          description: >-
            Construction age in whole years. The wizard collects a band and sends its lower bound,
            which is lossless because the bands have distinct floors (0, 1, 5, 10, 15). Omitted for
            an under-construction property — that is a possession state, and `possession` carries
            it. Absent means unstated, which is not zero.
    ListingUpdate:
      allOf:
        - $ref: '#/components/schemas/ListingCreate'
        - type: object
          description: All fields optional on update (PATCH semantics).
    ListingDuplicateCheck:
      type: object
      description: >-
        The subset of `ListingCreate` the duplicate rule actually reads. Same field names and same
        limits, deliberately: the server derives the comparison key from this body by the same calls
        the create makes, so any divergence here would mean the pre-check answered about a different
        property than the one about to be posted.


        Nothing is required — a wizard asks on every submission and most listings carry neither
        signal. With both absent the answer is `found: false` without a query, because there is
        nothing to compare.


        No `excludeId`: the only question this route answers is asked before a create, so there is
        never a listing to exclude. An edit does not ask it.
      properties:
        address: { type: string, maxLength: 300, description: Street address as typed; normalised server-side }
        locality: { type: string, description: Display name; resolved server-side to the slug the address key is scoped by }
        city: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        electricityMeterNo: { type: string, maxLength: 64 }
    ListingDuplicateVerdict:
      type: object
      required: [found]
      properties:
        found: { type: boolean, description: Whether the caller already has a live or in-review listing for this unit }
        existingId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The caller's existing listing, when `found`. A real server id, which is the point — the
            browser-side check this replaced could only name ids from its own local store, so the
            "edit the one you have" link it offered pointed at nothing. Resolves through
            `getMyListing`. No slug is returned: listings are not given one on create, so it would be
            null for every listing this route can name.
    PropertyStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          # Deliberately NOT $ref PropertyStatus. That enum has five values; this operation accepts
          # three. `flagged` is reached through flagProperty (which also records a reason) and
          # `archived` through archiveProperty (a separate axis, and owner-or-staff rather than
          # staff-only), so allowing either here would be a second, reason-less way to do something
          # the API already models properly. The implementation 400s on the other two; before this
          # was narrowed the contract promised five and delivered three.
          enum: [pending, approved, rejected]
          description: Moderation decision. Use flagProperty / archiveProperty for the other states.
        reason: { type: string, description: Recorded on the audit row; required by convention when rejecting }
    Offer:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        from: { $ref: '#/components/schemas/Party' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, countered, accepted, declined, withdrawn] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        # The buyer's preferred possession date, or absent if none was given (D112). A calendar day,
        # not an instant — `format: date`, matching the offer modal's date picker.
        moveIn: { type: string, format: date }
        history:
          type: array
          description: Negotiation trail.
          items:
            type: object
            properties:
              amount: { $ref: '#/components/schemas/Money' }
              by: { type: string, enum: [buyer, owner] }
              at: { type: string, format: date-time }
    OfferCreate:
      type: object
      # `propertyId` is required here because POST /offers is not nested under a property
      # and carries no path parameter — without it the server cannot know which listing is
      # being offered on. Added in slice 4; the endpoint was unimplementable as written.
      required: [propertyId, amount]
      properties:
        propertyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        message: { type: string }
        # Optional preferred possession date (D112) — the modal's "Preferred move-in" / "Target
        # possession" field. Nullable: a buyer may open on price alone and settle the date later.
        moveIn: { type: string, format: date }
    OfferResponse:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline, counter] }
        counterAmount: { $ref: '#/components/schemas/Money' }
        message: { type: string }
    Visit:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        visitor: { $ref: '#/components/schemas/Party' }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person, video] }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled, no-show] }
        createdAt: { type: string, format: date-time }
    VisitCreate:
      type: object
      # Same defect as OfferCreate: neither POST /visits nor POST /visit-requests is nested
      # under a property or carries a path parameter, so the listing has to travel in the
      # body. Added in slice 4.
      required: [propertyId, slot]
      properties:
        propertyId: { type: string }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person, video], default: in-person }
        note: { type: string }
    VisitSlotUpdate:
      type: object
      # D87: reschedule carries only the new instant. The server resets the visit to `scheduled`,
      # so no status is sent — mirrors how VisitCreate carries the slot as a single date-time.
      required: [slot]
      properties:
        slot: { type: string, format: date-time }
    Deal:
      type: object
      description: A closed/closing deal aggregate (owner ↔ counterparty lifecycle).
      properties:
        id: { type: string }
        propertyId: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        counterparty: { $ref: '#/components/schemas/Party' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [active, reserved, closed] }
        closedAt: { type: string, format: date-time }
    DealCloseRequest:
      type: object
      required: [agreedPrice, counterpartyMobile]
      properties:
        agreedPrice: { $ref: '#/components/schemas/Money' }
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string }

    # ---- Moderation ----
    StaffCreate:
      # S33: `mobile` added and made required. The source contract omitted it, but `users.mobile` is
      # NOT NULL UNIQUE with a format CHECK - it is the platform's natural identity for every user,
      # not a profile extra - so `addStaff` was literally unable to insert a row. Relaxing the column
      # instead was the alternative and the wrong one: it would have weakened the natural key for all
      # ~40k user rows to accommodate a handful of colleagues.
      #
      # D206: `password` REMOVED. It used to be an optional field here, which meant the administrator
      # who minted an account also chose the credential it would sign in with - so the second
      # administrator's co-signature attested to a RECORD ('an ops lead should exist') rather than to
      # a PERSON, and the maker could sign in as the colleague they had just had approved. The
      # account is now created with no usable password and its holder sets their own via
      # `redeemStaffInvite`. `mobile` therefore does double duty: it is the natural key AND where the
      # invite is delivered.
      type: object
      required: [name, mobile, email, role]
      properties:
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        team: { $ref: '#/components/schemas/Team' }
    MessageTemplate:
      # D216: one row of message_template. Operational copy, held in the database rather than as
      # Java constants so it can be corrected without a deploy.
      type: object
      description: >
        One piece of approved outreach copy. `body` arrives un-rendered, with `{placeholder}` tokens
        intact, so a console can preview it as the operator chooses; substitution happens on the
        server at send, from the listing and its owner, never from anything the client supplies.
      required: [id, channel, category, name, body]
      properties:
        id:
          type: string
          description: >-
            A slug, not a UUID, and deliberately: it is written by hand into outreach requests and
            read in the log, so it is meant to be legible.
          example: wa-photos
        channel: { type: string, enum: [whatsapp, sms, email] }
        category:
          type: string
          enum: [onboarding, reminder, notification, advice, verification]
          description: What the message is for, used to group the picker.
        name: { type: string, example: 'Photo request' }
        body:
          type: string
          description: >-
            The template text. Known placeholders are `{owner_name}`, `{owner_mobile}`, `{title}`,
            `{locality}`, `{price}`, `{listing_id}`, `{staff_name}` and `{claim_link}`. A token with
            no value is left standing as literal text rather than blanked, so an unresolved variable
            is visible in the preview instead of arriving at an owner as a missing word.
    PreparedMessage:
      # D216: the result of prepareOwnerOutreach.
      type: object
      description: >
        A message the server has rendered, recorded, and handed back for a human to send.
      required: [id, body, status, handoffLink]
      properties:
        id: { type: string, format: uuid, description: The ledger row, as returned by `listOwnerOutreach`. }
        body:
          type: string
          description: The rendered text, exactly as it will appear on the owner's phone.
        status:
          type: string
          enum: [prepared, sent, failed]
          description: >-
            Always `prepared` today. `sent` and `failed` exist because the transmitter is a seam:
            substituting a Business Solution Provider for click-to-chat would change which of these
            a row can reach and nothing else about this contract. Until then the server declines to
            claim delivery it cannot observe.
        handoffLink:
          type: string
          format: uri
          description: >-
            A `wa.me` link addressed to the owner's own number, carrying the rendered body. Opening
            it is the send.
          example: 'https://wa.me/919876543210?text=Hi%20Ramesh...'
    OutreachEntry:
      # D216: one row of outbound_message, as read back by listOwnerOutreach.
      type: object
      description: >
        One message prepared for this listing's owner. This log is what a colleague reads before
        picking up the phone, which is why `preparedBy` names a person rather than "the platform".
      required: [id, templateId, channel, body, status, preparedBy, preparedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, example: wa-photos }
        channel: { type: string, enum: [whatsapp, sms, email] }
        body: { type: string, description: The rendered text as it was at the time it was prepared. }
        status: { type: string, enum: [prepared, sent, failed] }
        preparedBy:
          type: string
          format: uuid
          description: The staff account that prepared it.
        preparedAt:
          type: string
          format: date-time
          description: >-
            Wall-clock time at insert, not transaction start, so two messages prepared in one unit of
            work still order against each other. Ordering is the point of this list.
    BackOfficePermission:
      # D192/D13: one entry of the catalogue served by GET /admin/permission-catalogue. Mirrors
      # security/BackOfficePermissions.Permission.
      type: object
      description: >
        One back-office permission atom. `name` is `module:action` and is the exact string stored
        and checked — the module and action are the same value split for grouping, so a console can
        render a grid without parsing.
      required: [name, module, action, adminOnly]
      properties:
        name: { type: string, example: 'tickets:read' }
        module: { type: string, example: tickets }
        action: { type: string, enum: [read, write] }
        adminOnly:
          type: boolean
          description: >-
            Whether the route this atom guards is admin-only, so a staff account can never hold it
            however its document is written. Advisory to the UI and authoritative on the server —
            the same field, precisely so a screen cannot offer a checkbox the server would ignore.
    BackOfficePermissionsRequest:
      # D192/D13: a bare list rather than a richer shape. The catalogue is served separately, so a
      # client has no reason to send back the module and action it was given, and a field the
      # server ignores is a field a client will one day rely on.
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: >-
            The atoms to store, from `GET /admin/permission-catalogue`. Empty means "no guarded
            back-office route".
          items: { type: string, example: 'tickets:read' }
    BackOfficeAccess:
      # D192/D13: mirrors moderation/user/BackOfficeAccessResponse.
      type: object
      description: >
        One back-office account's access. `permissions` and `effective` are both here on purpose:
        the first is what is stored, the second is what the server will honour after intersecting
        it with the account's role baseline.
      required: [userId, role, scoped, permissions, effective]
      properties:
        userId: { type: string, format: uuid }
        role:
          $ref: '#/components/schemas/Role'
        scoped:
          type: boolean
          description: >-
            Whether a document exists at all. Distinct from an empty `permissions`: no document
            means "unscoped — the role baseline applies", an empty one means "deliberately allowed
            nothing".
        permissions:
          type: array
          description: >-
            Exactly what is stored, unfiltered. Empty if the row is unreadable, in which case
            `effective` is empty too.
          items: { type: string }
        effective:
          type: array
          description: >-
            What this account may actually do right now — the role baseline narrowed by the stored
            document. Never larger than the baseline.
          items: { type: string }
    KycStartRequest:
      type: object
      description: >
        Optional parameters when starting the DigiLocker badge flow. No Aadhaar number is
        ever sent — verification happens on DigiLocker.
      properties:
        redirectUrl: { type: string, format: uri, description: Where DigiLocker returns the user after consent. }
    KycStart:
      type: object
      description: Handle to an in-progress DigiLocker verification (ADR-009/017).
      required: [verificationUrl, ref]
      properties:
        ref: { type: string, description: Server-side verification reference (correlates with the webhook). }
        verificationUrl: { type: string, format: uri, description: Short-lived Cashfree/DigiLocker consent URL to redirect the user to. }
        expiresAt: { type: string, format: date-time }
    AadhaarVerification:
      type: object
      description: >
        The caller's opt-in identity-verification badge (L2). A badge boosts ranking and
        trust but is never required to browse, post or contact (ADR-019).
      properties:
        badge: { type: boolean, description: True once the Verified badge is earned. }
        status: { type: string, enum: [none, pending, verified, failed] }
        source: { type: string, enum: [digilocker], description: Verification source (Cashfree Secure ID DigiLocker). }
        maskedAadhaar: { type: string, example: 'XXXX XXXX 1234', description: Last-4 only; the full number is never stored. }
        mobileMatch: { type: [boolean, 'null'], description: Soft signal — whether the Aadhaar-linked mobile matches the account mobile (ADR-009a). Not a gate at MVP. }
        verifiedAt: { type: [string, 'null'], format: date-time }
    DigilockerWebhook:
      type: object
      description: Cashfree Secure ID DigiLocker callback payload (provider → backend).
      properties:
        type: { type: string, example: DIGILOCKER_VERIFICATION_SUCCESS }
        ref: { type: string, description: Correlates with the `ref` returned by KycStart. }
        status: { type: string, enum: [SUCCESS, FAILED] }
        data:
          type: object
          description: Verified identity fields (masked); raw Aadhaar is never delivered.
          properties:
            maskedAadhaar: { type: string, example: 'XXXX XXXX 1234' }
            mobile: { $ref: '#/components/schemas/Mobile' }
            identityHash: { type: string, description: Server-computed composite dedup key (ADR-009b); not stored raw here. }
    PaymentWebhook:
      type: object
      # S15 (slice 5): this documented a FLAT payload -- {type, orderId, referenceId, purpose,
      # status, amount, paidAt} -- that Cashfree does not send and never has. The real v2025-01-01
      # envelope nests everything under `data`, with the order id at data.order.order_id and the
      # outcome at data.payment.payment_status. Anyone implementing the contract faithfully would
      # have built a handler that silently never fires: every field would read as null, the
      # signature would still verify, and the endpoint would answer 200 while doing nothing. That
      # is the worst failure mode available to a payment webhook.
      #
      # Corrected to the real shape. Two consequences worth stating, because they are easy to lose:
      #   * `purpose` does not exist upstream. What the payment settles must be recovered from our
      #     own order record, keyed by order_id -- not read off the callback.
      #   * order_amount is a DECIMAL with paise ("170.00"), not the platform's whole-rupee Money.
      #     It is typed as a string here deliberately: parsing it into an integer rupee value is a
      #     lossy decision that belongs in one place in the handler, not implied by the schema.
      description: >
        Cashfree Payment Gateway callback payload (provider → backend), API version 2025-01-01
        (ADR-017). Authenticity is verified from `x-webhook-signature` over
        `x-webhook-timestamp + rawBody`; the body must be read raw, because re-serializing the JSON
        changes the bytes and therefore the digest. Handlers dedupe on `data.order.order_id` and
        always answer 200.
      properties:
        type:
          type: string
          enum:
            - PAYMENT_SUCCESS_WEBHOOK
            - PAYMENT_FAILED_WEBHOOK
            - PAYMENT_USER_DROPPED_WEBHOOK
          example: PAYMENT_SUCCESS_WEBHOOK
        event_time: { type: string, format: date-time }
        data:
          type: object
          properties:
            order:
              type: object
              properties:
                order_id: { type: string, description: Cashfree order id; the idempotency / dedup key. }
                order_amount: { type: string, example: '17000.00', description: 'Decimal rupees with paise, as sent by the provider.' }
                order_currency: { type: string, example: INR }
            payment:
              type: object
              properties:
                cf_payment_id: { type: string }
                payment_status: { type: string, enum: [SUCCESS, FAILED, PENDING, USER_DROPPED] }
                payment_amount: { type: string, example: '17000.00' }
                payment_group: { type: string, example: upi }
                payment_time: { type: [string, 'null'], format: date-time }
            error_details:
              type: [object, 'null']
              description: Present on PAYMENT_FAILED_WEBHOOK.
              properties:
                error_code: { type: string }
                error_description: { type: string }
                error_reason: { type: string, example: bank_declined }
                error_source: { type: string, enum: [bank, cashfree, user] }
    PropertyReview:
      # S34 (slice 9): `messages` added.
      #
      # Same defect class as S30 and S31, found in the same sweep. The contract shipped
      # `POST /properties/{id}/verification/messages` to write into the owner<->ops clarification
      # thread and `POST .../verification/read` to mark it read, but the only GET on the thread
      # returned no messages at all - so the owner could be asked for a document and had no endpoint
      # that would ever show them the question. A write-only conversation is not a conversation.
      type: object
      description: Moderation record for a listing under review.
      properties:
        propertyId: { type: string }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        reviewer: { type: string }
        checklist:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              pass: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/VerificationMessage' }
        notes: { type: string }
        decidedAt: { type: string, format: date-time }

    ChecklistUpdate:
      # D218. `item` is the line's text, matching PropertyReview.checklist[].item exactly.
      type: object
      description: One verification checklist line, ticked or unticked.
      required: [item]
      properties:
        item: { type: string, example: 'Property tax receipt' }
        pass:
          type: boolean
          default: false
          description: 'Omitted is treated as false — "not stated" and "not checked" are the same fact here.'

    OwnershipVerification:
      # D190/Q15: the case file behind the Ownership Verified badge.
      #
      # `missingKinds` is the field that makes this worth returning rather than a bare boolean. Ops
      # working a queue needs "waiting on identity", not "not verified", and an owner told only that
      # their listing is unverified has no idea what to send.
      #
      # `verified` is DERIVED server-side from `verifiedUntil` against the clock, never stored as
      # the badge. A listing verified on a property-tax receipt stops being verified ninety days
      # after that receipt was issued, with no write to the row and therefore no window in which a
      # sweep has not run yet.
      type: object
      description: Ownership gate status and the evidence behind it.
      properties:
        propertyId: { type: string }
        verified: { type: boolean, description: 'The badge — an ops verdict that has not lapsed.' }
        verifiedAt: { type: [string, 'null'], format: date-time, description: 'When ops last accepted a complete evidence set.' }
        verifiedUntil:
          type: [string, 'null']
          format: date-time
          description: >
            The earliest expiry among the documents the badge rests on. Null in two very different
            situations — never verified, and verified on documents that do not expire — so it is
            read together with `verified` rather than alone.
        missingKinds:
          type: array
          description: 'Required facts with no current document: ownership_proof, owner_identity, site_presence.'
          items: { type: string, enum: [ownership_proof, owner_identity, site_presence] }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/OwnershipEvidence' }

    OwnershipEvidence:
      # D190: one recorded document. Expired rows stay in the list — the case file is a history of
      # what the badge was granted on, not a snapshot of what is current, and a disputed listing is
      # argued from the history.
      type: object
      properties:
        id: { type: string }
        docType: { type: string, enum: [index_ii, sale_deed, tax_receipt, electricity_bill, aadhaar, pan, site_photos] }
        kind: { type: string, enum: [ownership_proof, owner_identity, site_presence], description: 'Which of the three required facts this establishes.' }
        documentId: { type: [string, 'null'], description: 'The vault row, when the proof was uploaded rather than sighted in person.' }
        subjectName:
          type: [string, 'null']
          description: >
            Whose identity was sighted, as the document spells it. Present on the identity doc types
            and null on the rest, and staff-only: on an agent-posted listing it is a third party's
            name and the owner is not the person it belongs to.
        issuedAt:
          type: string
          format: date-time
          description: >
            When the document was issued or the photographs taken — NOT when ops reviewed it. Every
            expiry is measured from here, which is what stops a decade-old receipt minting a fresh
            badge.
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Null for the registry and identity documents that do not go stale.' }
        current: { type: boolean, description: 'Whether it still proves what it proves, as at the moment this was read.' }

    OwnershipEvidenceCreate:
      # D190: `issuedAt` is required rather than defaulted to now. A default would quietly turn
      # every stale document into a fresh one, which is the exact failure the gate exists to stop.
      type: object
      required: [docType, issuedAt]
      properties:
        docType: { type: string, enum: [index_ii, sale_deed, tax_receipt, electricity_bill, aadhaar, pan, site_photos] }
        documentId: { type: string, description: 'Optional — the documents-vault row this proof was uploaded to.' }
        issuedAt: { type: string, format: date-time, description: "The document's own date, read off the document." }
        subjectName:
          type: string
          maxLength: 120
          description: >
            Whose identity the document is. Required for `aadhaar` and `pan` and optional otherwise:
            a row recording that an identity document was sighted, without recording whose, cannot
            be contradicted by anything and so establishes nothing in a dispute.

    VerificationMessage:
      # S34: the wire shape of one message in the clarification thread. `from` is derived
      # server-side by comparing the sender to the listing owner, never sent by the client - a
      # client-supplied `from` would let an owner post a message that appeared to come from ops.
      #
      # D218: `internal` marks a staff-only message. It is only ever true in a staff response - the
      # owner's copy has internal messages filtered out entirely, so for them it is uniformly false
      # and carries nothing. It exists because filtering alone left staff unable to tell a staff-only
      # finding from something the owner was actually told: both arrive as `from: ops`, in one
      # conversation. A moderator acting on that misreading is the same disclosure the filter exists
      # to prevent, one step later.
      type: object
      properties:
        id: { type: string }
        from: { type: string, enum: [owner, ops] }
        body: { type: string }
        at: { type: string, format: date-time }
        read: { type: boolean }
        internal: { type: boolean, description: Staff-only; never true in an owner's copy. }
    PropertyReviewSummary:
      # D91: one row of the ops verification queue. Not `PropertyReview` with fields dropped — the
      # queue deliberately carries neither `checklist` nor `messages`, because a hundred case files
      # each dragging their whole clarification thread along is a page nobody can render and a
      # thread nobody reads at that width.
      #
      # D218: the queue is ordered by `last_message_at desc, id desc`, which is NOT on this schema.
      # `updatedAt` is rendered because a moderator wants to know how stale a case is, but it is no
      # longer the sort key: it moves for anything that dirties the row, whereas the desk triages by
      # who is waiting for a reply. Sorting client-side on `updatedAt` will not reproduce the server
      # order; page through it instead.
      type: object
      description: One listing under review, as it appears in the ops queue.
      properties:
        propertyId: { type: string }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        reviewer: { type: string }
        unread:
          type: integer
          description: >
            D218. Messages waiting on the side reading this row, counted from the opposite end
            depending on which queue served it: on `/admin/property-reviews` it is the owner's
            unread messages, on `/me/property-reviews` it is ops'. Same rule — a message is unread
            to the side that did not send it — which is also what `markVerificationRead` writes.
            Deliberately not reader-scoped on the ops queue: that desk is shared, so counting "what
            I personally have not opened" would make a colleague's reply look like new owner mail.
          example: 2
        decidedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PropertyReviewQueuePage:
      # The one non-house page envelope in the tree, named (D218) only because a second route now
      # returns it and 40 lines of copied YAML is a worse guard than a name. The name is
      # deliberately un-generic: nothing else can `$ref` it without either lying about its item type
      # or renaming it, which is the same protection the inline copy gave.
      #
      # This is what Spring Data's own `Page` serialises to, and it is not the shape the other
      # twenty-odd lists use: `number` where they say `page`, `sort` as an object rather than the
      # `field,dir` string, and six further fields no caller asked for. Recorded as it actually is,
      # because a contract describing the envelope we wish we had is worse than one that admits the
      # exception — Spring Data itself logs on every call that this shape carries no stability
      # guarantee. The fix is `PageResponse.of(...)` in the handlers; that breaks a live ops screen
      # and belongs in its own slice.
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PropertyReviewSummary' }
        number: { type: integer, description: 'Zero-based page index — `page` everywhere else.', example: 0 }
        size: { type: integer, example: 20 }
        numberOfElements: { type: integer, description: 'Items on this page.', example: 1 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
        sort:
          type: object
          properties:
            empty: { type: boolean }
            sorted: { type: boolean }
            unsorted: { type: boolean }
        pageable:
          type: object
          properties:
            offset: { type: integer, format: int64 }
            pageNumber: { type: integer }
            pageSize: { type: integer }
            paged: { type: boolean }
            unpaged: { type: boolean }
            sort:
              type: object
              properties:
                empty: { type: boolean }
                sorted: { type: boolean }
                unsorted: { type: boolean }
    Report:
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [property, user, review, post] }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, reviewing, actioned, dismissed] }
        createdAt: { type: string, format: date-time }
    ReportTriage:
      type: object
      description: >
        S30 (slice 9). Moves a report through triage. `note` is an internal ops note, never shown
        to the reporter or the reported party.
      required: [status]
      properties:
        status: { type: string, enum: [open, reviewing, actioned, dismissed] }
        note: { type: string, maxLength: 2000 }
        enforcement:
          type: string
          enum: [none, hide_content, suspend_account]
          default: none
          description: >
            D68. What to actually do to the target, applied in the same transaction as the status
            change. Before this field existed, `actioned` was a word: the report changed state and
            the reported listing stayed live.


            Only legal alongside `status=actioned` - "dismissed, and also taken down" is not a
            decision anybody means. Supported per target type: `property` accepts `hide_content`
            (flags the listing, which removes it from every public read); `user` accepts
            `suspend_account` (the same soft-delete an admin drives from the users screen).
            `review` and `post` accept `none` only - a review is taken down through
            `PATCH /reviews/{id}/status`, which also removes it from the rating average, and
            share-flat posts have no moderation verb yet. Both are refused with a message naming
            the endpoint to use instead, rather than accepted and silently discarded.
    ErasureCreate:
      type: object
      description: >
        D177. `reason` is optional and always will be - a statutory right is not conditional on
        explaining yourself, and a required field here would turn one into a negotiation.
      properties:
        reason: { type: string, maxLength: 2000 }
    ErasureDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [execute, reject] }
        note:
          type: string
          maxLength: 2000
          description: Required when rejecting. A refusal the subject cannot understand is one they cannot act on.
    ErasureRequest:
      type: object
      description: >
        D177. **`subjectId` is deliberately absent from this schema.** The subject reads their own
        request and knows who they are; an admin decides on whether a live obligation exists, which
        the id does not answer either way. Putting it on the wire would make the admin queue a list
        of everybody who has asked to be forgotten, which is the shape this feature exists to avoid.
      properties:
        id: { type: string }
        subjectDigest:
          type: string
          description: >
            SHA-256 over a deployment-held pepper and the subject's UUID, lowercase hex. A
            verifier, not an index: given a UUID you can confirm a request concerned it; given the
            table you cannot enumerate who was erased. Survives completion, when `subjectId` is
            cleared from the row.
        status: { type: string, enum: [pending, completed, rejected] }
        reason: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decisionNote: { type: string }
        erased:
          type: string
          description: >
            JSON document of what was removed - table names and row counts, never values. Null
            until the request completes.
        retained:
          type: string
          description: >
            JSON document of what was kept and the statute requiring it, plus the categories this
            implementation is known not to reach. Written at execution rather than resolved at read
            time, so a request decided today still carries the reasoning it was decided under.
    ReviewStatusUpdate:
      type: object
      description: >
        S31 (slice 9). Takes a review down (`rejected`) or restores it (`published`). `pending` is
        deliberately absent: it is the pre-moderation state a review is created in, and moving a
        live review back to it would hide it with no record of a decision having been made.
      required: [status]
      properties:
        status: { type: string, enum: [published, rejected] }
        reason: { type: string, maxLength: 2000 }
    ReportCreate:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [property, user, review, post] }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }
    InternalNote:
      type: object
      description: >
        D29. One thing a member of staff wrote about a listing, a person, a review or a report.
        Editable, unlike `ticket_notes` and the audit log: this is retained information about a
        case, not an audit record, and the audit trail of who changed what already exists
        elsewhere.
      properties:
        id: { type: string }
        entityType: { type: string, enum: [property, user, review, report] }
        entityId: { type: string }
        authorId:
          type: string
          description: >
            The real user id, taken from the principal on write and never client-supplied. The
            durable fact - it survives a rename.
        authorName:
          type: string
          description: >
            The author's display name, resolved from `users` at read time rather than copied onto
            the row. Falls back to the raw id when no account matches: a staff account can be
            archived and its notes stay, so an unresolved author is a real state and rendering it
            blank would make an authored note look anonymous.
        action:
          type: string
          description: >
            The maker-checker label the note was filed beside ("Approved", "Archived"). Absent for
            a note written on its own - an omitted label and an empty one are different claims.
        text: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: >
            Served because the note is editable. A reader who cannot tell the text in front of them
            was rewritten last week is reading it as if it were contemporaneous.
    InternalNoteCreate:
      type: object
      description: >
        `text` is required. The browser-side store this replaces accepted a note with no text so
        long as it had an action label, which wrote a row that rendered as an empty bullet under a
        colleague's name. An action with nothing to say is the audit log's job.
      required: [text]
      properties:
        text: { type: string, maxLength: 4000 }
        action: { type: string, maxLength: 60 }
    InternalNoteEdit:
      type: object
      description: >
        Text only. `action` is not editable: rewording an observation is a correction, changing
        which decision it sat beside is a rewrite.
      required: [text]
      properties:
        text: { type: string, maxLength: 4000 }

    # ---- Leads & Contact ----
    ContactStatus:
      type: object
      description: Whether the caller may see a listing's contact, under the badge-not-gate model (ADR-019).
      properties:
        status: { type: string, enum: [owner, approved, pending, declined, none], description: 'Gate state for this caller vs this listing: owner (viewer owns it), approved, pending, declined, or none (no request yet).' }
        verifiedContactOnly: { type: boolean, description: True when the owner accepts verified contacts only — caller needs the L2 badge (ADR-019). }
        verificationRequired: { type: boolean, description: True when this specific request is blocked pending the caller's Verified badge. }
        ownerHidesNumber: { type: boolean, description: 'True when the owner has opted to stay masked even after approving. The client should offer chat instead of a call; approval still stands (D5).' }
    ContactRequestCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        message: { type: string, maxLength: 1000 }
    ContactRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        requester: { $ref: '#/components/schemas/Party' }
        status: { type: string, enum: [pending, approved, declined] }
        contact:
          type: [object, 'null']
          description: Present only after the gate is passed & owner grants.
          properties:
            name: { type: string }
            mobile: { $ref: '#/components/schemas/Mobile' }
        createdAt: { type: string, format: date-time }
    # Slice-12 spec fix S45: `Enquiry` removed with its only operation. See /enquiries above.
    FinalizationRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        initiator: { $ref: '#/components/schemas/Party' }
        counterparty: { $ref: '#/components/schemas/Party' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, accepted, declined, cancelled] }
        createdAt: { type: string, format: date-time }
    FinalizationCreate:
      type: object
      # `propertyId` duplicates the {propId} path parameter of POST /finalization/{propId}/request.
      # Two sources for one value invites disagreement, so it is now optional and advisory:
      # the path always wins, and a body value that contradicts it is rejected with 422
      # rather than silently ignored. (Slice 4.)
      required: [counterpartyMobile, agreedPrice]
      properties:
        propertyId:
          type: string
          description: >
            Optional echo of the {propId} path parameter. If present it MUST equal the path
            value; a mismatch is a 422. The path is authoritative.
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
    # ---- Rentals & Payments ----
    Transaction:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        type: { type: string, enum: [income, expense] }
        category: { type: string, example: rent }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly], default: none }
    # S14 (slice 5): GET /me/finances/{propId}/dues returned a bare Transaction[], so a "due" --
    # whose entire defining fact is *when it falls due* -- carried no due date. The client could
    # only recompute it by re-implementing the recurrence rules, which is how two answers to one
    # question start to diverge. The server owns the recurrence, so the server states the date.
    Due:
      type: object
      description: >
        A recurring transaction projected forward to its next occurrence. `nextDue` is derived
        server-side from the transaction's `date` and `recurring` interval.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            nextDue: { type: string, format: date, description: The next occurrence on or after today. }
            daysUntil: { type: integer, description: Whole days from today to nextDue; negative if overdue. }
    TransactionCreate:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly], default: none }
    # S19 (slice 5): the partial-update shape the PATCH always needed. Every field optional -
    # an absent key means "leave it alone", which is what PATCH means and what the UI sends.
    TransactionUpdate:
      type: object
      description: >
        Partial update. Only the fields present are changed; `amount` and `date` cannot be set to
        null once present, because a ledger row without either is not a transaction.
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly] }
    OwnershipBasis:
      type: object
      properties:
        purchasePrice: { $ref: '#/components/schemas/Money' }
        purchaseDate: { type: string, format: date }
        loanOutstanding: { $ref: '#/components/schemas/Money' }
        emi: { $ref: '#/components/schemas/Money' }
        currentValue: { $ref: '#/components/schemas/Money' }
    FinanceSummary:
      type: object
      properties:
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        # S20 (slice 5): occupancyRate is nullable, and that is the point. It is tenanted-days over
        # days-in-window, derived from tenancies - so for a listing that has never been let (a
        # sale listing, or a flat the owner lives in) there is no rate to state. Returning 0.0
        # there would assert "vacant the whole time", which reads as a failing property rather
        # than an inapplicable question, and would drag any portfolio average down with it.
        occupancyRate:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 1
          description: >
            Fraction of the requested window covered by an active tenancy, or null if the property
            has never had one.
    CashflowPoint:
      type: object
      properties:
        month: { type: string, example: 2025-01 }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
    RentPayment:
      type: object
      properties:
        id: { type: string }
        tenancyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        # S13 (slice 5): platformFee and gst are stored by V6, whose header states they are
        # "server-computed from platform_fees/settings, never trusted from the client" -- but they
        # were absent from this response, so the only place the tenant could see them was the
        # browser's own calculation (lib/store/rent.js). A fee the client computes is a fee the
        # client can change, and a receipt that disagrees with the ledger is a support ticket.
        platformFee: { $ref: '#/components/schemas/Money' }
        gst: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        paidDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [due, paid, overdue, failed] }
        method: { type: string, enum: [upi, netbanking, card, autopay, cash] }
        reference: { type: string }
        failureReason: { type: [string, 'null'], description: "The provider's reason when status is failed, else null — a tenant can quote it to support." }
        # D167. The single-use Cashfree checkout session, mirroring `Subscription.paymentSessionId`.
        # Present only in the immediate `payRent` response for a freshly opened order; never stored,
        # so always null when the ledger is read back.
        paymentSessionId: { type: [string, 'null'] }
    RentPaymentCreate:
      type: object
      # S12 (slice 5): `amount` was client-supplied and required. Rent is a property of the
      # tenancy, so a tenant could have paid Rs 1 and the server would have recorded it as the
      # month's rent. Verbatim the slice-4 lesson: derive the sensitive value, do not validate what
      # the client sent. The amount is now taken from the tenancy; the optional `expectedAmount`
      # exists only so a client that is displaying a stale rent figure gets a 422 instead of
      # silently charging the new one.
      required: [tenancyId]
      properties:
        tenancyId: { type: string }
        expectedAmount:
          $ref: '#/components/schemas/Money'
          # Optional client-side optimistic check; the server bills the tenancy's rent regardless.
        method: { type: string, enum: [upi, netbanking, card, autopay] }
    RentMandate:
      type: object
      properties:
        id: { type: string }
        tenancyId: { type: string }
        maxAmount: { $ref: '#/components/schemas/Money' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28 }
        status: { type: string, enum: [active, paused, revoked] }
        provider: { type: string, example: cashfree }
    # S22 (slice 6): the write shape, split out of RentMandate. See PUT /me/rent-mandate for why.
    RentMandateUpdate:
      type: object
      required: [tenancyId]
      properties:
        tenancyId: { type: string }
        maxAmount:
          $ref: '#/components/schemas/Money'
          # The ceiling the tenant authorises. Deliberately not the rent: a rent increase must not
          # be collectable automatically without the tenant consenting to the new figure.
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          description: >
            Capped at 28 rather than 31. A mandate set for the 30th does not fire in February --
            the one month a tenant most needs autopay to work.
        status:
          type: string
          enum: [active, paused, revoked]
          description: >
            Optional lifecycle change on an existing mandate. Absent means leave the status alone.
            `paused` <-> `active` is a round trip the tenant controls: pausing is the platform
            declining to debit an instruction the bank still holds, so resuming it consents to
            nothing new -- the ceiling and the day are unchanged. `revoked` is one-way: it
            withdraws the instruction, and reviving it would be charging an account on consent
            that was taken back, so a fresh mandate must be created instead. Sending `revoked` ->
            anything answers `409`.
    PayoutAccount:
      type: object
      description: Read shape. The full account number is never returned -- only the masked tail.
      properties:
        accountHolder: { type: string }
        maskedAccount: { type: string, example: 'XXXXXX7890' }
        ifsc: { type: string }
        upiId: { type: string }
        verified: { type: boolean }
    # S11 (slice 5): GET and PUT shared one schema whose only account field was `maskedAccount`
    # ("XXXXXX7890"). You cannot *set* a bank account from a masked value, so the write endpoint
    # was uncallable-as-specified -- the same defect shape as slice 4's DealParty having no id.
    # Splitting read from write also stops a client sending `verified: true` about itself: bank
    # verification is Cashfree's penny-drop answer, not the account holder's claim.
    PayoutAccountUpdate:
      type: object
      required: [accountHolder]
      properties:
        accountHolder: { type: string }
        accountNumber:
          type: string
          description: Full account number; stored masked, never returned. Required unless upiId is given.
          writeOnly: true
        ifsc: { type: string }
        upiId: { type: string }
    Tenancy:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenant: { $ref: '#/components/schemas/Party' }
        owner: { $ref: '#/components/schemas/Party' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [active, ended, terminated] }
    TenancyDeclaration:
      type: object
      description: >
        A person's claim that they lived in a listing, and the owner's answer (D194). Only
        `confirmed` proves anything; `pending` is an unopposed assertion and `revoked` is one the
        owner has taken back. Carries the claimant's name and deliberately no mobile -- a number
        here would let anyone mint a contact reveal by simply asserting a relationship, which is
        the gate the platform's contact rules exist to hold.
      properties:
        id: { type: string }
        propertyId: { type: string }
        declarantId: { type: string }
        declarantName: { type: string }
        livedFrom:
          type: [string, 'null']
          format: date
          description: The claimant's own account of when the stay began. Not verified.
        livedTo:
          type: [string, 'null']
          format: date
        status: { type: string, enum: [pending, confirmed, revoked] }
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: When the owner last answered; null while pending.
    TenancyDeclarationCreate:
      type: object
      description: >
        Both fields optional and neither trusted -- they are context so the owner can recognise a
        former tenant, not evidence. The owner is read from the listing and is deliberately not a
        field here: letting a claimant nominate their own confirmer is the same hole as having no
        confirmation step at all.
      properties:
        livedFrom: { type: [string, 'null'], format: date }
        livedTo: { type: [string, 'null'], format: date }
    # S21 (slice 5): TenantProfile described a profile the product does not collect. The UI form
    # (pages/consumer/TenantProfile.jsx) captures name, occupation, monthly income, WHO will live
    # there, move-in date, a prior-landlord reference and a free-text introduction. The schema
    # instead had employer, familySize, budget and preferredLocalities -- of which only `name` and
    # `occupation` overlapped, and three of the four had no UI at all and never have.
    #
    # This was not cosmetic. The trust score is built from idVerified(30) + occupation(20) +
    # income(15) + priorLandlord(15) + about(10) + occupants(10). Four of those six inputs had no
    # column, so a server honouring the old schema could compute at most 50/100 -- every tenant's
    # score would have halved the moment the UI moved off the mock.
    #
    # `familySize: integer` is replaced by `occupants`, an enum. In Pune this is the single most
    # consequential tenant attribute: societies and owners screen explicitly on family vs bachelor
    # vs company lease, and many refuse bachelors outright. "3" cannot express "Bachelor (Male)",
    # so an integer does not merely lose detail, it loses the fact owners actually decide on.
    #
    # employer / budget / preferredLocalities are DROPPED rather than left unused -- same ruling as
    # D5's loan-rate and budget surfaces. `income` replaces `budget`: what a tenant earns is what an
    # owner screens on, and it is what the form asks for.
    TenantProfile:
      type: object
      description: >
        Read shape. `score` and `verified` are server-computed; see TenantProfileUpdate.
        `income` is shown only to an owner with an established relationship (see
        /tenant-profiles/{mobile}).
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        name: { type: string }
        occupation: { type: string, description: 'Free text, e.g. "Software Engineer".' }
        income: { $ref: '#/components/schemas/Money' }
        occupants:
          type: string
          enum: [family, bachelor_male, bachelor_female, company_lease]
          description: Who will occupy the home. Owners and societies screen on this directly.
        moveIn: { type: string, format: date, description: Earliest date the tenant can move in. }
        priorLandlord: { type: string, description: 'Reference contact, free text.' }
        about: { type: string, description: Tenant's own introduction. }
        score: { type: integer, minimum: 0, maximum: 100, readOnly: true, description: Computed trust score. }
        verified: { type: boolean, readOnly: true }
    # S17 (slice 5): PUT /me/tenant-profile accepted the full TenantProfile, including `score` and
    # `verified` -- so a tenant could award themselves a trust score of 100 and a verified badge,
    # which is precisely the signal owners use to decide who to let into their flat. `mobile` was
    # writable too, letting a profile be filed against somebody else's number. All three are now
    # server-owned and absent from the write shape rather than merely ignored, so a client author
    # discovers the rule from the contract instead of from an unexplained no-op.
    TenantProfileUpdate:
      type: object
      properties:
        name: { type: string }
        occupation: { type: string }
        income: { $ref: '#/components/schemas/Money' }
        occupants: { type: string, enum: [family, bachelor_male, bachelor_female, company_lease] }
        moveIn: { type: string, format: date }
        priorLandlord: { type: string }
        about: { type: string }
    # D114. The batch badge shapes. Deliberately NOT a list of TenantProfile: that read hands a
    # related caller a tenant's name, occupation and income, and reusing it per row would move a
    # whole list's worth of somebody's income across the wire to draw a tick. A badge needs one bit.
    #
    # `mobiles` carries the numbers as the caller has them, tolerantly: an entry that is not a valid
    # Indian mobile answers `false` rather than failing the request, because this backs a badge on
    # every row of a list and one bad entry must cost that row its badge, not blank every other
    # row's. The list SIZE is capped, and that is a hard 400 -- an unbounded list is one cheap
    # request buying an unbounded amount of database work.
    TenantVerifiedQuery:
      type: object
      required: [mobiles]
      description: >
        The numbers to ask about, as the caller holds them. Maximum 50; a larger batch is 400. An
        entry that is not a valid mobile is not an error -- it answers `false`.
      properties:
        mobiles:
          type: array
          maxItems: 50
          items: { type: string }
    TenantVerified:
      type: object
      description: >
        One answer. `mobile` is the caller's own input echoed back unchanged -- never a normalised,
        stored or masked number -- so a client can key its map on what it sent, and so this endpoint
        provably cannot emit a number the caller did not already hold. `verified` is `false` for an
        unregistered number, a registered one with no badge, and a person the caller has no
        relationship with, alike; there is no reason field, because the difference between those
        three IS the enumeration answer this endpoint refuses to give.
      properties:
        mobile: { type: string, description: The number exactly as supplied by the caller. }
        verified: { type: boolean, readOnly: true }

    # ---- Documents ----
    # ---- Managed properties (private owner records) ----
    ManagedProperty:
      type: object
      description: >-
        A private "single-player" property record (Owner Hub / Property Passport / rent tracker),
        held outside the searchable marketplace until published. `deal` is the catalogue buy|rent
        value (the front-end seam relabels it sale|rent); `publishedListingId` is null until the
        record is published, then the id of the spawned listing.
      properties:
        id: { type: string }
        title: { type: string }
        deal: { type: string, enum: [buy, rent] }
        propertyType: { type: string }
        bhk: { type: [number, 'null'] }
        price: { type: integer, format: int64, description: Amount in whole INR. }
        locality: { type: string }
        localitySlug: { type: [string, 'null'] }
        society: { type: [string, 'null'] }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'] }
        furnishing: { type: [string, 'null'] }
        visibility: { type: string, description: Owner-scoped visibility; private until published. }
        status: { type: string }
        rented: { type: boolean, description: Owner rent-tracker — currently rented. }
        tenantName: { type: [string, 'null'] }
        monthlyRent: { type: [integer, 'null'], format: int64 }
        dueDay: { type: [integer, 'null'], description: Rent due day of month. }
        valuation: { type: [object, 'null'], additionalProperties: true, description: Opaque Rent-o-meter snapshot. }
        publishedListingId: { type: [string, 'null'], description: Id of the spawned listing once published. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagedPropertyCreate:
      type: object
      required: [deal, propertyType, price, locality]
      description: >-
        Server-owned fields are never accepted here — visibility/status (forced private/managed
        unless a listing is adopted) and owner (the caller).
      properties:
        title: { type: string, description: Optional; synthesized from bhk/type/locality when blank. }
        deal: { type: string, enum: [buy, rent] }
        propertyType: { type: string }
        bhk: { type: [number, 'null'] }
        price: { type: integer, format: int64, minimum: 0, description: Amount in whole INR. }
        locality: { type: string }
        society: { type: [string, 'null'] }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'], description: Defaults sqft when null. }
        furnishing: { type: [string, 'null'] }
        rented: { type: [boolean, 'null'], description: Rent-tracker; defaults false. }
        tenantName: { type: [string, 'null'] }
        monthlyRent: { type: [integer, 'null'], format: int64, description: Defaults to price for a rent deal when omitted. }
        dueDay: { type: [integer, 'null'] }
        valuation: { type: [object, 'null'], additionalProperties: true }
        publishedListingId:
          type: [string, 'null']
          description: >-
            Adopt an existing listing of the caller's rather than starting private. Publish runs the
            other way (record first, listing second) and so cannot attach a file to a listing that
            already exists. 404 when the listing is not the caller's; 409 when it already has a
            managed record.
    ManagedPropertyUpdate:
      type: object
      description: >-
        Partial update — only supplied fields are applied. The lifecycle fields
        (visibility/status/publishedListingId) move only through publish, never a client patch.
      properties:
        title: { type: [string, 'null'] }
        deal: { type: [string, 'null'], description: buy|rent }
        propertyType: { type: [string, 'null'] }
        bhk: { type: [number, 'null'] }
        price: { type: [integer, 'null'], format: int64, minimum: 0 }
        locality: { type: [string, 'null'] }
        society: { type: [string, 'null'] }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'] }
        furnishing: { type: [string, 'null'] }
        rented: { type: [boolean, 'null'] }
        tenantName: { type: [string, 'null'] }
        monthlyRent: { type: [integer, 'null'], format: int64 }
        dueDay: { type: [integer, 'null'] }
        valuation: { type: [object, 'null'], additionalProperties: true }
    ManagedRentReceipt:
      type: object
      description: >-
        An immutable record that the owner received one month's rent outside PuneNest's payment
        rail. Every field except `rentMonth` is a snapshot taken from the owned property and the
        owner's user row at the moment of recording, never re-derived on read — a receipt handed to
        a tenant in August must keep saying what it said in August after the rent is raised or the
        address is edited.
      required: [id, rentMonth, amount, tenantName, landlordName, propertyAddress, createdAt]
      properties:
        id:
          type: string
          description: >-
            Server-generated, durable receipt id; doubles as the receipt's reference number on the
            generated PDF. Stable across devices and re-downloads.
        rentMonth: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-08' }
        amount: { type: integer, format: int64, description: Whole INR, as the property's monthly rent stood then. }
        tenantName: { type: string }
        landlordName: { type: string }
        propertyAddress: { type: string, description: '"society, locality, Pune" as it stood then.' }
        createdAt: { type: string, format: date-time, description: The receipt date — when the owner recorded the month. }
    ManagedRentReceiptCreate:
      type: object
      required: [rentMonth]
      description: >-
        One field, deliberately. Amount, tenant, landlord and address are read server-side from the
        owned property; accepting them here would let a caller issue themselves a receipt for a rent
        that was never agreed.
      properties:
        rentMonth: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-08' }
    Document:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        category: { type: string, example: Sale Deed }
        fileName: { type: string }
        url: { type: string, format: uri, description: Short-lived signed URL. }
        sizeBytes: { type: integer, format: int64 }
        mimeType: { type: string }
        uploadedAt: { type: string, format: date-time }
    DocumentRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        requester: { $ref: '#/components/schemas/Party' }
        categories: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, granted, declined, expired] }
        sharedDocumentCount:
          type: integer
          format: int32
          minimum: 0
          description: >
            Number of uploaded files this request's category scope unlocks. Zero means the owner
            approved categories for which no file has been uploaded yet; it does not mean the
            request was declined.
        shareToken: { type: [string, 'null'] }
        # Slice-10 spec fix S37. A grant is time-boxed, so the token has a deadline; without it
        # on the wire the client cannot tell a live grant from one about to lapse, and the
        # 'expired' status appears out of nowhere.
        expiresAt: { type: [string, 'null'], format: date-time }
        acknowledgedDisclaimer: { type: boolean, description: Buyer accepted the sensitive-docs disclaimer }
        createdAt: { type: string, format: date-time }
    # Slice-10 spec fix S35. DocumentRequest.acknowledgedDisclaimer is described as "Buyer
    # accepted the sensitive-docs disclaimer", but the create schema had no field to set it, so
    # it could only ever read false. A consent flag the client cannot send is not consent.
    DocumentRequestCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        categories: { type: array, items: { type: string } }
        message: { type: string, maxLength: 500 }
        acknowledgedDisclaimer:
          type: boolean
          default: false
          description: Buyer ticked the sensitive-documents disclaimer before asking.
    # ---- Services & Support ----
    Ticket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        propertyId: { type: [string, 'null'] }
        assignee: { type: [string, 'null'], readOnly: true, description: Assignee display name. Set via TicketUpdate.assigneeId (S42). }
        service: { type: string, description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        value: { $ref: '#/components/schemas/Money' }
        quotedValue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >
            What the customer accepted when the ticket came off a priced flow (D3). Read *next to*
            `value`, never instead of it: `value` is what the desk expects to bill and is ops-owned,
            `quotedValue` is what was promised at the point of sale and is write-once. A gap between
            the two is the desk's cue that the job is not the job that was quoted, which is a signal
            that only exists while both numbers do.
        detail: { type: string, description: Free-text request detail }
        notes:
          type: array
          description: Internal staff notes.
          items:
            type: object
            properties:
              by: { type: string }
              text: { type: string }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    # Debt D47. The raiser's view of their own ticket: `Ticket` minus `notes`. Two audiences read a
    # ticket -- the customer who raised it and the desk that works it -- and only one of them may see
    # the internal thread. Expressed as a second schema rather than a nullable field or a role-
    # conditional serializer, because a property that is absent from the type cannot be leaked by a
    # later change to the code that fills it in. `assignee` stays: it is a display name the contract
    # marks readOnly, not internal content, and telling a customer who is handling their request is
    # the point of a support queue.
    CustomerTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        propertyId: { type: [string, 'null'] }
        assignee: { type: [string, 'null'], readOnly: true, description: Assignee display name. Set via TicketUpdate.assigneeId (S42). }
        service: { type: string, description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        value: { $ref: '#/components/schemas/Money' }
        quotedValue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >
            What this customer accepted, echoed back for the same reason as `mobile` — it is their
            own number and their own agreed price, and withholding it from the person who agreed to
            it would make the receipt less useful than the form that produced it (D3).
        detail: { type: string, description: Free-text request detail }
        createdAt: { type: string, format: date-time }
    TicketCreate:
      type: object
      required: [subject]
      properties:
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        propertyId: { type: string }
        body: { type: string }
    # Slice-11 spec fix S42. `Ticket.assignee` is a display name, and a display name is not a
    # key -- two staffers called Rohit cannot be told apart, and a rename would orphan the ticket.
    # Assignment therefore takes the staff user id; the name is derived for display.
    # Debt D46: omitting `assigneeId` leaves the current assignee alone, so unassigning needs a
    # spelling of its own -- the reserved value `none`. A JSON null is absence, not an instruction.
    TicketUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assigneeId: { type: string, description: 'User id of the staff member to assign, or the reserved value "none" to unassign. Omit to leave the assignee unchanged; a null is treated as omitted.' }
        team: { $ref: '#/components/schemas/Team' }
    SupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        # Slice-12 spec fix S49. One boolean, so it has to belong to one side: it means "a support
        # reply the ticket's owner has not read yet". Set when staff or admin answer, cleared by
        # POST /support/tickets/{id}/read, and untouched by the customer's own replies.
        #
        # D50: the desk's side of the same question is a second column, not a second meaning for
        # this one. It is not on this schema -- a customer has no use for "has the desk read me" --
        # it is `awaitingReply` on AdminSupportTicket.
        unread: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        createdAt: { type: string, format: date-time }
    # D51. One row of the ops queue. Deliberately not `SupportTicket`: that schema carries the whole
    # thread inline, which is safe for a customer's own support history and is an unbounded response
    # by another route once the list is the whole platform's. Ops pages this to find a ticket, then
    # opens it at GET /support/tickets/{id}.
    AdminSupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: [string, 'null'] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        # Who is waiting. The mobile is not here: the ticket detail already reveals it to the same
        # callers, and the paged user directory masks it for the same reason -- a list is the shape
        # that gets exported, and this one is the platform's whole support traffic.
        raiser: { type: [string, 'null'], description: Display name of the customer who raised it }
        # D50's second column. This is what makes the list a queue rather than an archive.
        awaitingReply:
          type: boolean
          description: A customer message nobody on the desk has read.
        unread:
          type: boolean
          description: >-
            The other side: a staff reply the customer has not opened. Distinguishes "we have not
            answered" from "we answered and they have not looked".
        createdAt: { type: string, format: date-time }
    SupportTicketCreate:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string }
        category: { type: string }
        body: { type: string }
    ServiceRequestChecklist:
      # D120. Derived on every read from the request's own documents; nothing here is stored, so
      # there is no second source of truth that can drift from the vault. `ready`/`total` live on
      # the envelope rather than being folded client-side, so the badge and the list cannot
      # disagree.
      type: object
      required: [ready, total, items]
      properties:
        ready: { type: integer, description: Items with a document against them }
        total: { type: integer, description: Items this request asks for }
        items:
          type: array
          description: Every item, present or absent, in a fixed render order. The absent ones are the point.
          items:
            type: object
            required: [id, name, done]
            properties:
              # Also the upload `category` that satisfies this item -- one vocabulary, read and
              # written, rather than two kept in step by hand.
              id: { type: string, example: owner-id }
              name: { type: string, example: Owner Aadhaar + PAN }
              done: { type: boolean }
              # The newest document filed under this item. An id, never a URL: this endpoint mints
              # no download credential, so the bytes stay behind getServiceRequest.
              documentId: { type: [string, 'null'] }
    ServiceRequest:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: rent-agreement }
        # D44. The ops desk that works this request. Derived server-side from `type` by a map that
        # is total over the type enum -- rent-agreement is worked by the *rental* team, the other
        # four share their name with their desk -- and held to it by a database CHECK, so it can
        # never disagree with the type. Read-only: there is no field for it on ServiceRequestCreate,
        # because a client that could choose the desk could file a rent agreement onto the packers'
        # queue.
        team: { $ref: '#/components/schemas/Team' }
        status: { type: string, enum: [awaiting-payment, new, assigned, in-progress, draft-shared, changes-requested, approved, completed, cancelled] }
        propertyId: { type: [string, 'null'] }
        # D45. The ops board item this request mirrors, or null when it was filed straight from the
        # customer's wizard. Present so an operator working the paperwork can reach the enquiry it
        # came from instead of matching them up by name. The other direction is
        # GET /service-requests?ticketId=.
        ticketId: { type: [string, 'null'] }
        # D119: the structured fields the customer filled at create time, echoed back. Free-form
        # object (property, rent, deposit, scope, ...); null when the request carried none.
        details: { type: ['object', 'null'], additionalProperties: true }
        assignee: { type: [string, 'null'] }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              event: { type: string }
              by: { type: string }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequestMessage' }
        # D121. The co-fill counterparties of a two-sided matter, and whether they have accepted.
        # Empty on the ordinary one-person request. This is what makes a rent agreement legible as
        # an agreement between two people rather than as one person's form: it is how the requester
        # sees that their tenant has not answered yet, and how the tenant sees which side they are
        # on. There is deliberately no request-level `awaiting-party` status -- the party row's own
        # status carries that, and a second copy of it in the workflow vocabulary would be a second
        # thing to keep in step.
        parties:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequestParty' }
        createdAt: { type: string, format: date-time }
        # What the customer was charged, in whole rupees, for a priced desk (a rent agreement);
        # null for a free one (a legal opinion). Set once, at creation, from the published fee.
        amount: { type: [integer, 'null'], format: int64 }
        # The single-use Cashfree checkout session for a priced request. Present only on the create
        # response (the SDK consumes it once); always null on read. Never persisted.
        paymentSessionId: { type: [string, 'null'] }
    ServiceRequestCreate:
      type: object
      required: [type]
      properties:
        # Closed vocabulary. It used to be free text, which made the payment gate opt-in by
        # spelling: the server prices by matching the string exactly, so `rental` or `Rent-Agreement`
        # bought the rent-agreement desk for free and landed in a queue no team watches.
        type:
          type: string
          enum: [rent-agreement, legal, interior, packers, valuation]
          example: rent-agreement
        propertyId: { type: string }
        # D119: structured, not a flat string — stored as-is and echoed back on ServiceRequest.
        # Optional: omit it, or send an object; capped by serialized size server-side.
        # Must not carry identity numbers (`pan`/`aadhaar` at any depth): this object is echoed
        # verbatim to every staff read of the ops queue. Rejected with 400. Send them to
        # PUT /service-requests/{id}/identities instead (D151).
        details: { type: ['object', 'null'], additionalProperties: true }
        # D45. Optional. The ticket this request comes off, which must be one of the caller's own --
        # a request stapled to a stranger's enquiry would put two unrelated customers on one screen,
        # so an unknown or somebody else's ticket is a 404. One ticket carries at most one request;
        # a second is a 409.
        ticketId: { type: string }
    CoFillServiceRequestCreate:
      type: object
      required: [request, role, mobile]
      description: >
        The request and the invitation in one body, because on a co-filled agreement they are one
        decision.


        A composition of two existing shapes rather than a third variant of `ServiceRequestCreate`:
        `request` is exactly what `createServiceRequest` takes and `role`/`mobile` are exactly what
        `inviteServiceRequestParty` takes, so neither can drift from the operation it came from. The
        alternative -- flattening the four fields into one object -- would have made the co-fill body
        a near-copy of the plain one, and near-copies of a body that gains a field are how a client
        ends up able to set `ticketId` on one route and not the other for no reason anybody
        remembers.
      properties:
        request:
          allOf: [ { $ref: '#/components/schemas/ServiceRequestCreate' } ]
          description: >
            The request itself, on the same terms as `createServiceRequest` -- same closed `type`
            vocabulary, same `details` object, same refusal of identity numbers inside it.
        role:
          type: string
          enum: [owner, tenant]
          description: >
            The side the **invitee** is on, not the caller's. One of each per request, so naming the
            side that is already taken is a 409.
        mobile:
          type: string
          description: >
            The counterparty's mobile, ten digits. Resolved against `users` and bound to the account
            if one holds it; otherwise the invitation is written against the number itself and
            claimed when that number registers and proves itself by OTP (V107). Either way the
            requester is not blocked on the other person having signed up first, which is what the
            earlier design got wrong -- it put a stranger's registration in the middle of the
            requester's checkout.
    # D151. The parties a Leave & License names, and the two numbers it prints for each.
    #
    # Deliberately not reachable from ServiceRequest, from any list, or from any query keyed on
    # anything but a single request id. This is the entire disclosure surface for the only raw
    # Aadhaar numbers the platform holds -- `identity.kyc` stores masks by design -- and it is one
    # matter at a time or nothing.
    ServiceRequestIdentities:
      type: object
      required: [parties]
      properties:
        parties:
          type: array
          minItems: 1
          # Well past a real agreement (an owner and a handful of tenants) and short of anything
          # worth writing in bulk. This endpoint writes rows and nothing else throttles it (D2).
          maxItems: 12
          items: { $ref: '#/components/schemas/ServiceRequestIdentityInput' }
    ServiceRequestIdentityInput:
      type: object
      required: [partyRole]
      description: >
        Both numbers are optional individually -- a tenant may genuinely have no PAN -- but a party
        carrying neither is rejected with 422. Dropping such a party silently would leave the desk
        short of a number it had no way to know it should have asked for.
      properties:
        partyRole: { type: string, enum: [owner, tenant] }
        # Zero for the owner; the tenant's position in the wizard's list otherwise.
        partyIndex: { type: integer, minimum: 0, default: 0 }
        partyName: { type: string, maxLength: 120 }
        pan: { type: string, pattern: '^$|^[A-Za-z]{5}[0-9]{4}[A-Za-z]$', example: ABCDE1234F }
        aadhaar: { type: string, pattern: '^$|^[0-9]{12}$' }
    ServiceRequestIdentity:
      type: object
      description: >
        Returned in full, unmasked, because a masked PAN cannot be typed into a Leave & License.
        What makes that safe is the route, not the shape: assignee-only, audited, and purged when
        the matter closes.
      properties:
        partyRole: { type: string, enum: [owner, tenant] }
        partyIndex: { type: integer }
        partyName: { type: [string, 'null'] }
        pan: { type: [string, 'null'] }
        aadhaar: { type: [string, 'null'] }
        # Null numbers mean two different things and the reader has to tell them apart: with a null
        # purgedAt the customer left that field empty; with a timestamp the matter is closed and the
        # numbers have been discarded. Without this, a completed request would look identical to a
        # customer who never filled the form.
        purgedAt: { type: [string, 'null'], format: date-time }
    # Slice-10 spec fix S38. POST used to take RentAgreement itself and return no body, so the
    # client could send `status: registered` and then had no id to track what it created.
    RentAgreementCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        tenantMobile: { $ref: '#/components/schemas/Mobile' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        durationMonths: { type: integer, minimum: 1, maximum: 60 }
    RentAgreement:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenantMobile: { $ref: '#/components/schemas/Mobile' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        durationMonths: { type: integer }
        status: { type: string, enum: [draft, e-sign-pending, registered, active, expired] }
        documentUrl: { type: [string, 'null'], format: uri }
    OwnerKyc:
      type: object
      description: |
        The server's view of an owner's KYC. Every field is server-owned: the masks are derived
        from the values the owner submitted (the raw PAN/Aadhaar are never stored or returned),
        and `bankVerified`/`status` come from the KYC provider, never from the client.
      properties:
        panMasked: { type: [string, 'null'], example: 'XXXXX1234X' }
        aadhaarMasked: { type: [string, 'null'], example: 'XXXX XXXX 1234' }
        bankVerified: { type: boolean }
        status: { type: string, enum: [pending, verified, rejected] }
    # Slice-10 spec fix S36. PUT used to accept OwnerKyc itself, which invited the client to send
    # `status: verified` and its own masks -- self-certified KYC, and a mask is not verifiable
    # anyway. The input is the two real identifiers; the server masks, stores only the mask, and
    # owns the verdict.
    OwnerKycUpdate:
      type: object
      required: [pan, aadhaar]
      properties:
        pan:
          type: string
          pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$'
          example: ABCDE1234F
          description: Full PAN. Stored masked; never returned.
        aadhaar:
          type: string
          pattern: '^[0-9]{12}$'
          example: '123412341234'
          description: Full 12-digit Aadhaar. Stored masked; never returned.

    # ---- Billing & Growth ----
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Owner Pro }
        audience: { type: string, enum: [owner, tenant, buyer, agent] }
        price: { $ref: '#/components/schemas/Money' }
        billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
        # The paywall's real ceilings as numbers, not prose parsed from `features` (D109). Null means
        # no cap: an owner plan has no contact limit, and a tenant plan has no listing limit.
        listingLimit: { type: [integer, 'null'] }
        contactLimit: { type: [integer, 'null'] }
        features: { type: array, items: { type: string } }
    Subscription:
      type: object
      description: >
        A subscription. Every field is null on the synthetic "no subscription" document returned
        by `getSubscription` when the caller has never subscribed (the operation declares only a
        200, and an empty object is friendlier to the plan screen than a 404).
      properties:
        id: { type: [string, 'null'] }
        planId: { type: [string, 'null'] }
        # Slice-13 spec fix S50. `pending` added: the row exists from the moment the gateway
        # order is created, and calling that state `active` would give an unpaid subscriber the
        # plan's benefits for as long as they never complete checkout.
        status: { type: [string, 'null'], enum: [pending, active, past-due, cancelled, expired] }
        startedAt: { type: [string, 'null'], format: date-time }
        renewsAt: { type: [string, 'null'], format: date-time }
        # Slice-13 spec fix S50. The gateway order id, mirroring `RentPayment.reference`. Null
        # once nothing is owed; the durable handle the payment webhook correlates against.
        paymentRef: { type: [string, 'null'] }
        # The single-use Cashfree checkout session (Option A hosted checkout). Present only in the
        # immediate `subscribe` response for a priced plan, for `cashfree.checkout(...)`; never
        # stored, so always null from `getSubscription`.
        paymentSessionId: { type: [string, 'null'] }
    SubscribeRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string }
        paymentMethod: { type: string, enum: [upi, card, netbanking] }
    BoostPack:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: 7-day Spotlight }
        price: { $ref: '#/components/schemas/Money' }
        durationDays: { type: integer }
        placement: { type: string, enum: [top, featured, homepage] }
    Boost:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        packId: { type: string }
        # Slice-13 spec fix S51. Null until the payment webhook confirms: the window is measured
        # from the moment the money arrives, not from the moment checkout was opened, so a
        # buyer who pays an hour later still gets the full pack.
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        # Slice-13 spec fix S51. `pending` added, for the same reason as Subscription.status:
        # `201` is only the order being created, and an `active` boost that was never paid for
        # is free promotion.
        status: { type: string, enum: [pending, active, expired] }
        # Slice-13 spec fix S51. The gateway order id to hand to the checkout SDK; null when the
        # pack is free.
        paymentRef: { type: [string, 'null'] }
        # D167. The single-use Cashfree checkout session, mirroring `Subscription.paymentSessionId`.
        # Present only in the immediate `boostListing` response for a priced pack; never stored, so
        # always null from `listListingBoosts`.
        paymentSessionId: { type: [string, 'null'] }
    ServiceOffering:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Home Painting }
        category: { type: string }
        startingPrice: { $ref: '#/components/schemas/Money' }
        description: { type: string }
    ServiceOrder:
      type: object
      properties:
        id: { type: string }
        offeringId: { type: string }
        # D58 added `quoted`. The other five are unchanged: renaming shipped enum values to match
        # the register's prose (pending/accepted/in_progress) would break every generated client
        # and rewrite live rows for nothing a user can see.
        status: { type: string, enum: [placed, quoted, scheduled, in-progress, completed, cancelled] }
        amount: { $ref: '#/components/schemas/Money' }
        scheduledFor: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ServiceOrderCreate:
      type: object
      required: [offeringId]
      properties:
        offeringId: { type: string }
        propertyId: { type: string }
        preferredSlot: { type: string, format: date-time }
        notes: { type: string }
    # D58. Body of `updateServiceOrderStatus`.
    #
    # `scheduled` is absent: it means the customer accepted the price, and is reached only through
    # `acceptServiceOrder`. `placed` is absent because it is what ordering produces and nothing may
    # go back to it.
    #
    # `amount` is required when `status` is `quoted` and rejected (422) with every other value --
    # a conditional rule OpenAPI cannot express, and the reason this is not a plain status setter.
    # Quoting is the step that attaches money to an order; an amount that could move after the
    # customer accepted would be a repricing.
    ServiceOrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [quoted, in-progress, completed, cancelled] }
        amount: { $ref: '#/components/schemas/Money' }
    Entitlements:
      type: object
      description: What the caller may do, derived from their live plan and their referrals (D31b).
      properties:
        contacts: { $ref: '#/components/schemas/ContactEntitlement' }
        listings: { $ref: '#/components/schemas/ListingEntitlement' }
        agreements: { $ref: '#/components/schemas/AgreementEntitlement' }
    ContactEntitlement:
      type: object
      # `allowance` and `remaining` are null when the plan lifts the ceiling, rather than a very
      # large sentinel: a client that renders "999,983 contacts left" beside an unlimited plan has
      # been told the truth in a form nobody can read. `unlimited` carries the same fact as a
      # boolean so no client has to learn that a missing number is good news.
      #
      # `remaining` is allowance - used, floored at zero, and is sent even though it is derivable.
      # It is the number every screen shows, and that arithmetic is the one place a countdown and
      # the gate that refuses can quietly disagree.
      #
      # `referralBonus` is already inside `allowance` -- it is broken out so the Refer page can say
      # what referring earned, not so clients can add the two.
      properties:
        unlimited: { type: boolean }
        used: { type: integer, description: Contact requests opened, for all time }
        allowance: { type: [integer, 'null'] }
        remaining: { type: [integer, 'null'] }
        referralBonus: { type: integer, description: Part of allowance earned by referrals }
    ListingEntitlement:
      type: object
      # Reported, not enforced (D31b). POST /me/listings does not check this yet; the wizard's
      # paywall does. It exists so the browser stops *computing* the allowance for itself -- a
      # client-side gate reading a server-side number can be tightened later without another
      # contract change, and one reading a client-side number cannot be tightened at all.
      #
      # No `used` or `remaining` here, unlike contacts: live listings go up and come down, so the
      # count is a live property of the catalogue that the listings endpoints already report, and
      # repeating it would create a second number that could disagree with the first.
      properties:
        allowance: { type: integer }
        referralBonus: { type: integer }
    AgreementEntitlement:
      type: object
      properties:
        free:
          type: integer
          minimum: 0
          description: Rent agreements earned via referrals.
    ReferralSummary:
      type: object
      # D31b. `rewardsEarned` and `rewardsPending` were Money and are gone. The rupees they counted
      # were never spendable -- no wallet, no credit note, no discount at any checkout -- while
      # every screen the referrer could see, and `Referral.reward` below, promised owner contacts.
      # The contract was right and the implementation had drifted, so the numbers now say contacts.
      # `converted` counts referrals that have qualified or been approved, not approvals alone:
      # qualification grants on its own now, and a referrer reading "0 converted" beside fifteen
      # spendable contacts would have been told two incompatible things at once.
      properties:
        code: { type: string, example: PUNE-AB12 }
        invited: { type: integer }
        converted: { type: integer }
        contactsEarned: { type: integer, description: Owner contacts already granted }
        contactsPending: { type: integer, description: Owner contacts promised, not yet qualified }
    Referral:
      type: object
      description: A single referral record with anti-fraud signals (admin/ops view).
      properties:
        id: { type: string, example: RF3000 }
        referrer: { type: string }
        referrerMobile: { $ref: '#/components/schemas/Mobile' }
        referred: { type: string }
        referredMobile: { $ref: '#/components/schemas/Mobile' }
        channel: { type: string, enum: [seeker, owner] }
        # D60. `channel` says which side of the marketplace the referred party joined on, which is
        # not what its name promises and not a dimension anybody can build a sharing report on.
        # Added beside it rather than by redefining it: `channel` is already stored, filtered on
        # and behind a CHECK, and changing its meaning would silently rewrite every existing row.
        # Null whenever the redemption carried no share context, which includes every code passed
        # on by voice -- distinct from `other`, which is a channel the client named and we have no
        # word for.
        shareChannel: { type: [string, 'null'], enum: [whatsapp, sms, email, copy, qr, other, null] }
        reward: { type: string, description: "Human label, e.g. '+15 owner contacts'" }
        # Slice-13 spec fix S54 added this so a checker could see the size of what they were
        # approving; D31b changed its unit. It was Money and counted rupees while the label beside
        # it said contacts. It now counts owner contacts, so the two agree. Rows decided before
        # D31b keep their rupee figure: a `rewarded` row records what a person actually released at
        # the time and is not ours to restate, which is also why `reward` is prose rather than an
        # enum -- the field has to hold two eras of the offer at once.
        rewardAmount: { type: integer, description: Owner contacts granted by this referral }
        # Slice-13 spec fix S52. `clawed-back` added. Reusing `rejected` for a reversal would
        # erase the distinction between a reward that was never paid and one that was paid and
        # then recovered -- which is precisely the distinction a fraud desk exists to keep.
        status: { type: string, enum: [pending, qualified, rewarded, rejected, clawed-back] }
        risk: { type: string, enum: [low, medium, high] }
        aadhaarVerified: { type: boolean }
        aadhaarUnique: { type: boolean }
        # D55. Computed since V64 by comparing salted digests of the two parties' address and
        # User-Agent; before that they were hardcoded false on every row. False still means "no
        # evidence" rather than "proved different": either side may have no digest -- a code minted
        # before V64, a request without a User-Agent -- and a missing input never matches.
        sameDevice: { type: boolean }
        sameIp: { type: boolean }
        velocityHigh: { type: boolean }
        activated: { type: boolean }
        at: { type: string, format: date-time }
        # D56/Q17. When the referred party's first listing passed ownership verification -- the one
        # event that moves a referral to `qualified` without a human. Null until it happens, and it
        # happens at most once per referral: a second verified listing does not mint a second
        # credit.
        qualifiedAt: { type: [string, 'null'], format: date-time }
        handledBy: { type: [string, 'null'] }
        handledAt: { type: [string, 'null'], format: date-time }
    # ---- Engagement ----
    SavedSearch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [listings, flatmates], default: listings, description: Which discovery surface this alert watches. }
        query: { type: string, description: URL-encoded filter query string (listings alerts). }
        filters: { type: object, additionalProperties: true, description: Structured filter object (alternative to the query string). }
        criteria: { $ref: '#/components/schemas/FlatmateAlertCriteria', description: Present only when `kind` is `flatmates`; listings alerts use `query` / `filters` instead. }
        label: { type: string, description: Short human summary rendered on the alert card and in the dashboard Alerts panel. }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly] }
        channel: { type: string, enum: [whatsapp, sms, email, push], default: whatsapp }
        mobile: { $ref: '#/components/schemas/Mobile', description: Required for the signed-out lead path — an anonymous alert is keyed by mobile so it re-homes on sign-in. }
        newCount: { type: integer, description: Matches that arrived since the alert sweep's last baseline. Falls back to zero once the alert has been sent — it is a "what changed" number, not a total. }
        matchCount: { type: integer, description: How many live listings match these facets right now, regardless of age. Computed server-side on every read of this resource, because the browser could only ever count one page of the catalogue. Always 0 for a `flatmates` alert, which this count does not cover. }
        createdAt: { type: string, format: date-time }
    SavedSearchCreate:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [listings, flatmates], default: listings }
        query: { type: string, description: Required when `kind` is `listings`. }
        filters: { type: object, additionalProperties: true }
        criteria: { $ref: '#/components/schemas/FlatmateAlertCriteria', description: Required when `kind` is `flatmates`. }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly], default: daily }
        channel: { type: string, enum: [whatsapp, sms, email, push], default: whatsapp }
        mobile: { $ref: '#/components/schemas/Mobile' }
    SavedSearchUpdate:
      # Deliberately narrower than SavedSearchCreate: only the "how do you want to hear about it"
      # half. The query/filters/criteria half is the alert's identity -- editing it in place would
      # silently change what any future new-match count was counted against -- so replacing an alert
      # is delete + create. Both fields are optional; absent means unchanged.
      type: object
      properties:
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly] }
        channel: { type: string, enum: [whatsapp, sms, email, push] }
    RecentSearch:
      # Deliberately has no `id`. The entry is identified by its URL, there is no operation that
      # addresses one on its own, and a surrogate id would only invite a client to key its rail on
      # something that changes when an entry is evicted and re-added.
      type: object
      required: [label, url, at]
      properties:
        label: { type: string, maxLength: 200, description: "Chip text the user saw, e.g. `Rent · 2 BHK · Baner`. Presentation only — never the identity of the entry, since two different searches can render the same chip." }
        url: { type: string, maxLength: 500, description: "Normalized relative search URL (lowercased path, query parameters sorted). The identity of the entry." }
        at: { type: string, format: date-time, description: When the user last ran this search. Always server-generated; never accepted from the client. }
    RecentSearchCreate:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        url:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            A relative URL on one of our own search pages (`/listings`, `/flatmates`). Anything
            else — absolute, protocol-relative, backslash-smuggled, off-site or over-long — is a 422.
          example: /listings?deal=rent&loc=baner
    Review:
      # S26 (slice 8): `context`, `categories` and `recommend` were rendered by the property page
      # (pages/consumer/property/ReviewsSection.jsx) but absent from the contract -- the UI showed
      # a "Verified resident" / "Visited" badge, five sub-ratings and a recommend line that no
      # response could carry. A contract that cannot express what the product ships is the defect,
      # so the spec is fixed first and the schema follows in V16.
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [property, locality, society, owner] }
        targetId: { type: string }
        author: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        context:
          type: string
          enum: [visit, tenant]
          readOnly: true
          description: >
            How the author is known to have experienced the property -- `tenant` if they hold or
            held a tenancy on it, otherwise `visit` for a completed site visit. Drives the
            "Verified resident" / "Visited" badge, and is therefore **server-derived and
            read-only**: accepting it from the client would make the badge forgeable by anyone
            who can POST. Absent on society / locality / owner reviews, which have no visit or
            tenancy concept.
        categories:
          $ref: '#/components/schemas/ReviewCategories'
          description: >
            Optional per-aspect sub-ratings, each 1-5. Sparse -- the UI renders only the keys
            present, and an aspect nobody rated is absent rather than 0.

            **The vocabulary depends on the target type, and the server enforces that.** A listing
            is rated on `locality / condition / value / owner / accuracy`; a housing society on
            `Safety / Maintenance / Management / Amenities / Connectivity` -- the ids the society
            hub's aspect bars are keyed on, capitalisation included. The two sets are disjoint,
            because there is no aspect a flat and a society are both rated on. `locality` and
            `owner` targets use the property vocabulary: nothing in the product has named one for
            them, so they keep what they have always accepted.

            JSON Schema cannot make `properties` depend on a path parameter, so the union of both
            vocabularies is declared in `ReviewCategories` and the server narrows it per target --
            a society aspect posted to a property is **rejected with 400**, not dropped. Dropping
            it would return 201 for a review whose bar then renders empty, which is the failure
            nobody reports.
        recommend:
          type: [boolean, 'null']
          description: >
            Nullable on purpose: the UI distinguishes "did not say" (omit the recommend line)
            from "would not recommend" (`r.recommend != null`), so `false` and absent are not
            the same answer.
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, published, rejected]
          readOnly: true
          description: >
            Moderation state, and **present only on `GET /admin/reviews`**. Absent on every other
            read, because every other read filters `status = 'published'` before it maps -- so the
            field would be a constant there, and a constant field invites a client to branch on
            something that can never vary.

            Added because the moderation queue could not do the job its own description claims. That
            endpoint's useful call is the unfiltered one -- "everything, newest first, which is how a
            moderator finds a review nobody has reported yet" -- and a mixed-status list in which no
            row carries its status is a list nobody can act on: a moderator cannot tell what has
            already been taken down, so every row reads as "unknown". The `?status=` filter was the
            workaround, costing one round trip per status to reconstruct what a single response
            should have carried.

            `pending` is in the enum because the column can hold it, not because this platform
            writes it: reviews are post-moderated, so `ReviewService` publishes on write. Declaring
            only the two values a moderator can *set* would make the contract narrower than the
            column and would 400 a legitimate row if that policy ever changed.
    ReviewCreate:
      # Note what is NOT here: `context`. It is derived server-side (see Review.context) and a
      # client-settable badge would defeat the anti-fake-review rule this slice exists to enforce.
      #
      # `categories` and `recommend` were both accepted by the server and sent by the property
      # review modal long before they were declared here -- a spec drift, corrected now that the
      # society hub sends sub-ratings too and the vocabulary is target-dependent.
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        categories: { $ref: '#/components/schemas/ReviewCategories' }
        recommend:
          type: [boolean, 'null']
          description: >-
            Omit for "did not say". `false` is a different answer, and the UI shows it as one.
    ReviewCategories:
      # Extracted so `Review` and `ReviewCreate` cannot drift apart on what an aspect map may hold.
      # See Review.categories for why the union is declared and the server narrows it.
      type: object
      properties:
        locality:     { type: integer, minimum: 1, maximum: 5 }
        condition:    { type: integer, minimum: 1, maximum: 5 }
        value:        { type: integer, minimum: 1, maximum: 5 }
        owner:        { type: integer, minimum: 1, maximum: 5 }
        accuracy:     { type: integer, minimum: 1, maximum: 5 }
        Safety:       { type: integer, minimum: 1, maximum: 5 }
        Maintenance:  { type: integer, minimum: 1, maximum: 5 }
        Management:   { type: integer, minimum: 1, maximum: 5 }
        Amenities:    { type: integer, minimum: 1, maximum: 5 }
        Connectivity: { type: integer, minimum: 1, maximum: 5 }
      additionalProperties: false
    ReviewSummary:
      # D79 (tech debt): the property page computed all four of these in the browser by reducing
      # the unpaged `listReviews` array. That worked only for as long as the array stayed whole,
      # which made "do not page this endpoint" a correctness constraint rather than a preference.
      # Computed in SQL now; `listReviews` is unchanged and still unpaged.
      type: object
      required: [reviewCount, distribution, categoryAverages]
      properties:
        avgRating:
          type: [number, 'null']
          description: >-
            Mean published rating to one decimal, as the UI renders it. Null -- not 0 -- when the
            listing has no reviews, matching `Society.avgRating`: no rating is not a rating of
            zero, and a star strip showing 0.0 states something false about a listing nobody has
            reviewed yet.
        reviewCount:
          type: integer
          description: >-
            How many published reviews the summary is over. Always present, 0 included: unlike an
            average, "how many" always has an answer.
        distribution:
          type: object
          description: >-
            Reviews per star rating. **All five keys are always present and zero-filled**, so a bar
            chart needs no guard per bucket -- an absent bar and a zero-height bar are not the same
            picture, and only one of them is true.
          properties:
            '1': { type: integer }
            '2': { type: integer }
            '3': { type: integer }
            '4': { type: integer }
            '5': { type: integer }
          additionalProperties: false
        categoryAverages:
          type: object
          description: >-
            Mean per-aspect sub-rating to one decimal, over only the reviews that answered that
            aspect. Sparse and closed, exactly like `Review.categories`, and over the **same
            per-target-type vocabulary**: an aspect nobody rated is absent rather than 0, because
            averaging it over everyone would understate it, and an aspect belonging to another
            target's vocabulary is never published even if a legacy row holds one.
          properties:
            locality:     { type: number }
            condition:    { type: number }
            value:        { type: number }
            owner:        { type: number }
            accuracy:     { type: number }
            Safety:       { type: number }
            Maintenance:  { type: number }
            Management:   { type: number }
            Amenities:    { type: number }
            Connectivity: { type: number }
          additionalProperties: false
    # ---- Engagement · Flatmates ----
    # Two feeds, split by the one question a seeker can always answer: is there an
    # address yet? Behavioural spec: docs/flows/consumer/flatmates.md
    FlatmateTab:
      type: string
      description: >
        `move-in` = browse PLACES (rooms, plus groups that already hold a flat).
        `team-up` = browse PEOPLE (solo seekers, plus groups still hunting).
        Replaces the legacy flatmates/rooms/groups triple, which split by our storage
        model rather than by seeker intent.
      enum: [move-in, team-up]
      default: move-in
    FlatmateTabLegacy:
      type: string
      description: >
        Deprecated `?view=` values kept as read aliases so old deep links, saved alerts and
        notification links resolve instead of falling back to the default:
        rooms -> move-in; flatmates | groups -> team-up.
      enum: [rooms, flatmates, groups]
      deprecated: true
    RoomKind:
      type: string
      description: >
        What the room physically is. Drives the derived `attachedBath` — a master bedroom's
        private bathroom is implied, so the host is never asked the same question twice.
        A partitioned living room is the budget option.
      enum: [master, bedroom, living]
    PriceBasis:
      type: string
      description: >
        Whether the rent is quoted per ROOM or per PERSON. `person` (legacy spare-room posts)
        is what one flatmate pays; `room` (owner flat-split) is the whole room rent, split
        equally by whoever takes it. Mixing them silently would make a shared bed look pricier
        than a private room. Defaults to `person` for every post predating the split flow.
      enum: [room, person]
      default: person
    Occupancy:
      type: string
      description: >
        Whether anyone already lives in the home. Orthogonal to `hostRole` / `verificationTier`:
        occupancy answers "will I have flatmates from day one?", host role answers the trust
        question. Derived from the flat's ledger server-side, never trusted from the client.
      enum: [empty, filling, occupied]
    HostRole:
      type: string
      description: Who is letting the space — an owner of the flat, or a sitting tenant seeking a replacement.
      enum: [owner, tenant]
    VerificationTier:
      type: string
      description: >
        Supply-side trust tier. `identity` is the floor and carries no badge; `owner` means the
        post is attached to an Ops-approved property; `tenant` means a sitting tenant attested a
        registered rent agreement (badge withheld until Ops approves the uploaded document).
      enum: [identity, tenant, owner]
    ShareIntent:
      type: string
      description: >
        How the seeker intends to take a per-room-priced room — `solo` (alone), `bring` (with
        someone they already know, two people) or `match` (they want PuneNest to find them a
        room-sharer). Sets the opening message and tells the host how many people are moving in.
      enum: [solo, bring, match]
      default: solo
    FlatmateMoveIn:
      type: string
      description: >
        Move-in availability — the literal `now`, a legacy bucket of days (`15` | `30` | `60`),
        or an ISO-8601 date from the picker.
      example: '2026-08-15'
    FlatmateModStatus:
      type: string
      description: >
        Admin moderation state.


        `pending` is where every newly written post, room and group starts (D72) — visible to its
        author, to nobody else. It is not an accusation; it means only that nobody has looked yet.
        The public feeds match on a whitelist (`live`, `approved`), so a state nobody thought about
        stays invisible rather than leaking.


        Rows written before D72 carry `live`: they were published under the rule in force at the
        time and were not retroactively pulled into the queue.
      enum: [pending, live, approved, flagged, removed, rejected]
      default: pending
    FlatmateModerationQueueItem:
      type: object
      description: >
        One row of the flatmate moderation queue (D72). One shape for all three boards: a seeker
        post, a room and a group are stored and rendered differently, but a moderator asks each the
        same question — who wrote this, where do they say it is, and what did they type into the
        boxes nobody validated.


        `freeText` is the point of the screen; everything else is context. D72 exists because the
        free-text fields are where a broker who cannot publish a phone number in the contact field
        puts one instead, so a queue showing only a headline and a price would pass through exactly
        the abuse it was built to stop.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [post, room, group], description: Which board this came from. }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        authorId: { type: string, format: uuid }
        authorName: { type: [string, 'null'] }
        headline:
          type: [string, 'null']
          description: >
            The strongest short label the row has — the seeker's name, the society and flat, or the
            group title.
        locality: { type: [string, 'null'] }
        freeText:
          type: [string, 'null']
          description: Everything the author typed that nobody validated. Read this one.
        createdAt: { type: string, format: date-time }
    FlatmateSeekerPost:
      type: object
      description: >
        A person looking for flatmates who has **no address yet** — the `team-up` feed.
        One live post per identity (matched on mobile, then name).
      properties:
        id: { type: string, example: s1 }
        name: { type: string }
        gender: { type: string, enum: [any, male, female] }
        age: { type: [integer, 'null'], minimum: 18 }
        occupation: { type: string, example: UX Designer }
        budget: { $ref: '#/components/schemas/Money' }
        localities:
          type: array
          description: Pune localities the seeker will consider (canonical registry names).
          items: { type: string }
          example: [Baner, Balewadi]
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], description: Who they want to share the flat with. }
        roomPref: { type: string, enum: [any, private, shared] }
        tags:
          type: array
          description: Lifestyle habits; also the `habits` filter vocabulary.
          items: { type: string }
          example: [Vegetarian, Non-smoker]
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false, description: Seeker-side of ADR-019 — only badged callers may express interest. }
        verified: { type: boolean, description: Mirrors the seeker's DigiLocker L2 badge at post time (ADR-009a). }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        mobile: { $ref: '#/components/schemas/Mobile' }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        createdAt: { type: string, format: date-time }
    FlatmateSeekerPostCreate:
      type: object
      required: [name, budget, localities]
      properties:
        name: { type: string }
        gender: { type: string, enum: [any, male, female], default: female }
        age: { type: integer, minimum: 18 }
        occupation: { type: string }
        budget: { $ref: '#/components/schemas/Money' }
        localities: { type: array, minItems: 1, items: { type: string } }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], default: any }
        roomPref: { type: string, enum: [any, private, shared], default: any }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false }
    FlatmateSaveKey:
      type: object
      description: >
        One entry in the caller's flatmate shortlist, as a key rather than a card. `GET
        /me/flatmate-saves/keys` answers with these; `GET /me/flatmate-saves` answers the other
        question with full projections.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [room, group, post]
          description: Which collection `id` belongs to.
        id: { type: string, format: uuid }
    FlatmateRoomFeed:
      type: object
      description: >
        The card-sized projection of a room — what every anonymous read returns (`GET
        /flatmates/rooms`, `GET /flatmates/feed`, `GET /properties/{propId}/rooms`). It carries
        exactly what a card, a filter, the map and the client-side flat ledger consume; the eight
        fields `FlatmateRoom` adds on top are host-facing and no public reader touches them.
        Notably absent is `ownerMobile`: an anonymous room read has no field to put a number in,
        so the contact rule is structural rather than conventional.
      properties:
        id: { type: string, example: rm7 }
        type: { type: string, enum: [flatmate] }
        propertyId: { type: [string, 'null'], description: Parent rent listing when this room came from a flat split — the key that ties sibling rooms into one occupancy ledger and one joint agreement. }
        roomKind: { $ref: '#/components/schemas/RoomKind' }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared], description: Derived from `roomKind` on split rooms (master implies attached); asked explicitly on single-room posts. }
        priceBasis: { $ref: '#/components/schemas/PriceBasis' }
        budget: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        occupancy: { $ref: '#/components/schemas/Occupancy' }
        occupants: { type: integer, minimum: 0, maximum: 3, description: People actually living in THIS room. Emergent — tenants decide, the owner only records it. }
        maxOccupants: { type: integer, minimum: 1, default: 3, description: How many people may live in the whole FLAT (the society's rule) — the only ceiling the owner declares. }
        flatCommitted: { type: integer, readOnly: true, description: Derived — people moved into this flat across every sibling room. }
        flatMax: { type: [integer, 'null'], readOnly: true }
        shareMax: { type: integer, readOnly: true, minimum: 1, maximum: 3, description: 'Derived — the most people who could still take this room: min(3 - occupants, flatMax - flatCommitted). Always 1 when priceBasis is `person`.' }
        seatsTotal: { type: integer, minimum: 1, description: Seat model, used by single spare-room posts instead of the occupancy ledger. }
        seatsOpen: { type: integer, minimum: 0 }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        verified: { type: boolean, description: The Verified pill — for split rooms it tracks the PARENT listing's Ops approval, so it can never appear on a flat nobody has checked. }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted; `pending` withholds the tier badge and says so, `approved` grants it. Distinct from `verified`, which is the listing own approval rather than the host.' }
        society: { type: string }
        flatNumber: { type: string }
        locality: { type: string }
        localities: { type: array, items: { type: string } }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        bhk: { type: string, enum: ['1', '2', '3', '4'], description: "'4' means 4+." }
        flatType: { type: string, example: 3 BHK }
        homeTypeLabel: { type: string, example: Flat }
        gatedCommunity: { type: boolean }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        gender: { type: string, enum: [any, male, female] }
        food: { type: string, enum: [any, veg, nonveg] }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        owner: { type: string }
        createdAt: { type: string, format: date-time }
    FlatmateRoom:
      type: object
      description: >
        A room offered inside a real flat — the `move-in` feed. Created either by the
        list-property flatmate flow (one spare room, seat-based) or by an owner splitting a
        whole rent listing room by room (occupancy-based, `POST /properties/{propId}/split`).


        The host-facing shape: every property of `FlatmateRoomFeed` plus the eight only the host's
        own view of a room needs — their number, the anti-broker forensics, and the fields no public
        reader consumes. Returned by the write endpoints (`POST /flatmates/rooms`, the two PATCHes)
        and by `POST /properties/{propId}/split`.


        Stated in full rather than as `allOf: [FlatmateRoomFeed, …]`: `SpecSchemaParityTest` only
        unwraps the paged `allOf`, and returns null for any other composition rather than guess. An
        `allOf` here would therefore drop all four of those operations out of parity checking
        silently — the schema would read better and be checked less. The two schemas cannot drift
        apart regardless, because parity pins each one to its record in both directions and
        `FlatmateRoomShapeTest` pins the records to each other.
      properties:
        id: { type: string, example: rm7 }
        type: { type: string, enum: [flatmate] }
        propertyId: { type: [string, 'null'], description: Parent rent listing when this room came from a flat split — the key that ties sibling rooms into one occupancy ledger and one joint agreement. }
        roomKind: { $ref: '#/components/schemas/RoomKind' }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared], description: Derived from `roomKind` on split rooms (master implies attached); asked explicitly on single-room posts. }
        priceBasis: { $ref: '#/components/schemas/PriceBasis' }
        budget: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        occupancy: { $ref: '#/components/schemas/Occupancy' }
        occupants: { type: integer, minimum: 0, maximum: 3, description: People actually living in THIS room. Emergent — tenants decide, the owner only records it. }
        maxOccupants: { type: integer, minimum: 1, default: 3, description: How many people may live in the whole FLAT (the society's rule) — the only ceiling the owner declares. }
        flatCommitted: { type: integer, readOnly: true, description: Derived — people moved into this flat across every sibling room. }
        flatMax: { type: [integer, 'null'], readOnly: true }
        shareMax: { type: integer, readOnly: true, minimum: 1, maximum: 3, description: 'Derived — the most people who could still take this room: min(3 - occupants, flatMax - flatCommitted). Always 1 when priceBasis is `person`.' }
        seatsTotal: { type: integer, minimum: 1, description: Seat model, used by single spare-room posts instead of the occupancy ledger. }
        seatsOpen: { type: integer, minimum: 0 }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        verified: { type: boolean, description: The Verified pill — for split rooms it tracks the PARENT listing's Ops approval, so it can never appear on a flat nobody has checked. }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted.' }
        agreementDeclared: { type: boolean }
        addressFingerprint: { type: string, description: Stable key for one physical flat, used to detect two hosts claiming the same address. }
        flagForReview: { type: boolean }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        society: { type: string }
        societyId: { type: string }
        flatNumber: { type: string }
        locality: { type: string }
        localities: { type: array, items: { type: string } }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        bhk: { type: string, enum: ['1', '2', '3', '4'], description: "'4' means 4+." }
        flatType: { type: string, example: 3 BHK }
        homeTypeLabel: { type: string, example: Flat }
        gatedCommunity: { type: boolean }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        availableFrom: { type: string, format: date }
        gender: { type: string, enum: [any, male, female] }
        food: { type: string, enum: [any, veg, nonveg] }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        photos: { type: array, items: { type: string, format: uri } }
        owner: { type: string }
        ownerMobile: { $ref: '#/components/schemas/Mobile' }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        createdAt: { type: string, format: date-time }
    FlatmateRoomCreate:
      type: object
      required: [bhk, roomType, locality, society, rentShare, availableFrom, photos]
      description: Single spare-room post from the list-property flatmate flow. The required set mirrors `submitFlatmate` validation.
      properties:
        bhk: { type: string, enum: ['1', '2', '3', '4'] }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared] }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        locality: { type: string }
        societyId: { type: string }
        society: { type: string }
        rentShare: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        availableFrom: { type: string, format: date }
        lookingFor: { type: string, enum: [any, male, female] }
        foodPref: { type: string, enum: [any, veg, nonveg] }
        lifestyle: { type: array, items: { type: string } }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        agreementDeclared: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        ownerConsentMobile: { $ref: '#/components/schemas/Mobile' }
        photos: { type: array, minItems: 1, items: { type: string, format: uri } }
        note: { type: string, maxLength: 600 }
    FlatmateGroup:
      type: object
      description: >
        People teaming up. A group with an address (`propertyId` / `society`) sorts into
        `move-in`; an address-less group is a set of people still hunting and sorts into `team-up`.
      properties:
        id: { type: string, example: g1 }
        title: { type: string }
        locality: { type: string }
        policy: { type: string, enum: [any, women, men], description: '`any` means open-join — a request is auto-accepted.' }
        rent: { $ref: '#/components/schemas/Money', description: Whole-flat rent. }
        perHead: { $ref: '#/components/schemas/Money', description: 'Server-computed rent / seatsTotal (falling back to whole rent when seatsTotal is 0, so a client never divides by zero). Sent rather than derived because every surface that shows a group shows this number, and one rounding rule beats five.' }
        seatsTotal: { type: integer, minimum: 1 }
        seatsOpen: { type: integer, minimum: 0, description: Seats open right now — the honest count for a tenant backfilling one seat. Legacy groups omit it and fall back to seatsTotal minus members. }
        members:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: 'Omitted when this member has not given a name — an OTP account has none until its profile is filled in. Render a placeholder; do not invent one, and do not treat the absence as an error.' }
              initials: { type: string, maxLength: 2, description: Omitted with `name`, since there is nothing to take initials from. }
              verified: { type: boolean }
        propertyId: { type: [string, 'null'] }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        agreementDeclared: { type: boolean }
        ownerConsent: { type: boolean, description: True once the flat's owner confirmed the replacement search via OTP — turning "trust me" into an auditable consent record. }
        ownerConsentMobile: { $ref: '#/components/schemas/Mobile' }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted.' }
        addressFingerprint: { type: string }
        flagForReview: { type: boolean }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        ownerName: { type: string }
        ownerMobile: { $ref: '#/components/schemas/Mobile' }
        createdAt: { type: string, format: date-time }
    FlatmateGroupFeed:
      type: object
      description: >
        The card projection of a group, and what every anonymous read returns. Written out in full
        rather than as an `allOf` of FlatmateGroup for the same reason FlatmateRoomFeed is: a
        subtractive relationship cannot be expressed in JSON Schema, so an `allOf` would claim the
        card carries the host-only fields it exists to withhold. Absent here on purpose:
        `ownerConsentMobile` (a third party's number), `addressFingerprint` and `flagForReview`
        (anti-broker forensics the client only writes), `modStatus` (the moderation verdict — every
        producer of this shape already filters to the cleared statuses, so it could only say "this
        one passed") and `ownerMobile` (reached by expressing interest, never by browsing).
        `ownerConsent` stays as the boolean the card actually renders.
      properties:
        id: { type: string, example: g1 }
        title: { type: string }
        locality: { type: string }
        policy: { type: string, enum: [any, women, men], description: '`any` means open-join — a request is auto-accepted.' }
        rent: { $ref: '#/components/schemas/Money', description: Whole-flat rent. }
        perHead: { $ref: '#/components/schemas/Money', description: 'Server-computed rent / seatsTotal (falling back to whole rent when seatsTotal is 0, so a client never divides by zero).' }
        seatsTotal: { type: integer, minimum: 1 }
        seatsOpen: { type: integer, minimum: 0, description: Seats open right now — the honest count for a tenant backfilling one seat. Legacy groups omit it and fall back to seatsTotal minus members. }
        members:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: 'Omitted when this member has not given a name — an OTP account has none until its profile is filled in. Render a placeholder; do not invent one, and do not treat the absence as an error.' }
              initials: { type: string, maxLength: 2, description: Omitted with `name`, since there is nothing to take initials from. }
              verified: { type: boolean }
        propertyId: { type: [string, 'null'] }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        agreementDeclared: { type: boolean }
        ownerConsent: { type: boolean, description: True once the flat's owner confirmed the replacement search via OTP — turning "trust me" into an auditable consent record. The fact is public; the number behind it is not. }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted; `pending` withholds the tier badge and says so, `approved` grants it and lets the group survive the Verified-only filter.' }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
    FlatmateGroupCreate:
      type: object
      required: [title, rent, name]
      properties:
        title: { type: string }
        locality: { type: string, default: Baner }
        policy: { type: string, enum: [any, women, men], default: women }
        rent: { $ref: '#/components/schemas/Money' }
        seats: { type: integer, minimum: 1, default: 2 }
        seatsOpen: { type: integer, minimum: 1, default: 1 }
        name: { type: string, description: The creator's display name — becomes the first member. }
        role: { $ref: '#/components/schemas/HostRole' }
        propertyId: { type: string, description: Only honoured when role is `owner`; must be an Ops-approved listing to earn the owner tier. }
        agreement: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        consentMobile: { $ref: '#/components/schemas/Mobile' }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
    AgreementDoc:
      type: object
      description: >
        A tenant's uploaded rent agreement — the artifact Ops verifies. Images and PDFs only.
        Files over 3 MB are recorded present-but-not-stored so Ops can still ask for the original.
      properties:
        name: { type: string, maxLength: 200 }
        size: { type: integer, minimum: 0 }
        mime: { type: string, enum: ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'] }
        url: { type: [string, 'null'], format: uri }
        tooLarge: { type: boolean, default: false }
    FlatSplitRequest:
      type: object
      required: [maxOccupants, rooms]
      description: >
        Split an existing **rent** listing into per-room supply. The whole-flat listing keeps
        existing, so the share market never cannibalises core rental inventory.
      properties:
        maxOccupants:
          type: integer
          description: 'People allowed in the whole flat. Must sit in [roomCount, roomCount x 3].'
          minimum: 1
        rooms:
          type: array
          minItems: 1
          description: 'Lettable rooms = bedrooms + hall. Max is bhk + 1; unbounded when bhk is "4" (meaning 4+), so only the flat cap binds.'
          items:
            type: object
            required: [roomKind, rent]
            properties:
              roomKind: { $ref: '#/components/schemas/RoomKind' }
              rent: { $ref: '#/components/schemas/Money' }
              deposit: { $ref: '#/components/schemas/Money', description: Defaults to 2x rent when omitted. }
              note: { type: string, maxLength: 600 }
    FlatSplitResult:
      type: object
      properties:
        count: { type: integer }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        pending: { type: boolean, description: True when the parent listing is not yet Ops-approved, so the rooms start unbadged. }
        flagged: { type: boolean, description: True when a different host already claimed this address. }
        rooms: { type: array, items: { $ref: '#/components/schemas/FlatmateRoom' } }
    FlatmateInterestCreate:
      type: object
      description: Express interest in a seeker, a room or a group.
      properties:
        share: { $ref: '#/components/schemas/ShareIntent', description: Rooms only — how many people are moving in. }
        message: { type: string, maxLength: 4000, description: Optional override; the server generates a share-intent-appropriate opener when absent. }
    FlatmateRequest:
      type: object
      description: >
        Host-facing inbox record. The seeker-side interest map is device-local; this is what the
        HOST sees in Dashboard -> Requests. Deduped by requester + target.
      properties:
        id: { type: string }
        kind: { type: string, enum: [flatmate, room, group] }
        action: { type: string, enum: [request, join], description: '`request` needs host approval; `join` is an open-policy group (already joined, informational).' }
        share: { $ref: '#/components/schemas/ShareIntent' }
        targetId: { type: string }
        targetTitle: { type: string }
        locality: { type: string }
        requesterName: { type: string }
        requesterMobile: { $ref: '#/components/schemas/Mobile' }
        status: { type: string, enum: [pending, accepted, declined] }
        requestedAt: { type: string, format: date-time }
        message: { type: [string, 'null'], description: "The requester's note to the host, written when the request was made." }
        decidedAt: { type: [string, 'null'], format: date-time }
    FlatmateReview:
      type: object
      description: >
        Ops agreement-review queue item. A tenant's "I have a registered rent agreement" is
        self-declared, so tenant-tier posts — plus any address a different host already claimed and
        any flat split whose parent listing is still pending — land here before the post earns a
        badge. One review per group, and one per flat (not per room).
      properties:
        id: { type: string }
        kind: { type: string, enum: [room, group] }
        roomId: { type: [string, 'null'] }
        groupId: { type: [string, 'null'] }
        host: { type: string }
        hostMobile: { $ref: '#/components/schemas/Mobile' }
        address: { type: string }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        flagForReview: { type: boolean, description: Contested address — a DIFFERENT host already claimed it. Fuzzy match, so flag-not-block. }
        ownerConsent: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string, description: Required on reject; shown to the host. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FlatmateAlertCriteria:
      type: object
      description: >
        A flatmates saved-search. Only records filters the active tab actually honours, mirroring
        the tab-gated FilterBar, so a stale value never rides along invisibly.
      properties:
        tab: { $ref: '#/components/schemas/FlatmateTab' }
        q: { type: string }
        locality: { type: string }
        budget: { $ref: '#/components/schemas/Money', description: Omitted when the slider sits at its 40000 "Any" sentinel. }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        gender: { type: string, enum: [male, female] }
        sharing: { type: string, description: '`team-up` only — group size.' }
        attachedBath: { type: boolean, description: '`move-in` only.' }
        verifiedOnly: { type: boolean }
        habits: { type: array, items: { type: string } }
        label: { type: string, readOnly: true, description: Short human summary, e.g. 'Move in now · Baner · Verified'. }
    GroupApplication:
      type: object
      description: A flatmate group applying to an owner's listing. Carries two independent statuses — the owner's decision and admin moderation.
      properties:
        id: { type: string }
        listingId: { type: string }
        listingTitle: { type: string }
        locality: { type: string }
        rent: { $ref: '#/components/schemas/Money' }
        perHead: { $ref: '#/components/schemas/Money' }
        groupTitle: { type: string }
        applicantName: { type: string }
        members: { type: integer }
        seatsTotal: { type: integer }
        status: { type: string, enum: [pending, accepted, declined], description: The OWNER's decision. Admin may never write this. }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        at: { type: string, format: date-time }
    HostEligibility:
      type: object
      description: >
        Anti-broker guardrails, evaluated on every supply-side create (room post, group, flat split).
        A hard block (cap hit, or the same host re-claiming an address) refuses the post; a soft flag
        (a different host already claimed it) still posts but routes to Ops.
      properties:
        blocked: { type: boolean }
        overCap: { type: boolean, description: True at 3 live non-owner-tier posts per identity. Owner-tier posts are exempt from the count but never from the dedupe. }
        duplicate: { type: boolean }
        flagForReview: { type: boolean }
        fingerprint: { type: string }
        reason: { type: string }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, description: 'Dotted domain event (e.g. `offer.received`) or a coarse surface tag: `share` (flatmates), `listing`, `service`.', example: offer.received }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: string }
        createdAt: { type: string, format: date-time }
    QuietHours:
      type: object
      description: |
        A do-not-disturb window as two 24-hour `HH:mm` wall-clock labels -- exactly what
        `<input type="time">` emits and what the browser has always stored.

        The window MAY wrap past midnight; the default (22:00-07:00) does. `start == end` means
        "never", not "always" -- zero minutes and 1,440 minutes are the same pair of labels, and
        reading it the other way would mute a user permanently for dragging two sliders together.

        **Timezone.** The labels are reckoned in Asia/Kolkata. This platform has no per-user
        timezone -- `users` carries a city and nothing more -- so a user outside India would be
        quieted at IST-equivalent local times. Recorded here as an assumption rather than left
        implicit; a per-user zone is a new column and a new control, not a change to this schema.
      properties:
        enabled: { type: boolean }
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '07:00' }
    NotificationPreferences:
      type: object
      description: |
        How the platform is allowed to reach this user. Absent settings resolve to the values below,
        which are the browser's long-standing defaults: an account that has never opened Settings
        behaves exactly as it always has, and never as "everything muted".

        What the server acts on TODAY:
        * `quietHours` -- a notification written inside the window is **deferred**, never dropped.
          It is stored with its real timestamp and becomes visible when the window closes. The inbox
          is the only place a notification is ever read, so suppressing one would permanently lose an
          event (an offer, a moderation verdict) the user never asked to lose.
        * `matchAlerts` -- the master switch for proactive saved-search/price alerts, which ARE
          dropped when it is off (there is no later moment at which the user wants one). It does not
          silence events the user is a party to; an offer on your listing is not an alert you opted
          into.

        What is stored and returned but NOT yet acted on: `email`, `sms`, `whatsapp` and `language`.
        Nothing on the server sends email, SMS or WhatsApp -- delivery today is the in-app inbox and
        nothing else -- so there is no sender for these to gate. Gating the in-app row on a switch
        labelled "Email" would be worse than not gating it. They are persisted so the first real
        channel sender inherits an answer instead of a migration.
      properties:
        email: { type: boolean, default: true }
        sms: { type: boolean, default: false }
        whatsapp: { type: boolean, default: true }
        matchAlerts: { type: boolean, default: true }
        quietHours: { $ref: '#/components/schemas/QuietHours' }
        language: { type: string, enum: [en, hi, mr], default: en }
    NotificationPreferencesUpdate:
      type: object
      description: >
        The whole document. Every field is required -- see the operation description for why an
        omission is a 400 rather than a keep or a reset.
      required: [email, sms, whatsapp, matchAlerts, quietHours, language]
      properties:
        email: { type: boolean }
        sms: { type: boolean }
        whatsapp: { type: boolean }
        matchAlerts: { type: boolean }
        quietHours:
          type: object
          required: [enabled, start, end]
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
            end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '07:00' }
        language: { type: string, enum: [en, hi, mr] }
    OwnerProfile:
      type: object
      description: >
        A ceiling, not a projection of convenience. The profile page used to be handed the entire
        user row — email, where they operate, how long they have been here — so every field here is
        one somebody decided a stranger may see, and the absent ones are absent on purpose.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        verified:
          type: boolean
          description: The person has passed identity verification (Aadhaar/DigiLocker).
        city: { type: [string, 'null'] }
        memberSince:
          type: [integer, 'null']
          example: 2024
          description: >
            The *year* they joined, or null if unrecorded. A year, not a date: "on the platform
            since 2024" is the trust signal, and a precise join date is an account fact rather than
            a public one.
        listingCount:
          type: integer
          minimum: 0
          description: How many live listings they currently hold.
    TrustStats:
      type: object
      description: >
        Every field is a plain integer and zero is a real answer — an empty slice is a slice, not a
        missing one, so nothing here is ever null.
      required: [verifiedListings, totalListings, verifiedOwners]
      properties:
        verifiedListings: { type: integer, minimum: 0 }
        totalListings: { type: integer, minimum: 0 }
        verifiedOwners:
          type: integer
          minimum: 0
          description: >
            Distinct owners, counted by the database. Counting rows client-side made two listings
            from one owner read as two verified owners.
    MovePackConfig:
      type: object
      description: >
        Whether the Move-in Pack is on sale, and for how much.


        `items` is an open map rather than a record of named prices because the pack's contents are
        a merchandising decision — movers, cleaning, an agreement, paint, a verification, broadband
        today, something else next quarter. Naming them here would make adding a line item a deploy.


        Prices are **whole rupees**, like every other money value in this contract. There are no
        paise anywhere on this platform. Entries whose value is not a non-negative integer are
        omitted rather than forwarded or clamped: clamping would invent a number, and the page
        treats a missing item as one it cannot sell yet, which is the honest reading of a price
        nobody has validly set.
      required: [enabled, items]
      properties:
        enabled:
          type: boolean
          description: >
            Whether the pack is on sale. `false` puts the page in coming-soon mode — prices hidden,
            waitlist capture instead of booking. This is also the answer when the block is missing
            or malformed, deliberately: silence about a feature is a reasonable yes, silence about a
            price never is.
        items:
          type: object
          description: Price per pack line item in whole rupees, keyed by item slug. `{}` is a real answer.
          additionalProperties: { type: integer, minimum: 0 }
          example:
            movers: 8000
            clean: 2500
            agreement: 1500
            paint: 6000
            verify: 999
            internet: 500
    PlatformPricing:
      type: object
      description: >
        What PuneNest charges for its own products, as opposed to `Fees`, which is what a
        transaction costs and is mostly the state's money.


        Seven named fields rather than an open map, and the reason is the document they come out of:
        the same settings block also holds the free contact allowance, the referral bonus and the
        referral auto-qualify threshold, and that last one is the line past which a referral goes to
        the fraud desk. A projection of the block would publish it. This shape cannot, and neither
        can it publish the next key ops adds.


        Prices are **whole rupees** — there are no paise anywhere on this platform. The two
        percentages are decimals because they are multiplied by an amount rather than typed as one.
      required:
        - ownerPlanYearly
        - ownerProYearly
        - rentAgreementPlatform
        - seekerPlusTopup
        - featuredListing
        - gstPercent
        - rentPayPercent
      properties:
        ownerPlanYearly:
          type: integer
          minimum: 0
          description: Yearly price of the entry owner plan. `0` is a real answer — it is the free tier.
          example: 0
        ownerProYearly:
          type: integer
          minimum: 0
          description: Yearly price of the top owner plan.
          example: 4999
        rentAgreementPlatform:
          type: integer
          minimum: 0
          description: >
            The platform's share of a rent agreement. Stamp duty and registration are the state's,
            are computed per agreement from its own terms, and are quoted on `/fees` instead.
          example: 1999
        seekerPlusTopup:
          type: integer
          minimum: 0
          description: What a seeker pays to top up their owner-contact allowance.
          example: 299
        featuredListing:
          type: integer
          minimum: 0
          description: What an owner pays to feature one listing.
          example: 999
        gstPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Statutory GST on the convenience fee.
          example: 18
        rentPayPercent:
          type: number
          minimum: 0
          maximum: 100
          description: The convenience fee taken on a rent payment.
          example: 2
    SocietyAdminEdit:
      type: object
      description: >
        A correction to one society's facts. Every field is optional and an omitted field is left
        alone, because the four facts are corrected one at a time from different evidence and a full
        restatement would let a stale form revert the three the operator did not touch.


        `adminNote` is the exception that makes the rest work: an explicit `null` — or a blank
        string, which is what an emptied textarea sends — clears the note. Omission cannot express
        that, which is why the field is nullable rather than merely optional.
      properties:
        registration:
          type: boolean
          nullable: true
          description: Whether the society is registered.
        conveyance:
          type: boolean
          nullable: true
          description: Whether conveyance of the land to the society has been completed.
        maintenancePerSqft:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            Monthly maintenance in **rupees per square foot**, typically 1 to 8 in Pune. Capped
            because the adjacent mental model is the monthly bill, and a four-digit figure here is a
            units mistake rather than an expensive society.
          example: 3.5
        claimStatus:
          type: string
          nullable: true
          enum: [unclaimed, pending, claimed]
          description: >
            Where the society sits in the committee-claim flow. Editable here as well as from the
            claim desk on purpose: the desk moves it as evidence arrives, and this is the override
            for when the desk got it wrong.
        adminNote:
          type: string
          nullable: true
          description: >
            Free text for whoever reads this row next — why a fact was corrected, who confirmed it,
            what is still unverified. Never leaves the back office.
      example:
        conveyance: true
        maintenancePerSqft: 3.5
        adminNote: Conveyance deed seen 2026-08; registration number still unconfirmed.
    SocietyAdminView:
      type: object
      description: >
        A society as the back office sees it. Deliberately not `Society`: the public shape must
        never carry `adminNote`, and the way to guarantee that is for the two to be different types
        rather than for one of them to be filtered.
      required: [slug, name, registration, conveyance, claimStatus]
      properties:
        slug:
          type: string
          description: The society's public alias, and the handle this route is addressed by.
        name:
          type: string
        registration:
          type: boolean
        conveyance:
          type: boolean
        maintenancePerSqft:
          type: number
          nullable: true
          description: Rupees per square foot per month. Null when nobody has recorded one.
        claimStatus:
          type: string
          enum: [unclaimed, pending, claimed]
        adminNote:
          type: string
          nullable: true
          description: Null when there is no note. A cleared note is null, never an empty string.
    GeoPolicy:
      type: object
      description: >
        Map coverage and place-suppression policy.


        **Every field is an override.** The client ships a built-in centre and bounding box per city,
        and merges this document over them. City launch status is served separately by `GET /cities`.
        So an empty object is the correct answer for an install whose operator has never opened the
        Maps panel — not a broken one — and an unreachable server leaves the client on its defaults
        rather than on nothing.


        **Values that do not typecheck are dropped rather than forwarded**, as on `/flags` and
        `/move-pack`. The stored block is untyped and hand-editable, and a half-written bounding box
        passed through would be a response that disagrees with this schema.
      required: [cities, blacklist]
      properties:
        enforceCityLimit:
          type: boolean
          description: >
            Whether locality search is *restricted* to the active city's box rather than merely
            biased toward it. Absent when the operator has never set it; the client's default is on,
            because a search that can return an address in another state is worse than one that
            cannot find a legitimate fringe suburb.
        cities:
          type: object
          description: >
            Per-city overrides, keyed by the city name the client knows it by. Cities the operator
            has never touched are absent rather than echoed back at their defaults, so this map is
            usually much shorter than the city list. An entry with nothing set is omitted entirely.
          additionalProperties: { $ref: '#/components/schemas/GeoCityOverride' }
          example:
            Pune:
              center: { lat: 18.553, lng: 73.86 }
        blacklist:
          type: array
          description: >
            Places to hide from every suggestion box, newest first. `[]` is a real answer. Entries
            that could match nothing — no `placeId` and no term long enough for the client's matcher
            — are omitted, because they are inert on the client and a list whose whole purpose is to
            be matched against should not carry rows that never will be.
          items: { $ref: '#/components/schemas/GeoBlacklistEntry' }
    GeoCityOverride:
      type: object
      description: >
        One city's map overrides. Both are independently optional because the panel writes them
        independently: recentering a city and redrawing its box are separate edits, and an operator
        who did one has implied nothing about the other.
      properties:
        center:
          type: object
          description: >
            Map centre. Dropped as a unit when either coordinate is missing, not a number, not
            finite, or off the globe: half a point is not a point, and centring on a latitude and a
            zero lands the map in the sea off West Africa. Out-of-range values are dropped rather
            than clamped — clamping 200 to 90 invents a place at the North Pole that looks
            deliberate. Absent falls back to the built-in centre, which is a place.
          required: [lat, lng]
          properties:
            lat: { type: number, format: double, minimum: -90, maximum: 90 }
            lng: { type: number, format: double, minimum: -180, maximum: 180 }
        bounds:
          type: object
          description: >
            Coverage box, in the north/south/east/west vocabulary the Places request takes. Dropped
            as a unit when any edge is missing, not a number or off the globe, and it matters more
            than `center` does: with the city limit on, the client turns these into a hard
            `locationRestriction`, and a box missing its south edge is not a smaller box but a fence
            with a gap.


            Also dropped when the box is inverted — `north` at or below `south`, or `east` at or
            below `west`. Such a box encloses nothing, so every candidate is refused and the
            suggestion box for that city goes permanently and silently empty. Absent hands the city
            back its built-in bounds, which enclose the city.
          required: [north, south, east, west]
          properties:
            north: { type: number, format: double, minimum: -90, maximum: 90 }
            south: { type: number, format: double, minimum: -90, maximum: 90 }
            east: { type: number, format: double, minimum: -180, maximum: 180 }
            west: { type: number, format: double, minimum: -180, maximum: 180 }
    GeoBlacklistEntry:
      type: object
      description: >
        One blacklisted place. At least one of `placeId` and `term` is always present — an entry
        that can match nothing is not published.


        **The operator's reason is deliberately not on this schema.** Each stored entry carries a
        free-text note, which is moderator prose about a named building written when staff were the
        readers. The matcher has never consumed it, so it is withheld from this anonymous route and
        served only on `GET /admin/settings`.
      properties:
        id:
          type: string
          description: The entry's identifier, so a client can key a list without inventing a heuristic.
        placeId:
          type: string
          description: >
            Google place id, when the entry was picked from a search rather than typed. Matched
            exactly, which is why the panel recommends picking.
        term:
          type: string
          minLength: 2
          description: >
            Name to match as a case-insensitive substring, when the entry was typed. Never shorter
            than two characters — the client refuses to test below that, since one character matches
            most of Pune.
    ServiceWaitlistJoin:
      type: object
      description: >
        `name` is optional and `mobile` is not — the opposite way round from most forms, because the
        number is the only thing ops can act on and a name without one is a row nobody can use.
      required: [service, mobile]
      properties:
        service:
          type: string
          maxLength: 40
          description: >
            A slug from the server's waitlist vocabulary. Rejected with a 400 naming the value rather
            than silently filed under a default, so a client typo does not become a queue nobody
            reads.
        name:
          type: string
          maxLength: 120
          description: What to call them, if they said. Trimmed and capped; blank becomes a fixed placeholder.
        mobile: { $ref: '#/components/schemas/Mobile' }
    ContentTranslations:
      type: object
      description: >
        Editor-written translations, keyed language then wire field name (D2) — e.g.
        `{ "mr": { "question": "...", "answer": "..." } }`. Two levels, strings at the leaves, and
        nothing else: the shape is fixed rather than free-form so a nested array or a number is
        refused at deserialisation instead of failing later at the point somebody tried to render it.
        Only the fields an editor actually translated are present, and only the languages they
        translated into; a client falls back to the top-level field for anything missing. Empty
        rather than absent when nothing is translated, so "this row has no translations" and "this
        row predates translations" stay the same fact.
      additionalProperties:
        type: object
        additionalProperties: { type: string }
    Announcement:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, success, warning] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        translations: { $ref: '#/components/schemas/ContentTranslations' }
    CmsService:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        link: { type: string }
        translations: { $ref: '#/components/schemas/ContentTranslations' }
    Faq:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        translations: { $ref: '#/components/schemas/ContentTranslations' }
    Banner:
      type: object
      properties:
        id: { type: string }
        image: { type: string, format: uri }
        link: { type: string }
        headline: { type: string }
        position: { type: integer }
        translations: { $ref: '#/components/schemas/ContentTranslations' }

    # ---- Admin & Analytics ----
    AdminKpis:
      type: object
      description: >
        The ops scorecard. Counts exclude soft-deleted rows. `pendingModeration` is listings
        awaiting a moderation decision (`status=pending`); the abuse-report queue is counted
        separately as `openReports` and is deliberately not folded in - the two queues are worked
        by different people against different SLAs, so one combined number would be a figure
        neither desk could act on.
      properties:
        totalListings: { type: integer }
        activeListings: { type: integer }
        pendingModeration: { type: integer }
        openReports:
          type: integer
          description: >
            D68. Abuse reports still awaiting a decision (`open` or `reviewing`). A claimed but
            undecided report still counts as outstanding work, because it is.
        totalUsers: { type: integer }
        newUsers7d: { type: integer }
        dealsClosed30d: { type: integer }
        revenue30d:
          # 3.1 spelling of a nullable $ref. `nullable: true` alongside an `allOf` was the 3.0
          # idiom; in 3.1 that keyword does not exist, so it said nothing and this field read as
          # non-nullable. A type array cannot express it either — the null has to be a branch.
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
          # S61: this endpoint is x-roles [staff, admin] but /admin/finance is [admin] only,
          # so serving staff a revenue figure here contradicts the very next operation. Null for
          # staff, populated for admin - ops keeps its scorecard without being handed the one
          # number the contract says it must not see.
          description: Platform revenue over the last 30 days. **Null for staff** - admin only.
    AnalyticsPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
    AdminAnalyticsTraffic:
      type: object
      description: Arrivals for one window, from PuneNest's own page-view table.
      properties:
        days: { type: integer, description: 'The window actually used, echoed so a clamped request is visible' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        series:
          type: array
          description: One row per day.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              sessions: { type: integer }
              pageviews: { type: integer }
              signups: { type: integer }
        sources:
          type: array
          description: >
            Channels derived from the referrer host. `direct` is honest about being a residue --
            it holds app switches, pasted links and stripped referrers as well as typed URLs.
          items:
            type: object
            properties:
              channel: { type: string, example: direct }
              sessions: { type: integer }
              sharePct: { type: number }
        devices:
          type: object
          description: Session counts by device bucket. Three buckets, because that is all the beacon reports.
          properties:
            mobile: { type: integer }
            tablet: { type: integer }
            desktop: { type: integer }
        identity:
          type: array
          description: Anonymous against signed-in sessions by week -- the split the funnel turns on.
          items:
            type: object
            properties:
              week: { type: string, format: date, description: Week-starting date }
              anonymous: { type: integer }
              signedIn: { type: integer }
    AdminAnalyticsEngagement:
      type: object
      description: How deep the visits went, for one window.
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        weeks:
          type: array
          items:
            type: object
            properties:
              week: { type: string, format: date }
              sessions: { type: integer }
              avgSessionMinutes:
                type: [number, 'null']
                description: >
                  **Null, never zero, when there were too few sessions to average honestly.** A
                  zero here would draw a line reading "engagement collapsed" for a week in which
                  nobody visited, and somebody would act on it.
              bounceRatePct:
                type: [number, 'null']
                description: Null on the same terms as `avgSessionMinutes`, and for the same reason.
        topPages:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              views: { type: integer }
              anonViews:
                type: integer
                description: >
                  Beside the total rather than folded into it: a page only signed-in users reach
                  and a page anonymous users bounce off are different problems with the same count.
    AdminAnalyticsSurfers:
      type: object
      description: The anonymous-to-signed-in funnel for one window.
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalSessions: { type: integer }
        anonSessions: { type: integer }
        signedInSessions: { type: integer }
        signups: { type: integer }
        anonSharePct: { type: number }
        conversionRatePct: { type: number }
        weeks:
          type: array
          description: The trend behind the two headline percentages.
          items:
            type: object
            properties:
              week: { type: string, format: date }
              anonymous: { type: integer }
              signedIn: { type: integer }
        pages:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              views: { type: integer }
              anonViews: { type: integer }
        dropOff:
          type: array
          description: >
            Where sessions end. The actionable half of the report -- an exit from the signup screen
            is a funnel problem, an exit from a listing detail page usually is not.
          items:
            type: object
            properties:
              path: { type: string }
              exits: { type: integer }
              sharePct: { type: number }
    PricingInsightRow:
      type: object
      description: One locality's asking prices against the rate PuneNest publishes for it.
      properties:
        slug: { type: string }
        name: { type: string }
        marketRatePerSqft:
          type: [number, 'null']
          description: The curated figure the platform publishes. Null for a locality nobody has rated yet.
        avgActualRatePerSqft:
          type: [number, 'null']
          description: >
            What live listings actually average. The gap against `marketRatePerSqft` is the point of
            the report: where they have separated, the curated number is misleading buyers.
        avgRent: { type: [number, 'null'] }
        rentalYieldPct: { type: [number, 'null'] }
        buyCount: { type: integer }
        rentCount: { type: integer }
        totalListings: { type: integer }
        demand: { type: [number, 'null'], description: 'Demand signal for the locality, for reading the price gap against interest' }
    SlaSummary:
      type: object
      description: >
        Moderation turnaround against the promised target. Nulls are serialised rather than omitted:
        a window with nothing reviewed must be able to say "no data", and an absent key is
        indistinguishable from a key the client forgot to read.
      properties:
        targetHours: { type: integer, description: The turnaround the platform promises owners }
        reviewedCount: { type: integer }
        avgHoursToReview: { type: [number, 'null'] }
        medianHoursToReview:
          type: [number, 'null']
          description: >
            Beside the mean, because one listing left for a fortnight drags the average past target
            while most owners were served within the hour -- and acting on that average would be
            acting on the wrong problem.
        breachedCount: { type: integer }
        slaRatePct: { type: [number, 'null'], description: Share of reviewed listings that met the target }
        pendingCount: { type: integer }
        pendingBreachingCount:
          type: integer
          description: Still waiting and already past target -- owners currently being let down.
        worstPending:
          type: array
          description: The longest-waiting listings, named so somebody can pick one up.
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              hoursWaiting: { type: number }
        ticketPickup:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            How long a service request waits before a named person owns it. Measured from the first
            audit row that set an assignee, not from `tickets.assignee_id` -- that column holds the
            *current* owner, so a ticket picked up within the hour and later handed back to the pool
            reads as never picked up at all.
        ticketDelivery:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            Creation to the first `resolved` or `closed`. Both count: a desk that closes a request
            without resolving it has finished with it, and recognising only `resolved` would leave
            those outstanding for ever.
        conciergeToLive:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            A staff-posted listing's creation to the first status change that put it live --
            specifically to `approved`, not merely to the first decision. One bounced back for a
            missing document and approved a week later went live on the second row.
    SlaTrack:
      type: object
      description: >
        One turnaround measurement: how long a class of work took, how much of it is still waiting,
        and how that compares to the target. The same shape `SlaSummary`'s own top-level fields
        carry for listing review -- those stay flat because they were on the wire first, and
        renaming them to buy symmetry would break a screen to move a bracket.


        Nulls mean nothing has been completed, and are serialised for the reason the parent gives:
        `0` hours reads as instantaneous and `100` percent reads as a flawless record, and both are
        claims about a team that has done nothing yet.
      properties:
        targetHours:
          type: integer
          description: >
            The policy this track is judged against, served rather than assumed so that "breached"
            means the same thing on the server that computed it and on the screen that colours it.
        completedCount: { type: integer }
        avgHours: { type: [number, 'null'] }
        medianHours:
          type: [number, 'null']
          description: Beside the mean, for the reason `medianHoursToReview` gives.
        breachedCount: { type: integer }
        slaRatePct: { type: [number, 'null'] }
        outstandingCount:
          type: integer
          description: >
            Still waiting right now. Unwindowed, like `pendingCount`: a backlog is present tense,
            and a `?days=` filter would drop the oldest items -- the ones the figure exists for.
        outstandingBreachingCount: { type: integer }
    OwnerListingStanding:
      type: object
      description: How much listing allowance one phone number has left, for a post-on-behalf decision.
      properties:
        mobile: { type: string, description: 'Echoed back, so a mistyped digit is visible in the answer' }
        known: { type: boolean, description: Whether this number belongs to a PuneNest account at all }
        allowance: { type: integer, description: How many live listings this owner may hold }
        held: { type: integer, description: How many they hold now }
        overAllowance: { type: boolean, description: The single field the composer branches on }
    PageViewBatchCreate:
      type: object
      description: >
        A flush of everything one tab has seen since the last one. Batched rather than one request
        per view because `WriteRateLimitFilter` allows 120 mutating requests a minute per caller,
        shared with everything real the visitor does -- a per-view beacon's first casualty would be
        the enquiry they tried to send afterwards, refused with a 429 because telemetry had already
        spent the budget.
      required: [sessionId, events]
      properties:
        sessionId:
          type: string
          pattern: '[A-Za-z0-9_-]{8,64}'
          description: >
            An opaque tab-scoped token the client mints. **Format-constrained rather than merely
            length-bounded**: without a pattern this is a 64-character free-text field on an
            unauthenticated endpoint -- somewhere a careless client parks an email address and a
            hostile one parks anything at all. Token characters only means whatever arrives cannot
            be personal data even by accident.


            On the batch rather than on each event, because a flush comes from one tab and a tab is
            one session by construction.
        events:
          type: array
          minItems: 1
          maxItems: 50
          description: >
            The views, oldest first, though nothing depends on the order. Capped at 50 -- far above
            a real flush and far below a payload worth sending to be expensive.
          items:
            type: object
            required: [path, device, agoMs]
            properties:
              path: { type: string, maxLength: 200, description: 'The matched route pattern, not the visited URL -- no ids, no query string' }
              referrerHost: { type: [string, 'null'], maxLength: 120, description: Host only. A full referrer would carry the previous page's query string with it. }
              device: { type: string, enum: [mobile, tablet, desktop] }
              agoMs:
                type: integer
                minimum: 0
                description: >
                  How long before this flush the view happened. **Relative, not an absolute
                  timestamp, and that is the point.** A browser clock is routinely minutes out and
                  occasionally years out; day buckets are cut on IST, so a skewed clock files a view
                  under the wrong day rather than degrading gracefully, and a hostile client could
                  backdate a flood into any month it liked. An offset is anchored to the server's
                  clock on arrival, so the worst a wrong client manages is misreporting how long ago
                  something happened within its own flush.


                  Negative is rejected -- "in the future" is a broken or hostile client and saying
                  so is more useful than accepting it. Implausibly large is clamped rather than
                  rejected, because a tab left idle for hours and flushed on unload is a real
                  session that should be counted.
    DataExport:
      type: object
      description: >
        Everything PuneNest holds about one person, assembled in one call. The response describes
        itself on purpose: somebody exercising a subject-access right should not have to
        reverse-engineer a database schema to read the answer.
      properties:
        generatedAt: { type: string, format: date-time }
        subjectId: { type: string, description: The account this export is about }
        schemaVersion:
          type: integer
          description: >
            So a person who exports twice a year apart can tell whether the shape changed underneath
            them, rather than guessing from a diff.
        redactionRule:
          type: string
          description: >
            In plain words, how other people's identifiers were handled. An export of your enquiries
            necessarily touches the owners you contacted, and their phone numbers are not yours to
            receive -- stating the rule is the difference between a redaction and an omission.
        rowLimit: { type: integer, description: The per-dataset cap; `truncated` says where it bit }
        datasets:
          type: array
          items:
            type: object
            properties:
              domain: { type: string, example: listings }
              name: { type: string, example: enquiries }
              describes: { type: string, description: 'One sentence saying what these rows are, in plain words' }
              rowCount: { type: integer }
              truncated: { type: boolean, description: True when `rowLimit` cut the set -- a capped export is honest about being capped }
              withheld:
                type: object
                additionalProperties: { type: string }
                description: >
                  Column name to the reason it was removed. An export that silently dropped a column
                  would be a worse answer than one that names it.
              rows:
                type: array
                items: { type: object, additionalProperties: true }
        excluded:
          type: array
          description: Tables left out entirely, with reasons.
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
    DemandSignalCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [search, alert, view]
          description: >
            Which moment produced the signal. Constrained rather than free text: an unrecognised
            kind would be a row the report has to invent a weight for.
        localitySlug:
          type: string
          maxLength: 120
          description: >
            Where they were looking. Not a foreign key, and not required - a signal for a place the
            platform does not cover is the most valuable row this endpoint can produce, and a
            missing one still counts toward "people are searching".
        deal: { type: string, enum: [buy, rent] }
        bhk: { type: string, maxLength: 40, description: As typed in the filter, not normalised. }
        propertyId:
          type: string
          format: uuid
          description: Set on a view. Absent on a search, which by definition has no one property.
    SupplyGapRow:
      type: object
      description: >
        Counts only. There is no revenue, no conversion and no per-person detail here, and that is a
        constraint rather than an accident - the underlying table holds no contact detail, so
        nothing richer could honestly be derived from it.
      properties:
        localitySlug:
          type: string
          description: Absent on the single row aggregating signals that carried no locality.
        localityName:
          type: string
          description: >
            Absent (NON_NULL) rather than null when the slug has no row in `localities`, so the
            shape of the response does not advertise that a field is being withheld. An absent name
            means the demand is for somewhere PuneNest does not yet cover.
        supply: { type: integer, format: int64, description: Live approved listings in this locality. }
        searches: { type: integer, format: int64 }
        alerts: { type: integer, format: int64 }
        views: { type: integer, format: int64 }
        repeatSeekers:
          type: integer
          format: int64
          description: >
            Signed-in people who searched this locality three or more times in the window.
            Knowingly an undercount, and deliberately so: without an account there is nothing that
            distinguishes one person searching three times from three people searching once. The
            browser report it replaces claimed otherwise, by stamping every anonymous search with
            the same literal user id and then counting it as a repeat visitor.
        demand:
          type: integer
          format: int64
          description: Weighted total - alerts x5, searches x2, views x1.
        gap:
          type: integer
          format: int64
          description: >
            `demand - supply`. Negative means the platform holds more homes there than anybody is
            asking for, which is as actionable as the positive case and is why this is signed.
    AdminFinance:
      type: object
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        payoutsDue: { $ref: '#/components/schemas/Money' }
        payoutsCompleted: { $ref: '#/components/schemas/Money' }
        refunds: { $ref: '#/components/schemas/Money' }
        breakdown:
          type: array
          items:
            type: object
            properties:
              source: { type: string, example: subscriptions }
              amount: { $ref: '#/components/schemas/Money' }
        # Disclosures, not money (D63/D65). A structural zero and a measured zero are the same
        # number on screen, so these say which one the figure beside them is. Driven by
        # `punenest.finance.*`, so the day a money path ships the flag flips without a release.
        payoutsMeasured:
          type: boolean
          description: Whether `payoutsCompleted` counts anything. **False today** - no payout path exists.
        refundsMeasured:
          type: boolean
          description: Whether `refunds` counts anything. **False today** - no refund path exists.
        serviceOrdersCounted:
          type: boolean
          description: Whether `revenue` includes the services marketplace. **False today** - `service_orders.amount` is a quote, not a receipt.
        # The console's models. Every one of these replaced a figure the browser invented.
        mrr:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Monthly run rate of the **active** subscription book, normalised so a yearly plan
                contributes a twelfth and a quarterly plan a third.


                Forward-looking, and therefore not a slice of `revenue`, which is historical: a
                cancelled subscription earned what it earned and will bill nothing more. That is
                also why this counts `status = 'active'` where the revenue figures count
                `status <> 'pending'`.


                Zero-rupee plans are excluded by price rather than by name, so a promotional free
                plan is handled correctly the day it is created.
        monthRevenue:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Revenue inside the current Indian calendar month. Served rather than left to the
                client to sum out of the series, because two definitions of "this month" drift at
                every month boundary and in every time zone.
        users:
          type: integer
          format: int64
          description: Everyone with an account, archived rows excluded. The denominator of ARPU.
        payingUsers:
          type: integer
          format: int64
          description: >
            Distinct people who paid the platform anything this month. The denominator of ARPPU.


            Both denominators are reported because they answer different questions, and a console
            showing one of them under an unqualified label invites the reader to assume it is the
            other. Somebody who paid rent and bought a boost in the same month counts once.
        gstCollected:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Tax collected this month. **Rent only** - `rent_payments.gst` is the one place on
                the platform where tax is stored as its own number. Subscription and boost prices
                are single figures with no tax component recorded beside them, so any GST
                attributed to them would be a rate this server invented applied to a price that may
                already include it. The console labels the figure with the source it covers.
        pendingSettlement:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Platform fees on rent that has been billed and not settled - money owed **to** the
                platform. Distinct from `payoutsDue`, which is money the platform owes **on**.
        plans:
          type: array
          description: The active subscription book itemised. Sums to `mrr` by construction.
          items:
            type: object
            properties:
              name: { type: string, example: Owner Plus }
              audience: { type: string, example: owner }
              billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
              price:
                allOf:
                  - $ref: '#/components/schemas/Money'
                  - description: The sticker price for one billing cycle, **not** normalised.
              active: { type: integer, format: int64 }
              monthlyValue:
                allOf:
                  - $ref: '#/components/schemas/Money'
                  - description: What these subscriptions contribute to `mrr`.
    AdminFinanceSeriesPoint:
      type: object
      description: One month of revenue, split by source.
      properties:
        month:
          type: string
          format: date
          description: >
            The first day of the bucket, on the Indian calendar. The whole month is the value; the
            day is only how a month is spelled as a date.
        rent:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: Convenience fees on settled rent. The rent itself is the landlord's and is never here.
        subscriptions:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: Plan prices, counted when the payment reference proves an order settled.
        featured:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Boost pack prices, counted from `paid_at`, which only a payment webhook sets. Named
                for the product rather than for the `boosts` table, because the screen has always
                said "Featured" and that is the word an administrator can act on.
        services:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                **Always `0`.** A measurement, not a missing field - see the operation description
                and the `serviceOrdersCounted` disclosure on `/admin/finance`.
    AdminFinanceTransaction:
      type: object
      description: One movement of money the platform can evidence.
      properties:
        id:
          type: string
          format: uuid
          description: >
            The source row in `rent_payments`, `subscriptions` or `boosts`. Not synthesised and not
            prefixed, so a figure on this screen is traceable to the record that produced it.
        date:
          type: string
          format: date
          description: >
            When the money moved, on the Indian calendar. For an unsettled row this is when it was
            billed or begun - the row is on the ledger because it is expected, and a null date would
            sort it out of the view that exists to chase it.
        party:
          type: string
          description: >
            The counterparty's name. **Never a mobile number**: `/admin/enquiries` exists for the
            case where an operator needs to reach somebody, and it audits the reveal. A finance
            ledger has no reason to carry contact details at all.
        kind: { type: string, enum: [rent_fee, subscription, featured] }
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                The platform's share, never the gross - a rent row carries its convenience fee and
                not the rent. Never negative.
        status:
          type: string
          enum: [paid, pending, failed]
          description: Settlement, derived. See the operation description for why `refunded` is absent.
        method:
          type: string
          description: >
            How it was paid, where the source records one. Absent rather than null - only rent
            payments come back from the gateway with an instrument attached.
    AdminSettings:
      type: object
      description: Platform configuration document (SSOT for fees, feature flags and RBAC).
      properties:
        contactUnlockLimit: { type: integer }
        kycBadgeEnabled: { type: boolean, description: Whether the opt-in DigiLocker Verified-badge flow is available (ADR-019). Replaces the retired global Aadhaar gate. }
        listingExpiryDays: { type: integer }
        boostEnabled: { type: boolean }
        maintenanceMode: { type: boolean }
        site:
          type: object
          description: Branding / support contact block.
          additionalProperties: true
        fees:
          type: object
          description: Platform fee configuration (INR); read by the billing layer.
          properties:
            ownerPlanYearly: { type: integer }
            ownerProYearly: { type: integer }
            rentAgreementPlatform: { type: integer }
            seekerPlusTopup: { type: integer }
            featuredListing: { type: integer }
            gstPercent: { type: number, example: 18 }
            rentPayPercent: { type: number, example: 2 }
          additionalProperties: true
        movePack:
          type: object
          additionalProperties: true
        geo:
          type: object
          description: >
            Coverage and locality-search policy — where each city centres and how far it extends,
            whether search is fenced to those bounds, and which places to hide from every suggestion
            box.


            Listed here as documentation, not as a constraint: `additionalProperties: true`
            throughout, because `PUT /admin/settings` deep-merges any top-level key and binding this
            block to a closed shape would drop whatever the Maps panel adds next. It went undeclared
            for a long time for exactly that reason, and the omission read as "the server does not
            know about geo" when in fact it stores and merges it like everything else.


            The public projection of this block is `GET /geo`, which is narrower in one respect: it
            withholds each blacklist entry's free-text reason. That note is moderator prose about a
            named building and is served **only** here.
          additionalProperties: true
        flags:
          type: object
          description: Feature toggles.
          additionalProperties: { type: boolean }
        adminFlags:
          type: object
          additionalProperties: { type: boolean }
        permissions:
          type: object
          description: >
            Per-team capability allow-list (team-or-`admin` -> [capability, ...]), enforced server-side
            since D67 was wired. It narrows the role guards and can never widen them: every capability
            check is composed onto the `x-roles` check that was already there, so no value here admits
            a caller a role would refuse. An absent, malformed or non-object document falls back to the
            role guards alone; within a well-formed document an unlisted team or an unlisted capability
            is a denial, and `"*"` means all. Editing this changes access control - the four
            capabilities are `view_dashboard` (GET /admin/dashboard, GET /admin/analytics),
            `view_service_requests` (the ops branch of GET /service-requests), `update_ticket`
            (PATCH /tickets/{id}, POST /tickets/{id}/notes) and `export_csv`, which is stored but
            enforces nothing because the platform has no export endpoint (D5 - exports render in the
            browser).
          additionalProperties: true
      # `customRoles` was removed from this schema (D67/D13, migration V61). It described named
      # module bundles for scoped back-office accounts, keyed by a `roleId` that no user row, no
      # JWT claim and no endpoint has ever carried, and its module vocabulary is the admin client's
      # (`enquiries`, `properties:verify`, ...) rather than the server's `permissions` capabilities.
      # It was stored faithfully and read by nothing. Worse, it composes by UNION where the
      # permission map may only NARROW, so honouring it later would widen access using a document
      # written while it granted nothing. PUT /admin/settings now answers 422 for this key rather
      # than accepting it, so the contract not listing it is the whole truth rather than an omission.
    ContentItem:
      type: object
      description: >
        A CMS row of any of the four managed types. The endpoint is keyed by `{type}` in the path,
        so the caller already knows which fields apply; fields belonging to the other three types
        are null. Kept as one flat schema rather than a `oneOf` because the path parameter is
        already the discriminator, and four write schemas plus four read schemas would restate it
        eight more times.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [announcements, services, faqs, banners] }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        # announcements
        title: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        severity: { type: [string, 'null'] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        active: { type: [boolean, 'null'] }
        # services
        name: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        link: { type: [string, 'null'] }
        # faqs
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        # banners
        image: { type: [string, 'null'] }
        headline: { type: [string, 'null'] }
        position: { type: [integer, 'null'] }
        # every type
        translations: { $ref: '#/components/schemas/ContentTranslations' }
    ContentItemWrite:
      type: object
      description: >
        Create or update payload. Every field is optional here because the required set depends on
        `{type}` and OpenAPI cannot express that against a path parameter; the server enforces it
        (announcements need `title`, services `name`, faqs `question`, banners `image`) and answers
        422 otherwise. On PATCH an absent field is left unchanged.
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 4000 }
        # Matches the announcements.severity CHECK constraint (V8) and the Announcement read
        # schema. This previously read [info, warning, critical], which offered a value the
        # database rejects and omitted one it accepts, so a client following the contract was
        # answered with a constraint violation. AdminContentService now checks the same three.
        severity: { type: string, enum: [info, success, warning] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        active: { type: boolean }
        name: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        link: { type: string, maxLength: 500 }
        question: { type: string, maxLength: 300 }
        answer: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 60 }
        image: { type: string, maxLength: 500 }
        headline: { type: string, maxLength: 200 }
        position: { type: integer, minimum: 0, maximum: 999 }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actor: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string, example: property.approve }
        entity: { type: string, example: property }
        entityId: { type: string }
        checker: { type: [string, 'null'], description: Approver in maker-checker flows. }
        at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    StaffActivityEntry:
      type: object
      # A projection of AuditEntry with the actor resolved to a person and the metadata dropped.
      # The review question is "what has this colleague been doing"; the metadata is the detail of a
      # single case, which is what /admin/audit-log is for.
      required: [id, actor, actorRole, action, entity, at]
      properties:
        id: { type: string, description: The audit row's id, so the feed can be reconciled against the audit log. }
        actor: { type: string, description: The acting user's id; pass back as the `actor` filter. }
        actorName: { type: string, description: 'Resolved name, or the raw actor handle when no account matches — a deleted account still has to appear.' }
        actorRole: { type: string, enum: [staff, admin] }
        actorTeam: { type: [string, 'null'] }
        action: { type: string, example: user.suspend }
        entity: { type: string, example: user, description: The kind of record acted on; the console's category. }
        entityId: { type: [string, 'null'] }
        at: { type: string, format: date-time }
    StaffActivityCount:
      type: object
      required: [entity, count]
      properties:
        entity: { type: string, example: user }
        count: { type: integer, format: int64 }
    StaffLeaderboardEntry:
      type: object
      # Volume, not performance. An audit row records that something was done, not that it was worth
      # doing — the mock filed the same number under "performance", which the data cannot support.
      required: [actor, name, role, total]
      properties:
        actor: { type: string }
        name: { type: string }
        role: { type: string, enum: [staff, admin] }
        team: { type: [string, 'null'] }
        total: { type: integer, format: int64 }
    StaffActivitySummary:
      type: object
      required: [total, staffCount, byEntity, actions, leaderboard]
      properties:
        total: { type: integer, format: int64, description: Every matching row in the window. }
        staffCount: { type: integer, format: int64, description: Distinct actors in the window — the honest reading of "active staff". }
        byEntity:
          type: array
          description: The split by kind of record acted on, busiest first.
          items: { $ref: '#/components/schemas/StaffActivityCount' }
        actions:
          type: array
