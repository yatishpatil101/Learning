      operationId: finalizationStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
    delete:
      tags: [Leads & Contact]
      summary: Cancel my finalization request (buyer)
      operationId: cancelFinalization
      responses:
        '204': { description: Cancelled }
  /finalization/requests/{reqId}/accept:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Accept finalization (owner, checker step)
