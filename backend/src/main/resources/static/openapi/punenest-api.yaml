        Every locality, **retired ones included**, alphabetical, each with its true live-listing
        count. The only read on the platform that returns inactive localities: `listLocalities` is
        the public catalogue, and a retired area that still appears there is one search engines keep
        indexing. A console that could not see a retired locality could not un-retire one, which
