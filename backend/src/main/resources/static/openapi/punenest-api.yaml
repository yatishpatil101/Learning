  # 9. BILLING & GROWTH (plans, boosts, orders, referrals)
  # ============================================================
  /plans:
    get:
      tags: [Billing & Growth]
      summary: Subscription plans catalog
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
  /me/subscription:
    get:
      tags: [Billing & Growth]
      summary: My current subscription
      operationId: getSubscription
      responses:
        '200': { description: Subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
    post:
      tags: [Billing & Growth]
      summary: Subscribe / upgrade plan
      operationId: subscribe
      description: >
        Subscribes to / upgrades a plan, collected via the Cashfree Payment Gateway
        (ADR-017). `402` means payment is required to proceed; on gateway success the
        subscription is activated by the payment webhook (see `callbacks`).
      externalDocs:
        description: Plans, billing & referrals flow
        url: docs/flows/consumer/plans-billing-refer.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '402': { description: Payment required }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /boost-packs:
    get:
      tags: [Billing & Growth]
      summary: Listing boost packs catalog
      operationId: listBoostPacks
      security: []
      responses:
        '200':
          description: Packs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BoostPack' }
  /me/properties/{propId}/boost:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Billing & Growth]
      summary: Boost a listing
      operationId: boostListing
      description: >
        Purchases a boost pack for a listing, collected via the Cashfree Payment Gateway
        (ADR-017). The boost activates on gateway success, confirmed by the payment webhook
        (see `callbacks`).
      externalDocs:
        description: Plans, billing & referrals flow
        url: docs/flows/consumer/plans-billing-refer.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packId]
              properties:
                packId: { type: string }
      responses:
        '201':
          description: Boost applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Boost' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
