openapi: 3.1.0
info:
  title: PuneNest API
  version: "1.3.0"
  summary: Pune-first real-estate marketplace backend API.
  description: |
    Enterprise API contract for **PuneNest**, a Pune-first real-estate marketplace
    (broker-optional listings, rentals, deals, services and back-office operations).

    **This specification is the single source of truth for the PuneNest HTTP API.**
    Endpoints, request/response shapes, and enums are defined here and nowhere else.
    Companion docs describe *behaviour and data*, not the wire contract:
      - `docs/system/data-model.md`     — ER map / DB persistence design (field shapes are the schemas below)
      - `docs/system/cross-cutting.md`  — auth, contact gate, maker-checker, audit rules
      - `docs/system/platform-architecture.md` — component/vendor decisions & ADRs (KYC, payments, verification posture)
      - `docs/system/package-structure.md` — the 11 bounded contexts and their package/schema mapping
      - `docs/flows/**`                 — per-feature behavioural specs

    ### Changelog
    - 1.3.0 — **Flatmates re-modelled around seeker intent.** The flatmates/rooms/groups triple is
      replaced by two feeds, `move-in` and `team-up` (`FlatmateTab`; the old values survive as
      deprecated read aliases). `FlatmatePost` is renamed `FlatmateSeekerPost` and re-shaped to what
      a seeker actually posts; `FlatmateRoom`, `FlatmateGroup`, `FlatmateRequest`, `FlatmateReview`,
      `GroupApplication`, `AgreementDoc`, `FlatmateAlertCriteria` and `HostEligibility` are new.
      New supply model: `RoomKind`, `PriceBasis` (per-room vs per-person rent), `Occupancy` and the
      flat occupancy ledger, plus the owner **flat split** (`POST|DELETE /properties/{id}/split`).
      Room enquiries carry a `ShareIntent`. The flatmates "Verified" pill is the **same** DigiLocker
      L2 badge as the rest of the app (ADR-009a), not a separate seeker OTP. `SavedSearch` gains
      `kind`/`criteria`/`label`/`mobile` and an `sms` channel for flatmate alerts. Moderation adds
      the ops flatmate-verification queue and the admin flatmate/group-application desks.
    - 1.2.0 — **Verification is a badge, not a gate** (ADR-019): browsing and contacting
      owners require only a signed-in mobile-OTP account (L1); identity verification is an
      **opt-in "Verified" badge** (L2) and is hard-required only at the deal step (L3).
      KYC moved to the **Cashfree Secure ID DigiLocker** consent flow (ADR-009/017): the
      submit endpoint now *starts* a redirect and resolves via webhook (no Aadhaar number is
      ever received); dedup is a composite `identity_hash` (ADR-009b) and mobile-match is a
      soft signal at MVP (ADR-009a). Contact `403 aadhaar_required` is replaced by
      `403 verification_required`, returned **only** when the target owner opted into
      "verified contact only".
    - 1.1.0 — Reconciled the role model to the canonical `buyer/owner/staff/admin`
      set (`staff` scoped by `team`); aligned `Team` to the ops teams; made this
      spec the sole API source of truth (retired the duplicate markdown catalogue).

    ## Conventions
    - Base path: `/api`
    - Auth: Bearer JWT (`Authorization: Bearer <token>`) unless marked public.
    - Pagination: `?page=0&size=20` (zero-indexed); responses use `PageEnvelope`.
    - Sort: `?sort=field,direction` (e.g. `sort=createdAt,desc`).
    - Dates: ISO-8601 UTC. Money: integer INR (paise-free rupees).
    - Errors: `{ "error": "code", "message": "human-readable", "status": 400 }`.
    - Soft-delete: archive/restore only — no hard DELETE for core aggregates.

    Tags map to **bounded contexts** to support future microservice decomposition.
  contact:
    name: PuneNest Platform Engineering
    url: https://punenest.example.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api
    description: Local development
  - url: https://staging.punenest.example.com/api
    description: Staging
  - url: https://api.punenest.example.com/api
    description: Production

tags:
  - name: Identity & Access
    description: Authentication, sessions, current-user profile, staff onboarding.
  - name: Catalog & Search
    description: Public property discovery, localities, cities, reference/fee data.
  - name: Listings
    description: Owner listing lifecycle (create, edit, deals, offers, visits).
  - name: Moderation
    description: Admin property/user moderation, verification, reports, audit.
  - name: Leads & Contact
    description: Contact-gate requests, enquiries, finalization (maker-checker).
  - name: Rentals & Payments
    description: Rent payments, mandates, payouts, tenancies, tenant profiles.
  - name: Documents
    description: Property documents, buyer document-access requests, sharing.
  - name: Services & Support
    description: Service tickets, support tickets, service workflows, agreements.
  - name: Billing & Growth
    description: Plans, boosts, service orders, referrals, fees.
  - name: Engagement
    description: Saved properties/searches, reviews, notifications, flatmates.
  - name: Admin & Analytics
    description: KPIs, analytics, platform settings, content/CMS, society leads.

externalDocs:
  description: >
    Behavioural flow specs (actors, screens, sequence) and the architecture / ADRs that
    this wire contract implements. Swagger documents the request/response of each call;
    these docs document the end-to-end journey across calls, actors and time.
  url: docs/system/platform-architecture.md

security:
  - bearerAuth: []

paths:
  # ============================================================
  # 1. IDENTITY & ACCESS
  # ============================================================
  /auth/login:
    post:
      tags: [Identity & Access]
      summary: Login via OTP-verified mobile
      security: []
      operationId: login
      description: >
        Dual-mode. Posting `mobile` **without** `otp` is the *send* step: a code is dispatched and
        the response is only `{ "otpSent": true }`. Posting `mobile` **with** `otp` is step 2 (L1):
        it verifies the code and returns access/refresh tokens. First-time mobiles are provisioned
        as `buyer` on successful verification, so no separate sign-up call exists. L1 sign-in is the
        only floor for participating (posting, enquiring, contacting owners) — identity verification
        is an opt-in badge on top (ADR-019). On success, call `getMe`.
      externalDocs:
        description: Auth / OTP sign-in flow (actors + screens)
        url: docs/flows/consumer/auth.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Either the OTP-send acknowledgement (`{ "otpSent": true }`) or, when `otp` was supplied
            and verified, the issued token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
          links:
            currentUser: { $ref: '#/components/links/GetCurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-login:
    post:
      tags: [Identity & Access]
      summary: Staff/admin login
      security: []
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/staff-invite/redeem:
    post:
      tags: [Identity & Access]
      summary: Redeem a back-office invite and set your own password
      security: []
      operationId: redeemStaffInvite
      # S28 (tech debt D206): necessarily unauthenticated. The caller is a new colleague who has no
      # credential yet - the single-use token IS the credential, and it is verified server-side.
      description: >
        The one route on which a back-office password is chosen, and it is chosen by the person who
        will use it. `addStaff` creates the account with **no usable password** and issues a
        single-use, expiring invite to the colleague's own mobile; neither the administrator who
        created the account nor the one who approved it is ever told that token. Until it is
        redeemed the account cannot obtain a token on any login path, exactly as an unapproved
        account cannot.


        Redeeming is **not** a login: it returns no session and no account details. If the account
        is also waiting for a second administrator, that gate still applies afterwards.


        Every failure - unknown, wrong, expired, already redeemed, account since archived - answers
        the same 401 with the same message. Distinguishing them would turn this route into an
        oracle, and the legitimate holder's remedy is the same in every case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInviteRedeem' }
      responses:
        '204': { description: Password set. Sign in normally (subject to approval). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Identity & Access]
      summary: Rotate the refresh token
      security: []
      operationId: refreshSession
      description: >
        Exchange a valid refresh token for a new access token and a new refresh token. Refresh
        tokens are **single-use**: the presented token is revoked and a replacement is returned, so
        a client must persist the new value. Replaying a spent token fails with 401 — clients should
        treat that as session loss and send the user back to sign-in. Because the refresh token is
        itself the credential, this endpoint takes no bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated — new token pair issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Identity & Access]
      summary: Invalidate current session
      operationId: logout
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Identity & Access]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Identity & Access]
      summary: Update own profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ============================================================
  # 2. CATALOG & SEARCH (public discovery + reference data)
  # ============================================================
  /properties:
    get:
      tags: [Catalog & Search]
      summary: List / search properties
      description: Full-text + faceted search. N+1-safe; owner contact is masked.
      security: []
      operationId: searchProperties
      parameters:
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string }, description: 'Locality *slug* (matches PropertySummary.localitySlug, not the display name)' }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - name: possession
          in: query
          description: >
            Exact match on possession state. Listings with no recorded possession are
            never returned by this facet.
          schema: { $ref: '#/components/schemas/PropertyPossession' }
        - name: q
          in: query
          schema: { type: string }
          description: |
            Free text over **title and locality only**.

            Owner name and owner mobile are matched by the moderation search
            (`listPropertiesForModeration`) and must not be added here: this endpoint needs no
            login, so those axes would make it an owner directory keyed by phone number.
        - name: status
          in: query
          description: >
            Can only *narrow within* approved on this anonymous endpoint — the public floor
            (`approved`, non-archived) is unconditional, so any other value yields an empty page
            rather than unapproved rows. Use `listPropertiesForModeration` to search every status.
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        # --- listings-page facets (D26) ---------------------------------------------------------
        # Every one of these was already offered by the results UI and already evaluated -- in the
        # browser, over a fully-downloaded catalogue. That is why they are being declared now
        # rather than added: a predicate the database cannot see cannot take part in ORDER BY or
        # LIMIT, so client-side filtering meant every page was a page of the wrong set. Six of them
        # had no column at all and silently matched nothing against this API (V95).
        #
        # All list-valued facets accept a repeated parameter (?bhks=2&bhks=3) or a comma list
        # (?bhks=2,3). Unless stated otherwise they are unions: any selected value matches.
        - name: rank
          in: query
          description: >
            Which ranking to apply when no explicit `sort` is given. `relevance` (the default)
            orders by featured, verifications, RERA, freshness and completeness; `newest` orders by
            recency alone.


            Separate from `sort` because neither is a column order, and `sort` is deliberately
            restricted to a whitelist of indexed columns so a client cannot probe or force a scan on
            an arbitrary one. Passing a ranking through `sort` would mean either widening that
            whitelist or having the value silently dropped. An explicit `sort` wins over `rank`
            either way: paid placement and merit both yield to an order the buyer actually chose.
          schema: { type: string, enum: [relevance, newest], default: relevance }
        - name: types
          in: query
          description: >
            Property types, OR'd, case-insensitive. One list rather than the UI's separate
            residential and commercial chip groups — both narrow the same column, and which drawer
            a chip was in is not the server's concern.
          schema: { type: array, items: { type: string } }
        - name: bhks
          in: query
          description: >
            Bedroom counts, OR'd. A token is a whole number, or `Nplus` for an open top (`3plus` =
            three or more), because the UI's top chip is genuinely open-ended and matching it as an
            equality would hide every 4BHK from a buyer who asked for "3+".


            Named `bhks`, not `bhk`, because the single-valued `bhk` above already exists on this
            endpoint. Two parameters sharing a name with different arity is not merely ambiguous:
            the scalar binds first, so the multi-select either fails to parse or quietly degrades
            into an equality against the literal string "2,3". Same for `furnishings`.
          schema: { type: array, items: { type: string } }
        - name: furnishings
          in: query
          description: Furnishing states, OR'd. Plural for the reason given on `bhks`.
          schema: { type: array, items: { $ref: '#/components/schemas/Furnishing' } }
        - name: localities
          in: query
          description: Locality *slugs*, OR'd. The multi-select counterpart of `locality`.
          schema: { type: array, items: { type: string } }
        - name: societies
          in: query
          description: Society slugs, OR'd.
          schema: { type: array, items: { type: string } }
        - name: amenities
          in: query
          description: >
            Amenity tokens, **AND'd** — the one list here that is not a union. A buyer ticking
            "lift" and "parking" has stated two requirements, not offered two alternatives, and
            returning a listing with only one of them wastes the visit that discovers the difference.
          schema: { type: array, items: { type: string } }
        - name: landUse
          in: query
          description: >
            Plot zoning, OR'd. Matters because the wrong answer here is not a disappointment but a
            dead purchase: agricultural land cannot be built on by a non-agriculturist.
          schema: { type: array, items: { type: string, enum: [residential, commercial, industrial, agricultural, mixed] } }
        - name: room
          in: query
          description: Flatmate room shape, OR'd — a private room, or a bed in a shared one.
          schema: { type: array, items: { type: string, enum: [single, shared] } }
        - name: sharing
          in: query
          description: >
            PG/hostel occupancy, OR'd. One building usually offers several at different rents, and a
            seeker who will take a double or a triple has asked one question, not two.
          schema: { type: array, items: { type: string, enum: [single, double, triple, four, five] } }
        - name: tenants
          in: query
          description: >
            Accepted tenant types, OR'd — **plus every listing that stated no preference at all**.
            An owner who left the field blank has refused nobody, and reading silence as refusal
            would hide most of the inventory from the filter meant to narrow it.
          schema: { type: array, items: { type: string, enum: [family, bachelor-male, bachelor-female, company] } }
        - name: construction
          in: query
          description: >
            Possession states, OR'd — the multi-select counterpart of `possession`. When both are
            sent they AND, which is what a caller sending both asked for.
          schema: { type: array, items: { $ref: '#/components/schemas/PropertyPossession' } }
        - name: availableFrom
          in: query
          description: >
            Move-in bucket, **cumulative**: `30` also matches `15` and `now`. A tenant who can wait
            a month can obviously also take a flat that is free today, and an exact match on the
            bucket would deny them it.
          schema: { type: string, enum: [now, '15', '30'] }
        - name: pets
          in: query
          description: >
            `true` restricts to pet-friendly listings. `false` is treated as "not asked", not as
            "show me the ones that forbid pets" — nobody performs that search.
          schema: { type: boolean }
        - name: ownerVerified
          in: query
          description: Restrict to listings whose poster passed Aadhaar/DigiLocker. Only ever narrows.
          schema: { type: boolean }
        - name: ownershipVerified
          in: query
          description: Restrict to listings whose ownership paperwork checked out. Only ever narrows.
          schema: { type: boolean }
        - name: rera
          in: query
          description: >
            Restrict to RERA-registered listings. A boolean even though the column holds the
            registration number itself, because the yes/no is the only question the filter asks.
          schema: { type: boolean }
        - name: societyVerified
          in: query
          description: Restrict to listings in a verified society.
          schema: { type: boolean }
        - name: conveyanceDone
          in: query
          description: Restrict to societies whose conveyance is complete.
          schema: { type: boolean }
        - { name: minArea, in: query, description: Inclusive lower bound on built area., schema: { type: number, minimum: 0 } }
        - { name: maxArea, in: query, description: Inclusive upper bound on built area., schema: { type: number, minimum: 0 } }
        - name: minAge
          in: query
          description: >
            Inclusive lower bound on construction age in years. A listing that never stated its age
            is **excluded** when either age bound is set, rather than read as new — unstated is not
            zero, and floating silent listings above honest ones would reward the omission.
          schema: { type: integer, minimum: 0 }
        - name: maxAge
          in: query
          description: >
            Inclusive upper bound on construction age. The UI's top of range is an open "25+", which
            it expresses by simply omitting this.
          schema: { type: integer, minimum: 0 }
        - { name: minFloor, in: query, description: Inclusive lower bound on floor number., schema: { type: integer } }
        - { name: maxFloor, in: query, description: Inclusive upper bound on floor number., schema: { type: integer } }
        - name: nearLat
          in: query
          description: >
            Latitude of a "near me / near this landmark" centre. Required together with `nearLng`
            and `nearRadiusKm`; any one alone is ignored, because a centre without a radius and a
            radius without a centre are both incomplete questions and neither has a safe default.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: nearLng
          in: query
          description: Longitude of the search centre. See `nearLat`.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: nearRadiusKm
          in: query
          description: >
            Search radius in kilometres, **clamped to 50**. Clamped rather than rejected: a caller
            asking for a wider circle than we serve has asked a reasonable question badly, and the
            widest circle we do serve is a better answer than a `400`. The ceiling exists because
            the radius sizes a bounding box, and an unbounded one spans the planet — which would
            turn this anonymous endpoint into a full-table scan available on request. Fifty
            kilometres already reaches past every locality in the catalogue.
          schema: { type: number, minimum: 0, maximum: 50 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged property summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertySummary' }
  /properties/featured:
    get:
      tags: [Catalog & Search]
      summary: Featured listings
      security: []
      operationId: featuredProperties
      responses:
        '200':
          description: Featured property summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertySummary' }
  /properties/trust-stats:
    get:
      tags: [Catalog & Search]
      summary: Verified share of the live catalogue
      description: >
        The three trust headlines, counted by the database, for the whole live catalogue or for one
        locality. Declared before `/properties/{id}` for readability only — Spring ranks an exact
        path above a template one, so this can never be read as a listing whose id is `trust-stats`.


        It exists because the homepage used to derive these numbers in the browser from whichever
        listings it had already loaded, which made every one of them a statement about the current
        page dressed up as a statement about the catalogue. The distinct-owner figure was the worst:
        two pages of the same owner's flats counted as two verified owners.
      security: []
      operationId: propertyTrustStats
      parameters:
        - name: locality
          in: query
          description: >
            Locality *slug*, not a display name. An unknown slug answers zeroes rather than 404 —
            this is a headline about a slice, and an empty slice is a real slice.
          schema: { type: string }
      responses:
        '200':
          description: Counts for the whole catalogue, or for the requested locality
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustStats' }
  /properties/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Catalog & Search]
      summary: Single property detail
      security: []
      operationId: getProperty
      responses:
        '200':
          description: Property detail (owner contact masked until contact gate passed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
  /owners/{id}:
    get:
      tags: [Catalog & Search]
      summary: Public owner profile card
      description: >
        The seller card behind a listing. Public, and takes no principal at all: the page shows the
        same thing to everyone, and the mobile is masked unconditionally because the profile has no
        listing in context and so no contact gate to consult.


        That is the fix, not a limitation. The old page revealed the number to anyone holding an
        approved request against *any* of this owner's listings, which quietly turned a per-listing
        grant into a per-person one — approval on a Baner 2BHK saying nothing about the same owner's
        Kothrud shop.


        The owner's listings are deliberately not embedded. They are `GET /properties?owner={id}`,
        which is the same paged, approved-and-unarchived read as every other catalogue surface — one
        hard floor, one card shape, one place to get it wrong. There is no `GET /owners`: a
        downloadable list of the platform's landlords is not a feature.
      security: []
      operationId: getOwnerProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The owner's public card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerProfile' }
        '404':
          description: >
            Unknown, malformed, or belonging to an archived account — one answer for all three, so
            the route cannot be used to test whether an id exists.
  /localities:
    get:
      tags: [Catalog & Search]
      summary: All localities
      security: []
      operationId: listLocalities
      responses:
        '200':
          description: Localities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Locality' }
  /localities/{slug}:
    get:
      tags: [Catalog & Search]
      summary: Locality detail + listings
      security: []
      operationId: getLocality
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Locality detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /societies:
    get:
      tags: [Catalog & Search]
      summary: Browse societies (curated + MahaRERA + community)
      security: []
      operationId: listSocieties
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text name/builder search }
        - { name: locality, in: query, schema: { type: string }, description: Filter by locality slug }
        - { name: sort, in: query, schema: { type: string }, description: 'e.g. occupancy,desc' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Societies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Society' }
    post:
      tags: [Catalog & Search]
      summary: Add a society the catalogue does not have
      operationId: mintSociety
      description: >
        The escape hatch behind every society picker on the platform. A curated directory is always
        behind the city: somebody is listing a flat in a building that finished last quarter, and a
        picker that cannot admit that is a picker that stops the listing.


        **Two success codes, and the difference is the point.** `201` for a society that did not
        exist, `200` when the name already resolves to one -- both hand back the same canonical row,
        so a client that ignores the distinction still behaves correctly. But collapsing them would
        make the screen say "Added" to somebody who has just re-found a society that has been on
        PuneNest for two years, which is both wrong and quietly alarming: it suggests the catalogue
        is empty.


        Signing in is required, and not as a formality. The row records who added it, which is what
        an operator reviewing `/admin/society-candidates` needs in order to ask a question about it,
        and what makes one account minting fifty societies a visible pattern rather than a suspicion.


        What arrives here is a *candidate*, not a verified building: it carries `source` marking its
        provenance and no `verifiedAt` until an operator confirms it. Everything downstream that
        cares -- the hub's trust badge, the directory's ordering -- reads those two fields rather
        than assuming a row's existence means somebody checked it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyCreate' }
      responses:
        '200':
          description: Already on PuneNest -- the existing canonical row, unmodified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Society' }
        '201':
          description: Added as a candidate, awaiting an operator's check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Society' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}:
    get:
      tags: [Catalog & Search]
      summary: Society hub detail (curated + community merged)
      security: []
      operationId: getSociety
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Society detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /societies/{slug}/membership:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: Where the caller stands in this society
      security: []
      operationId: getSocietyMembership
      description: >
        One read for four facts the hub needs before it can draw a single control: this reader's own
        residency, whether they are the committee, the society's live claim, and how many residents
        are verified.


        Public and caller-aware, the same shape `getSociety` uses. `permitAll` does not reject a
        bearer token, so a signed-in reader gets their standing and an anonymous one gets the
        society's public facts with the personal parts null. The alternative -- a `401` for the
        signed-out case -- would force the hub to guess who is looking before it asks, and the
        client cannot know that before the token round-trips.


        Four facts in one response rather than four reads, because they are drawn together and a
        page that renders them as they arrive flickers a "Verify your flat" prompt in front of a
        resident who verified theirs last year.
      responses:
        '200':
          description: >
            The caller's standing. `resident` and `claim` are null for a signed-out reader and for a
            signed-in one who has never asked; `verifiedResidents` is public either way, because it
            is the number that tells a prospective buyer whether this hub is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyMembership' }
        '404': { $ref: '#/components/responses/NotFound' }
  /societies/{slug}/residents:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: The residency review queue (committee or staff)
      operationId: listSocietyResidents
      description: >
        What the committee works through: everybody who has asked to be recognised as living here.


        The reviewer is "platform staff, **or** the person whose claim on this society was
        approved", and the second half of that cannot be written as a role -- it is a fact about a
        row in `society_claims`. So this is not an `x-roles` route, and a staff token is sufficient
        but not necessary.


        Sort is fixed to newest-first in the query and a client `sort` is ignored rather than
        honoured, because the underlying projection cannot satisfy an arbitrary order and a second
        `order by` would fail at the database rather than at the boundary.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, verified, rejected] }, description: Narrow the queue; omit for everything }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: The queue, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyResident' }
        '403':
          description: Signed in, but neither staff nor this society's committee
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Ask to be recognised as a resident of one flat
      operationId: requestSocietyResidency
      description: >
        The request that turns an account into a verified neighbour -- which is what the noticeboard
        gate, the WhatsApp invite and the `authorIsResident` badge all read.


        **200, not 201, and deliberately so.** A person has at most one standing request per
        society, so a second call amends the first rather than creating a second row. A `201` with a
        `Location` would be a lie the second time and would teach a client to expect two rows where
        the unique index guarantees one. Correcting a mistyped flat number is the common case, not
        the exception.


        The resource is created under the society rather than under `/me` because it belongs to the
        society's register, not to the caller's account: the committee reads it, the committee
        decides it, and its uniqueness rule is scoped to the building.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyResidentRequest' }
      responses:
        '200':
          description: >
            The caller's standing request, created or amended. `status` is `pending` until the
            committee decides; `mobile` is the caller's own, so it is not masked back to them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyResident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/residents/{residentId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: residentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Engagement]
      summary: Verify or reject one residency request (committee or staff)
      operationId: decideSocietyResidency
      description: >
        The decision that grants or withholds resident standing in this building.


        `PATCH` rather than two verbs (`.../verify`, `.../reject`) because approve and reject are one
        field's value, and splitting them would put the vocabulary in the URL where it cannot be
        enumerated or extended without a new route. The same reasoning the moderation queues use.


        Guarded by the same "staff or this society's approved claimant" rule as the queue read, and
        for the same reason it is not an `x-roles`: half of it is a row, not a role. The decision
        records who made it, so a committee's own moderation is attributable rather than anonymous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyResidentDecision' }
      responses:
        '200':
          description: The decided row, with `status`, `assignedTo` and `decidedAt` filled in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyResident' }
        '403':
          description: Signed in, but neither staff nor this society's committee
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/claim:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Engagement]
      summary: Claim this society on behalf of its committee
      operationId: claimSociety
      description: >
        How a managing committee asks for the power to run their own society page -- to review
        residency requests, take down a notice and moderate the community tab.


        **200 for the same reason `requestSocietyResidency` answers 200**: one claim per person per
        society, so a second call amends the first. Somebody who typed the wrong committee role or
        left the note blank should be able to correct it without an operator first rejecting the
        original.


        Nothing is granted here. The claim lands `pending` on `/admin/society-claims`, and until an
        operator approves it the claimant is an ordinary member. That is the whole point: a route
        that let a signed-in stranger assert committee status over a building would hand them the
        residency register of everybody who lives in it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyClaimCreate' }
      responses:
        '200':
          description: 'The claim, created or amended, `status: pending`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyClaim' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/questions:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: Questions asked about this society
      security: []
      operationId: listSocietyQuestions
      description: >
        Public, newest first, with each question's answers attached rather than fetched per row --
        a Q&A tab that needed a second call per question would issue twenty requests to draw one
        screen.


        **Deliberately not gated on residency, on either side.** The person with the most to ask has
        not moved in yet, and refusing them the question would leave the tab full of residents
        talking to each other about a building they already understand. The reader is protected by
        the `authorIsResident` badge instead, which says who is answering from inside the building
        and who is not, and lets them weigh it themselves.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Questions, newest first, answers nested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Ask a question about this society
      operationId: askSocietyQuestion
      description: >
        Any signed-in caller. **201**, unlike the residency and claim writes next door, because this
        genuinely creates a new row every time: a second question is a second question, and nothing
        about it amends the first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyPost' }
      responses:
        '201':
          description: The question, with an empty `answers` array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/questions/{questionId}/answers:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Engagement]
      summary: Answer a question about this society
      operationId: answerSocietyQuestion
      description: >
        Any signed-in caller, on the same reasoning as the question: a prospective buyer who viewed
        three flats here knows things the residents have stopped noticing.


        The answer is returned on its own rather than as the re-read question, so a client that has
        the thread in hand appends one row instead of replacing the list and losing the reader's
        scroll position. `authorIsResident` travels with it, which is the field that lets a reader
        weigh "the lift works fine" against who said it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyPost' }
      responses:
        '201':
          description: The answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyAnswer' }
        '404':
          description: No such society, or no such question on it
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/board:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: The society noticeboard
      security: []
      operationId: listSocietyBoard
      description: >
        Public to read, because an active noticeboard is the most honest signal a society hub can
        give a prospective buyer -- a building where somebody posted about the water tank cleaning
        last Tuesday is a building somebody is looking after.


        **Caller-aware for exactly one field.** The rows are identical for everyone; whether a
        delete control is drawn is not. Working that out on the client from a display name would get
        it wrong the moment two residents share one, so `canRemove` is computed server-side against
        the actual rule -- author, committee, or staff.
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: Narrow to one notice kind; omit for all }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Notices, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyBoardItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Post a notice (verified resident, committee or staff)
      operationId: postSocietyBoardItem
      description: >
        **The one write on the society hub that needs a verified flat**, and the reason this
        controller's gate is not a role. A notice asserts something about the building -- that the
        lift is out, that the AGM is on Sunday -- and a stranger asserting it is misinformation with
        the society's name on it. Asking a question needs only an account; posting a notice needs a
        row in `society_residents` saying the committee recognised you.


        That rule cannot be a `@PreAuthorize`, so it is not in `x-roles` either: a `403` here means
        "verify your flat first", not "you are the wrong kind of user".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyBoardItemCreate' }
      responses:
        '201':
          description: The notice, with `canRemove` true for its author
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyBoardItem' }
        '403':
          description: Signed in, but not a verified resident of this society
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/board/{itemId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Engagement]
      summary: Take one notice down (author, committee or staff)
      operationId: removeSocietyBoardItem
      description: >
        Three parties may remove a notice and the reasons differ: the author because they posted it,
        the committee because they answer for what the building says about itself, and staff because
        the platform answers for it publicly. That set is exactly what `canRemove` reports on the
        read, so a client never has to draw a control it will then be told it cannot use.


        204 with no body, because the row is gone and the list the caller is holding is the one they
        already have minus this item.
      responses:
        '204':
          description: Removed
        '403':
          description: Signed in, but not the author, the committee or staff
        '404':
          description: No such society, or no such notice on it
  /societies/{slug}/contributions:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: The community tab -- tips, trusted picks and photos
      security: []
      operationId: listSocietyContributions
      description: >
        Deliberately **unfiltered**. The tab's chips carry a count for every bucket including the
        ones you are not looking at, so the page is drawn from one read and filtered in the browser;
        a `kind` parameter would mean either a request per chip or counts that lag the list.


        **Caller-aware for three things a client cannot work out for itself**: whether this reader
        has already voted (`helpfulByMe`), whether a delete control would actually work
        (`canRemove`), and whether they are entitled to see a recommended person's phone number.
        That last one is the load-bearing case -- an electrician somebody recommended never agreed
        to be on the open web, so `referralContact` is withheld from a signed-out reader.


        Page size defaults to 50, higher than the platform's usual 20: this is a scroll-through
        feed, not a work queue, and the chip counts are only honest if the rows behind them are
        actually loaded.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Contributions, newest first, replies nested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyContribution' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Add a tip, a trusted pick or a photo
      operationId: addSocietyContribution
      description: >
        Any signed-in caller -- a lower bar than the noticeboard next door, and on purpose. A notice
        speaks for the building; a contribution speaks for one person, and is labelled as such by
        `authorName` and `authorIsResident`. Requiring a verified flat here would have emptied the
        tab of exactly the people most willing to fill it.


        `referralContact` is somebody else's phone number. It is accepted here because a
        recommendation without a way to reach the person is not a recommendation, and withheld on
        the public read for the same reason it was accepted: it belongs to a third party who is not
        on the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyContributionCreate' }
      responses:
        '201':
          description: The contribution, with `canRemove` true and an empty `replies` array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyContribution' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/contributions/{contributionId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: contributionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Engagement]
      summary: Remove one contribution (author, committee or staff)
      operationId: removeSocietyContribution
      description: >
        The same three parties as the noticeboard, for the same three reasons, reported in advance
        by `canRemove` on the read.
      responses:
        '204':
          description: Removed, along with its replies
        '403':
          description: Signed in, but not the author, the committee or staff
        '404':
          description: No such society, or no such contribution on it
  /societies/{slug}/contributions/{contributionId}/helpful:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: contributionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Engagement]
      summary: Mark a contribution helpful
      operationId: markSocietyContributionHelpful
      description: >
        **`PUT` to set and `DELETE` to clear, rather than one toggle endpoint**, and this is the
        detail worth reading twice. Both verbs are idempotent, so a request retried after a timeout
        on a train produces the state the tap intended. A toggle would produce the opposite one --
        the user taps, the response is lost, the client retries, and the vote it just cast is
        silently withdrawn.


        Answers with the new count and the caller's own state rather than 204, because that is
        exactly what the button draws and re-reading the whole page to colour one icon would be
        absurd.
      responses:
        '200':
          description: The contribution's vote state after the write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyHelpful' }
        '404':
          description: No such society, or no such contribution on it
    delete:
      tags: [Engagement]
      summary: Withdraw a helpful vote
      operationId: clearSocietyContributionHelpful
      description: >
        The idempotent partner of the `PUT`. Clearing a vote that was never cast is a `200` with the
        unchanged count, not a `404` -- the caller asked for a state and that state is what they now
        have.
      responses:
        '200':
          description: The contribution's vote state after the write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyHelpful' }
        '404':
          description: No such society, or no such contribution on it
  /societies/{slug}/contributions/{contributionId}/replies:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: contributionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Engagement]
      summary: Reply in the thread under a contribution
      operationId: replyToSocietyContribution
      description: >
        Any signed-in caller. One level of nesting and no more: a reply has no replies of its own,
        because a society tab is not a forum and a three-deep thread on a tip about the milkman is a
        moderation problem nobody asked for.


        Returned on its own rather than as the re-read contribution, so a client appends instead of
        replacing the list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyPost' }
      responses:
        '201':
          description: The reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyContributionReply' }
        '404':
          description: No such society, or no such contribution on it
        '422': { $ref: '#/components/responses/ValidationError' }
  /societies/{slug}/contributions/{contributionId}/replies/{replyId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: contributionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: replyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Engagement]
      summary: Remove one reply (its author, the committee or staff)
      operationId: removeSocietyContributionReply
      description: >
        The reply's **own** author, not the contribution's -- somebody who posted a tip does not
        thereby get to delete a correction to it. That distinction is why this is its own route and
        its own `canRemove` on the reply rather than an inherited one.
      responses:
        '204':
          description: Removed
        '403':
          description: Signed in, but not the reply's author, the committee or staff
        '404':
          description: No such society, contribution, or reply
  /societies/{slug}/proposals:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Engagement]
      summary: What the community says this society is
      security: []
      operationId: listSocietyProposals
      description: >
        One resource for three things the hub used to keep in three `localStorage` keys: missing
        details, the resident WhatsApp group, and a corrected map pin. They share one lifecycle --
        propose, ops screen, apply -- and a client that has to know which of three URLs a form posts
        to has been handed a decision the server is better placed to make.


        **One read rather than three, so the page cannot render half a state**: a banner saying your
        pin correction is pending beside a map that has already been corrected.


        Public because the hub calls it before it knows who is looking; what it publishes is not.
        A signed-out reader is told a resident group exists (`whatsappAvailable`) and is nudged to
        verify their flat, and never sees `whatsappJoinUrl` -- an invite link is a door into a group
        of people who live somewhere, and it reaches a verified resident or nobody.
      responses:
        '200':
          description: >
            Every pending proposal plus the resident group's status. `whatsappJoinUrl` is null for
            anyone who is not a verified resident of this society, whatever `whatsappAvailable` says.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyProposals' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Propose a detail, the resident group link, or a corrected pin
      operationId: proposeSocietyChange
      description: >
        **Two gates behind one route.** A missing detail -- the builder, the year, the maintenance
        rate -- is open to anyone signed in, because it is a fact about a building that a visitor
        can read off the gate. The group link and the map pin need a verified flat: one is an
        invitation into a residents' group and the other moves where the building *is*, and neither
        should be settable by somebody who has never been there. The service names which rule
        stopped you in the `403`.


        **201 even though a re-submission overwrites this author's own pending row.** From the
        caller's side a proposal has been lodged either way, and the distinction between "created"
        and "corrected" is one the composer does not draw and the author does not care about.


        Nothing is applied here. The proposal lands `pending` on `/admin/society-proposals`, and
        approval is what writes the value onto the society.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyProposalCreate' }
      responses:
        '201':
          description: 'The proposal, `status: pending`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyProposal' }
        '403':
          description: >
            A group-link or pin proposal from somebody who is not a verified resident of this
            society. A detail proposal never reaches this.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /page-views:
    post:
      tags: [Engagement]
      summary: Report a batch of page views
      security: []
      operationId: recordPageViews
      description: >
        PuneNest's entire analytics intake. There is no third-party tag on the site, so everything
        `/admin/analytics/*` reports is built from what this endpoint was told -- which is the
        deliberate trade: the platform sees less than a commercial analytics product would, and no
        ad network sees Indian house-hunters' browsing at all.


        **202, and empty.** The client is reporting something that already happened; it is not
        asking a question and there is nothing useful to hand back. Answering `200` with a body
        would invite a client to wait for it, and a beacon that blocks a page transition on an
        analytics write is a beacon that costs the user the thing being measured.


        **Batched by design.** Up to 50 events per call, so a session posts a handful of times
        rather than once per navigation. Every field is a shape, not an identity: `path` is the
        route, `referrerHost` is a host and never a full URL with its query string, `device` is one
        of three buckets. No IP address, no fingerprint, no user agent.


        Unauthenticated, and it accepts a token if one is present. That is what makes the
        anonymous-to-signed-in funnel measurable at all -- refusing anonymous events would leave the
        platform able to count only the people who already converted. `sessionId` is generated by
        the client and is the only thread between two events; it is pattern-constrained rather than
        free text so it cannot be used to smuggle a payload into the analytics tables.


        Best-effort by nature: a blocked or failed beacon means the visit is simply absent from the
        reports rather than estimated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageViewBatchCreate' }
      responses:
        '202':
          description: Accepted for recording. No body.
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/data-export:
    get:
      tags: [Identity & Access]
      summary: Everything PuneNest holds about me
      operationId: exportMyData
      description: >
        The subject-access request, answered in one call rather than by an email to support that
        somebody has to remember to action.


        The response describes itself. Each dataset carries a `describes` sentence saying in plain
        words what the rows are, a `rowCount`, a `truncated` flag, and a `withheld` map naming any
        column removed and why. `excluded` names the tables left out entirely, with reasons. A
        person exercising this right should not have to reverse-engineer a database schema to
        understand the answer, and an export that silently omitted a column would be a worse answer
        than one that says which column it omitted.


        **Redaction is stated, not implied.** `redactionRule` says how other people's identifiers
        were handled -- an export of your enquiries necessarily touches the owners you contacted,
        and their phone numbers are not yours to receive. `rowLimit` and `truncated` say the same
        thing about volume: a capped export is honest about being capped.


        `schemaVersion` exists so a person who exports twice a year apart can tell whether the shape
        changed underneath them.


        Rate-limited alongside the platform's other writes despite being a read -- it assembles many
        tables per call, and it is a request nobody legitimately makes twice a minute.
      responses:
        '200':
          description: The full export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/societies/following:
    get:
      tags: [Engagement]
      summary: Societies the caller follows
      description: >
        Most recently followed first. Paged rather than a bare array: nothing caps how many
        societies one person may follow. Cards are the same shape the public directory returns, so
        `followerCount`, `avgRating` and `listingCount` are all present and `followedByMe` is
        computed rather than assumed — it can read false if the follow was removed on another device
        between the page and this read.
      operationId: listFollowedSocieties
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Followed societies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Society' }
  /me/societies/{slug}/follow:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [Engagement]
      summary: Follow a society
      operationId: followSociety
      responses:
        '204': { description: Followed }
    delete:
      tags: [Engagement]
      summary: Unfollow a society
      operationId: unfollowSociety
      responses:
        '204': { description: Unfollowed }
  /reels:
    get:
      tags: [Catalog & Search]
      summary: Short-video property reels feed
      security: []
      operationId: listReels
      parameters:
        - { name: locality, in: query, description: 'Locality slug (e.g. koregaon-park), not the display name.', schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Reels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reel' }
  /cities:
    get:
      tags: [Catalog & Search]
      summary: Available cities
      security: []
      operationId: listCities
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
  /cities/waitlist:
    post:
      tags: [Catalog & Search]
      summary: Join city waitlist
      security: []
      operationId: joinCityWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityWaitlistRequest' }
      responses:
        '201': { description: Added to waitlist }
        '422': { $ref: '#/components/responses/ValidationError' }
  /fees:
    get:
      tags: [Catalog & Search]
      summary: Current fee structure, one entry per deal intent
      security: []
      operationId: getFees
      responses:
        '200':
          description: >-
            Fee structure. Spec fix S24: an array, one entry per deal intent, not a single object.
            `platform_fees` is keyed by deal and the `Fees` schema itself carries a `deal` field, so
            a single object could never say which deal it described. A cost-transparency surface
            wants both sides at once, and an array needs no query parameter.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Fees' }
  /flags:
    get:
      tags: [Catalog & Search]
      summary: Feature toggles the client should render against
      security: []
      operationId: getAppFlags
      responses:
        '200':
          description: >-
            The `flags` block of `AdminSettings`, and only that block.

            Public because these toggles decide what a **logged-out visitor** sees — the map view,
            the EMI calculator, the referral offer, whether signups are open at all. `GET
            /admin/settings` cannot serve them: it is admin-only in both directions on purpose,
            because the same document carries the fee table and the permission map. Before this
            route existed the client kept its own copy in local storage, so an operator could switch
            maintenance mode on, be told it saved, and watch the site carry on serving.

            **Absent means enabled.** The client's test is `flags[key] !== false`, so only toggles
            somebody has explicitly decided about appear here and `{}` is a correct answer for a
            fresh install. Values that are not booleans are omitted rather than forwarded.

            Deliberately one block, not a public projection of the settings document: `adminFlags`,
            `fees`, `permissions` and `geo` are not here, and the next block that needs an anonymous
            reader gets its own route.
          content:
            application/json:
              schema:
                type: object
                description: Flag name to explicit setting. Unlisted flags are enabled.
                additionalProperties: { type: boolean }
                example:
                  kycBadgeEnabled: true
                  boostEnabled: true
                  maintenanceMode: false
  /move-pack:
    get:
      tags: [Catalog & Search]
      summary: Move-in Pack launch state and price list
      security: []
      operationId: getMovePack
      responses:
        '200':
          description: >-
            The `movePack` block of `AdminSettings`, and only that block.

            Public for the reason `/fees` already settled: a price quoted to somebody who has not
            signed in is not a privileged fact, and this one is quoted on a page that renders for
            visitors who may never have an account. `GET /admin/settings` cannot serve it, because
            that document also carries the permission map.

            **Why not another key on `/flags`.** That endpoint's contract is map-of-boolean and it
            drops non-booleans on purpose, so it cannot carry a price list without giving up the
            guarantee that makes it safe to read blindly. Its own description asks the next block
            needing a public reader to make its own case rather than move in; this is that case.

            **Why `enabled` travels with the prices** instead of joining the flags: it decides
            whether the prices beside it may be shown at all, and configuration that has to be
            consistent should not be assembled from two responses that can arrive in either order
            or fail independently.

            **Absent means off**, which is the one place this endpoint must not agree with
            `/flags`. There, a flag nobody configured is enabled, so shipping a feature is a code
            change rather than a code change plus a config row. Applying that to a price would have
            an unconfigured install offering to sell at a number nobody chose. A missing,
            unparseable or malformed row therefore answers `enabled: false` with no prices, which
            puts the page in coming-soon mode and captures a waitlist signup instead of taking
            money.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovePackConfig' }
  /pricing:
    get:
      tags: [Catalog & Search]
      summary: What PuneNest charges for its own products
      security: []
      operationId: getPricing
      responses:
        '200':
          description: >-
            The platform's own price list: the two owner plans, the seeker contact top-up, the
            featured-listing fee, the platform's share of a rent agreement, and the two percentages
            that make up a rent-payment convenience charge.

            **Why this is not `/fees`.** That route answers what a *transaction* costs, keyed by
            deal intent, and most of what it quotes is not ours — stamp duty and registration are
            the state's, and the zero beside brokerage is the platform's entire pitch. This answers
            what PuneNest sells and for how much. Putting "the government takes 1% of the agreement
            value" and "Owner Pro is 4,999 a year" in one array of one shape would leave a reader
            unable to tell which of the two it was holding, so the two questions get two routes with
            names far enough apart that nobody has to check. `/fees` is unchanged.

            **Why not another key on `/flags`.** The answer `/move-pack` gives: that endpoint's
            contract is map-of-boolean and it drops everything else on purpose, so the guarantee
            that makes it safe to read blindly is exactly what a price list would cost it.

            **Public** for the reason `/fees` settled and `/move-pack` reused: a price quoted before
            the sign-up wall is not a privileged fact, and these are quoted on the plans page, the
            paywall and the boost dialog, two of which a visitor reaches without an account. `GET
            /admin/settings` cannot serve them, because that document also carries the permission
            map.

            **Seven named fields, not the `fees` block.** That block also holds the free contact
            allowance, the referral bonus, and `referralQualifyPerMonth` — the threshold past which
            a referral stops qualifying automatically and goes to the fraud desk. Publishing that
            would tell the one reader who most wants to know exactly where the line is. A projection
            would carry it; this response cannot, and the next key ops adds to the document is not
            published by accident.

            Never fails on bad configuration. Every value falls back to its seeded figure, because
            the callers are page renders and a 500 on the plans page is a worse answer to a mistyped
            price than the one the platform charged yesterday.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformPricing' }
  /geo:
    get:
      tags: [Catalog & Search]
      summary: Map coverage and place-suppression policy
      security: []
      operationId: getGeoPolicy
      responses:
        '200':
          description: >-
            The `geo` block of `AdminSettings`, projected and narrowed.

            Public because every part of it decides what a logged-out visitor is shown: where a map
            centres, whether a locality search box is hard-fenced to the city bounds or merely
            biased toward them, and which places are hidden from every suggestion box in the
            product. `GET /admin/settings` cannot serve it — that document also carries the fee
            table and the permission map. City launch status is served on `GET /cities`, not here.

            **Why not another key on `/flags`.** Same answer as `/move-pack`: that endpoint is
            typed map-of-boolean and drops everything else on purpose. Two of this block's three
            parts are a per-city roster of coordinates and an ordered list, so neither would
            survive the trip.

            **Everything here is an override.** The client ships built-in defaults — a centre, a
            bounding box and a launch status per city — and merges this response over them. There
            is deliberately no seeded `geo` row, so a fresh install answers `{}` and gets the
            built-in policy, which is the correct reading of an operator who has never opened the
            Maps panel. It also makes the endpoint safe to fail: unreachable leaves the client on
            defaults rather than on nothing.

            **Malformed values are dropped, not forwarded**, as on `/flags` and `/move-pack`. A
            centre missing a longitude is not a point and a box missing an edge is not a smaller
            box — it is a fence with a gap, and the search it fences would quietly start
            suggesting places from the next district. Dropping falls back to the built-in, which
            is the only other honest reading.

            **The operator's note is not here.** Each stored blacklist entry carries a free-text
            reason for hiding the place — moderator prose about a named building, written when
            staff were the readers. The client's matcher has never read it: it tests `placeId`
            exactly and `term` as a case-insensitive substring, and nothing else. So it is
            withheld from this anonymous route and stays on `/admin/settings`, where it belongs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoPolicy' }
  # ============================================================
  # 3. LISTINGS (owner listing lifecycle)
  # ============================================================
  /me/listings:
    get:
      tags: [Listings]
      summary: My posted properties
      operationId: myListings
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Create new listing
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Created (status = pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/listings/duplicate-check:
    post:
      tags: [Listings]
      summary: Have I already listed this property?
      operationId: checkOwnDuplicate
      description: >-
        Asked by the listing wizard before it submits, and answered **only** against the caller's own
        listings. The server derives the comparison key from the address exactly as `createListing`
        will — `LocalityResolver` for the slug, then `AddressKey` for the normalised line — so the
        pre-check and the write cannot disagree about what counts as the same doorway.


        This exists because the check used to happen in the browser, against whatever listings that
        browser's local store happened to hold. On a live API that is the seeded demo catalogue, so
        the wizard could refuse a real owner over a fixture and then offer to open an id the server
        had never issued.


        Two signals, OR'd, and the same two `listDuplicateCandidates` uses on the ops side: the
        electricity meter number, and the normalised address within a resolved locality. A listing
        the catalogue could not place has no locality slug, so it matches nothing on address — two
        listings nobody could file are not known to be in the same place. A tax ID (`pmcPropertyId`)
        is **not** a signal here; there is no such column, and declaring the field would read as
        coverage the server does not have.


        `POST` rather than `GET` because the body carries a meter number, which is the one identifier
        on a listing that names a real-world utility account — a query string would put it in the
        access log and the browser history. Nothing is written.


        Always `200`. "Yes, here is the one you already have" is an answer, not a refusal: there is
        no listing yet for the server to reject, and a `409` here would train clients to treat the
        routine outcome as an error and skip the call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDuplicateCheck' }
      responses:
        '200':
          description: Whether the caller already has this unit listed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDuplicateVerdict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/listings/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single listing detail
      operationId: getMyListing
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update listing (foundation-field changes cost a re-review)
      description: >-
        Partial update; only the fields present are applied. Every **foundation** field — the set a
        buyer can search on — earns a moderator's attention when its value actually changes, but not
        the same amount of it (Q14).


        Changing `locality`, `propertyType`, `bhk` or `deal` changes what the listing fundamentally
        *is*, so leaving it in search would return a wrong answer (a 2BHK under 3BHK, a rental under
        sale). The response comes back with `status: pending` and the listing is off search until a
        moderator re-approves it.


        Changing `price`, `furnishing` or `possession` changes an attribute of a listing that is
        still the same property, so the worst case is a briefly out-of-date value. The response
        keeps `status: approved`, the listing stays in search, and `recheckPending` comes back true
        with `recheckReason` naming the fields. A PATCH that does both is treated as the first: the
        full re-moderation covers the attribute change too, so no separate re-check is raised.


        Every other field (description, photos, deposit, address, …) publishes immediately and
        raises nothing.
      operationId: updateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Take a listing down
      operationId: archiveListing
      description: >
        **A soft archive, not a delete**, and the response is what says so: this hands back the
        listing it just archived rather than a `204`. The row survives with `archived: true`, drops
        out of search and off the public detail page, and stays reachable to its owner and to
        moderation.


        Returning the body is the point. The owner's dashboard needs to redraw the card in its
        archived state immediately, and a `204` would force a re-read of a listing that public
        search can no longer return. It is also the honest shape: nothing was destroyed, so claiming
        "no content" would misdescribe what happened.


        Enquiries, visits and moderation history that already reference this listing keep pointing
        at a real row. That is the reason for the archive rather than a hard delete -- a buyer's
        past conversation should not lose the flat it was about because the owner rented it out.


        A listing the caller does not own is a `404`, not a `403`: whether a stranger's listing id
        exists is not information this route owes an unrelated caller.
      responses:
        '200':
          description: 'The archived listing, `archived: true`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/listings/{id}/confirm-available:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Confirm this listing is still available
      description: >-
        The owner's answer to the freshness nudge. Stamps `lastConfirmedAt` to now, which is the
        entire write — the active/aging/stale/dormant state is derived from that instant on every
        read, so a listing that had gone dormant is visible again immediately.


        Deliberately narrow. It does **not** change `status`, so answering the nudge can never take
        a live listing out of search; it does **not** clear a pending re-check, so an owner cannot
        dismiss a moderator's queue entry by confirming availability; and it does **not** restore an
        archived listing. Those are the three ways a well-meant "also do the obvious thing" would
        turn the most-repeated owner action on the platform into a footgun.


        No request body — the path says the only thing this call can say, and the only date that
        matters is the server's. Idempotent: confirming an already-fresh listing simply re-stamps,
        because the owner cannot see which of their listings the badge currently considers stale.
      operationId: confirmListingAvailable
      responses:
        '200':
          description: The listing, with `lastConfirmedAt` updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/managed-properties:
    get:
      tags: [Listings]
      summary: My managed properties (private records, newest first)
      description: >-
        Owner-scoped "single-player" property records that live outside the searchable
        marketplace until published. Self-scoped by the JWT; no `x-roles`.
      operationId: myManagedProperties
      responses:
        '200':
          description: Managed properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Register a managed property (private)
      operationId: registerManagedProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPropertyCreate' }
      responses:
        '201':
          description: Created (visibility = private)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/managed-properties/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single managed property (owner)
      description: 404 (never 403) when the record is not the caller's, so another owner's record is never confirmed.
      operationId: getManagedProperty
      responses:
        '200':
          description: Managed property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update managed property (partial)
      operationId: updateManagedProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPropertyUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Delete managed property (owner)
      operationId: deleteManagedProperty
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/managed-properties/{id}/publish:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Publish a managed property into the marketplace
      description: >-
        Spawns a normal pending listing and links back to it. Idempotent — a record already
        published is returned unchanged with its `publishedListingId` set.
      operationId: publishManagedProperty
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/managed-properties/{id}/rent-receipts:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Manual rent receipts for one managed property (newest month first)
      description: >-
        Rent the owner recorded as received outside PuneNest's payment rail — cash or a bank
        transfer we never saw. Distinct from `/me/rent-payments`, which is the *tenant's* gateway
        payment and whose paid state is set by a webhook; nothing on this path reads or writes one.


        404 (never 403) when the property is not the caller's, so another owner's record is never
        confirmed.
      operationId: managedPropertyRentReceipts
      parameters:
        - name: months
          in: query
          required: false
          description: >-
            How many recent months to return. A page size, so out-of-range values are clamped to
            1..24 rather than rejected — a client asking for 5000 means "all of them".
          schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
      responses:
        '200':
          description: Recent receipts, newest `rentMonth` first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedRentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Listings]
      summary: Record one month's rent as received
      description: >-
        Mints an immutable receipt for `rentMonth`. The body carries the month and nothing else:
        amount, tenant, landlord and property address are snapshotted server-side from the owned
        property and the caller's own user row, because a rent receipt is a tax document and "the
        browser said so" is not a provenance for one. The snapshot is what lets a receipt handed
        over in August keep saying what it said in August after the rent is raised.


        Requires a property that is marked rented, carries a positive `monthlyRent` and names a
        tenant — otherwise 422. At most one receipt per property per month, enforced by a unique
        index, so a repeat is a deterministic 409 rather than a second document for one payment.


        Does **not** mark any gateway `RentPayment` as paid.
      operationId: recordManagedPropertyRentReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedRentReceiptCreate' }
      responses:
        '201':
          description: Receipt created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals:
    get:
      tags: [Listings]
      summary: All deals for my properties
      operationId: myDeals
      description: >
        Newest first, owner-scoped, paged. `deals` is unique per property, so this collection is as
        large as the caller's portfolio - an agency reading its whole book to render twenty cards is
        what the page replaces. No `sort` parameter: the order is fixed server-side.
      parameters:
