        availableFrom: { type: string, format: date }
        preferences:
          type: object
          properties:
            gender: { type: string, enum: [any, male, female] }
            foodPreference: { type: string, enum: [any, veg, non-veg] }
            occupation: { type: string }
        postedBy: { $ref: '#/components/schemas/Party' }
        createdAt: { type: string, format: date-time }
    ShareFlatPostCreate:
      type: object
      required: [title, locality, rentShare]
      properties:
        title: { type: string }
        locality: { type: string }
        rentShare: { $ref: '#/components/schemas/Money' }
        availableFrom: { type: string, format: date }
        preferences:
          type: object
          properties:
            gender: { type: string, enum: [any, male, female] }
            foodPreference: { type: string, enum: [any, veg, non-veg] }
            occupation: { type: string }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: offer.received }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: string }
        createdAt: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, success, warning] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    CmsService:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        link: { type: string }
    Faq:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
    Banner:
      type: object
      properties:
        id: { type: string }
        image: { type: string, format: uri }
        link: { type: string }
