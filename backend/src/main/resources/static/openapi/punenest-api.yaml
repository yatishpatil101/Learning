  /me/verification/aadhaar:
    get:
      tags: [Moderation]
      summary: Get own verification badge status
      operationId: getAadhaarStatus
      description: >
        Returns the caller's **opt-in** identity-verification badge (L2). Absence of a
        badge never blocks browsing, posting or contacting owners (ADR-019).
      responses:
        '200':
          description: Badge status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AadhaarVerification' }
    post:
      tags: [Moderation]
      summary: Start DigiLocker verification (earn the Verified badge)
      operationId: submitAadhaar
      description: >
        Starts the **Cashfree Secure ID DigiLocker** consent flow (ADR-009/017). The
        server returns a short-lived `verificationUrl`; the user completes Aadhaar + OTP +
        consent **on DigiLocker** (never on PuneNest), and the result is delivered
        asynchronously to the Cashfree webhook below. We never receive the raw Aadhaar
        number; dedup uses a composite `identity_hash` (ADR-009b). This is opt-in and only
        awards a trust badge + ranking boost — it is **not** required to use the platform.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycStartRequest' }
      responses:
        '202':
          description: Verification started — redirect the user to `verificationUrl`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStart' }
              examples:
                started:
                  summary: Redirect the user to DigiLocker consent
                  value: { ref: kyc_9f2a, verificationUrl: 'https://verification.cashfree.com/dl/9f2a', expiresAt: '2026-07-26T20:10:00Z' }
          links:
            pollBadgeStatus: { $ref: '#/components/links/PollKycBadge' }
        '409':
          description: >
            This identity is already linked to another account (one Aadhaar = one badge,
            ADR-009b). Fires only inside this opt-in flow; never blocks posting/contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: aadhaar_already_registered, message: This Aadhaar is already verified on another account, status: 409 }
        '422': { $ref: '#/components/responses/ValidationError' }
      externalDocs:
        description: Aadhaar-badge (DigiLocker) sequence & ADRs
        url: docs/system/platform-architecture.md
      callbacks:
        verificationResult: { $ref: '#/components/callbacks/DigilockerVerificationResult' }
  /webhooks/cashfree/digilocker:
    post:
      tags: [Moderation]
      summary: Cashfree DigiLocker verification webhook (provider → backend)
      operationId: cashfreeDigilockerWebhook
      security: []
      description: >
        Server-to-server callback from Cashfree Secure ID delivering
        `DIGILOCKER_VERIFICATION_SUCCESS` / failure. Authenticity is verified via the
        HMAC-SHA256 signature over `x-webhook-timestamp + rawBody` (ADR-017); the outbound
        prod call itself is signed with an RSA public-key signature (`X-Cf-Signature`,
        ADR-018). The success payload additionally carries the Aadhaar-linked `mobile`,
        used for the soft mobile-match signal (ADR-009a). Handlers must verify the
        signature, be idempotent, and always return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DigilockerWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /webhooks/cashfree/payment:
    post:
      tags: [Rentals & Payments]
      summary: Cashfree Payment Gateway webhook (provider → backend)
      operationId: cashfreePaymentWebhook
      security: []
      description: >
        Server-to-server callback from the Cashfree PG delivering the **terminal** payment
        outcome (`PAYMENT_SUCCESS_WEBHOOK` / failure) for rent, subscription, boost and
        service-order payments (ADR-017). This is the source of truth for payment state —
        the synchronous `201` on the initiating call is only `pending`. Authenticity is
        verified via the HMAC-SHA256 signature over `x-webhook-timestamp + rawBody`.
        Handlers must verify the signature, be idempotent (dedupe on `orderId`), and always
        return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /properties/{id}/verification:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
