      summary: Update user
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
