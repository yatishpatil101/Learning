  # D29. Internal notes: what the team knows about a case.
  #
  # Under /admin/notes rather than hanging off each of the four families (/properties/{id}/notes,
  # /users/{id}/notes, ...). Notes are one thing with one audience and one pair of permission atoms,
  # and four paths would be four chances for one of them to be guarded differently from the rest.
  #
  # entityType is the contract's word for the kind. Note `property`, not `listing` - the same
  # vocabulary gap the report target types document, closed the same way: the API keeps the
  # contract's word and the client bridges it, once, in its mapper.
  /admin/notes/{entityType}/{entityId}:
    parameters:
      - name: entityType
        in: path
        required: true
        description: The kind of thing the note is about.
        schema: { type: string, enum: [property, user, review, report] }
      - name: entityId
        in: path
        required: true
        description: >
          The target's id. Not resolved against its table - a note about a listing that is archived
          an hour later is exactly the note worth keeping.
        schema: { type: string }
    get:
      tags: [Moderation]
      summary: Internal notes on one entity (admin/staff)
      operationId: listInternalNotes
      description: >
        Newest first. Any member of staff or admin may read any note - deliberately
        inter-transparent, because notes are how one shift hands a case to the next.
      x-roles: [staff, admin]
      # A bare array, not a PageEnvelope. Per api-standards.md 5.1 the envelope is for collections
      # that grow with the platform; this one grows with a single case's history.
      responses:
        '200':
          description: Notes, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InternalNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Moderation]
      summary: Add an internal note (admin/staff)
      operationId: addInternalNote
      description: >
        The author is taken from the authenticated principal. There is no author field on the body:
        an author who can name themselves can also name somebody else.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalNoteCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/notes/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Moderation]
      summary: Correct an internal note (admin/staff)
      operationId: editInternalNote
      description: >
        Any member of staff may edit any note, not only its author. Notes are retained information
        rather than an audit record, and information that cannot be corrected is worse than
        information that can - the wrong version is the one that stays on the screen. The previous
        wording is written to the audit log before it is overwritten. `action` is not editable:
