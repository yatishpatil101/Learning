        headline: { type: string }
        position: { type: integer }

    # ---- Admin & Analytics ----
    AdminKpis:
      type: object
      properties:
        totalListings: { type: integer }
        activeListings: { type: integer }
        pendingModeration: { type: integer }
        totalUsers: { type: integer }
        newUsers7d: { type: integer }
        dealsClosed30d: { type: integer }
        revenue30d: { $ref: '#/components/schemas/Money' }
    AnalyticsPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
    AdminFinance:
      type: object
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        payoutsDue: { $ref: '#/components/schemas/Money' }
        payoutsCompleted: { $ref: '#/components/schemas/Money' }
        refunds: { $ref: '#/components/schemas/Money' }
        breakdown:
          type: array
          items:
            type: object
            properties:
              source: { type: string, example: subscriptions }
              amount: { $ref: '#/components/schemas/Money' }
    AdminSettings:
      type: object
      properties:
        contactUnlockLimit: { type: integer }
        aadhaarGateEnabled: { type: boolean }
        listingExpiryDays: { type: integer }
        boostEnabled: { type: boolean }
        maintenanceMode: { type: boolean }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actor: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string, example: property.approve }
        entity: { type: string, example: property }
        entityId: { type: string }
        checker: { type: string, nullable: true, description: Approver in maker-checker flows. }
        at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    SocietyLead:
      type: object
      properties:
        id: { type: string }
        societyName: { type: string }
        contactName: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        units: { type: integer }
        interest: { type: string, enum: [bulk-listing, society-services, partnership] }
        status: { type: string, enum: [new, contacted, qualified, won, lost] }
        createdAt: { type: string, format: date-time }
    SocietyLeadCreate:
      type: object
      required: [societyName, contactName, mobile]
      properties:
        societyName: { type: string }
        contactName: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        units: { type: integer }
        interest: { type: string, enum: [bulk-listing, society-services, partnership] }
