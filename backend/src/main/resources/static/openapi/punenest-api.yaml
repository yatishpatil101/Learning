        `/locality/{slug}`, from saved-search alerts and from its society's home list, however
        prominently it appears elsewhere.


        **This queue lives on the server.** Its predecessor read one browser's `localStorage`, which
        meant a listing waiting on a decision was invisible to every operator but the one whose
        machine happened to have seen it — the screen was clear because it was looking somewhere
        else, not because the work was done.


        Ordered approved-first, then oldest-first. An approved listing missing from every locality
