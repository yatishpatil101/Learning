openapi: 3.1.0
info:
  title: PuneNest API
  version: "1.3.0"
  summary: Pune-first real-estate marketplace backend API.
  description: |
    Enterprise API contract for **PuneNest**, a Pune-first real-estate marketplace
    (broker-optional listings, rentals, deals, services and back-office operations).

    **This specification is the single source of truth for the PuneNest HTTP API.**
    Endpoints, request/response shapes, and enums are defined here and nowhere else.
    Companion docs describe *behaviour and data*, not the wire contract:
      - `docs/system/data-model.md`     — ER map / DB persistence design (field shapes are the schemas below)
      - `docs/system/cross-cutting.md`  — auth, contact gate, maker-checker, audit rules
      - `docs/system/platform-architecture.md` — component/vendor decisions & ADRs (KYC, payments, verification posture)
      - `docs/system/package-structure.md` — the 11 bounded contexts and their package/schema mapping
      - `docs/flows/**`                 — per-feature behavioural specs

    ### Changelog
    - 1.3.0 — **Flatmates re-modelled around seeker intent.** The flatmates/rooms/groups triple is
      replaced by two feeds, `move-in` and `team-up` (`FlatmateTab`; the old values survive as
      deprecated read aliases). `FlatmatePost` is renamed `FlatmateSeekerPost` and re-shaped to what
      a seeker actually posts; `FlatmateRoom`, `FlatmateGroup`, `FlatmateRequest`, `FlatmateReview`,
      `GroupApplication`, `AgreementDoc`, `FlatmateAlertCriteria` and `HostEligibility` are new.
      New supply model: `RoomKind`, `PriceBasis` (per-room vs per-person rent), `Occupancy` and the
      flat occupancy ledger, plus the owner **flat split** (`POST|DELETE /properties/{id}/split`).
      Room enquiries carry a `ShareIntent`. The flatmates "Verified" pill is the **same** DigiLocker
      L2 badge as the rest of the app (ADR-009a), not a separate seeker OTP. `SavedSearch` gains
      `kind`/`criteria`/`label`/`mobile` and an `sms` channel for flatmate alerts. Moderation adds
      the ops flatmate-verification queue and the admin flatmate/group-application desks.
    - 1.2.0 — **Verification is a badge, not a gate** (ADR-019): browsing and contacting
      owners require only a signed-in mobile-OTP account (L1); identity verification is an
      **opt-in "Verified" badge** (L2) and is hard-required only at the deal step (L3).
      KYC moved to the **Cashfree Secure ID DigiLocker** consent flow (ADR-009/017): the
      submit endpoint now *starts* a redirect and resolves via webhook (no Aadhaar number is
      ever received); dedup is a composite `identity_hash` (ADR-009b) and mobile-match is a
      soft signal at MVP (ADR-009a). Contact `403 aadhaar_required` is replaced by
      `403 verification_required`, returned **only** when the target owner opted into
      "verified contact only".
    - 1.1.0 — Reconciled the role model to the canonical `buyer/owner/staff/admin`
      set (`staff` scoped by `team`); aligned `Team` to the ops teams; made this
      spec the sole API source of truth (retired the duplicate markdown catalogue).

    ## Conventions
    - Base path: `/api`
    - Auth: Bearer JWT (`Authorization: Bearer <token>`) unless marked public.
    - Pagination: `?page=0&size=20` (zero-indexed); responses use `PageEnvelope`.
    - Sort: `?sort=field,direction` (e.g. `sort=createdAt,desc`).
    - Dates: ISO-8601 UTC. Money: integer INR (paise-free rupees).
    - Errors: `{ "error": "code", "message": "human-readable", "status": 400 }`.
    - Soft-delete: archive/restore only — no hard DELETE for core aggregates.

    Tags map to **bounded contexts** to support future microservice decomposition.
  contact:
    name: PuneNest Platform Engineering
    url: https://punenest.example.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api
    description: Local development
  - url: https://staging.punenest.example.com/api
    description: Staging
  - url: https://api.punenest.example.com/api
    description: Production

tags:
  - name: Identity & Access
    description: Authentication, sessions, current-user profile, staff onboarding.
  - name: Catalog & Search
    description: Public property discovery, localities, cities, reference/fee data.
  - name: Listings
    description: Owner listing lifecycle (create, edit, deals, offers, visits).
  - name: Moderation
    description: Admin property/user moderation, verification, reports, audit.
  - name: Leads & Contact
    description: Contact-gate requests, enquiries, finalization (maker-checker).
  - name: Rentals & Payments
    description: Rent payments, mandates, payouts, tenancies, tenant profiles.
  - name: Documents
    description: Property documents, buyer document-access requests, sharing.
  - name: Services & Support
    description: Service tickets, support tickets, service workflows, agreements.
  - name: Billing & Growth
    description: Plans, boosts, service orders, referrals, fees.
  - name: Engagement
    description: Saved properties/searches, reviews, notifications, flatmates.
  - name: Admin & Analytics
    description: KPIs, analytics, platform settings, content/CMS, society leads.

externalDocs:
  description: >
    Behavioural flow specs (actors, screens, sequence) and the architecture / ADRs that
    this wire contract implements. Swagger documents the request/response of each call;
    these docs document the end-to-end journey across calls, actors and time.
  url: docs/system/platform-architecture.md

security:
  - bearerAuth: []

paths:
  # ============================================================
  # 1. IDENTITY & ACCESS
  # ============================================================
  /auth/login:
    post:
      tags: [Identity & Access]
      summary: Login via OTP-verified mobile
      security: []
      operationId: login
      description: >
        Dual-mode. Posting `mobile` **without** `otp` is the *send* step: a code is dispatched and
        the response is only `{ "otpSent": true }`. Posting `mobile` **with** `otp` is step 2 (L1):
        it verifies the code and returns access/refresh tokens. First-time mobiles are provisioned
        as `buyer` on successful verification, so no separate sign-up call exists. L1 sign-in is the
        only floor for participating (posting, enquiring, contacting owners) — identity verification
        is an opt-in badge on top (ADR-019). On success, call `getMe`.
      externalDocs:
        description: Auth / OTP sign-in flow (actors + screens)
        url: docs/flows/consumer/auth.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Either the OTP-send acknowledgement (`{ "otpSent": true }`) or, when `otp` was supplied
            and verified, the issued token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
          links:
            currentUser: { $ref: '#/components/links/GetCurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-login:
    post:
      tags: [Identity & Access]
      summary: Staff/admin login
      security: []
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Identity & Access]
      summary: Rotate the refresh token
      security: []
      operationId: refreshSession
      description: >
        Exchange a valid refresh token for a new access token and a new refresh token. Refresh
        tokens are **single-use**: the presented token is revoked and a replacement is returned, so
        a client must persist the new value. Replaying a spent token fails with 401 — clients should
        treat that as session loss and send the user back to sign-in. Because the refresh token is
        itself the credential, this endpoint takes no bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated — new token pair issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Identity & Access]
      summary: Invalidate current session
      operationId: logout
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Identity & Access]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Identity & Access]
      summary: Update own profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ============================================================
  # 2. CATALOG & SEARCH (public discovery + reference data)
  # ============================================================
  /properties:
    get:
      tags: [Catalog & Search]
      summary: List / search properties
      description: Full-text + faceted search. N+1-safe; owner contact is masked.
      security: []
      operationId: searchProperties
      parameters:
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string }, description: 'Locality *slug* (matches PropertySummary.localitySlug, not the display name)' }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - name: possession
          in: query
          description: >
            Exact match on possession state. Listings with no recorded possession are
            never returned by this facet.
          schema: { $ref: '#/components/schemas/PropertyPossession' }
        - { name: q, in: query, description: Free-text search, schema: { type: string } }
        - name: status
          in: query
          description: >
            Can only *narrow within* approved on this anonymous endpoint — the public floor
            (`approved`, non-archived) is unconditional, so any other value yields an empty page
            rather than unapproved rows. Use `listPropertiesForModeration` to search every status.
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged property summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertySummary' }
  /properties/featured:
    get:
      tags: [Catalog & Search]
      summary: Featured listings
      security: []
      operationId: featuredProperties
      responses:
        '200':
          description: Featured property summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertySummary' }
  /properties/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Catalog & Search]
      summary: Single property detail
      security: []
      operationId: getProperty
      responses:
        '200':
          description: Property detail (owner contact masked until contact gate passed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
  /localities:
    get:
      tags: [Catalog & Search]
      summary: All localities
      security: []
      operationId: listLocalities
      responses:
        '200':
          description: Localities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Locality' }
  /localities/{slug}:
    get:
      tags: [Catalog & Search]
      summary: Locality detail + listings
      security: []
      operationId: getLocality
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Locality detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /societies:
    get:
      tags: [Catalog & Search]
      summary: Browse societies (curated + MahaRERA + community)
      security: []
      operationId: listSocieties
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text name/builder search }
        - { name: locality, in: query, schema: { type: string }, description: Filter by locality slug }
        - { name: sort, in: query, schema: { type: string }, description: 'e.g. occupancy,desc' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Societies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Society' }
  /societies/{slug}:
    get:
      tags: [Catalog & Search]
      summary: Society hub detail (curated + community merged)
      security: []
      operationId: getSociety
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Society detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/societies/{slug}/follow:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [Engagement]
      summary: Follow a society
      operationId: followSociety
      responses:
        '204': { description: Followed }
    delete:
      tags: [Engagement]
      summary: Unfollow a society
      operationId: unfollowSociety
      responses:
        '204': { description: Unfollowed }
  /reels:
    get:
      tags: [Catalog & Search]
      summary: Short-video property reels feed
      security: []
      operationId: listReels
      parameters:
        - { name: locality, in: query, description: 'Locality slug (e.g. koregaon-park), not the display name.', schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Reels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reel' }
  /cities:
    get:
      tags: [Catalog & Search]
      summary: Available cities
      security: []
      operationId: listCities
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
  /cities/waitlist:
    post:
      tags: [Catalog & Search]
      summary: Join city waitlist
      security: []
      operationId: joinCityWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityWaitlistRequest' }
      responses:
        '201': { description: Added to waitlist }
        '422': { $ref: '#/components/responses/ValidationError' }
  /fees:
    get:
      tags: [Catalog & Search]
      summary: Current fee structure, one entry per deal intent
      security: []
      operationId: getFees
      responses:
        '200':
          description: >-
            Fee structure. Spec fix S24: an array, one entry per deal intent, not a single object.
            `platform_fees` is keyed by deal and the `Fees` schema itself carries a `deal` field, so
            a single object could never say which deal it described. A cost-transparency surface
            wants both sides at once, and an array needs no query parameter.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Fees' }
  # ============================================================
  # 3. LISTINGS (owner listing lifecycle)
  # ============================================================
  /me/listings:
    get:
      tags: [Listings]
      summary: My posted properties
      operationId: myListings
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Create new listing
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Created (status = pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/listings/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single listing detail
      operationId: getMyListing
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update listing (foundation-field changes revert status to pending)
      operationId: updateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/managed-properties:
    get:
      tags: [Listings]
      summary: My managed properties (private records, newest first)
      description: >-
        Owner-scoped "single-player" property records that live outside the searchable
        marketplace until published. Self-scoped by the JWT; no `x-roles`.
      operationId: myManagedProperties
      responses:
        '200':
          description: Managed properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Register a managed property (private)
      operationId: registerManagedProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPropertyCreate' }
      responses:
        '201':
          description: Created (visibility = private)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/managed-properties/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single managed property (owner)
      description: 404 (never 403) when the record is not the caller's, so another owner's record is never confirmed.
      operationId: getManagedProperty
      responses:
        '200':
          description: Managed property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update managed property (partial)
      operationId: updateManagedProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPropertyUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Delete managed property (owner)
      operationId: deleteManagedProperty
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/managed-properties/{id}/publish:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Publish a managed property into the marketplace
      description: >-
        Spawns a normal pending listing and links back to it. Idempotent — a record already
        published is returned unchanged with its `publishedListingId` set.
      operationId: publishManagedProperty
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/deals:
    get:
      tags: [Listings]
      summary: All deals for my properties
      operationId: myDeals
      description: >
        Newest first, owner-scoped, paged. `deals` is unique per property, so this collection is as
        large as the caller's portfolio - an agency reading its whole book to render twenty cards is
        what the page replaces. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged deals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Deal' }
  /me/deals/{propId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
    get:
      tags: [Listings]
      summary: Deal status for a property
      operationId: getDeal
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/deals/{propId}/reserve:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Mark property under offer
      operationId: reserveDeal
      description: >
        Marks the property under offer (deal state: available → reserved → closed/reopened).
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      responses:
        '200':
          description: Reserved
          links:
            closeThisDeal: { $ref: '#/components/links/CloseThisDeal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/deals/{propId}/close:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Close deal (sold/rented)
      operationId: closeDeal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealCloseRequest' }
      responses:
        '200': { description: Closed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}/reopen:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Reopen property
      operationId: reopenDeal
      responses:
        '200': { description: Reopened }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/deals/{propId}/parties:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Listings]
      summary: Under-offer parties
      operationId: listParties
      responses:
        '200':
          description: Parties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DealParty' }
    post:
      tags: [Listings]
      summary: Add party
      operationId: addParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealParty' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealParty' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}/parties/{partyId}:
    # Was `{idx}`, a positional integer index into the party list. That is racy and not
    # idempotent: two concurrent removals of "idx=0" delete two different people, and a
    # retried request deletes the wrong row. Changed to an opaque server-assigned id in
    # slice 4 — free to do now because no client consumes this endpoint yet (the frontend
    # deal provider is still mock-only); it becomes a breaking change once one does.
    parameters:
      - { $ref: '#/components/parameters/PropId' }
      - { name: partyId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Listings]
      summary: Remove party
      operationId: removeParty
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/offers:
    get:
      tags: [Listings]
      summary: Offers on my properties
      operationId: offersOnMine
      description: >
        Newest first, owner-scoped, paged. Every row here is written by a *buyer*, so the collection
        grows with demand for the listing rather than with anything its owner did - the owner an
        unpaged read punishes is the successful one. No `sort` parameter: the order is fixed
        server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged offers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }
  /offers/mine:
    get:
      tags: [Listings]
      summary: My submitted offers
      operationId: myOffers
      description: >
        Newest first, caller-scoped, paged - the mirror of `offersOnMine` over the same table. Paged
        in step with it so the response shape does not depend on which side of a negotiation the
        caller is on. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged offers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }
  /offers:
    post:
      tags: [Listings]
      summary: Submit offer
      operationId: submitOffer
      description: >
        Buyer submits a price offer on a listing. The owner then accepts / declines /
        counters via `respondOffer` (negotiation loop).
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferCreate' }
      responses:
        '201':
          description: Offer submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
          links:
            respondToOffer: { $ref: '#/components/links/RespondToOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /offers/{id}/respond:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Listings]
      summary: Accept / decline / counter an offer
      operationId: respondOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferResponse' }
      responses:
        '200': { description: Responded }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /visits:
    get:
      tags: [Listings]
      # Was summarised "All visits (admin)" but carried no `x-roles`, so as written any
      # signed-in user could read every visit on the platform — visitor name, mobile,
      # property address and time. A privacy breach by omission. Rescoped in slice 4 to the
      # caller's own visits, which is what the frontend actually consumes (VisitsTab). A
      # genuine admin surface can be added later with an explicit `x-roles: [admin]`.
      summary: Visits the caller booked
      operationId: listVisits
      description: >
        Newest first, caller-scoped, paged - the mirror of `myVisitRequests` over the same table.
        Paged in step with it so the response shape does not depend on which end of a visit the
        caller is on. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Visit' }
    post:
      tags: [Listings]
      summary: Schedule visit
      operationId: scheduleVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitCreate' }
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/visit-requests:
    get:
      tags: [Listings]
      summary: Visit requests on my properties
      operationId: myVisitRequests
      description: >
        Newest first, owner-scoped, paged. A booking here is made by a *visitor*, so the collection
        grows with demand for the listing rather than with anything its owner did. No `sort`
        parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged visit requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Visit' }
  /visit-requests:
    post:
      tags: [Listings]
      summary: Request a visit
      operationId: requestVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
  /visit-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Listings]
      summary: Confirm / cancel visit
      operationId: updateVisitStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /visits/{id}/slot:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Listings]
      # D87: reschedule moves the slot in place and returns the visit to `scheduled` so the other
      # party re-confirms. Either participant may call it; a terminal visit is a 409.
      summary: Reschedule visit to a new slot
      operationId: rescheduleVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitSlotUpdate' }
      responses:
        '200': { description: Rescheduled }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ============================================================
  # 4. MODERATION (admin property/user moderation, verification, reports)
  # ============================================================
  /properties/{id}/status:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Approve / reject listing
      operationId: setPropertyStatus
      # S28: Approving/rejecting a listing is the core moderation task.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyStatusUpdate' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/toggle-featured:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Toggle featured flag
      operationId: toggleFeatured
      # S28: Merchandising a listing on the homepage.
      x-roles: [staff, admin]
      responses:
        '200': { description: Toggled }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/flag:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Flag listing
      operationId: flagProperty
      # S28: Raising a moderation flag.
      x-roles: [staff, admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Flagged }
    delete:
      tags: [Moderation]
      summary: Clear flag
      operationId: clearFlag
      # S28: Clearing a moderation flag.
      x-roles: [staff, admin]
      responses:
        '204': { description: Cleared }
  /properties/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Archive listing (soft-delete)
      operationId: archiveProperty
      # S28: deliberately NO x-roles. DUAL AUDIENCE: the owner soft-deleting their own listing, or staff/admin taking one down. Role-gating this would remove an owner's ability to delete their own listing. Guard is owner-or-staff, enforced server-side.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived listing
      operationId: restoreProperty
      # S28: deliberately NO x-roles. DUAL AUDIENCE: see archiveProperty.
      responses:
        '200': { description: Restored (status reset to pending) }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/rooms:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Listings]
      summary: Rooms this flat is split into
      description: Returns the per-room supply plus the flat's occupancy ledger.
      operationId: listPropertyRooms
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlatmateRoom' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/split:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Listings]
      summary: Let this flat room by room
      description: >
        Owner-only, rent-only, once-only. The whole-flat listing keeps existing. Rooms start at
        `identity` tier and unbadged while the parent listing is pending; they are promoted to
        `owner` tier when Ops approves the flat — the badge is earned from the parent's approval,
        never asserted by the act of splitting.
      operationId: splitFlat
      externalDocs: { description: Behaviour, url: docs/flows/consumer/list-property-wizard.md }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatSplitRequest' }
      responses:
        '201':
          description: Split created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatSplitResult' }
        '403': { description: Caller is not the listing's owner (`not_owner`) }
        '409':
          description: '`already_split`, `not_splittable` (sale listing), or blocked by the host-eligibility guardrails.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Stop letting this flat room by room
      description: Refused once anyone has moved in — deleting the rooms would erase a live tenancy.
      operationId: unsplitFlat
      responses:
        '204': { description: Split withdrawn }
        '409': { description: Someone has already moved in (`occupied`) }
  /properties/{id}/admin:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Admin update of property fields
      description: >
        Admin field-level update. NOTE — the source contract reuses
        `PATCH /properties/{id}`; disambiguated here from the public getter to
        avoid method/verb collision (documented assumption).
      operationId: adminUpdateProperty
      # S28: Editing another user's listing to correct it.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        # Slice-15 spec fix S67. The one path that edits a listing the caller does not own had
        # no failure documented at all, so "id does not exist" was undefined behaviour.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users:
    get:
      tags: [Moderation]
      summary: List all users (admin)
      operationId: listUsers
      # S28: Ops needs to find a user to help them; mobile is masked on the list.
      x-roles: [staff, admin]
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: User detail + listings
      operationId: getUser
      # S28: Ops needs the contact detail to act on a case; the reveal is audited.
      x-roles: [staff, admin]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Moderation]
      summary: Update user
      operationId: adminUpdateUser
      # S28: Editing another person's profile is not a daily ops action.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Archive user (soft-delete)
      operationId: archiveUser
      # S28: Suspending a person from the platform.
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
  /users/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived user
      operationId: restoreUser
      # S28: Reinstating a suspended person.
      x-roles: [admin]
      responses:
        '200': { description: Restored }
  /users/staff:
    post:
      tags: [Moderation]
      summary: Add staff member
      operationId: addStaff
      # S28: PRIVILEGE ESCALATION. Only an admin may mint a colleague an account.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/verification/aadhaar:
    get:
      tags: [Moderation]
      summary: Get own verification badge status
      operationId: getAadhaarStatus
      # S28: deliberately NO x-roles. The caller's own KYC badge. /me/** self-scoping is the guard.
      description: >
        Returns the caller's **opt-in** identity-verification badge (L2). Absence of a
        badge never blocks browsing, posting or contacting owners (ADR-019).
      responses:
        '200':
          description: Badge status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AadhaarVerification' }
    post:
      tags: [Moderation]
      summary: Start DigiLocker verification (earn the Verified badge)
      operationId: submitAadhaar
      # S28: deliberately NO x-roles. The caller's own KYC submission. /me/** self-scoping is the guard.
      description: >
        Starts the **Cashfree Secure ID DigiLocker** consent flow (ADR-009/017). The
        server returns a short-lived `verificationUrl`; the user completes Aadhaar + OTP +
        consent **on DigiLocker** (never on PuneNest), and the result is delivered
        asynchronously to the Cashfree webhook below. We never receive the raw Aadhaar
        number; dedup uses a composite `identity_hash` (ADR-009b). This is opt-in and only
        awards a trust badge + ranking boost — it is **not** required to use the platform.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycStartRequest' }
      responses:
        '202':
          description: Verification started — redirect the user to `verificationUrl`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStart' }
              examples:
                started:
                  summary: Redirect the user to DigiLocker consent
                  value: { ref: kyc_9f2a, verificationUrl: 'https://verification.cashfree.com/dl/9f2a', expiresAt: '2026-07-26T20:10:00Z' }
          links:
            pollBadgeStatus: { $ref: '#/components/links/PollKycBadge' }
        '409':
          description: >
            This identity is already linked to another account (one Aadhaar = one badge,
            ADR-009b). Fires only inside this opt-in flow; never blocks posting/contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: aadhaar_already_registered, message: This Aadhaar is already verified on another account, status: 409 }
        '422': { $ref: '#/components/responses/ValidationError' }
      externalDocs:
        description: Aadhaar-badge (DigiLocker) sequence & ADRs
        url: docs/system/platform-architecture.md
      callbacks:
        verificationResult: { $ref: '#/components/callbacks/DigilockerVerificationResult' }
  /webhooks/cashfree/digilocker:
    post:
      tags: [Moderation]
      summary: Cashfree DigiLocker verification webhook (provider → backend)
      operationId: cashfreeDigilockerWebhook
      # S28: deliberately NO x-roles. security: [] — a server-to-server callback authenticated by HMAC, not a role.
      security: []
      description: >
        Server-to-server callback from Cashfree Secure ID delivering
        `DIGILOCKER_VERIFICATION_SUCCESS` / failure. Authenticity is verified via the
        HMAC-SHA256 signature over `x-webhook-timestamp + rawBody` (ADR-017); the outbound
        prod call itself is signed with an RSA public-key signature (`X-Cf-Signature`,
        ADR-018). The success payload additionally carries the Aadhaar-linked `mobile`,
        used for the soft mobile-match signal (ADR-009a). Handlers must verify the
        signature, be idempotent, and always return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DigilockerWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /webhooks/cashfree/payment:
    post:
      tags: [Rentals & Payments]
      summary: Cashfree Payment Gateway webhook (provider → backend)
      operationId: cashfreePaymentWebhook
      security: []
      description: >
        Server-to-server callback from the Cashfree PG delivering the **terminal** payment
        outcome (`PAYMENT_SUCCESS_WEBHOOK` / failure) for rent, subscription, boost and
        service-order payments (ADR-017). This is the source of truth for payment state —
        the synchronous `201` on the initiating call is only `pending`. Authenticity is
        verified via the HMAC-SHA256 signature over `x-webhook-timestamp + rawBody`.
        Handlers must verify the signature, be idempotent (dedupe on `orderId`), and always
        return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /properties/{id}/verification:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: Get property review thread
      operationId: getPropertyVerification
      # S28: deliberately NO x-roles. The owner<->ops clarification thread; the owner is a participant. Guard is participant-or-staff.
      responses:
        '200':
          description: Review thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
    post:
      tags: [Moderation]
      summary: Initiate property review
      operationId: initPropertyVerification
      # S28: deliberately NO x-roles. The owner submits their listing for review. Guard is participant-or-staff.
      responses:
        '201': { description: Initiated }
  /properties/{id}/verification/messages:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Add message to review
      operationId: addVerificationMessage
      # S28: deliberately NO x-roles. Both sides of the thread post here. Guard is participant-or-staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201': { description: Added }
  /properties/{id}/verification/read:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Mark review messages read
      operationId: markVerificationRead
      # S28: deliberately NO x-roles. Either participant marks their own side read. Guard is participant-or-staff.
      responses:
        '204': { description: Marked }
  /properties/{id}/verification/decision:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Approve / reject property (admin)
      operationId: verificationDecision
      # S28: The checker half of the maker-checker listing review.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200': { description: Decided }
        '403': { $ref: '#/components/responses/Forbidden' }
  # S30 (slice 9): PATCH /reports/{id} ADDED.
  #
  # The contract shipped an abuse queue that could be written to (POST) and read (GET) but never
  # worked: there was no verb to move a report out of `open`. The Report schema has declared a
  # four-state `status` (open/reviewing/actioned/dismissed) since V7 and nothing could ever set it,
  # so the queue could only grow and two moderators had no way to avoid handling the same report
  # twice. Triage is the operation that makes the other two worth having.
  #
  # Scoped deliberately narrowly: this moves the *report's* state. Acting on the thing reported is
  # a separate, already-specified operation (PATCH /properties/{id}/status,
  # PATCH /users/{id}/archive, PATCH /reviews/{id}/status), so that a moderator's judgement on the
  # complaint and the takedown itself stay two auditable events rather than one hidden side effect.
  /reports/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Moderation]
      summary: Triage a report
      operationId: triageReport
      # S30: Working the abuse queue is the daily ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportTriage' }
      responses:
        '200':
          description: Triaged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # S31 (slice 9): PATCH /reviews/{id}/status ADDED.
  #
  # Reviews were the one piece of user-generated content on the platform with no takedown at all.
  # A review can name a person, allege fraud, and sit permanently on their listing; `reports`
  # accepts `targetType: review`, so the contract already assumed a moderator could act on one, but
  # gave them nothing to act with. Slice 8 recorded this as its single accepted risk and handed it
  # here.
  #
  # No new column: `reviews.status` already carries moderation state, and every read filters
  # status = 'published' -- including the rating aggregate -- so 'rejected' removes the review from
  # the listing and from the score it was moving. See V18 for the reasoning in full.
  /admin/properties:
    get:
      tags: [Moderation]
      summary: Listing moderation queue
      operationId: listPropertiesForModeration
      description: >
        Listings of every status including archived, newest first. The moderation writes
        (`setPropertyStatus`, `toggleFeatured`, `flagProperty`, `clearFlag`, `adminUpdateProperty`)
        all address a listing by id and shipped without any read that could produce one for an
        unapproved listing: `searchProperties` pins `status='approved' AND archived=false`
        unconditionally — it takes no principal, so it cannot relax for staff — and `myListings` is
        scoped to the caller's own account. Unlike `searchProperties`, `status` here *widens*.
        Owner contact is masked, as on every ops surface.
      x-roles: [staff, admin]
      parameters:
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string }, description: 'Locality *slug*, as on searchProperties' }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - { name: possession, in: query, schema: { $ref: '#/components/schemas/PropertyPossession' } }
        - { name: q, in: query, description: Free-text over title + locality, schema: { type: string } }
        - name: status
          in: query
          description: Narrow to one moderation status. Omit for every status.
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - name: archived
          in: query
          description: >
            Tri-state. Omit for both live and archived listings; `true` for archived only; `false`
            for live only. A separate axis from `status` — archiving preserves the moderation state
            the listing was archived from.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listings, every status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Property' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reviews:
    get:
      tags: [Moderation]
      summary: Review moderation queue
      operationId: listReviewsForModeration
      description: >
        Reviews of every status, newest first. The counterpart `setReviewStatus` shipped without
        this, so a moderator could act on a review only if they already had its id — in practice,
        only ones that had been reported. Reviews are post-moderated (published on write), so the
        useful filters are `rejected` (what has been taken down) and no filter at all.
      x-roles: [staff, admin]
      parameters:
        - name: status
          in: query
          description: Narrow to one moderation status. Omit for the whole queue.
          schema: { type: string, enum: [pending, published, rejected] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }
  /reviews/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Moderation]
      summary: Publish or take down a review
      operationId: setReviewStatus
      # S31: Taking down defamatory or fake content is the daily ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewStatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reports:
    get:
      tags: [Moderation]
      summary: All listing reports (admin)
      operationId: listReports
      # S28: The trust & safety queue. Anyone may file; only ops may read.
      x-roles: [staff, admin]
      # S32 (slice 9): was a bare array. Every signed-in user can add to this queue and only ops
      # can take anything out of it, which makes it the clearest growth case on the platform
      # (api-standards.md §5.1). No `Sort`: newest-first is fixed server-side and index-backed by
      # idx_reports_status_created / idx_reports_created, added in V18.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          description: Filter to one triage state. Omitted returns the whole queue.
          schema: { type: string, enum: [open, reviewing, actioned, dismissed] }
      responses:
        '200':
          description: Paged reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Report' }
    post:
      tags: [Moderation]
      summary: Report a listing
      operationId: createReport
      # S28: deliberately NO x-roles. Any signed-in user must be able to report abuse — that is the whole point of the queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
  /admin/flatmate-reviews:
    get:
      tags: [Moderation]
      summary: Flatmate host-verification queue (ops)
      description: >
        Tenant-tier posts, contested addresses and flat splits whose parent listing is still
        pending. Owner-tier posts are vetted through the listing's own documents and never appear.
      operationId: listFlatmateReviews
      externalDocs: { description: Behaviour, url: docs/flows/ops/service-queues.md }
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateReview' }
  /admin/flatmate-reviews/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Decide a flatmate host verification
      description: A rejection requires a reason — the host is always told why.
      operationId: decideFlatmateReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateReview' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/flatmates/moderation:
    get:
      tags: [Moderation]
      summary: The flatmate moderation queue
      description: >
        What is waiting to be let out. Since D72 a seeker post, room or group starts `pending` and
        is invisible on every consumer surface until a moderator decides; this is where that backlog
        is seen. Oldest first, because a queue served newest-first starves the person who has been
        waiting longest.


        Distinct from `/admin/flatmate-reviews`, which is the **verification** queue — "has this
        host proved what they claimed". An unbadged post and an unvetted post are different things.


        One `kind` per call. Posts, rooms and groups are three tables with three shapes; a merged
        board could not page without either loading every pending row or reporting a total that is
        true of one table and false of the screen.


        The author's mobile is deliberately absent. Deciding whether a post may be published does
        not require ringing the person, and a number on every row of a paged staff screen is a bulk
        contact list one screenshot away from leaving the building.
      operationId: listFlatmateModerationQueue
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [post, room, group], default: post }
          description: Which board to page through.
        - name: modStatus
          in: query
          schema: { $ref: '#/components/schemas/FlatmateModStatus' }
          description: >
            Defaults to `pending`, which is the queue. Any other state is accepted so a team can
            review its own past decisions.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateModerationQueueItem' }
  /admin/flatmates/{id}/moderation:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Moderate a flatmate seeker post, room or group
      description: >
        Admin moderation axis only. It must never write a group application's owner decision, and
        a `flagged` / `removed` post must disappear from every consumer feed, the map and the alert
        matcher — not merely change a label.
      operationId: moderateFlatmatePost
      externalDocs: { description: Behaviour, url: docs/flows/admin/flatmates-moderation.md }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modStatus]
              properties:
                modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
                note: { type: string, description: Internal note, never exposed to consumers. Expected on flag/remove. }
      responses:
        '200': { description: Moderated }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/group-applications:
    get:
      tags: [Moderation]
      summary: Flatmate group applications
      operationId: listGroupApplications
      description: Newest first. Paged — a platform-wide board with no per-caller scoping.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/GroupApplication' }
  /admin/group-applications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Moderate a group application
      operationId: decideGroupApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modStatus]
              properties:
                modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
                note: { type: string }
      responses:
        '200':
          description: Moderated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
  # ============================================================
  # 5. LEADS & CONTACT (contact gate, enquiries, finalization)
  # ============================================================
  /contacts/status:
    get:
      tags: [Leads & Contact]
      summary: Check contact status for a property
      operationId: contactStatus
      parameters:
        - { name: propertyId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Contact status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactStatus' }
  /contacts/request:
    post:
      tags: [Leads & Contact]
      summary: Request owner's contact (requires sign-in)
      operationId: requestContact
      description: >
        Requires only a signed-in mobile-OTP account (L1) — identity verification is **not**
        a prerequisite (ADR-019). Returns `401` if unauthenticated. Returns
        `403 verification_required` **only** when the target owner has opted into
        "verified contact only" and the caller has no Verified badge (L2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequestCreate' }
      externalDocs:
        description: Contact-gate & leads flow (badge-not-gate)
        url: docs/flows/consumer/contact-gate-leads.md
      responses:
        '200':
          description: Requested — the owner is notified; contact unlocks now or on approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactStatus' }
              examples:
                approved:
                  summary: Contact approved
                  value: { status: approved, verifiedContactOnly: false, verificationRequired: false }
                pendingOwner:
                  summary: Awaiting owner approval
                  value: { status: pending, verifiedContactOnly: false, verificationRequired: false }
          links:
            checkStatus: { $ref: '#/components/links/CheckContactStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Owner accepts verified contacts only — earn the Verified badge to proceed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: verification_required, message: This owner only accepts verified contacts, status: 403 }
  /me/contact-requests:
    get:
      tags: [Leads & Contact]
      summary: View incoming contact requests (owner)
      operationId: myContactRequests
      description: >
        Newest first, owner-scoped. Paged: this collection grows with inbound demand rather than with
        the owner's own actions, so a popular listing is exactly what makes it large. Use
        `myPendingContactCount` for the "waiting on you" badge - counting one page under-reports.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ContactRequest' }
  /me/contact-requests/pending-count:
    get:
      tags: [Leads & Contact]
      summary: Count of contact requests awaiting the owner
      operationId: myPendingContactCount
      description: >
        The owner's "waiting on you" badge. Counted server-side because `myContactRequests` is paged:
        filtering one page client-side is the wrong number precisely for the owner who has enough
        leads to need the badge.
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { type: integer, example: 3 }
  /me/contact-requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Leads & Contact]
      summary: Approve / decline contact request
      operationId: respondContactRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
  # Slice-12 spec fix S45. `GET /enquiries` and the `Enquiry` schema were removed here,
  # executing the sunset this document wrote for itself in slice 4: "NOT IMPLEMENTED and will not
  # be. Sunset: remove from this spec once the admin lead views land." Those views shipped in
  # slice 8. Nothing in the platform writes an `enquiries` row -- the contact-request surface
  # (ADR-019) replaced it before either was implemented -- so the operation could only ever have
  # returned an empty page, which is a worse admin surface than none. V22 drops the table.
  /messages:
    get:
      tags: [Leads & Contact]
      summary: Current user's conversations (in-app inbox)
      operationId: myMessages
      description: >
        Most recent first. Paged: an owner's inbox grows with inbound enquiries rather than with
        their own activity, so it is demand-driven and uncapped.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Conversation' }
    post:
      tags: [Leads & Contact]
      summary: Start a conversation (e.g. owner-buyer chat after contact-gate)
      description: >-
        Requires an existing relationship: the caller holds an approved contact request against a
        listing the counterparty owns, or the counterparty holds one against a listing the caller
        owns. Staff and admin may always open a thread.


        Without that rule this operation is a mobile-enumeration oracle -- a distinguishable answer
        for "registered" and "not registered" turns the endpoint into a way to test a list of phone
        numbers against the user base, and an unsolicited-message channel to anyone whose number
        leaked from anywhere else. The refusal is therefore identical in both cases.
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        # Slice-12 spec fix S48. 200 as well as 201: starting a conversation that already exists
        # returns the existing one rather than forking the thread, and the status says which
        # happened. The 403 was undeclared and is the load-bearing rule of this operation -- see
        # the description above.
        '200':
          description: The conversation already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Leads & Contact]
      summary: Conversation detail with message thread
      operationId: getConversation
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/reply:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Send a message in a conversation
      operationId: replyConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        # Slice-12 spec fix S48: a conversation the caller is not a participant in is a 404, not a
        # 403 -- confirming that a thread exists is itself the disclosure.
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Mark a conversation as read
      operationId: readConversation
      responses:
        '204': { description: Marked read }
        '404': { $ref: '#/components/responses/NotFound' }  # Slice-12 spec fix S48
  /me/finalization-requests:
    get:
      tags: [Leads & Contact]
      summary: Pending finalization requests (owner)
      operationId: myFinalizationRequests
      description: >
        Newest first, counterparty-scoped, pending only, paged. Every row is a proposal a buyer aimed
        at the caller, so the collection grows with inbound demand. No `sort` parameter: the order is
        fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FinalizationRequest' }
  /finalization/{propId}/request:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Leads & Contact]
      summary: Request to finalize deal (buyer, maker step)
      operationId: requestFinalization
      description: >
        Maker step of the maker-checker finalization (buyer). The owner then accepts
        (checker step) — the deal-verified moment (L3) where hard KYC / mobile-match may be
        required of both parties (ADR-009a/019). Track via `finalizationStatus`.
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizationCreate' }
      responses:
        '200':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
          links:
            trackStatus: { $ref: '#/components/links/FinalizationStatus' }
  /finalization/{propId}/status:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Leads & Contact]
      summary: My finalization status
      operationId: finalizationStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
    delete:
      tags: [Leads & Contact]
      summary: Cancel my finalization request (buyer)
      operationId: cancelFinalization
      responses:
        '204': { description: Cancelled }
  /finalization/requests/{reqId}/accept:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Accept finalization (owner, checker step)
      description: >
        Accepting closes the property's deal and auto-declines every other pending
        finalization request on it, in one transaction.

        NOT YET IMPLEMENTED: for rent deals this should also create a tenancy record.
        Deferred to the rent/tenancy slice, which owns the tenancy invariants -- writing
        tenancy rows from here would mean retrofitting rules onto rows this slice created.
      # Slice-4 spec fix S7. This used to require a FinalizationAccept body of
      # { accept: boolean, note: string }. Both fields were dead. `accept` is redundant and
      # actively ambiguous on an endpoint literally named /accept -- there is a sibling
      # /decline, so it is unclear what POST /accept with { accept: false } should mean, and
      # any answer is a trap. `note` had no column to land in and no client that sent it, so
      # the server would have accepted it and silently dropped it, which is worse than not
      # offering the field: the caller believes it was recorded. Removed rather than backed
      # with a migration, because nothing reads it.
      operationId: acceptFinalization
      responses:
        '200': { description: Accepted }
  /finalization/requests/{reqId}/decline:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Decline finalization (owner)
      operationId: declineFinalization
      responses:
        '200': { description: Declined }
  # ============================================================
  # 6. RENTALS & PAYMENTS (finance, rent, mandates, tenancies)
  # ============================================================
  /me/finances/{propId}/transactions:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Transactions list (owner)
      operationId: listTransactions
      # S25 (pagination pass): was a bare array. A property's ledger accrues rows on a schedule and
      # is never culled, so its size tracks how long the property has been held, not anything the
      # caller did -- api-standards.md §5.1 ("scope is not the test; growth is"). No `Sort`: the
      # order is fixed server-side (date desc, createdAt desc) and index-backed by
      # idx_transactions_property.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
    post:
      tags: [Rentals & Payments]
      summary: Add transaction
      operationId: addTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /me/finances/{propId}/transactions/{txnId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
      - { name: txnId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Rentals & Payments]
      summary: Update transaction
      operationId: updateTransaction
      # S19 (slice 5): this PATCH took TransactionCreate, whose `required: [type, amount, date]`
      # makes it a PUT wearing a PATCH's name - a client correcting a typo in `note` was obliged to
      # resend the type, amount and date, and any field it forgot to echo would be rejected or
      # silently reset. The mock has always sent a partial patch ({...txn, ...patch}), so the
      # contract as written could not express the call the UI actually makes. TransactionUpdate has
      # no required fields; an absent key means "leave it alone".
      #
      # The 200 also had no response body, so a client had no way to see the server's own view of
      # the row it had just changed (notably the re-derived recurrence) without re-listing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { description: No such transaction on this property }
    delete:
      tags: [Rentals & Payments]
      summary: Delete transaction
      operationId: deleteTransaction
      responses:
        '204': { description: Deleted }
  /me/finances/{propId}/basis:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Ownership basis
      operationId: getBasis
      responses:
        '200': { description: Basis, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipBasis' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Set ownership basis
      operationId: setBasis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipBasis' }
      responses:
        '200': { description: Saved }
  /me/finances/{propId}/summary:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Income / expense / net summary
      operationId: financeSummary
      # S18 (slice 5): the summary and cashflow reads took no window parameter, but the Finances
      # tab has always had a period selector (All time / This month / This quarter / This year) and
      # a 12-month chart. With no parameter the endpoint can only ever answer "all time", so the
      # selector would have had nothing to send and the server would have had to be re-specified
      # the first time anyone used it. The period is the client's question; the aggregate is the
      # server's answer, so the question belongs in the request.
      parameters:
        - name: period
          in: query
          description: >
            Window the totals are computed over. `year` is the Indian financial year (1 April -
            31 March), not the calendar year - that is the year an owner files against.
          schema: { type: string, enum: [all, month, quarter, year], default: all }
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSummary' } } } }
  /me/finances/{propId}/cashflow:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Monthly cashflow
      operationId: financeCashflow
      parameters:
        - name: months
          in: query
          description: How many months back to project, ending with the current month.
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200':
          description: Cashflow series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashflowPoint' }
  /me/finances/{propId}/dues:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Upcoming dues
      operationId: financeDues
      responses:
        '200':
          description: Dues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Due' }
  /me/rent-payments:
    get:
      tags: [Rentals & Payments]
      summary: My rent payments
      operationId: myRentPayments
      # S25 (pagination pass): was a bare array. A rent ledger grows a row a month for as long as the
      # tenancy runs -- time-driven, not action-driven (api-standards.md §5.1). No `Sort`: the order
      # is fixed server-side (dueDate desc, createdAt desc).
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/RentPayment' }
    post:
      tags: [Rentals & Payments]
      summary: Pay rent (tenant)
      operationId: payRent
      description: >
        Initiates a rent payment via the Cashfree Payment Gateway (ADR-017). The `201`
        records the payment as **pending**; its terminal state (`success` / `failed`) is
        confirmed asynchronously by Cashfree via the payment webhook (see `callbacks`).
        Treat the returned record as pending until the webhook confirms.
      externalDocs:
        description: Rent & tenancy payment flow
        url: docs/flows/consumer/rent-tenancy.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentPaymentCreate' }
      responses:
        '201':
          description: Payment initiated (pending until the webhook confirms).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentPayment' }
        # S23 (slice 6): the operation declared only 201/422 while the server also answers 404 and
        # 409. An undeclared status is worse than a wrong one -- a generated client has no branch
        # for it, so a stale-amount rejection surfaces to the tenant as an unhandled error rather
        # than "the rent changed, please confirm again".
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /me/rent-ledger:
    get:
      tags: [Rentals & Payments]
      summary: Received payments (owner)
      operationId: rentLedger
      # S25 (pagination pass): was a bare array, and this is the worst of the three -- an owner's
      # ledger spans every tenancy on every listing they have ever let, so it grows with portfolio
      # size *and* with time (api-standards.md §5.1). No `Sort`: order fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/RentPayment' }
  /me/rent-mandate:
    get:
      tags: [Rentals & Payments]
      summary: Current autopay mandate
      operationId: getMandate
      responses:
        '200': { description: Mandate, content: { application/json: { schema: { $ref: '#/components/schemas/RentMandate' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Set up autopay mandate
      operationId: setMandate
      # S22 (slice 6): the request body was the full `RentMandate`, i.e. the read shape -- exactly
      # the defect S11 fixed on PayoutAccount, and it lands harder here. `RentMandate` carries `id`,
      # `status` and `provider`, none of which a client may assert. A caller PUTting
      # `status: active` on a mandate they had revoked would be reactivating a standing instruction
      # against their own bank account without ever re-giving consent -- and `id` would let them
      # aim the write at somebody else's mandate entirely.
      #
      # Split into a write shape carrying only what a tenant decides: which tenancy, the ceiling
      # they authorise, the day of the month, and an optional pause/revoke. The response stays the
      # full read shape so the client can render the saved mandate without a second call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentMandateUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentMandate' }
        '404': { $ref: '#/components/responses/NotFound' }
        # S23: revoking is terminal and re-activation is refused -- both are 409, not 422.
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/payout-account:
    get:
      tags: [Rentals & Payments]
      summary: Payout account (owner)
      operationId: getPayoutAccount
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutAccount' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Set payout account (owner)
      operationId: setPayoutAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAccountUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccount' }
        # S23: the body is bean-validated (IFSC pattern, 9-18 digit account, holder required),
        # so 422 is reachable and must be declared.
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/tenancies:
    get:
      tags: [Rentals & Payments]
      summary: My active tenancies (as tenant)
      operationId: myTenancies
      responses:
        '200':
          description: Tenancies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenancy' }
  /tenancies:
    get:
      tags: [Rentals & Payments]
      summary: Tenancies in my properties (owner)
      operationId: ownerTenancies
      responses:
        '200':
          description: Tenancies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenancy' }
    # S9 (slice 5): POST /tenancies DELETED.
    #
    # It was summarised "(system, on deal finalization)" but carried no x-roles and accepted the
    # whole Tenancy schema -- id, owner, tenant, rent, deposit and status all client-supplied. As
    # written, any signed-in user could fabricate a tenancy on any property, naming themselves as
    # owner or tenant. Because `tenancies` is the parent of `rent_payments` and `rent_mandates`,
    # that manufactures a money-bearing relationship out of nothing: a forged tenancy is a claim on
    # somebody else's rent.
    #
    # "System" is not a role, so there was never a guard that could express the intent. The correct
    # mechanism is that no client creates a tenancy at all -- it is created transactionally inside
    # DealService when a *rent* deal closes (the side effect slice 4 deferred to Phase 5), where
    # the owner, tenant, rent and deposit are all already known and already authorised. See D1.
  /me/tenant-profile:
    get:
      tags: [Rentals & Payments]
      summary: My tenant profile
      operationId: getTenantProfile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/TenantProfile' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Update tenant profile
      operationId: updateTenantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantProfileUpdate' }
      responses:
        '200':
          description: Saved (returns computed score)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantProfile' }
  /tenant-profiles/{mobile}:
    parameters:
      - { name: mobile, in: path, required: true, schema: { $ref: '#/components/schemas/Mobile' } }
    get:
      tags: [Rentals & Payments]
      summary: View a tenant's profile (owner, only for a tenant you are actually dealing with)
      # S10 (slice 5). This carried no access rule at all while being keyed by mobile number.
      # Walking the 10-digit space would have returned name, occupation, income, occupant type and
      # trust score for every tenant on the platform -- a worse leak than the slice-4
      # finalization oracle, which only answered yes/no, and keyed by the exact identifier the
      # entire contact gate exists to protect.
      #
      # The legitimate use is narrow: an owner screening someone who has actually approached their
      # listing. So the caller must have a live relationship with that tenant -- an existing
      # tenancy, or an accepted contact request on one of the caller's properties. Anything else is
      # 404, never 403: confirming "that mobile exists but you may not see it" is itself the
      # enumeration answer we are refusing to give.
      description: >
        Requires an existing relationship between the caller and the tenant: a tenancy on one of
        the caller's properties, or an accepted contact request. Returns 404 -- never 403 -- when
        no such relationship exists, so the endpoint cannot be used to test whether a mobile number
        is registered.
      operationId: getTenantProfileByMobile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/TenantProfile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenant-profiles/verified:
    post:
      tags: [Rentals & Payments]
      summary: Which of these people are verified tenants (batch badge)
      # D114. The verified tick renders beside every row of a list -- every offer on a property,
      # every applicant, every reviewer -- and each row is about somebody else. Asking
      # /tenant-profiles/{mobile} per row is an N+1 on a render path, so the client had no server
      # answer at all and the badge stayed on localStorage, where it could only ever be wrong in
      # the direction of showing less than the truth.
      #
      # POST, for a read. The input is a list of mobile numbers and the method is chosen for where
      # the parameters end up: a query string carrying them would write the identifier the whole
      # contact gate exists to protect into access logs, proxy caches, browser history and Referer
      # headers. A body goes to none of those. Being a POST also puts it inside the platform write
      # rate limit without an exception being written anywhere.
      #
      # It answers one bit per entry and never a reason. "No such number", "registered but not
      # verified" and "not your business" are all `false` -- the same refusal shape S10 chose for
      # the single read, so this cannot be walked to discover which mobile numbers are registered.
      # The relationship guard is identical to S10's and is not relaxed: an entry is `true` only
      # where GET /tenant-profiles/{mobile} would have succeeded.
      #
      # `mobile` in each answer is the caller's own input echoed verbatim, so the response provably
      # cannot contain a number the caller did not already hold (D5/Q2).
      description: >
        Batch form of `GET /tenant-profiles/{mobile}` reduced to the verified badge. Requires the
        same relationship with each person -- a tenancy either way round, or an accepted contact
        request against one of the caller's listings -- and returns `false`, never an error or a
        reason, for every entry that does not qualify, is not registered, or holds no badge. The
        answer has the same length and order as `mobiles`, and each `mobile` is the string the
        caller supplied, unchanged. At most 50 entries; a larger batch is 400.
      operationId: tenantsVerified
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantVerifiedQuery' }
      responses:
        '200':
          description: One flag per supplied number, in the order supplied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantVerified' }
        '400': { $ref: '#/components/responses/BadRequest' }
  # ============================================================
  # 7. DOCUMENTS
  # ============================================================
  /me/documents/{propId}:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Documents]
      summary: Documents for property (owner)
      operationId: listDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Upload document (multipart)
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Sale Deed }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/{propId}/{docId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove document (owner)
      operationId: deleteDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/personal:
    get:
      tags: [Documents]
      summary: Personal KYC documents (owner)
      description: >-
        The caller's own KYC papers. `personal` is a literal segment that out-ranks the
        `{propId}` template, so a property can never be addressed here. Self-scoped; no `x-roles`.
      operationId: listPersonalDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Upload personal KYC document (multipart)
      operationId: uploadPersonalDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Aadhaar }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/personal/{docId}:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove personal KYC document (owner)
      operationId: deletePersonalDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/photos:
    post:
      tags: [Listings]
      summary: Upload a listing photo (multipart)
      description: >-
        Store one image in the public bucket and return its permanent CDN URL, which the client puts
        into a listing's `images`. Unscoped by property: in the create-listing wizard the photos are
        chosen before the property exists. Image-only (JPEG, PNG, WebP, HEIC or AVIF) because the
        object is world-readable — no PDF and no SVG. Self-scoped; no `x-roles`.
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/requests:
    get:
      tags: [Documents]
      summary: Buyer document-access requests (owner inbox)
      operationId: myDocumentRequests
      description: >
        Newest first, owner-scoped, paged. Every row is written by a prospective *buyer* asking to
        see the paperwork, so the list grows with demand for the listing rather than with anything
        its owner did. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentRequest' }
  /documents/requests:
    post:
      tags: [Documents]
      summary: Request document access (buyer)
      operationId: requestDocumentAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequestCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRequest' }
  /me/documents/requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Documents]
      summary: Grant / decline document access (owner)
      operationId: respondDocumentRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
  /documents/shared:
    get:
      tags: [Documents]
      summary: View shared documents via link token
      description: |
        Public but token-scoped. `token` IS the authorisation — there is no session, and the link is
        meant to be forwarded to a lawyer or a bank officer who has no PuneNest account.

        Treat it as a bearer credential: whoever holds the string can read the owner's title deeds
        until the grant expires (7 days from the grant). It must never be written to an access log,
        an error report or an analytics event; server-side, the container access-log pattern is
        pinned to exclude query strings and responses carry `Referrer-Policy: no-referrer` (D42).
        Every failure — unknown, declined, expired — is the same 401, deliberately, so the endpoint
        cannot be used as an oracle for which tokens were ever real.
      security: []
      operationId: getSharedDocuments
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Bearer credential for one grant. Do not log, store or forward.
      responses:
        '200':
          description: Shared documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ============================================================
  # 8. SERVICES & SUPPORT (tickets, support, workflows, agreements)
  # ============================================================
  /tickets:
    get:
      tags: [Services & Support]
      summary: All service requests (admin/staff)
      operationId: listTickets
      x-roles: [staff, admin]
      parameters:
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
    # Deliberately NO x-roles (slice-11 S43): a customer raising a request is the point of the
    # queue, exactly as with POST /reports. Only reading and working the queue is staff-only.
    post:
      tags: [Services & Support]
      summary: Create service request
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
      # Debt D47. The 201 returned `Ticket`, which carries `notes` -- "Internal staff notes" by its
      # own description -- to the one caller on this path who is not staff: the raiser. It read empty
      # only because a ticket cannot have a note in the transaction that created it. The response is
      # now `CustomerTicket`, the same object with no `notes` property, so the guarantee is in the
      # schema rather than in the timing.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerTicket' }
  /tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Services & Support]
      summary: Update ticket (admin/staff)
      operationId: updateTicket
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
  /tickets/{id}/notes:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Add internal note (admin/staff)
      operationId: addTicketNote
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  by: { type: string }
                  text: { type: string }
                  at: { type: string, format: date-time }
  /support/tickets:
    get:
      tags: [Services & Support]
      # Slice-12 spec fix S47. Was "My support tickets (all for admin)" -- one operation with two
      # growth profiles. For a customer the collection grows with their own activity, so
      # `api-standards.md` 5.1 says bare array; for an admin it grows with the platform, which the
      # same rule says must be a `PageEnvelope`. Serving both from one operation means either an
      # admin reading every support conversation on the platform -- names, mobiles, message bodies
      # -- in a single unbounded response, or a shape that changes with the caller's role. Narrowed
      # to the caller's own tickets. Ops triage already has its own paginated, team-scoped board at
      # `GET /tickets`; a platform-wide support view belongs under `/admin/` when it is needed.
      summary: My support tickets
      operationId: listSupportTickets
      responses:
        '200':
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportTicket' }
    post:
      tags: [Services & Support]
      summary: Create support ticket
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
  /support/tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Support ticket detail with messages
      operationId: getSupportTicket
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Reply to support ticket
      operationId: replySupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        # Slice-12 spec fix S46. Was a bare `'201': Replied`, so a client had no way to render the
        # message it had just sent without re-fetching the whole ticket. Same defect class as S44.
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      # D50. Was "clear the raiser's flag", and a staff caller reached it successfully and changed
      # nothing, because there was only one flag and it was not theirs. Now clears whichever side of
      # the two-sided read model belongs to the caller -- `unread` for the raiser, the desk's own
      # signal for staff and admin -- and never the other side's.
      summary: Mark support ticket read (the caller's own side)
      operationId: markSupportTicketRead
      responses:
        '204': { description: Marked }
        '404': { $ref: '#/components/responses/NotFound' }  # Slice-12 spec fix S48
  /admin/support-tickets:
    get:
      tags: [Services & Support]
      # D51. S47 narrowed `GET /support/tickets` to the caller's own tickets for every role, because
      # one operation cannot be a bare array for a customer and a page envelope for an admin, and
      # "every support conversation on the platform" unpaged is a PII export whoever asks. That left
      # ops with no support overview at all. This is the operation S47's note said would be needed:
      # under /admin, paged, and a summary rather than the threads.
      #
      # Staff as well as admin, unlike /admin/audit-log: staff have always been able to read and
      # answer any ticket at GET /support/tickets/{id}, so withholding only the index would leave
      # them able to act on tickets they cannot find.
      summary: Platform-wide support queue (paged)
      operationId: adminSupportTickets
      x-roles: [staff, admin]
      parameters:
        - name: awaitingReply
          in: query
          schema: { type: boolean }
          description: >-
            Omit for everything. `true` narrows to tickets whose newest message is from the customer
            and nobody on the desk has read -- the working queue. `false` is the complement.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Support tickets, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminSupportTicket' }
  /service-requests:
    # Slice-11 spec fix S40. Two changes, one cause: without a list a staff member cannot find the
    # requests the five staff-only operations below act on, and "every service request on the
    # platform" is not a bare array -- it is the unbounded queue api-standards.md section 5.1 exists
    # to page. Scope is role-derived: a customer sees their own requests, staff/admin see the queue.
    get:
      tags: [Services & Support]
      summary: Service requests - own for a customer, the whole queue for staff/admin
      operationId: listServiceRequests
      parameters:
        - { name: type, in: query, schema: { type: string }, description: Service type, e.g. rent-agreement }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Service requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceRequest' }
    post:
      tags: [Services & Support]
      summary: Create service request
      operationId: createServiceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Service request detail with timeline
      operationId: getServiceRequest
      responses:
        '200':
          description: Service request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Services & Support]
      summary: Update status (staff)
      operationId: updateServiceRequestStatus
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Add message to service request
      operationId: addServiceRequestMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /service-requests/{id}/docs:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload / update document on request
      operationId: addServiceRequestDoc
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category: { type: string }
                file: { type: string, format: binary }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
  /service-requests/{id}/identities:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    # D151. A Leave & License names each party by PAN and Aadhaar, so the drafting desk needs both.
    # They used to travel inside `details`, which is plaintext jsonb echoed verbatim on every staff
    # read including the paged queue -- a bulk identity dump. `details` now refuses them (400) and
    # this is the replacement: written by the requester, readable by the one staff member the
    # request is assigned to, audited on every read and refusal, and blanked when the request
    # reaches a terminal status.
    #
    # NOT the document vault, which is what the register first proposed. The vault answers reads
    # with a signed URL -- a credential that carries its own authority, cannot be pointed at one
    # operator, cannot refuse anybody, and whose use never reaches the server, so no read of it can
    # be recorded. "Only the assignee" and "every access audited" are the requirement, and neither
    # is expressible against a bearer URL.
    put:
      tags: [Services & Support]
      summary: Record the parties' identity numbers (requester only)
      operationId: putServiceRequestIdentities
      description: >
        Replaces the whole set. The wizard resubmits every party when the customer corrects one, so
        append semantics would leave the mistyped number behind under a shifted index. No role
        annotation: the guard is participant identity -- staff and admin are refused, because a desk
        that could write these could also invent them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestIdentities' }
      responses:
        '204':
          description: >
            Recorded. Deliberately empty -- echoing the numbers back onto a response nobody reads
            them from is the habit that made `details` a leak.
        '403':
          description: The caller is staff or admin; only the requester may record these
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: The request is completed or cancelled, so there is nothing left to draft from
    get:
      tags: [Services & Support]
      summary: Read the parties' identity numbers (assigned operator only)
      operationId: getServiceRequestIdentities
      x-roles: [staff, admin]
      description: >
        The role list is the outer guard, not the real one: the server refuses every staff member
        except the one the request is assigned to, admins included. An admin who needs the numbers
        assigns the request to themselves first -- two visible moves if somebody else already holds
        it, since there is no `assigned` -> `assigned` transition -- and each one is a timeline entry
        and an audit row. The control is accountability, not prohibition. Every call -- successful or
        refused -- is written to `audit_log`.
      responses:
        '200':
          description: The parties on this request, owner first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceRequestIdentity' }
        '403':
          description: The request is unassigned, or assigned to somebody else
        '404':
          description: No such request
  /service-requests/{id}/draft:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    # Slice-11 spec fix S41. The operation had no request body, so "share draft for review" shared
    # nothing -- the customer was asked to approve a document that was never transmitted. Multipart,
    # matching /final-doc, because a draft agreement is a file.
    post:
      tags: [Services & Support]
      summary: Share draft for review (staff)
      operationId: shareServiceRequestDraft
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                note: { type: string, maxLength: 500 }
                file: { type: string, format: binary }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}/draft/decision:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Approve / reject draft
      operationId: decideServiceRequestDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      # D152. Abandoning a payment modal is the most ordinary thing to do in a checkout, and it
      # used to be terminal: no webhook arrives, the row sits at awaiting-payment forever, the
      # one-open-order cap then refuses the next attempt, and status changes are staff-only. This
      # is the release valve. It is deliberately narrower than PATCH /status -- it is the only
      # transition a requester may make, and only out of awaiting-payment.
      summary: Cancel an unpaid request (requester only)
      operationId: cancelServiceRequest
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: The request is not awaiting payment, so there is nothing to release
  /service-requests/{id}/final-doc:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload final document (staff)
      operationId: uploadServiceRequestFinalDoc
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      # Slice-11 spec fix S44. The operation declared a bare description and no content, so a
      # client had no documented way to learn the new state and had to re-fetch to find out
      # whether its own write took effect. Every one of these already returns the resource.
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
  /me/rent-agreements:
    get:
      tags: [Services & Support]
      summary: My rent agreements
      operationId: myRentAgreements
      responses:
        '200':
          description: Agreements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RentAgreement' }
    post:
      tags: [Services & Support]
      summary: Create rent-agreement record
      operationId: createRentAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentAgreementCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentAgreement' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/owner-kyc:
    get:
      tags: [Services & Support]
      summary: Owner KYC data
      operationId: getOwnerKyc
      responses:
        '200': { description: KYC, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerKyc' } } } }
    put:
      tags: [Services & Support]
      summary: Save owner KYC
      operationId: saveOwnerKyc
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerKycUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerKyc' }
  # ============================================================
  # 9. BILLING & GROWTH (plans, boosts, orders, referrals)
  # ============================================================
  /plans:
    get:
      tags: [Billing & Growth]
      summary: Subscription plans catalog
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
  /me/subscription:
    get:
      tags: [Billing & Growth]
      summary: My current subscription
      operationId: getSubscription
      responses:
        '200': { description: Subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
    post:
      tags: [Billing & Growth]
      summary: Subscribe / upgrade plan
      operationId: subscribe
      description: >
        Subscribes to / upgrades a plan, collected via the Cashfree Payment Gateway
        (ADR-017). A priced plan returns a `pending` subscription carrying `paymentRef`
        (the gateway order id) and is activated by the payment webhook (see `callbacks`);
        a zero-price plan is `active` immediately.
      externalDocs:
        description: Plans, billing & referrals flow
        url: docs/flows/consumer/plans-billing-refer.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        # Slice-13 spec fix S50. Was `'402': Payment required` with no response body, so a
        # client told to pay was given nothing to pay with -- no order id, no session, no link.
        # The platform already has a working answer for this (`POST /me/rent-payments`): return
        # the resource in a not-yet-paid state carrying the gateway order id, and let the webhook
        # settle it. Applying the same shape here removes an unimplementable response and makes
        # the two money flows behave identically.
        '201':
          description: >
            Subscribed. `status` is `active` for a free plan and `pending` for a priced one,
            in which case `paymentRef` carries the gateway order id to hand to the checkout SDK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        # D160. One outstanding unpaid order per user: a priced plan is refused while the caller
        # already holds a `pending` subscription, because each one opens a live gateway order and
        # nothing else bounded the total (Idempotency-Key is optional, and the rate limit caps speed
        # rather than count). The held order is readable at GET /me/subscription, and the
        # abandoned-checkout sweep cancels it if the customer never returns, so the refusal is
        # temporary by construction.
        '409': { $ref: '#/components/responses/Conflict' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /boost-packs:
    get:
      tags: [Billing & Growth]
      summary: Listing boost packs catalog
      operationId: listBoostPacks
      security: []
      responses:
        '200':
          description: Packs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BoostPack' }
  /me/properties/{propId}/boost:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Billing & Growth]
      summary: Boosts bought for a listing
      operationId: listListingBoosts
      description: >
        Every boost ever purchased for this listing, newest first, owner-scoped. Includes windows
        that never opened: a boost still `pending` is a payment that did not complete, which is the
        most useful thing this endpoint can tell an owner asking why nothing happened.
      responses:
        '200':
          description: Boosts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Boost' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Billing & Growth]
      summary: Boost a listing
      operationId: boostListing
      description: >
        Purchases a boost pack for a listing, collected via the Cashfree Payment Gateway
        (ADR-017). Returns a `pending` boost carrying `paymentRef`; the window opens when the
        payment webhook confirms the money (see `callbacks`).
      externalDocs:
        description: Plans, billing & referrals flow
        url: docs/flows/consumer/plans-billing-refer.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packId]
              properties:
                packId: { type: string }
      responses:
        '201':
          description: Boost applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Boost' }
        # D160. One outstanding unpaid order per *buyer*, not per listing: an owner is refused while
        # they already hold a `pending` boost on any of their listings. Scoping to the listing would
        # have let the bound grow with how many listings someone can create, which is not a bound.
        # The held order is readable at GET /me/properties/{propId}/boost and the abandoned-checkout
        # sweep expires it, so the refusal is temporary by construction.
        '409': { $ref: '#/components/responses/Conflict' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
  /service-catalog:
    get:
      tags: [Billing & Growth]
      summary: Paid services catalog (packing, painting, legal, etc.)
      operationId: listServiceCatalog
      security: []
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceOffering' }
  /me/service-orders:
    get:
      tags: [Billing & Growth]
      summary: My service orders
      operationId: listServiceOrders
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceOrder' }
    post:
      tags: [Billing & Growth]
      summary: Place service order
      operationId: createServiceOrder
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOrderCreate' }
      responses:
        '201':
          description: Ordered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
  /me/referrals:
    get:
      tags: [Billing & Growth]
      summary: My referral code + rewards
      operationId: getReferrals
      responses:
        '200': { description: Referrals, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } } }
  /referrals/redeem:
    post:
      tags: [Billing & Growth]
      summary: Redeem a referral code
      operationId: redeemReferral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: Redeemed }
        '409': { description: Already redeemed / invalid }
  /referrals:
    get:
      tags: [Billing & Growth]
      summary: Referral review queue (admin/ops fraud desk)
      operationId: listReferrals
      # Slice-13 spec fix S53. The summary said "admin/ops" and nothing enforced it, so as
      # written this queue -- every referrer's and referred party's mobile number, plus the
      # fraud signals that say which of them we suspect -- was readable by any signed-in user.
      # The three decision endpoints below were open in the same way.
      x-roles: [staff, admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, qualified, rewarded, rejected, clawed-back] } }  # Slice-13 spec fix S52
        - { name: risk, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Referrals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Approve a referral (checker) - credits the referrer's reward ledger
      operationId: approveReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/reject:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Reject a referral (checker)
      operationId: rejectReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/clawback:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Claw back a released referral reward - debits the ledger
      operationId: clawbackReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Clawed back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  # ============================================================
  # 10. ENGAGEMENT (saved, alerts, reviews, flatmates, content)
  # ============================================================
  /me/saved:
    get:
      tags: [Engagement]
      summary: Saved properties
      operationId: listSaved
      description: >
        Newest-saved first. Paged: nothing caps how many listings a user may shortlist, and each row
        is a full PropertySummary.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged saved list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertySummary' }
  /me/saved/{propId}:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    put:
      tags: [Engagement]
      summary: Save a property
      operationId: savePropertyItem
      responses:
        '204': { description: Saved }
    delete:
      tags: [Engagement]
      summary: Unsave a property
      operationId: unsaveProperty
      responses:
        '204': { description: Removed }
  /me/saved-searches:
    get:
      tags: [Engagement]
      summary: Saved searches / alerts
      operationId: listSavedSearches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedSearch' }
    post:
      tags: [Engagement]
      summary: Create saved search / alert
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/saved-searches/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Change alert preferences on a saved search
      description: >
        Updates how the caller is alerted, not what is searched for. The query, filters and criteria
        are the identity of the alert — changing them replaces it rather than modifying it, so they
        are not accepted here. Turn alerts off with `alertFrequency: off`.
      operationId: updateSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Engagement]
      summary: Delete saved search
      operationId: deleteSavedSearch
      responses:
        '204': { description: Removed }
  /properties/{propId}/reviews:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Engagement]
      summary: Reviews for a property/locality
      operationId: listReviews
      security: []
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
    post:
      tags: [Engagement]
      summary: Post a review
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
  /reviews/{entityType}/{entityId}:
    parameters:
      - { name: entityType, in: path, required: true, schema: { type: string, enum: [society, locality, owner] } }
      - { name: entityId, in: path, required: true, schema: { type: string }, description: Slug or id of the target entity }
    get:
      tags: [Engagement]
      summary: Reviews for a society / locality / owner
      operationId: listEntityReviews
      security: []
      # S27 (slice 8): was a bare array. A popular locality's reviews are bounded only by the
      # city's user base -- platform-scale growth, so api-standards.md §5.1 says page it. No
      # `Sort`: the order is fixed server-side (newest first) and index-backed by
      # idx_reviews_target_created. The aggregate the UI needs (avg + count) is served by the
      # society / locality DETAIL endpoints, not by summing a page.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }
    post:
      tags: [Engagement]
      summary: Post a review for a society / locality / owner
      operationId: createEntityReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
  # ---------------------------------------------------------------------------------------------
  # The /share-flat/* operations that used to sit here were removed when the flatmates backend
  # landed (V28). They were the legacy surface: listShareFlatPosts, createShareFlatPost and
  # shareFlatInterest, served by ShareFlatController over V7's share_flat_posts. Their data was
  # carried into flatmate_seeker_posts and flatmate_requests, the tables were dropped, and the
  # /flatmates/* operations below are now served for real rather than being a target contract.
  #
  # `/share-flat` remains a permanent client-side redirect to `/flatmates` in the frontend router;
  # nothing on the API answers that prefix any more.
  # ---------------------------------------------------------------------------------------------
  /flatmates/feed:
    get:
      tags: [Engagement]
      summary: Flatmates feed (tab-aware, mixed)
      description: >
        One feed per tab. `move-in` returns rooms plus groups that already hold an address;
        `team-up` returns solo seeker posts plus address-less groups. The list is sorted as one
        list — merging two pre-sorted lists would stack every room above every group.
      operationId: listFlatmateFeed
      security: []
      externalDocs: { description: Behaviour, url: docs/flows/consumer/flatmates.md }
      parameters:
        - { name: tab, in: query, schema: { $ref: '#/components/schemas/FlatmateTab' } }
        - { name: view, in: query, deprecated: true, description: Legacy tab alias; resolved to `tab`., schema: { $ref: '#/components/schemas/FlatmateTabLegacy' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string } }
        - { name: budget, in: query, description: Per-head ceiling. Rooms are matched on their best achievable per-person price, so a shareable room can surface under a lower budget., schema: { type: integer } }
        - { name: moveIn, in: query, schema: { $ref: '#/components/schemas/FlatmateMoveIn' } }
        - { name: gender, in: query, schema: { type: string, enum: [male, female] } }
        - { name: sharing, in: query, description: '`team-up` only.', schema: { type: string } }
        - { name: attachedBath, in: query, description: '`move-in` only.', schema: { type: boolean } }
        - { name: verifiedOnly, in: query, schema: { type: boolean } }
        - { name: habits, in: query, schema: { type: array, items: { type: string } } }
        - { name: near, in: query, description: 'Proximity centre as `lat,lng`.', schema: { type: string, example: '18.5590,73.7868' } }
        - { name: nearRadius, in: query, schema: { type: number, default: 5 } }
        - { name: nearMode, in: query, schema: { type: string, enum: [km, min], default: km } }
        - { name: sort, in: query, schema: { type: string, enum: [verified, match, budget-low, budget-high, new], default: verified } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/FlatmateSeekerPost'
                            - $ref: '#/components/schemas/FlatmateRoom'
                            - $ref: '#/components/schemas/FlatmateGroup'
  /flatmates/posts:
    get:
      tags: [Engagement]
      summary: Flatmate seeker posts
      operationId: listFlatmateSeekerPosts
      security: []
      parameters:
        - { name: locality, in: query, schema: { type: string } }
        - name: gender
          in: query
          description: Who the seeker will share with. Exact match; `any` is treated as no filter.
          schema: { type: string, enum: [any, male, female] }
        - name: flatPref
          in: query
          description: Who the seeker wants in the flat. Matches an `any` post as well; `any` request is no filter.
          schema: { type: string, enum: [any, women, men] }
        - name: roomPref
          in: query
          description: Whether the seeker wants a private room. Exact match; `any` is treated as no filter.
          schema: { type: string, enum: [any, private, shared] }
        - name: minBudget
          in: query
          description: Lowest monthly budget, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxBudget
          in: query
          description: Highest monthly budget, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateSeekerPost' }
    post:
      tags: [Engagement]
      summary: Create a flatmate seeker post
      description: Requires only an L1 signed-in account (ADR-019). One live post per identity.
      operationId: createFlatmateSeekerPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateSeekerPostCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '409': { description: A live post already exists for this identity (`already_live`) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/posts/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Update my flatmate seeker post
      operationId: updateFlatmateSeekerPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateSeekerPostCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Engagement]
      summary: Remove my flatmate seeker post
      description: Backs both "Delete" and "Mark filled".
      operationId: deleteFlatmateSeekerPost
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/posts/{id}/interest:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Express interest in a flatmate seeker post
      operationId: flatmatePostInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201': { description: Sent }
        '403': { description: The target opted into verified-only contact (`verification_required`) }
        '409': { description: Interest already expressed (`already_interested`) }
  /flatmates/rooms:
    get:
      tags: [Engagement]
      summary: Flatmate rooms
      operationId: listFlatmateRooms
      security: []
      parameters:
        - { name: locality, in: query, schema: { type: string } }
        - name: gender
          in: query
          description: Who the room is offered to. Matches an `any` room as well; `any` request is no filter.
          schema: { type: string, enum: [any, male, female] }
        - name: food
          in: query
          description: Dietary preference. Matches an `any` room as well; `any` request is no filter.
          schema: { type: string, enum: [any, veg, nonveg] }
        - name: roomType
          in: query
          description: Private or shared occupancy of the room. Exact match.
          schema: { type: string, enum: ['Private room', 'Shared room'] }
        - name: furnishing
          in: query
          description: Furnishing level. Exact match.
          schema: { type: string, enum: [unfurnished, semi, furnished] }
        - name: bhk
          in: query
          description: Bedrooms in the flat; `4` means 4+. Exact match.
          schema: { type: string, enum: ['1', '2', '3', '4'] }
        - name: minBudget
          in: query
          description: Lowest rent for the room's price basis, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxBudget
          in: query
          description: Highest rent for the room's price basis, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRoom' }
    post:
      tags: [Engagement]
      summary: Post a spare room
      description: L1 signed-in. Runs the anti-broker guardrails; a hard block returns `409` with the eligibility result.
      operationId: createFlatmateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateRoomCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '409':
          description: Blocked by the host-eligibility guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/rooms/{id}/seats:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Reopen or close a room seat
      description: Seat-model rooms only. The verification tier is preserved, so a re-list needs no re-verification.
      operationId: setRoomSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatsOpen]
              properties:
                seatsOpen: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '409': { description: This room has no seat model (`not_seat_based`) }
  /flatmates/rooms/{id}/occupants:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Record how many people live in a room
      description: >
        Owner-split rooms only. The server clamps to `min(3, maxOccupants - siblings)` and echoes the
        clamped value, so a society cap can never be exceeded by editing one room.
      operationId: setRoomOccupants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occupants]
              properties:
                occupants: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated (clamped)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/rooms/{id}/agreement/reissue:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Reissue the flat's joint rent agreement
      description: >
        One agreement covers the owner and every flatmate in the flat, so a room changing hands
        invalidates it. Starts a fresh rent-agreement service request bound to the flat.
      operationId: reissueJointAgreement
      responses:
        '202': { description: Reissue started }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/groups:
    get:
      tags: [Engagement]
      summary: Flatmate groups
      operationId: listFlatmateGroups
      security: []
      parameters:
        - { name: locality, in: query, schema: { type: string } }
        - name: policy
          in: query
          description: Group join policy. Matches an open (`any`) group as well; `any` request is no filter.
          schema: { type: string, enum: [any, women, men] }
        - name: minRent
          in: query
          description: Lowest whole-flat rent, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxRent
          in: query
          description: Highest whole-flat rent, in whole rupees.
          schema: { type: integer, format: int64, minimum: 0 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateGroup' }
    post:
      tags: [Engagement]
      summary: Create a flatmate group
      description: L1 signed-in. The verification tier is derived server-side from role + proof; the client can never self-assign a host badge.
      operationId: createFlatmateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateGroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '409':
          description: Blocked by the host-eligibility guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    delete:
      tags: [Engagement]
      summary: Remove a group I created
      operationId: deleteFlatmateGroup
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/groups/{id}/seats:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Reopen or close a group seat
      operationId: setGroupSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatsOpen]
              properties:
                seatsOpen: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/groups/{id}/owner-consent:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Request or confirm the flat owner's consent
      description: >
        Tenant replacement track. Called once without `otp` to send an OTP to the flat owner, then
        again with it to record an auditable consent. Consent is never client-asserted.
      operationId: requestOwnerConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerMobile]
              properties:
                ownerMobile: { $ref: '#/components/schemas/Mobile' }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200': { description: OTP sent, or consent recorded }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/rooms/{id}/interest:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Enquire about a room
      description: Carries the share intent, so the host learns how many people are moving in in the first line.
      operationId: flatmateRoomInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201': { description: Sent }
        '409': { description: Interest already expressed (`already_interested`) }
  /flatmates/groups/{id}/join:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Ask to join a group
      description: An open-policy group (`policy` = `any`) auto-accepts; every other policy creates a pending host-inbox request.
      operationId: flatmateGroupJoin
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201':
          description: Joined or requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRequest' }
        '409': { description: Group is full (`group_full`) or already requested (`already_interested`) }
  /me/flatmate-requests:
    get:
      tags: [Engagement]
      summary: My incoming flatmate requests (host inbox)
      operationId: listMyFlatmateRequests
      description: >
        Newest first, host-scoped, paged. The host writes none of these rows - each is a stranger
        answering their ad - so the inbox grows with the ad's reach. `status` filters before the
        page, so `totalElements` counts the matching requests rather than all of them. No `sort`
        parameter: the order is fixed server-side.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, declined] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRequest' }
  /me/flatmate-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Accept or decline an incoming flatmate request
      operationId: decideFlatmateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, declined] }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications:
    get:
      tags: [Engagement]
      summary: My notifications
      operationId: listNotifications
      # S27 (slice 8): was a bare array. Notifications accrue with time, per user, and nothing
      # culls them -- the clearest case of api-standards.md §5.1's "scope is not the test; growth
      # is". No `Sort`: newest-first is fixed server-side and index-backed by
      # idx_notifications_user_created (user_id, created_at DESC), added in V16.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
  /notifications/read:
    post:
      tags: [Engagement]
      summary: Mark notifications read (all or by ids)
      operationId: markNotificationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Marked }
  /notifications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    delete:
      tags: [Engagement]
      summary: Dismiss a notification
      description: >
        Removes one notification from the caller's inbox. Server-side and permanent, so a dismissal
        syncs across the user's devices (replacing the client-side tombstone the http provider kept
        while this endpoint did not exist). User-scoped: another user's id is 404, never 403.
      operationId: dismissNotification
      responses:
        '204': { description: Dismissed }
        '404': { $ref: '#/components/responses/NotFound' }
  /announcements:
    get:
      tags: [Engagement]
      summary: Active announcements (public)
      operationId: listAnnouncements
      security: []
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Announcement' }
  /services:
    get:
      tags: [Engagement]
      summary: Marketing services listing (CMS, public)
      operationId: listCmsServices
      security: []
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CmsService' }
  /faqs:
    get:
      tags: [Engagement]
      summary: FAQs (public)
      operationId: listFaqs
      security: []
      responses:
        '200':
          description: FAQs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Faq' }
  /banners:
    get:
      tags: [Engagement]
      summary: Homepage banners (public)
      operationId: listBanners
      security: []
      responses:
        '200':
          description: Banners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Banner' }
  # ============================================================
  # 11. ADMIN & ANALYTICS (KPIs, settings, audit, CMS, society leads)
  # ============================================================
  /admin/dashboard:
    get:
      tags: [Admin & Analytics]
      summary: Admin KPI dashboard
      operationId: adminDashboard
      # S28: The ops scorecard.
      x-roles: [staff, admin]
      responses:
        '200':
          description: KPIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminKpis' }
  /admin/analytics:
    get:
      tags: [Admin & Analytics]
      summary: Analytics time series
      operationId: adminAnalytics
      # S28: Aggregate platform analytics.
      x-roles: [staff, admin]
      # S59: `metric` was a required free-text string, so every client guess was a syntactically
      # valid request and the server had to invent an answer for `metric=potato`. Enumerated to the
      # four series the platform can actually derive from its own tables. `revenue` is in whole
      # rupees; the other three are counts.
      # Defaults: `from` = 30 days ago, `to` = today. The range is capped server-side at 366
      # buckets - an unbounded date range on a grouped scan is a denial-of-service with a chart on it.
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [listings, users, deals, revenue] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnalyticsPoint' }
  /admin/finance:
    get:
      tags: [Admin & Analytics]
      summary: Platform finance overview (revenue, payouts)
      operationId: adminFinance
      # S28: Revenue and settlement figures.
      x-roles: [admin]
      responses:
        '200':
          description: Finance overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFinance' }
  /admin/settings:
    get:
      tags: [Admin & Analytics]
      summary: Platform settings
      operationId: getAdminSettings
      # S28: Platform configuration, including fees.
      # S68 (tech debt D66): the 200 carries a strong ETag over the whole document. It is a hash of
      # the stored content, not a row version, because this resource is the union of several
      # `settings` rows - a per-row counter could not describe "the document you were looking at".
      # A hash also makes a save that changes nothing leave the tag alone, which is what an entity
      # tag is supposed to mean.
      x-roles: [admin]
      responses:
        '200':
          description: Settings
          headers:
            ETag:
              description: >-
                Opaque version of the returned document. Send it back as `If-Match` on PUT to make
                the write conditional.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
    put:
      tags: [Admin & Analytics]
      summary: Update platform settings (merge)
      operationId: updateAdminSettings
      # S28: Changing platform fees and feature flags.
      # S60: MERGE, not replace, and the spec now says so. Every property of AdminSettings is
      # optional, so `{"flags":{"x":true}}` is a well-formed whole document - under replace
      # semantics the flags panel would silently wipe fees, permissions and custom roles, and the
      # platform would start charging its defaults. Objects are merged key by key; arrays and
      # scalars are replaced wholesale; a key that is absent is left alone.
      # S56: returns the stored document, because after clamping and merging what is stored is not
      # necessarily what was sent, and an admin editing money must be shown the result.
      # Every call writes an audit row (`settings.update`) naming the top-level keys touched.
      # S68 (tech debt D66): optional `If-Match`. The S60 merge stopped the flags panel from wiping
      # the fee table, but two admins editing the SAME key still last-write-wins and neither is
      # told. A precondition is the only thing that can detect that, because the server cannot tell
      # a deliberate overwrite from an ignorant one by looking at the body.
      # Optional rather than required: making it mandatory would break every existing caller and
      # turn a safety feature into an outage. A caller that omits it keeps today's behaviour and
      # accepts today's risk.
      x-roles: [admin]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            The ETag from a previous GET. If the stored document has changed since, the write is
            refused with 412 and nothing is written.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettings' }
      responses:
        '200':
          description: Saved
          headers:
            ETag:
              description: Version of the document as saved - use it for the next conditional write.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '412':
          description: >-
            Someone else changed the settings since the ETag was issued. Nothing was written; re-read
            and re-apply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/audit-log:
    get:
      tags: [Admin & Analytics]
      summary: Audit log (maker-checker trail)
      operationId: adminAuditLog
      # S28: Who watches the watchers: staff must not read the record of admin actions.
      x-roles: [admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
  /admin/content/{type}:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
    get:
      tags: [Admin & Analytics]
      summary: List CMS content of a type (incl. archived)
      operationId: adminListContent
      # S28: CMS is an ops job.
      # S55: was `200: {description: Content items}` with no schema at all, and create/update took
      # `{type: object}`. Five operations with no contract is not a contract. Typed against
      # ContentItem / ContentItemWrite. Stays a bare array (api-standards.md 5.1: CMS is fixed
      # reference data), and includes archived rows because the ops screen has an Archived tab.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Content items, newest first, archived included
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentItem' }
    post:
      tags: [Admin & Analytics]
      summary: Create CMS content item
      operationId: adminCreateContent
      # S28: CMS is an ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemWrite' }
      responses:
        '201':
          description: Created
          # S56: was a bodiless 201. The ops screen renders the saved row straight from the
          # response; without a body it has to guess the server-assigned id and timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Admin & Analytics]
      summary: Update CMS content item
      operationId: adminUpdateContent
      # S28: CMS is an ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Admin & Analytics]
      summary: Archive content item (soft delete)
      operationId: adminArchiveContent
      # S28: CMS is an ops job.
      # S56: returns the item so the caller can see `archived: true` without a re-read.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Admin & Analytics]
      summary: Restore archived content item
      operationId: adminRestoreContent
      # S28: CMS is an ops job.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /society-leads:
    get:
      tags: [Admin & Analytics]
      summary: Society / builder B2B leads
      operationId: listSocietyLeads
      # S28: B2B pipeline. Anyone may submit a lead; only ops may read them.
      # S57: was an unpaged array of every lead on the platform, each carrying a name and a mobile
      # number - an unbounded response and a bulk contact export in one. Identical defect to S47 on
      # support tickets. Paged, with a status filter so the pipeline can be worked a column at a time.
      x-roles: [staff, admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, contacted, qualified, won, lost] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Leads, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyLead' }
    post:
      tags: [Admin & Analytics]
      summary: Submit society/builder enquiry (public)
      operationId: createSocietyLead
      # S28: deliberately NO x-roles. security: [] — public B2B lead capture; the submitter is not a user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyLeadCreate' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyLead' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /society-leads/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Admin & Analytics]
      summary: Update society lead (staff)
      operationId: updateSocietyLead
      # S28: Working the B2B pipeline.
      # S56: returns the lead so the board can re-render from the response.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyLead' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token issued by the Identity & Access domain. Send as
        `Authorization: Bearer <token>`. Short-lived (15 min); refresh via
        `/auth/refresh`. Claims carry `sub`, `role`, `mobileVerified`, and
        `aadhaarVerified` (an opt-in trust **badge**, not a gate — participation only
        needs `mobileVerified`); `staff` tokens also carry `team`.
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.punenest.in/.well-known/openid-configuration
      description: >
        Target-state federation. The modular monolith issues its own JWTs today;
        an external OIDC provider (Keycloak/Auth0) can be adopted without changing
        resource-server contracts.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`field,(asc|desc)`; repeatable for multi-sort.'
      schema: { type: string, example: createdAt,desc }
    PropertyId:
      name: id
      in: path
      required: true
      description: Property slug or id.
      schema: { type: string, example: 3bhk-koregaon-park-xf12 }
    PropId:
      name: propId
      in: path
      required: true
      description: Property id.
      schema: { type: string }
    ContentType:
      name: type
      in: path
      required: true
      description: Which CMS list is being managed.
      schema: { type: string, enum: [announcements, services, faqs, banners] }
    GenericId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReqId:
      name: reqId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID to make unsafe money/booking operations retry-safe.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: bad_request, message: Invalid query parameter 'size', status: 400 }
    Unauthorized:
      description: Missing/invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthorized, message: Authentication required, status: 401 }
    Forbidden:
      description: Authenticated but not permitted (RBAC, or owner accepts verified contacts only).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: forbidden, message: You do not have permission to perform this action, status: 403 }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: Property not found, status: 404 }
    Conflict:
      description: >
        The request is well-formed but conflicts with current state -- a duplicate, or an
        illegal transition for the resource's present status. Distinct from `422`, which is a
        payload that failed validation on its own terms.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: conflict, message: Rent for this month is already paid or in progress, status: 409 }
    ValidationError:
      description: Semantic validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until retry is allowed. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: rate_limited, message: Too many requests, status: 429 }

  links:
    GetCurrentUser:
      operationId: getMe
      description: Fetch the freshly authenticated user's profile.
    PollKycBadge:
      operationId: getAadhaarStatus
      description: Poll the opt-in badge until `status` is `verified` or `failed`.
    CheckContactStatus:
      operationId: contactStatus
      description: Re-read the gate state for the property just requested.
      parameters:
        propertyId: $request.body#/propertyId
    CloseThisDeal:
      operationId: closeDeal
      description: After reserving, close the deal (sold/rented) for the same property.
      parameters:
        propId: $request.path.propId
    FinalizationStatus:
      operationId: finalizationStatus
      description: Track the maker-checker finalization for this property.
      parameters:
        propId: $request.path.propId
    RespondToOffer:
      operationId: respondOffer
      description: Owner accepts / declines / counters the submitted offer.
      parameters:
        id: $response.body#/id
  callbacks:
    DigilockerVerificationResult:
      'https://api.punenest.example/api/webhooks/cashfree/digilocker':
        post:
          summary: Cashfree posts the DigiLocker verification result here (async continuation).
          description: See `POST /webhooks/cashfree/digilocker` for signature verification and full semantics.
          requestBody:
            content:
              application/json:
                schema: { $ref: '#/components/schemas/DigilockerWebhook' }
          responses:
            '200': { description: Acknowledged }
    PaymentResult:
      'https://api.punenest.example/api/webhooks/cashfree/payment':
        post:
          summary: Cashfree posts the terminal payment result here (async continuation).
          description: See `POST /webhooks/cashfree/payment` for signature verification and full semantics.
          requestBody:
            content:
              application/json:
                schema: { $ref: '#/components/schemas/PaymentWebhook' }
          responses:
            '200': { description: Acknowledged }
  schemas:
    # ---- Common / primitives ----
    Error:
      type: object
      required: [error, message, status]
      properties:
        error: { type: string, description: Machine-readable code., example: not_found }
        message: { type: string, description: Human-readable detail. }
        status: { type: integer, description: HTTP status., example: 404 }
        traceId: { type: string, description: Correlation id for observability. }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: mobile }
                  message: { type: string, example: must be a 10-digit Indian mobile }
    PageEnvelope:
      type: object
      description: Envelope for paginated collections; `content` is supplied per endpoint.
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        sort: { type: string, example: createdAt,desc }
    Mobile:
      type: string
      pattern: '^[6-9][0-9]{9}$'
      description: >-
        An Indian mobile number. The pattern is the canonical stored and returned
        shape: ten digits, leading 6-9. On input the server is deliberately more
        tolerant (Q1) — it accepts spacing and a leading +91/0091/0 country code and
        normalises to these ten digits before storing. Anything that does not reduce
        to a valid ten-digit mobile is rejected with 422.
      example: '9876543210'
    Money:
      type: integer
      format: int64
      description: Amount in whole Indian rupees (INR). No decimals/paise.
      example: 2500000
    DealIntent:
      type: string
      description: Transaction intent.
      enum: [buy, rent]
    Furnishing:
      type: string
      enum: [unfurnished, semi-furnished, furnished]
    PropertyPossession:
      type: string
      description: >
        When the property can be occupied. Absent/null means "not stated", which is
        deliberately distinct from all three values — an unrecorded possession must not
        satisfy a `ready-to-move` search. Land and plot listings have no meaningful
        possession state and stay unset.
      enum: [ready-to-move, new-launch, under-construction]
    PropertyStatus:
      type: string
      enum: [pending, approved, rejected, flagged, archived, sold, rented]
      description: >
        Moderation state. `sold`/`rented` are terminal (D110): set when the listing's deal closes,
        they drop it from the approved-floored search but keep it reachable by direct link, badged.
    Role:
      type: string
      description: >
        Canonical auth role carried in the JWT `role` claim. Property seekers
        (buyers and tenants) share the single `buyer` role. `staff` are scoped
        further by `team`. Admin RBAC labels (e.g. manager/member) are
        permissions, not roles, and are not modelled here.
      enum: [buyer, owner, staff, admin]
    Team:
      type: string
      description: Ops team a staff member belongs to; scopes service-request and ticket routing.
      enum: [rental, legal, loans, interior, packers, valuation]
    Party:
      type: object
      description: |
        A platform user acting as a participant on an offer, visit, deal or finalization
        request. Always resolves to a registered account, so `id` is the user id.
        `mobile` is contact gated and arrives masked until the owner has acted.
      properties:
        id:
          type: string
          readOnly: true
          description: User id of the participant. Server-assigned.
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { type: string, enum: [buyer, owner] }
    # Slice-4 spec fix S6. Distinct from Party on purpose. An under-offer party is an
    # off-platform person the owner jotted down while the listing is reserved -- a free-text
    # name, a raw mobile and a private note. It has no account, so it has no `role` and no
    # contact gating, and it carries `note`/`at` which are meaningless on Offer.from or
    # Visit.visitor. Overloading Party would have leaked two optional fields into five
    # unrelated payloads. `id` is required by DELETE /me/deals/{propId}/parties/{partyId}
    # (see S5): without it the client can never learn what to delete.
    DealParty:
      type: object
      description: An off-platform interested party recorded by the owner on a reserved deal.
      required: [name]
      properties:
        id:
          type: string
          readOnly: true
          description: Server-assigned. Stable across edits, unlike the previous positional index.
        name: { type: string, maxLength: 120 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string, maxLength: 500 }
        at:
          type: string
          format: date-time
          readOnly: true
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        note: { type: string, maxLength: 500 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string }
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
        # NOT IMPLEMENTED. Declared here since the contract was first written; the Java
        # `MessageCreate` record carries `body` only, and there is no upload surface for chat.
        # Kept rather than deleted because the client's share chips (contact / document / location /
        # visit) are the eventual consumers - but they currently send plain text, and a reader of
        # this schema must not assume otherwise.
        attachments:
          type: array
          items: { type: string, format: uri }
    Message:
      type: object
      properties:
        id: { type: string }
        authorId:
          type: string
          description: >
            Who wrote it. **Use this, not `author`, to decide whether a message is the reader's
            own.** `author` is a display name, and attributing by name works until two users share
            one - at which point a stranger's message renders on the reader's side of the thread.
        author: { type: [string, 'null'], description: Display name, absent if the account has none }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      description: In-app chat thread between two parties, optionally about a listing.
      properties:
        id: { type: string }
        counterpartyName: { type: string }
        counterpartyRole: { $ref: '#/components/schemas/Role' }
        # Slice-12 spec fix S49. Masked or raw by the same ADR-019 rule the rest of the platform
        # uses, and the rule is not symmetric: an approved contact request reveals the *owner's*
        # number to the buyer who asked, never the buyer's number to the owner. So a buyer in a
        # conversation about a listing they were approved for sees a raw number, and the owner on
        # the other side of that same thread sees `98XXXXX210`. Being in a conversation is not
        # itself a reveal -- if it were, starting one would route around the contact gate.
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        propertyId: { type: [string, 'null'] }
        propertyTitle: { type: [string, 'null'] }
        lastMessage: { type: string, description: Preview of the most recent message }
        unread: { type: integer, description: Unread message count for the current user }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          description: Full thread; present on detail, omitted on list.
          items: { $ref: '#/components/schemas/Message' }
    ConversationCreate:
      type: object
      required: [counterpartyMobile, body]
      properties:
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        propertyId: { type: string, description: 'Listing the chat is about, if any' }
        body: { type: string, maxLength: 4000 }

    # ---- Identity & Access ----
    LoginRequest:
      type: object
      required: [mobile]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        otp: { type: string, description: Required on the verify step., example: '123456' }
        password: { type: string, description: Optional password path. }
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, description: The rotating single-use refresh token issued by the previous auth call. }
    AuthResponse:
      type: object
      description: >
        Dual-shape response. `POST /auth/login` without an `otp` is the *send* step and returns
        only `{ "otpSent": true }` — no tokens. A completed verify / staff-login / refresh returns
        the token pair plus `user`. Absent fields are omitted, not null.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, default: Bearer }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }
        otpSent:
          type: boolean
          description: Present and `true` only on the OTP-send step; omitted on token-bearing responses.
          example: true
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/Role' }
        team: { $ref: '#/components/schemas/Team' }
        status: { type: string, enum: [active, suspended, archived] }
        verified: { type: boolean, description: 'Opt-in identity Verified badge (L2, ADR-019) — not required to participate.' }
        city: { type: string, example: Pune }
        mobileVerified: { type: boolean, description: Mobile-OTP (L1) — the floor for posting/enquiring/contacting. }
        aadhaarVerified: { type: boolean, description: 'Alias of the Verified badge (DigiLocker). A trust signal, never a gate.' }
        verifiedContactOnly: { type: boolean, description: Owner preference — accept contact requests from verified (L2) users only. }
        hideNumber: { type: boolean, description: 'Owner preference — stay masked even after approving a contact request. The approval grants the conversation, not the digits.' }
        listingsCount: { type: integer, description: Active listings (owners) }
        joinedAt: { type: string, format: date-time }
        lastActive: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string, format: uri }
        city: { type: string, description: 'Home city. The profile form has always sent this; the contract lacked it, so it was accepted and silently dropped (D20).' }
        hideNumber: { type: boolean, description: 'Owner preference - stay masked even after approving a contact request; reach me in-app instead. Not a second gate: approval still unlocks the conversation (D5).' }

    # ---- Catalog & Search ----
    PropertySummary:
      type: object
      description: Lightweight card projection for search/lists (no gated contact).
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { type: string, example: apartment }
        bhk: { type: number, example: 3 }
        price: { $ref: '#/components/schemas/Money' }
        priceUnit: { type: string, enum: [total, per-month], example: per-month }
        area: { type: number, example: 1180 }
        areaUnit: { type: string, example: sqft }
        furnishing: { $ref: '#/components/schemas/Furnishing' }
        possession: { $ref: '#/components/schemas/PropertyPossession' }
        locality: { type: string, example: Koregaon Park }
        localitySlug:
          type: string
          example: koregaon-park
          description: >-
            Curated locality key (FK to Locality.slug) and the value the `locality` search filter
            matches on. `locality` above is the human display name and is NOT unique or stable —
            never key off it. Absent when the listing's locality could not be resolved to a curated
            locality (owner free-text that matched nothing); such listings are invisible to locality
            filters until curated during moderation.
        city: { type: string, example: Pune }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        coverImage: { type: string, format: uri }
        verified: { type: boolean }
        postedByType: { type: string, enum: [owner, agent, builder] }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        dealStatus:
          type: string
          enum: [active, reserved, closed]
          description: >
            Deal outcome mirrored from the owner-scoped deal (D110), readable on public cards and
            detail. `reserved` badges a listing "under offer" while it stays `approved` and still
            takes offers; `closed` accompanies a terminal `sold`/`rented` status.
        boosted:
          type: boolean
          description: >
            The owner is paying to promote this listing (D59). Disclosure, not capability: a boosted
            listing is ranked above unboosted ones **only in the default order**, and an explicit
            `sort` (price/area/bhk) is honoured exactly, so paid placement can never silently
            override the order a buyer chose. Computed from the live promotion window at request
            time, so it is never stale. Clients should label these cards visibly.
        createdAt: { type: string, format: date-time }
    Property:
      allOf:
        - $ref: '#/components/schemas/PropertySummary'
        - type: object
          properties:
            description: { type: string }
            deposit: { $ref: '#/components/schemas/Money' }
            maintenance: { $ref: '#/components/schemas/Money' }
            negotiable: { type: boolean }
            reraId: { type: string }
            carpetArea: { type: number }
            builtUpArea: { type: number }
            superBuiltUpArea: { type: number }
            floor: { type: integer }
            totalFloors: { type: integer }
            facing: { type: string }
            amenities:
              type: array
              items: { type: string }
            images:
              type: array
              items: { type: string, format: uri }
            floorPlan: { type: string, format: uri }
            video: { type: string, format: uri }
            address: { type: string }
            pincode: { type: string }
            views: { type: integer, description: Denormalized view counter }
            enquiries: { type: integer, description: Denormalized enquiry counter }
            featured: { type: boolean }
            flagReason: { type: [string, 'null'], description: Admin moderation flag; empty when unflagged }
            archived: { type: boolean, description: Soft-delete flag. A separate axis from status - always false on the public detail read; meaningful on /me/listings and /admin/properties. }
            ownerVerified: { type: boolean }
            ownershipVerified: { type: boolean }
            societyVerified: { type: boolean }
            conveyanceDone: { type: boolean }
            docsCount: { type: integer }
            owner:
              type: object
              description: Owner summary; contact number masked until the contact-gate is passed.
              properties:
                id: { type: string }
                name: { type: string }
                mobile: { type: string, description: Masked (e.g. 98XXXXX210) until unlocked }
                verified: { type: boolean }
            adminPipeline:
              type: object
              description: Admin post-on-behalf onboarding pipeline (staff-created listings).
              properties:
                postedByAdmin: { type: boolean }
                postedByStaff: { type: [string, 'null'] }
                pipelineStage: { type: string, enum: [listed, docs_submitted, photos_uploaded, aadhaar_verified, claim_sent, claimed] }
                claimLinkSent: { type: boolean }
                photosUploaded: { type: boolean }
                aadhaarVerified: { type: boolean }
                reminderCount: { type: integer }
    Locality:
      type: object
      properties:
        slug: { type: string, example: koregaon-park }
        name: { type: string, example: Koregaon Park }
        city: { type: string, example: Pune }
        listingCount: { type: integer }
        avgRentPsf: { type: number }
        avgBuyPsf: { type: number }
        ratePerSqft: { type: number, description: Avg buy rate (INR/sqft) }
        avgRent: { type: integer, description: Absolute avg monthly rent (INR) }
        demand: { type: integer, description: Demand index (0-100) }
        focus: { type: string, enum: [Buy, Rent, Both] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        active: { type: boolean, description: Shown on site }
    LocalityDetail:
      allOf:
        - $ref: '#/components/schemas/Locality'
        - type: object
          properties:
            about: { type: string }
            connectivity: { type: array, items: { type: string } }
            highlights: { type: array, items: { type: string } }
            priceTrends:
              type: array
              items:
                type: object
                properties:
                  month: { type: string }
                  rentPsf: { type: number }
                  buyPsf: { type: number }
    Society:
      type: object
      properties:
        id: { type: string, example: S01 }
        slug: { type: string, example: kumar-pinnacle }
        name: { type: string }
        builder: { type: string }
        localitySlug: { type: string }
        lat: { type: number }
        lng: { type: number }
        year: { type: integer, description: Year built / possession }
        towers: { type: integer }
        units: { type: integer }
        occupancy: { type: number, description: Occupancy percentage (0-100) }
        maintenancePerSqft: { type: number }
        parkingRatio: { type: number }
        lifts: { type: integer }
        security:
          type: [string, 'null']
          example: 3-tier + CCTV
          description: >-
            Security arrangement, free text. Spec fix S25: was a boolean. "Gated", "3-tier + CCTV"
            and "Guard at gate only" are materially different to somebody choosing where to live,
            and a boolean discards that difference while pretending to answer the question.
        water: { type: string }
        power: { type: string }
        petPolicy: { type: string }
        vegPolicy: { type: string }
        rera: { type: [string, 'null'], description: MahaRERA registration id; empty if none }
        registration: { type: boolean, description: Society registered }
        conveyance: { type: boolean, description: Conveyance deed done }
        amenities: { type: array, items: { type: string } }
        source: { type: string, enum: [curated, rera, community], description: Origin of the record }
        claimStatus: { type: string, enum: [unclaimed, pending, claimed], description: Community claim state }
        listingCount: { type: integer }
        followerCount: { type: integer }
        followedByMe: { type: boolean }
        avgRating:
          type: [number, 'null']
          description: >-
            Average published rating, computed on read. Null — not 0 — when the society has no
            reviews: no rating is not a rating of zero, and a card rendering 0.0 for an unreviewed
            society states something false about it. On the directory as well as the hub because
            the cards show a star; resolving it per card would be one request per row.
        reviewCount:
          type: integer
          description: >-
            How many published reviews the average is over. Without it the average is unreadable —
            4.9 from one review is not 4.9 from two hundred.
    SocietyDetail:
      allOf:
        - $ref: '#/components/schemas/Society'
        - type: object
          properties:
            homes:
              type: array
              items: { $ref: '#/components/schemas/PropertySummary' }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/Review' }
    Reel:
      type: object
      properties:
        id: { type: string, example: RL1 }
        listingId: { type: string, description: FK to a property }
        title: { type: string }
        locality: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        deal: { $ref: '#/components/schemas/DealIntent' }
        poster: { type: string, description: Poster / thumbnail image url }
        video: { type: string, description: Video url }
        likes: { type: integer }
        views: { type: integer }
        tag: { type: string }
    City:
      type: object
      properties:
        slug: { type: string, example: pune }
        name: { type: string, example: Pune }
        live: { type: boolean }
        listingCount: { type: integer }
    CityWaitlistRequest:
      type: object
      required: [mobile, city]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        city: { type: string }
        email: { type: string, format: email }
    Fees:
      type: object
      description: Transparent fee/charges breakdown for a deal.
      properties:
        deal: { $ref: '#/components/schemas/DealIntent' }
        brokerage: { $ref: '#/components/schemas/Money' }
        platformFee: { $ref: '#/components/schemas/Money' }
        stampDuty: { $ref: '#/components/schemas/Money' }
        registration: { $ref: '#/components/schemas/Money' }
        gst: { $ref: '#/components/schemas/Money' }
        notes: { type: string }
    # ---- Listings (owner) ----
    ListingCreate:
      type: object
      required: [title, deal, propertyType, price, locality, city]
      properties:
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { type: string }
        bhk: { type: number }
        price: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        maintenance: { $ref: '#/components/schemas/Money' }
        negotiable: { type: boolean }
        area: { type: number }
        areaUnit: { type: string, default: sqft }
        furnishing: { $ref: '#/components/schemas/Furnishing' }
        locality: { type: string }
        city: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        reraId: { type: string }
        possession: { $ref: '#/components/schemas/PropertyPossession' }
        amenities: { type: array, items: { type: string } }
        images: { type: array, items: { type: string, format: uri } }
        description: { type: string }
    ListingUpdate:
      allOf:
        - $ref: '#/components/schemas/ListingCreate'
        - type: object
          description: All fields optional on update (PATCH semantics).
    PropertyStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          # Deliberately NOT $ref PropertyStatus. That enum has five values; this operation accepts
          # three. `flagged` is reached through flagProperty (which also records a reason) and
          # `archived` through archiveProperty (a separate axis, and owner-or-staff rather than
          # staff-only), so allowing either here would be a second, reason-less way to do something
          # the API already models properly. The implementation 400s on the other two; before this
          # was narrowed the contract promised five and delivered three.
          enum: [pending, approved, rejected]
          description: Moderation decision. Use flagProperty / archiveProperty for the other states.
        reason: { type: string, description: Recorded on the audit row; required by convention when rejecting }
    Offer:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        from: { $ref: '#/components/schemas/Party' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, countered, accepted, declined, withdrawn] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        # The buyer's preferred possession date, or absent if none was given (D112). A calendar day,
        # not an instant — `format: date`, matching the offer modal's date picker.
        moveIn: { type: string, format: date }
        history:
          type: array
          description: Negotiation trail.
          items:
            type: object
            properties:
              amount: { $ref: '#/components/schemas/Money' }
              by: { type: string, enum: [buyer, owner] }
              at: { type: string, format: date-time }
    OfferCreate:
      type: object
      # `propertyId` is required here because POST /offers is not nested under a property
      # and carries no path parameter — without it the server cannot know which listing is
      # being offered on. Added in slice 4; the endpoint was unimplementable as written.
      required: [propertyId, amount]
      properties:
        propertyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        message: { type: string }
        # Optional preferred possession date (D112) — the modal's "Preferred move-in" / "Target
        # possession" field. Nullable: a buyer may open on price alone and settle the date later.
        moveIn: { type: string, format: date }
    OfferResponse:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline, counter] }
        counterAmount: { $ref: '#/components/schemas/Money' }
        message: { type: string }
    Visit:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        visitor: { $ref: '#/components/schemas/Party' }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person, video] }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled, no-show] }
        createdAt: { type: string, format: date-time }
    VisitCreate:
      type: object
      # Same defect as OfferCreate: neither POST /visits nor POST /visit-requests is nested
      # under a property or carries a path parameter, so the listing has to travel in the
      # body. Added in slice 4.
      required: [propertyId, slot]
      properties:
        propertyId: { type: string }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person, video], default: in-person }
        note: { type: string }
    VisitSlotUpdate:
      type: object
      # D87: reschedule carries only the new instant. The server resets the visit to `scheduled`,
      # so no status is sent — mirrors how VisitCreate carries the slot as a single date-time.
      required: [slot]
      properties:
        slot: { type: string, format: date-time }
    Deal:
      type: object
      description: A closed/closing deal aggregate (owner ↔ counterparty lifecycle).
      properties:
        id: { type: string }
        propertyId: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        counterparty: { $ref: '#/components/schemas/Party' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [active, reserved, closed] }
        closedAt: { type: string, format: date-time }
    DealCloseRequest:
      type: object
      required: [agreedPrice, counterpartyMobile]
      properties:
        agreedPrice: { $ref: '#/components/schemas/Money' }
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string }

    # ---- Moderation ----
    StaffCreate:
      # S33: `mobile` added and made required. The source contract omitted it, but `users.mobile` is
      # NOT NULL UNIQUE with a format CHECK - it is the platform's natural identity for every user,
      # not a profile extra - so `addStaff` was literally unable to insert a row. Relaxing the column
      # instead was the alternative and the wrong one: it would have weakened the natural key for all
      # ~40k user rows to accommodate a handful of colleagues. `password` stays optional because a
      # staff member can also sign in through the ordinary OTP path on that same mobile; it is only
      # required for the email+password StaffLoginRequest route.
      type: object
      required: [name, mobile, email, role]
      properties:
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        team: { $ref: '#/components/schemas/Team' }
        password: { type: string, format: password }
    KycStartRequest:
      type: object
      description: >
        Optional parameters when starting the DigiLocker badge flow. No Aadhaar number is
        ever sent — verification happens on DigiLocker.
      properties:
        redirectUrl: { type: string, format: uri, description: Where DigiLocker returns the user after consent. }
    KycStart:
      type: object
      description: Handle to an in-progress DigiLocker verification (ADR-009/017).
      required: [verificationUrl, ref]
      properties:
        ref: { type: string, description: Server-side verification reference (correlates with the webhook). }
        verificationUrl: { type: string, format: uri, description: Short-lived Cashfree/DigiLocker consent URL to redirect the user to. }
        expiresAt: { type: string, format: date-time }
    AadhaarVerification:
      type: object
      description: >
        The caller's opt-in identity-verification badge (L2). A badge boosts ranking and
        trust but is never required to browse, post or contact (ADR-019).
      properties:
        badge: { type: boolean, description: True once the Verified badge is earned. }
        status: { type: string, enum: [none, pending, verified, failed] }
        source: { type: string, enum: [digilocker], description: Verification source (Cashfree Secure ID DigiLocker). }
        maskedAadhaar: { type: string, example: 'XXXX XXXX 1234', description: Last-4 only; the full number is never stored. }
        mobileMatch: { type: [boolean, 'null'], description: Soft signal — whether the Aadhaar-linked mobile matches the account mobile (ADR-009a). Not a gate at MVP. }
        verifiedAt: { type: [string, 'null'], format: date-time }
    DigilockerWebhook:
      type: object
      description: Cashfree Secure ID DigiLocker callback payload (provider → backend).
      properties:
        type: { type: string, example: DIGILOCKER_VERIFICATION_SUCCESS }
        ref: { type: string, description: Correlates with the `ref` returned by KycStart. }
        status: { type: string, enum: [SUCCESS, FAILED] }
        data:
          type: object
          description: Verified identity fields (masked); raw Aadhaar is never delivered.
          properties:
            maskedAadhaar: { type: string, example: 'XXXX XXXX 1234' }
            mobile: { $ref: '#/components/schemas/Mobile' }
            identityHash: { type: string, description: Server-computed composite dedup key (ADR-009b); not stored raw here. }
    PaymentWebhook:
      type: object
      # S15 (slice 5): this documented a FLAT payload -- {type, orderId, referenceId, purpose,
      # status, amount, paidAt} -- that Cashfree does not send and never has. The real v2025-01-01
      # envelope nests everything under `data`, with the order id at data.order.order_id and the
      # outcome at data.payment.payment_status. Anyone implementing the contract faithfully would
      # have built a handler that silently never fires: every field would read as null, the
      # signature would still verify, and the endpoint would answer 200 while doing nothing. That
      # is the worst failure mode available to a payment webhook.
      #
      # Corrected to the real shape. Two consequences worth stating, because they are easy to lose:
      #   * `purpose` does not exist upstream. What the payment settles must be recovered from our
      #     own order record, keyed by order_id -- not read off the callback.
      #   * order_amount is a DECIMAL with paise ("170.00"), not the platform's whole-rupee Money.
      #     It is typed as a string here deliberately: parsing it into an integer rupee value is a
      #     lossy decision that belongs in one place in the handler, not implied by the schema.
      description: >
        Cashfree Payment Gateway callback payload (provider → backend), API version 2025-01-01
        (ADR-017). Authenticity is verified from `x-webhook-signature` over
        `x-webhook-timestamp + rawBody`; the body must be read raw, because re-serializing the JSON
        changes the bytes and therefore the digest. Handlers dedupe on `data.order.order_id` and
        always answer 200.
      properties:
        type:
          type: string
          enum:
            - PAYMENT_SUCCESS_WEBHOOK
            - PAYMENT_FAILED_WEBHOOK
            - PAYMENT_USER_DROPPED_WEBHOOK
          example: PAYMENT_SUCCESS_WEBHOOK
        event_time: { type: string, format: date-time }
        data:
          type: object
          properties:
            order:
              type: object
              properties:
                order_id: { type: string, description: Cashfree order id; the idempotency / dedup key. }
                order_amount: { type: string, example: '17000.00', description: 'Decimal rupees with paise, as sent by the provider.' }
                order_currency: { type: string, example: INR }
            payment:
              type: object
              properties:
                cf_payment_id: { type: string }
                payment_status: { type: string, enum: [SUCCESS, FAILED, PENDING, USER_DROPPED] }
                payment_amount: { type: string, example: '17000.00' }
                payment_group: { type: string, example: upi }
                payment_time: { type: [string, 'null'], format: date-time }
            error_details:
              type: [object, 'null']
              description: Present on PAYMENT_FAILED_WEBHOOK.
              properties:
                error_code: { type: string }
                error_description: { type: string }
                error_reason: { type: string, example: bank_declined }
                error_source: { type: string, enum: [bank, cashfree, user] }
    PropertyReview:
      # S34 (slice 9): `messages` added.
      #
      # Same defect class as S30 and S31, found in the same sweep. The contract shipped
      # `POST /properties/{id}/verification/messages` to write into the owner<->ops clarification
      # thread and `POST .../verification/read` to mark it read, but the only GET on the thread
      # returned no messages at all - so the owner could be asked for a document and had no endpoint
      # that would ever show them the question. A write-only conversation is not a conversation.
      type: object
      description: Moderation record for a listing under review.
      properties:
        propertyId: { type: string }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        reviewer: { type: string }
        checklist:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              pass: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/VerificationMessage' }
        notes: { type: string }
        decidedAt: { type: string, format: date-time }

    VerificationMessage:
      # S34: the wire shape of one message in the clarification thread. `from` is derived
      # server-side by comparing the sender to the listing owner, never sent by the client - a
      # client-supplied `from` would let an owner post a message that appeared to come from ops.
      type: object
      properties:
        id: { type: string }
        from: { type: string, enum: [owner, ops] }
        body: { type: string }
        at: { type: string, format: date-time }
        read: { type: boolean }
    Report:
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [property, user, review, post] }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, reviewing, actioned, dismissed] }
        createdAt: { type: string, format: date-time }
    ReportTriage:
      type: object
      description: >
        S30 (slice 9). Moves a report through triage. `note` is an internal ops note, never shown
        to the reporter or the reported party.
      required: [status]
      properties:
        status: { type: string, enum: [open, reviewing, actioned, dismissed] }
        note: { type: string, maxLength: 2000 }
    ReviewStatusUpdate:
      type: object
      description: >
        S31 (slice 9). Takes a review down (`rejected`) or restores it (`published`). `pending` is
        deliberately absent: it is the pre-moderation state a review is created in, and moving a
        live review back to it would hide it with no record of a decision having been made.
      required: [status]
      properties:
        status: { type: string, enum: [published, rejected] }
        reason: { type: string, maxLength: 2000 }
    ReportCreate:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [property, user, review, post] }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }

    # ---- Leads & Contact ----
    ContactStatus:
      type: object
      description: Whether the caller may see a listing's contact, under the badge-not-gate model (ADR-019).
      properties:
        status: { type: string, enum: [owner, approved, pending, declined, none], description: 'Gate state for this caller vs this listing: owner (viewer owns it), approved, pending, declined, or none (no request yet).' }
        verifiedContactOnly: { type: boolean, description: True when the owner accepts verified contacts only — caller needs the L2 badge (ADR-019). }
        verificationRequired: { type: boolean, description: True when this specific request is blocked pending the caller's Verified badge. }
        ownerHidesNumber: { type: boolean, description: 'True when the owner has opted to stay masked even after approving. The client should offer chat instead of a call; approval still stands (D5).' }
    ContactRequestCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        message: { type: string, maxLength: 1000 }
    ContactRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        requester: { $ref: '#/components/schemas/Party' }
        status: { type: string, enum: [pending, approved, declined] }
        contact:
          type: [object, 'null']
          description: Present only after the gate is passed & owner grants.
          properties:
            name: { type: string }
            mobile: { $ref: '#/components/schemas/Mobile' }
        createdAt: { type: string, format: date-time }
    # Slice-12 spec fix S45: `Enquiry` removed with its only operation. See /enquiries above.
    FinalizationRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        initiator: { $ref: '#/components/schemas/Party' }
        counterparty: { $ref: '#/components/schemas/Party' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, accepted, declined, cancelled] }
        createdAt: { type: string, format: date-time }
    FinalizationCreate:
      type: object
      # `propertyId` duplicates the {propId} path parameter of POST /finalization/{propId}/request.
      # Two sources for one value invites disagreement, so it is now optional and advisory:
      # the path always wins, and a body value that contradicts it is rejected with 422
      # rather than silently ignored. (Slice 4.)
      required: [counterpartyMobile, agreedPrice]
      properties:
        propertyId:
          type: string
          description: >
            Optional echo of the {propId} path parameter. If present it MUST equal the path
            value; a mismatch is a 422. The path is authoritative.
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
    # ---- Rentals & Payments ----
    Transaction:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        type: { type: string, enum: [income, expense] }
        category: { type: string, example: rent }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly], default: none }
    # S14 (slice 5): GET /me/finances/{propId}/dues returned a bare Transaction[], so a "due" --
    # whose entire defining fact is *when it falls due* -- carried no due date. The client could
    # only recompute it by re-implementing the recurrence rules, which is how two answers to one
    # question start to diverge. The server owns the recurrence, so the server states the date.
    Due:
      type: object
      description: >
        A recurring transaction projected forward to its next occurrence. `nextDue` is derived
        server-side from the transaction's `date` and `recurring` interval.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            nextDue: { type: string, format: date, description: The next occurrence on or after today. }
            daysUntil: { type: integer, description: Whole days from today to nextDue; negative if overdue. }
    TransactionCreate:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly], default: none }
    # S19 (slice 5): the partial-update shape the PATCH always needed. Every field optional -
    # an absent key means "leave it alone", which is what PATCH means and what the UI sends.
    TransactionUpdate:
      type: object
      description: >
        Partial update. Only the fields present are changed; `amount` and `date` cannot be set to
        null once present, because a ledger row without either is not a transaction.
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly] }
    OwnershipBasis:
      type: object
      properties:
        purchasePrice: { $ref: '#/components/schemas/Money' }
        purchaseDate: { type: string, format: date }
        loanOutstanding: { $ref: '#/components/schemas/Money' }
        emi: { $ref: '#/components/schemas/Money' }
        currentValue: { $ref: '#/components/schemas/Money' }
    FinanceSummary:
      type: object
      properties:
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        # S20 (slice 5): occupancyRate is nullable, and that is the point. It is tenanted-days over
        # days-in-window, derived from tenancies - so for a listing that has never been let (a
        # sale listing, or a flat the owner lives in) there is no rate to state. Returning 0.0
        # there would assert "vacant the whole time", which reads as a failing property rather
        # than an inapplicable question, and would drag any portfolio average down with it.
        occupancyRate:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 1
          description: >
            Fraction of the requested window covered by an active tenancy, or null if the property
            has never had one.
    CashflowPoint:
      type: object
      properties:
        month: { type: string, example: 2025-01 }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
    RentPayment:
      type: object
      properties:
        id: { type: string }
        tenancyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        # S13 (slice 5): platformFee and gst are stored by V6, whose header states they are
        # "server-computed from platform_fees/settings, never trusted from the client" -- but they
        # were absent from this response, so the only place the tenant could see them was the
        # browser's own calculation (lib/store/rent.js). A fee the client computes is a fee the
        # client can change, and a receipt that disagrees with the ledger is a support ticket.
        platformFee: { $ref: '#/components/schemas/Money' }
        gst: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        paidDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [due, paid, overdue, failed] }
        method: { type: string, enum: [upi, netbanking, card, autopay, cash] }
        reference: { type: string }
        failureReason: { type: [string, 'null'], description: "The provider's reason when status is failed, else null — a tenant can quote it to support." }
        # D167. The single-use Cashfree checkout session, mirroring `Subscription.paymentSessionId`.
        # Present only in the immediate `payRent` response for a freshly opened order; never stored,
        # so always null when the ledger is read back.
        paymentSessionId: { type: [string, 'null'] }
    RentPaymentCreate:
      type: object
      # S12 (slice 5): `amount` was client-supplied and required. Rent is a property of the
      # tenancy, so a tenant could have paid Rs 1 and the server would have recorded it as the
      # month's rent. Verbatim the slice-4 lesson: derive the sensitive value, do not validate what
      # the client sent. The amount is now taken from the tenancy; the optional `expectedAmount`
      # exists only so a client that is displaying a stale rent figure gets a 422 instead of
      # silently charging the new one.
      required: [tenancyId]
      properties:
        tenancyId: { type: string }
        expectedAmount:
          $ref: '#/components/schemas/Money'
          # Optional client-side optimistic check; the server bills the tenancy's rent regardless.
        method: { type: string, enum: [upi, netbanking, card, autopay] }
    RentMandate:
      type: object
      properties:
        id: { type: string }
        tenancyId: { type: string }
        maxAmount: { $ref: '#/components/schemas/Money' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 28 }
        status: { type: string, enum: [active, paused, revoked] }
        provider: { type: string, example: cashfree }
    # S22 (slice 6): the write shape, split out of RentMandate. See PUT /me/rent-mandate for why.
    RentMandateUpdate:
      type: object
      required: [tenancyId]
      properties:
        tenancyId: { type: string }
        maxAmount:
          $ref: '#/components/schemas/Money'
          # The ceiling the tenant authorises. Deliberately not the rent: a rent increase must not
          # be collectable automatically without the tenant consenting to the new figure.
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          description: >
            Capped at 28 rather than 31. A mandate set for the 30th does not fire in February --
            the one month a tenant most needs autopay to work.
        status:
          type: string
          enum: [active, paused, revoked]
          description: >
            Optional lifecycle change on an existing mandate. Absent means leave the status alone.
            `paused` <-> `active` is a round trip the tenant controls: pausing is the platform
            declining to debit an instruction the bank still holds, so resuming it consents to
            nothing new -- the ceiling and the day are unchanged. `revoked` is one-way: it
            withdraws the instruction, and reviving it would be charging an account on consent
            that was taken back, so a fresh mandate must be created instead. Sending `revoked` ->
            anything answers `409`.
    PayoutAccount:
      type: object
      description: Read shape. The full account number is never returned -- only the masked tail.
      properties:
        accountHolder: { type: string }
        maskedAccount: { type: string, example: 'XXXXXX7890' }
        ifsc: { type: string }
        upiId: { type: string }
        verified: { type: boolean }
    # S11 (slice 5): GET and PUT shared one schema whose only account field was `maskedAccount`
    # ("XXXXXX7890"). You cannot *set* a bank account from a masked value, so the write endpoint
    # was uncallable-as-specified -- the same defect shape as slice 4's DealParty having no id.
    # Splitting read from write also stops a client sending `verified: true` about itself: bank
    # verification is Cashfree's penny-drop answer, not the account holder's claim.
    PayoutAccountUpdate:
      type: object
      required: [accountHolder]
      properties:
        accountHolder: { type: string }
        accountNumber:
          type: string
          description: Full account number; stored masked, never returned. Required unless upiId is given.
          writeOnly: true
        ifsc: { type: string }
        upiId: { type: string }
    Tenancy:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenant: { $ref: '#/components/schemas/Party' }
        owner: { $ref: '#/components/schemas/Party' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [active, ended, terminated] }
    # S21 (slice 5): TenantProfile described a profile the product does not collect. The UI form
    # (pages/consumer/TenantProfile.jsx) captures name, occupation, monthly income, WHO will live
    # there, move-in date, a prior-landlord reference and a free-text introduction. The schema
    # instead had employer, familySize, budget and preferredLocalities -- of which only `name` and
    # `occupation` overlapped, and three of the four had no UI at all and never have.
    #
    # This was not cosmetic. The trust score is built from idVerified(30) + occupation(20) +
    # income(15) + priorLandlord(15) + about(10) + occupants(10). Four of those six inputs had no
    # column, so a server honouring the old schema could compute at most 50/100 -- every tenant's
    # score would have halved the moment the UI moved off the mock.
    #
    # `familySize: integer` is replaced by `occupants`, an enum. In Pune this is the single most
    # consequential tenant attribute: societies and owners screen explicitly on family vs bachelor
    # vs company lease, and many refuse bachelors outright. "3" cannot express "Bachelor (Male)",
    # so an integer does not merely lose detail, it loses the fact owners actually decide on.
    #
    # employer / budget / preferredLocalities are DROPPED rather than left unused -- same ruling as
    # D5's loan-rate and budget surfaces. `income` replaces `budget`: what a tenant earns is what an
    # owner screens on, and it is what the form asks for.
    TenantProfile:
      type: object
      description: >
        Read shape. `score` and `verified` are server-computed; see TenantProfileUpdate.
        `income` is shown only to an owner with an established relationship (see
        /tenant-profiles/{mobile}).
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        name: { type: string }
        occupation: { type: string, description: 'Free text, e.g. "Software Engineer".' }
        income: { $ref: '#/components/schemas/Money' }
        occupants:
          type: string
          enum: [family, bachelor_male, bachelor_female, company_lease]
          description: Who will occupy the home. Owners and societies screen on this directly.
        moveIn: { type: string, format: date, description: Earliest date the tenant can move in. }
        priorLandlord: { type: string, description: 'Reference contact, free text.' }
        about: { type: string, description: Tenant's own introduction. }
        score: { type: integer, minimum: 0, maximum: 100, readOnly: true, description: Computed trust score. }
        verified: { type: boolean, readOnly: true }
    # S17 (slice 5): PUT /me/tenant-profile accepted the full TenantProfile, including `score` and
    # `verified` -- so a tenant could award themselves a trust score of 100 and a verified badge,
    # which is precisely the signal owners use to decide who to let into their flat. `mobile` was
    # writable too, letting a profile be filed against somebody else's number. All three are now
    # server-owned and absent from the write shape rather than merely ignored, so a client author
    # discovers the rule from the contract instead of from an unexplained no-op.
    TenantProfileUpdate:
      type: object
      properties:
        name: { type: string }
        occupation: { type: string }
        income: { $ref: '#/components/schemas/Money' }
        occupants: { type: string, enum: [family, bachelor_male, bachelor_female, company_lease] }
        moveIn: { type: string, format: date }
        priorLandlord: { type: string }
        about: { type: string }
    # D114. The batch badge shapes. Deliberately NOT a list of TenantProfile: that read hands a
    # related caller a tenant's name, occupation and income, and reusing it per row would move a
    # whole list's worth of somebody's income across the wire to draw a tick. A badge needs one bit.
    #
    # `mobiles` carries the numbers as the caller has them, tolerantly: an entry that is not a valid
    # Indian mobile answers `false` rather than failing the request, because this backs a badge on
    # every row of a list and one bad entry must cost that row its badge, not blank every other
    # row's. The list SIZE is capped, and that is a hard 400 -- an unbounded list is one cheap
    # request buying an unbounded amount of database work.
    TenantVerifiedQuery:
      type: object
      required: [mobiles]
      description: >
        The numbers to ask about, as the caller holds them. Maximum 50; a larger batch is 400. An
        entry that is not a valid mobile is not an error -- it answers `false`.
      properties:
        mobiles:
          type: array
          maxItems: 50
          items: { type: string }
    TenantVerified:
      type: object
      description: >
        One answer. `mobile` is the caller's own input echoed back unchanged -- never a normalised,
        stored or masked number -- so a client can key its map on what it sent, and so this endpoint
        provably cannot emit a number the caller did not already hold. `verified` is `false` for an
        unregistered number, a registered one with no badge, and a person the caller has no
        relationship with, alike; there is no reason field, because the difference between those
        three IS the enumeration answer this endpoint refuses to give.
      properties:
        mobile: { type: string, description: The number exactly as supplied by the caller. }
        verified: { type: boolean, readOnly: true }

    # ---- Documents ----
    # ---- Managed properties (private owner records) ----
    ManagedProperty:
      type: object
      description: >-
        A private "single-player" property record (Owner Hub / Property Passport / rent tracker),
        held outside the searchable marketplace until published. `deal` is the catalogue buy|rent
        value (the front-end seam relabels it sale|rent); `publishedListingId` is null until the
        record is published, then the id of the spawned listing.
      properties:
        id: { type: string }
        title: { type: string }
        deal: { type: string, enum: [buy, rent] }
        propertyType: { type: string }
        bhk: { type: [number, 'null'] }
        price: { type: integer, format: int64, description: Amount in whole INR. }
        locality: { type: string }
        localitySlug: { type: [string, 'null'] }
        society: { type: [string, 'null'] }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'] }
        furnishing: { type: [string, 'null'] }
        visibility: { type: string, description: Owner-scoped visibility; private until published. }
        status: { type: string }
        rented: { type: boolean, description: Owner rent-tracker — currently rented. }
        tenantName: { type: [string, 'null'] }
        monthlyRent: { type: [integer, 'null'], format: int64 }
        dueDay: { type: [integer, 'null'], description: Rent due day of month. }
        valuation: { type: [object, 'null'], additionalProperties: true, description: Opaque Rent-o-meter snapshot. }
        publishedListingId: { type: [string, 'null'], description: Id of the spawned listing once published. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagedPropertyCreate:
      type: object
      required: [deal, propertyType, price, locality]
      description: >-
        Server-owned fields are never accepted here — visibility/status (forced private/managed),
        owner (the caller) and publishedListingId (set only by publish).
      properties:
        title: { type: string, description: Optional; synthesized from bhk/type/locality when blank. }
        deal: { type: string, enum: [buy, rent] }
        propertyType: { type: string }
        bhk: { type: [number, 'null'] }
        price: { type: integer, format: int64, minimum: 0, description: Amount in whole INR. }
        locality: { type: string }
        society: { type: [string, 'null'] }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'], description: Defaults sqft when null. }
        furnishing: { type: [string, 'null'] }
        rented: { type: [boolean, 'null'], description: Rent-tracker; defaults false. }
        tenantName: { type: [string, 'null'] }
        monthlyRent: { type: [integer, 'null'], format: int64, description: Defaults to price for a rent deal when omitted. }
        dueDay: { type: [integer, 'null'] }
        valuation: { type: [object, 'null'], additionalProperties: true }
    ManagedPropertyUpdate:
      type: object
      description: >-
        Partial update — only supplied fields are applied. The lifecycle fields
        (visibility/status/publishedListingId) move only through publish, never a client patch.
      properties:
        title: { type: [string, 'null'] }
        deal: { type: [string, 'null'], description: buy|rent }
        propertyType: { type: [string, 'null'] }
        bhk: { type: [number, 'null'] }
        price: { type: [integer, 'null'], format: int64, minimum: 0 }
        locality: { type: [string, 'null'] }
        society: { type: [string, 'null'] }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'] }
        furnishing: { type: [string, 'null'] }
        rented: { type: [boolean, 'null'] }
        tenantName: { type: [string, 'null'] }
        monthlyRent: { type: [integer, 'null'], format: int64 }
        dueDay: { type: [integer, 'null'] }
        valuation: { type: [object, 'null'], additionalProperties: true }
    Document:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        category: { type: string, example: Sale Deed }
        fileName: { type: string }
        url: { type: string, format: uri, description: Short-lived signed URL. }
        sizeBytes: { type: integer, format: int64 }
        mimeType: { type: string }
        uploadedAt: { type: string, format: date-time }
    DocumentRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        requester: { $ref: '#/components/schemas/Party' }
        categories: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, granted, declined, expired] }
        shareToken: { type: [string, 'null'] }
        # Slice-10 spec fix S37. A grant is time-boxed, so the token has a deadline; without it
        # on the wire the client cannot tell a live grant from one about to lapse, and the
        # 'expired' status appears out of nowhere.
        expiresAt: { type: [string, 'null'], format: date-time }
        acknowledgedDisclaimer: { type: boolean, description: Buyer accepted the sensitive-docs disclaimer }
        createdAt: { type: string, format: date-time }
    # Slice-10 spec fix S35. DocumentRequest.acknowledgedDisclaimer is described as "Buyer
    # accepted the sensitive-docs disclaimer", but the create schema had no field to set it, so
    # it could only ever read false. A consent flag the client cannot send is not consent.
    DocumentRequestCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        categories: { type: array, items: { type: string } }
        message: { type: string, maxLength: 500 }
        acknowledgedDisclaimer:
          type: boolean
          default: false
          description: Buyer ticked the sensitive-documents disclaimer before asking.
    # ---- Services & Support ----
    Ticket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        propertyId: { type: [string, 'null'] }
        assignee: { type: [string, 'null'], readOnly: true, description: Assignee display name. Set via TicketUpdate.assigneeId (S42). }
        service: { type: string, description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        value: { $ref: '#/components/schemas/Money' }
        detail: { type: string, description: Free-text request detail }
        notes:
          type: array
          description: Internal staff notes.
          items:
            type: object
            properties:
              by: { type: string }
              text: { type: string }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    # Debt D47. The raiser's view of their own ticket: `Ticket` minus `notes`. Two audiences read a
    # ticket -- the customer who raised it and the desk that works it -- and only one of them may see
    # the internal thread. Expressed as a second schema rather than a nullable field or a role-
    # conditional serializer, because a property that is absent from the type cannot be leaked by a
    # later change to the code that fills it in. `assignee` stays: it is a display name the contract
    # marks readOnly, not internal content, and telling a customer who is handling their request is
    # the point of a support queue.
    CustomerTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        propertyId: { type: [string, 'null'] }
        assignee: { type: [string, 'null'], readOnly: true, description: Assignee display name. Set via TicketUpdate.assigneeId (S42). }
        service: { type: string, description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        value: { $ref: '#/components/schemas/Money' }
        detail: { type: string, description: Free-text request detail }
        createdAt: { type: string, format: date-time }
    TicketCreate:
      type: object
      required: [subject]
      properties:
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        propertyId: { type: string }
        body: { type: string }
    # Slice-11 spec fix S42. `Ticket.assignee` is a display name, and a display name is not a
    # key -- two staffers called Rohit cannot be told apart, and a rename would orphan the ticket.
    # Assignment therefore takes the staff user id; the name is derived for display.
    TicketUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assigneeId: { type: string, description: User id of the staff member to assign, or null to unassign }
        team: { $ref: '#/components/schemas/Team' }
    SupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        # Slice-12 spec fix S49. One boolean, so it has to belong to one side: it means "a support
        # reply the ticket's owner has not read yet". Set when staff or admin answer, cleared by
        # POST /support/tickets/{id}/read, and untouched by the customer's own replies.
        #
        # D50: the desk's side of the same question is a second column, not a second meaning for
        # this one. It is not on this schema -- a customer has no use for "has the desk read me" --
        # it is `awaitingReply` on AdminSupportTicket.
        unread: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        createdAt: { type: string, format: date-time }
    # D51. One row of the ops queue. Deliberately not `SupportTicket`: that schema carries the whole
    # thread inline, which is safe for a customer's own support history and is an unbounded response
    # by another route once the list is the whole platform's. Ops pages this to find a ticket, then
    # opens it at GET /support/tickets/{id}.
    AdminSupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: [string, 'null'] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        # Who is waiting. The mobile is not here: the ticket detail already reveals it to the same
        # callers, and the paged user directory masks it for the same reason -- a list is the shape
        # that gets exported, and this one is the platform's whole support traffic.
        raiser: { type: [string, 'null'], description: Display name of the customer who raised it }
        # D50's second column. This is what makes the list a queue rather than an archive.
        awaitingReply:
          type: boolean
          description: A customer message nobody on the desk has read.
        unread:
          type: boolean
          description: >-
            The other side: a staff reply the customer has not opened. Distinguishes "we have not
            answered" from "we answered and they have not looked".
        createdAt: { type: string, format: date-time }
    SupportTicketCreate:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string }
        category: { type: string }
        body: { type: string }
    ServiceRequest:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: rent-agreement }
        status: { type: string, enum: [awaiting-payment, new, assigned, in-progress, draft-shared, approved, completed, cancelled] }
        propertyId: { type: [string, 'null'] }
        # D119: the structured fields the customer filled at create time, echoed back. Free-form
        # object (property, rent, deposit, scope, ...); null when the request carried none.
        details: { type: ['object', 'null'], additionalProperties: true }
        assignee: { type: [string, 'null'] }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              event: { type: string }
              by: { type: string }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        createdAt: { type: string, format: date-time }
        # What the customer was charged, in whole rupees, for a priced desk (a rent agreement);
        # null for a free one (a legal opinion). Set once, at creation, from the published fee.
        amount: { type: [integer, 'null'], format: int64 }
        # The single-use Cashfree checkout session for a priced request. Present only on the create
        # response (the SDK consumes it once); always null on read. Never persisted.
        paymentSessionId: { type: [string, 'null'] }
    ServiceRequestCreate:
      type: object
      required: [type]
      properties:
        # Closed vocabulary. It used to be free text, which made the payment gate opt-in by
        # spelling: the server prices by matching the string exactly, so `rental` or `Rent-Agreement`
        # bought the rent-agreement desk for free and landed in a queue no team watches.
        type:
          type: string
          enum: [rent-agreement, legal, interior, packers, valuation]
          example: rent-agreement
        propertyId: { type: string }
        # D119: structured, not a flat string — stored as-is and echoed back on ServiceRequest.
        # Optional: omit it, or send an object; capped by serialized size server-side.
        # Must not carry identity numbers (`pan`/`aadhaar` at any depth): this object is echoed
        # verbatim to every staff read of the ops queue. Rejected with 400. Send them to
        # PUT /service-requests/{id}/identities instead (D151).
        details: { type: ['object', 'null'], additionalProperties: true }
    # D151. The parties a Leave & License names, and the two numbers it prints for each.
    #
    # Deliberately not reachable from ServiceRequest, from any list, or from any query keyed on
    # anything but a single request id. This is the entire disclosure surface for the only raw
    # Aadhaar numbers the platform holds -- `identity.kyc` stores masks by design -- and it is one
    # matter at a time or nothing.
    ServiceRequestIdentities:
      type: object
      required: [parties]
      properties:
        parties:
          type: array
          minItems: 1
          # Well past a real agreement (an owner and a handful of tenants) and short of anything
          # worth writing in bulk. This endpoint writes rows and nothing else throttles it (D2).
          maxItems: 12
          items: { $ref: '#/components/schemas/ServiceRequestIdentityInput' }
    ServiceRequestIdentityInput:
      type: object
      required: [partyRole]
      description: >
        Both numbers are optional individually -- a tenant may genuinely have no PAN -- but a party
        carrying neither is rejected with 422. Dropping such a party silently would leave the desk
        short of a number it had no way to know it should have asked for.
      properties:
        partyRole: { type: string, enum: [owner, tenant] }
        # Zero for the owner; the tenant's position in the wizard's list otherwise.
        partyIndex: { type: integer, minimum: 0, default: 0 }
        partyName: { type: string, maxLength: 120 }
        pan: { type: string, pattern: '^$|^[A-Za-z]{5}[0-9]{4}[A-Za-z]$', example: ABCDE1234F }
        aadhaar: { type: string, pattern: '^$|^[0-9]{12}$' }
    ServiceRequestIdentity:
      type: object
      description: >
        Returned in full, unmasked, because a masked PAN cannot be typed into a Leave & License.
        What makes that safe is the route, not the shape: assignee-only, audited, and purged when
        the matter closes.
      properties:
        partyRole: { type: string, enum: [owner, tenant] }
        partyIndex: { type: integer }
        partyName: { type: [string, 'null'] }
        pan: { type: [string, 'null'] }
        aadhaar: { type: [string, 'null'] }
        # Null numbers mean two different things and the reader has to tell them apart: with a null
        # purgedAt the customer left that field empty; with a timestamp the matter is closed and the
        # numbers have been discarded. Without this, a completed request would look identical to a
        # customer who never filled the form.
        purgedAt: { type: [string, 'null'], format: date-time }
    # Slice-10 spec fix S38. POST used to take RentAgreement itself and return no body, so the
    # client could send `status: registered` and then had no id to track what it created.
    RentAgreementCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        tenantMobile: { $ref: '#/components/schemas/Mobile' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        durationMonths: { type: integer, minimum: 1, maximum: 60 }
    RentAgreement:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenantMobile: { $ref: '#/components/schemas/Mobile' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        durationMonths: { type: integer }
        status: { type: string, enum: [draft, e-sign-pending, registered, active, expired] }
        documentUrl: { type: [string, 'null'], format: uri }
    OwnerKyc:
      type: object
      description: |
        The server's view of an owner's KYC. Every field is server-owned: the masks are derived
        from the values the owner submitted (the raw PAN/Aadhaar are never stored or returned),
        and `bankVerified`/`status` come from the KYC provider, never from the client.
      properties:
        panMasked: { type: [string, 'null'], example: 'XXXXX1234X' }
        aadhaarMasked: { type: [string, 'null'], example: 'XXXX XXXX 1234' }
        bankVerified: { type: boolean }
        status: { type: string, enum: [pending, verified, rejected] }
    # Slice-10 spec fix S36. PUT used to accept OwnerKyc itself, which invited the client to send
    # `status: verified` and its own masks -- self-certified KYC, and a mask is not verifiable
    # anyway. The input is the two real identifiers; the server masks, stores only the mask, and
    # owns the verdict.
    OwnerKycUpdate:
      type: object
      required: [pan, aadhaar]
      properties:
        pan:
          type: string
          pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$'
          example: ABCDE1234F
          description: Full PAN. Stored masked; never returned.
        aadhaar:
          type: string
          pattern: '^[0-9]{12}$'
          example: '123412341234'
          description: Full 12-digit Aadhaar. Stored masked; never returned.

    # ---- Billing & Growth ----
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Owner Pro }
        audience: { type: string, enum: [owner, tenant, buyer, agent] }
        price: { $ref: '#/components/schemas/Money' }
        billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
        # The paywall's real ceilings as numbers, not prose parsed from `features` (D109). Null means
        # no cap: an owner plan has no contact limit, and a tenant plan has no listing limit.
        listingLimit: { type: [integer, 'null'] }
        contactLimit: { type: [integer, 'null'] }
        features: { type: array, items: { type: string } }
    Subscription:
      type: object
      description: >
        A subscription. Every field is null on the synthetic "no subscription" document returned
        by `getSubscription` when the caller has never subscribed (the operation declares only a
        200, and an empty object is friendlier to the plan screen than a 404).
      properties:
        id: { type: [string, 'null'] }
        planId: { type: [string, 'null'] }
        # Slice-13 spec fix S50. `pending` added: the row exists from the moment the gateway
        # order is created, and calling that state `active` would give an unpaid subscriber the
        # plan's benefits for as long as they never complete checkout.
        status: { type: [string, 'null'], enum: [pending, active, past-due, cancelled, expired] }
        startedAt: { type: [string, 'null'], format: date-time }
        renewsAt: { type: [string, 'null'], format: date-time }
        # Slice-13 spec fix S50. The gateway order id, mirroring `RentPayment.reference`. Null
        # once nothing is owed; the durable handle the payment webhook correlates against.
        paymentRef: { type: [string, 'null'] }
        # The single-use Cashfree checkout session (Option A hosted checkout). Present only in the
        # immediate `subscribe` response for a priced plan, for `cashfree.checkout(...)`; never
        # stored, so always null from `getSubscription`.
        paymentSessionId: { type: [string, 'null'] }
    SubscribeRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string }
        paymentMethod: { type: string, enum: [upi, card, netbanking] }
    BoostPack:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: 7-day Spotlight }
        price: { $ref: '#/components/schemas/Money' }
        durationDays: { type: integer }
        placement: { type: string, enum: [top, featured, homepage] }
    Boost:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        packId: { type: string }
        # Slice-13 spec fix S51. Null until the payment webhook confirms: the window is measured
        # from the moment the money arrives, not from the moment checkout was opened, so a
        # buyer who pays an hour later still gets the full pack.
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        # Slice-13 spec fix S51. `pending` added, for the same reason as Subscription.status:
        # `201` is only the order being created, and an `active` boost that was never paid for
        # is free promotion.
        status: { type: string, enum: [pending, active, expired] }
        # Slice-13 spec fix S51. The gateway order id to hand to the checkout SDK; null when the
        # pack is free.
        paymentRef: { type: [string, 'null'] }
        # D167. The single-use Cashfree checkout session, mirroring `Subscription.paymentSessionId`.
        # Present only in the immediate `boostListing` response for a priced pack; never stored, so
        # always null from `listListingBoosts`.
        paymentSessionId: { type: [string, 'null'] }
    ServiceOffering:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Home Painting }
        category: { type: string }
        startingPrice: { $ref: '#/components/schemas/Money' }
        description: { type: string }
    ServiceOrder:
      type: object
      properties:
        id: { type: string }
        offeringId: { type: string }
        status: { type: string, enum: [placed, scheduled, in-progress, completed, cancelled] }
        amount: { $ref: '#/components/schemas/Money' }
        scheduledFor: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ServiceOrderCreate:
      type: object
      required: [offeringId]
      properties:
        offeringId: { type: string }
        propertyId: { type: string }
        preferredSlot: { type: string, format: date-time }
        notes: { type: string }
    ReferralSummary:
      type: object
      properties:
        code: { type: string, example: PUNE-AB12 }
        invited: { type: integer }
        converted: { type: integer }
        rewardsEarned: { $ref: '#/components/schemas/Money' }
        rewardsPending: { $ref: '#/components/schemas/Money' }
    Referral:
      type: object
      description: A single referral record with anti-fraud signals (admin/ops view).
      properties:
        id: { type: string, example: RF3000 }
        referrer: { type: string }
        referrerMobile: { $ref: '#/components/schemas/Mobile' }
        referred: { type: string }
        referredMobile: { $ref: '#/components/schemas/Mobile' }
        channel: { type: string, enum: [seeker, owner] }
        reward: { type: string, description: "Human label, e.g. '+15 owner contacts'" }
        # Slice-13 spec fix S54. `reward` is prose and `ReferralSummary.rewardsEarned` is Money,
        # and nothing reconciled the two -- so a checker was asked to approve a payout without
        # being shown its amount, and the summary had no number to sum. This is that number.
        rewardAmount: { $ref: '#/components/schemas/Money' }
        # Slice-13 spec fix S52. `clawed-back` added. Reusing `rejected` for a reversal would
        # erase the distinction between a reward that was never paid and one that was paid and
        # then recovered -- which is precisely the distinction a fraud desk exists to keep.
        status: { type: string, enum: [pending, qualified, rewarded, rejected, clawed-back] }
        risk: { type: string, enum: [low, medium, high] }
        aadhaarVerified: { type: boolean }
        aadhaarUnique: { type: boolean }
        sameDevice: { type: boolean }
        sameIp: { type: boolean }
        velocityHigh: { type: boolean }
        activated: { type: boolean }
        at: { type: string, format: date-time }
        handledBy: { type: [string, 'null'] }
        handledAt: { type: [string, 'null'], format: date-time }
    # ---- Engagement ----
    SavedSearch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [listings, flatmates], default: listings, description: Which discovery surface this alert watches. }
        query: { type: string, description: URL-encoded filter query string (listings alerts). }
        filters: { type: object, additionalProperties: true, description: Structured filter object (alternative to the query string). }
        criteria: { $ref: '#/components/schemas/FlatmateAlertCriteria', description: Present only when `kind` is `flatmates`; listings alerts use `query` / `filters` instead. }
        label: { type: string, description: Short human summary rendered on the alert card and in the dashboard Alerts panel. }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly] }
        channel: { type: string, enum: [whatsapp, sms, email, push], default: whatsapp }
        mobile: { $ref: '#/components/schemas/Mobile', description: Required for the signed-out lead path — an anonymous alert is keyed by mobile so it re-homes on sign-in. }
        newCount: { type: integer, description: New matches since last viewed }
        createdAt: { type: string, format: date-time }
    SavedSearchCreate:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [listings, flatmates], default: listings }
        query: { type: string, description: Required when `kind` is `listings`. }
        filters: { type: object, additionalProperties: true }
        criteria: { $ref: '#/components/schemas/FlatmateAlertCriteria', description: Required when `kind` is `flatmates`. }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly], default: daily }
        channel: { type: string, enum: [whatsapp, sms, email, push], default: whatsapp }
        mobile: { $ref: '#/components/schemas/Mobile' }
    SavedSearchUpdate:
      # Deliberately narrower than SavedSearchCreate: only the "how do you want to hear about it"
      # half. The query/filters/criteria half is the alert's identity -- editing it in place would
      # silently change what any future new-match count was counted against -- so replacing an alert
      # is delete + create. Both fields are optional; absent means unchanged.
      type: object
      properties:
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly] }
        channel: { type: string, enum: [whatsapp, sms, email, push] }
    Review:
      # S26 (slice 8): `context`, `categories` and `recommend` were rendered by the property page
      # (pages/consumer/property/ReviewsSection.jsx) but absent from the contract -- the UI showed
      # a "Verified resident" / "Visited" badge, five sub-ratings and a recommend line that no
      # response could carry. A contract that cannot express what the product ships is the defect,
      # so the spec is fixed first and the schema follows in V16.
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [property, locality, society, owner] }
        targetId: { type: string }
        author: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        context:
          type: string
          enum: [visit, tenant]
          readOnly: true
          description: >
            How the author is known to have experienced the property -- `tenant` if they hold or
            held a tenancy on it, otherwise `visit` for a completed site visit. Drives the
            "Verified resident" / "Visited" badge, and is therefore **server-derived and
            read-only**: accepting it from the client would make the badge forgeable by anyone
            who can POST. Absent on society / locality / owner reviews, which have no visit or
            tenancy concept.
        categories:
          type: object
          description: >
            Optional per-aspect sub-ratings, each 1-5. Sparse -- the UI renders only the keys
            present. The key set is closed; an unknown key is rejected rather than stored.
          properties:
            locality:  { type: integer, minimum: 1, maximum: 5 }
            condition: { type: integer, minimum: 1, maximum: 5 }
            value:     { type: integer, minimum: 1, maximum: 5 }
            owner:     { type: integer, minimum: 1, maximum: 5 }
            accuracy:  { type: integer, minimum: 1, maximum: 5 }
          additionalProperties: false
        recommend:
          type: [boolean, 'null']
          description: >
            Nullable on purpose: the UI distinguishes "did not say" (omit the recommend line)
            from "would not recommend" (`r.recommend != null`), so `false` and absent are not
            the same answer.
        createdAt: { type: string, format: date-time }
    ReviewCreate:
      # Note what is NOT here: `context`. It is derived server-side (see Review.context) and a
      # client-settable badge would defeat the anti-fake-review rule this slice exists to enforce.
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
    # ---- Engagement · Flatmates ----
    # Two feeds, split by the one question a seeker can always answer: is there an
    # address yet? Behavioural spec: docs/flows/consumer/flatmates.md
    FlatmateTab:
      type: string
      description: >
        `move-in` = browse PLACES (rooms, plus groups that already hold a flat).
        `team-up` = browse PEOPLE (solo seekers, plus groups still hunting).
        Replaces the legacy flatmates/rooms/groups triple, which split by our storage
        model rather than by seeker intent.
      enum: [move-in, team-up]
      default: move-in
    FlatmateTabLegacy:
      type: string
      description: >
        Deprecated `?view=` values kept as read aliases so old deep links, saved alerts and
        notification links resolve instead of falling back to the default:
        rooms -> move-in; flatmates | groups -> team-up.
      enum: [rooms, flatmates, groups]
      deprecated: true
    RoomKind:
      type: string
      description: >
        What the room physically is. Drives the derived `attachedBath` — a master bedroom's
        private bathroom is implied, so the host is never asked the same question twice.
        A partitioned living room is the budget option.
      enum: [master, bedroom, living]
    PriceBasis:
      type: string
      description: >
        Whether the rent is quoted per ROOM or per PERSON. `person` (legacy spare-room posts)
        is what one flatmate pays; `room` (owner flat-split) is the whole room rent, split
        equally by whoever takes it. Mixing them silently would make a shared bed look pricier
        than a private room. Defaults to `person` for every post predating the split flow.
      enum: [room, person]
      default: person
    Occupancy:
      type: string
      description: >
        Whether anyone already lives in the home. Orthogonal to `hostRole` / `verificationTier`:
        occupancy answers "will I have flatmates from day one?", host role answers the trust
        question. Derived from the flat's ledger server-side, never trusted from the client.
      enum: [empty, filling, occupied]
    HostRole:
      type: string
      description: Who is letting the space — an owner of the flat, or a sitting tenant seeking a replacement.
      enum: [owner, tenant]
    VerificationTier:
      type: string
      description: >
        Supply-side trust tier. `identity` is the floor and carries no badge; `owner` means the
        post is attached to an Ops-approved property; `tenant` means a sitting tenant attested a
        registered rent agreement (badge withheld until Ops approves the uploaded document).
      enum: [identity, tenant, owner]
    ShareIntent:
      type: string
      description: >
        How the seeker intends to take a per-room-priced room — `solo` (alone), `bring` (with
        someone they already know, two people) or `match` (they want PuneNest to find them a
        room-sharer). Sets the opening message and tells the host how many people are moving in.
      enum: [solo, bring, match]
      default: solo
    FlatmateMoveIn:
      type: string
      description: >
        Move-in availability — the literal `now`, a legacy bucket of days (`15` | `30` | `60`),
        or an ISO-8601 date from the picker.
      example: '2026-08-15'
    FlatmateModStatus:
      type: string
      description: >
        Admin moderation state.


        `pending` is where every newly written post, room and group starts (D72) — visible to its
        author, to nobody else. It is not an accusation; it means only that nobody has looked yet.
        The public feeds match on a whitelist (`live`, `approved`), so a state nobody thought about
        stays invisible rather than leaking.


        Rows written before D72 carry `live`: they were published under the rule in force at the
        time and were not retroactively pulled into the queue.
      enum: [pending, live, approved, flagged, removed, rejected]
      default: pending
    FlatmateModerationQueueItem:
      type: object
      description: >
        One row of the flatmate moderation queue (D72). One shape for all three boards: a seeker
        post, a room and a group are stored and rendered differently, but a moderator asks each the
        same question — who wrote this, where do they say it is, and what did they type into the
        boxes nobody validated.


        `freeText` is the point of the screen; everything else is context. D72 exists because the
        free-text fields are where a broker who cannot publish a phone number in the contact field
        puts one instead, so a queue showing only a headline and a price would pass through exactly
        the abuse it was built to stop.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [post, room, group], description: Which board this came from. }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        authorId: { type: string, format: uuid }
        authorName: { type: [string, 'null'] }
        headline:
          type: [string, 'null']
          description: >
            The strongest short label the row has — the seeker's name, the society and flat, or the
            group title.
        locality: { type: [string, 'null'] }
        freeText:
          type: [string, 'null']
          description: Everything the author typed that nobody validated. Read this one.
        createdAt: { type: string, format: date-time }
    FlatmateSeekerPost:
      type: object
      description: >
        A person looking for flatmates who has **no address yet** — the `team-up` feed.
        One live post per identity (matched on mobile, then name).
      properties:
        id: { type: string, example: s1 }
        name: { type: string }
        gender: { type: string, enum: [any, male, female] }
        age: { type: [integer, 'null'], minimum: 18 }
        occupation: { type: string, example: UX Designer }
        budget: { $ref: '#/components/schemas/Money' }
        localities:
          type: array
          description: Pune localities the seeker will consider (canonical registry names).
          items: { type: string }
          example: [Baner, Balewadi]
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], description: Who they want to share the flat with. }
        roomPref: { type: string, enum: [any, private, shared] }
        tags:
          type: array
          description: Lifestyle habits; also the `habits` filter vocabulary.
          items: { type: string }
          example: [Vegetarian, Non-smoker]
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false, description: Seeker-side of ADR-019 — only badged callers may express interest. }
        verified: { type: boolean, description: Mirrors the seeker's DigiLocker L2 badge at post time (ADR-009a). }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        mobile: { $ref: '#/components/schemas/Mobile' }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        createdAt: { type: string, format: date-time }
    FlatmateSeekerPostCreate:
      type: object
      required: [name, budget, localities]
      properties:
        name: { type: string }
        gender: { type: string, enum: [any, male, female], default: female }
        age: { type: integer, minimum: 18 }
        occupation: { type: string }
        budget: { $ref: '#/components/schemas/Money' }
        localities: { type: array, minItems: 1, items: { type: string } }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], default: any }
        roomPref: { type: string, enum: [any, private, shared], default: any }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false }
    FlatmateRoom:
      type: object
      description: >
        A room offered inside a real flat — the `move-in` feed. Created either by the
        list-property flatmate flow (one spare room, seat-based) or by an owner splitting a
        whole rent listing room by room (occupancy-based, `POST /properties/{propId}/split`).
      properties:
        id: { type: string, example: rm7 }
        type: { type: string, enum: [flatmate] }
        propertyId: { type: [string, 'null'], description: Parent rent listing when this room came from a flat split — the key that ties sibling rooms into one occupancy ledger and one joint agreement. }
        roomKind: { $ref: '#/components/schemas/RoomKind' }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared], description: Derived from `roomKind` on split rooms (master implies attached); asked explicitly on single-room posts. }
        priceBasis: { $ref: '#/components/schemas/PriceBasis' }
        budget: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        occupancy: { $ref: '#/components/schemas/Occupancy' }
        occupants: { type: integer, minimum: 0, maximum: 3, description: People actually living in THIS room. Emergent — tenants decide, the owner only records it. }
        maxOccupants: { type: integer, minimum: 1, default: 3, description: How many people may live in the whole FLAT (the society's rule) — the only ceiling the owner declares. }
        flatCommitted: { type: integer, readOnly: true, description: Derived — people moved into this flat across every sibling room. }
        flatMax: { type: [integer, 'null'], readOnly: true }
        shareMax: { type: integer, readOnly: true, minimum: 1, maximum: 3, description: 'Derived — the most people who could still take this room: min(3 - occupants, flatMax - flatCommitted). Always 1 when priceBasis is `person`.' }
        seatsTotal: { type: integer, minimum: 1, description: Seat model, used by single spare-room posts instead of the occupancy ledger. }
        seatsOpen: { type: integer, minimum: 0 }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        verified: { type: boolean, description: The Verified pill — for split rooms it tracks the PARENT listing's Ops approval, so it can never appear on a flat nobody has checked. }
        agreementDeclared: { type: boolean }
        addressFingerprint: { type: string, description: Stable key for one physical flat, used to detect two hosts claiming the same address. }
        flagForReview: { type: boolean }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        society: { type: string }
        societyId: { type: string }
        flatNumber: { type: string }
        locality: { type: string }
        localities: { type: array, items: { type: string } }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        bhk: { type: string, enum: ['1', '2', '3', '4'], description: "'4' means 4+." }
        flatType: { type: string, example: 3 BHK }
        homeTypeLabel: { type: string, example: Flat }
        gatedCommunity: { type: boolean }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        availableFrom: { type: string, format: date }
        gender: { type: string, enum: [any, male, female] }
        food: { type: string, enum: [any, veg, nonveg] }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        photos: { type: array, items: { type: string, format: uri } }
        owner: { type: string }
        ownerMobile: { $ref: '#/components/schemas/Mobile' }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        createdAt: { type: string, format: date-time }
    FlatmateRoomCreate:
      type: object
      required: [bhk, roomType, locality, society, rentShare, availableFrom, photos]
      description: Single spare-room post from the list-property flatmate flow. The required set mirrors `submitFlatmate` validation.
      properties:
        bhk: { type: string, enum: ['1', '2', '3', '4'] }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared] }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        locality: { type: string }
        societyId: { type: string }
        society: { type: string }
        rentShare: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        availableFrom: { type: string, format: date }
        lookingFor: { type: string, enum: [any, male, female] }
        foodPref: { type: string, enum: [any, veg, nonveg] }
        lifestyle: { type: array, items: { type: string } }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        agreementDeclared: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        ownerConsentMobile: { $ref: '#/components/schemas/Mobile' }
        photos: { type: array, minItems: 1, items: { type: string, format: uri } }
        note: { type: string, maxLength: 600 }
    FlatmateGroup:
      type: object
      description: >
        People teaming up. A group with an address (`propertyId` / `society`) sorts into
        `move-in`; an address-less group is a set of people still hunting and sorts into `team-up`.
      properties:
        id: { type: string, example: g1 }
        title: { type: string }
        locality: { type: string }
        policy: { type: string, enum: [any, women, men], description: '`any` means open-join — a request is auto-accepted.' }
        rent: { $ref: '#/components/schemas/Money', description: Whole-flat rent. }
        perHead: { $ref: '#/components/schemas/Money', description: 'Server-computed rent / seatsTotal (falling back to whole rent when seatsTotal is 0, so a client never divides by zero). Sent rather than derived because every surface that shows a group shows this number, and one rounding rule beats five.' }
        seatsTotal: { type: integer, minimum: 1 }
        seatsOpen: { type: integer, minimum: 0, description: Seats open right now — the honest count for a tenant backfilling one seat. Legacy groups omit it and fall back to seatsTotal minus members. }
        members:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              initials: { type: string, maxLength: 2 }
              verified: { type: boolean }
        propertyId: { type: [string, 'null'] }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        agreementDeclared: { type: boolean }
        ownerConsent: { type: boolean, description: True once the flat's owner confirmed the replacement search via OTP — turning "trust me" into an auditable consent record. }
        ownerConsentMobile: { $ref: '#/components/schemas/Mobile' }
        addressFingerprint: { type: string }
        flagForReview: { type: boolean }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
        ownerName: { type: string }
        ownerMobile: { $ref: '#/components/schemas/Mobile' }
        createdAt: { type: string, format: date-time }
    FlatmateGroupCreate:
      type: object
      required: [title, rent, name]
      properties:
        title: { type: string }
        locality: { type: string, default: Baner }
        policy: { type: string, enum: [any, women, men], default: women }
        rent: { $ref: '#/components/schemas/Money' }
        seats: { type: integer, minimum: 1, default: 2 }
        seatsOpen: { type: integer, minimum: 1, default: 1 }
        name: { type: string, description: The creator's display name — becomes the first member. }
        role: { $ref: '#/components/schemas/HostRole' }
        propertyId: { type: string, description: Only honoured when role is `owner`; must be an Ops-approved listing to earn the owner tier. }
        agreement: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        consentMobile: { $ref: '#/components/schemas/Mobile' }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 600 }
    AgreementDoc:
      type: object
      description: >
        A tenant's uploaded rent agreement — the artifact Ops verifies. Images and PDFs only.
        Files over 3 MB are recorded present-but-not-stored so Ops can still ask for the original.
      properties:
        name: { type: string, maxLength: 200 }
        size: { type: integer, minimum: 0 }
        mime: { type: string, enum: ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'] }
        url: { type: [string, 'null'], format: uri }
        tooLarge: { type: boolean, default: false }
    FlatSplitRequest:
      type: object
      required: [maxOccupants, rooms]
      description: >
        Split an existing **rent** listing into per-room supply. The whole-flat listing keeps
        existing, so the share market never cannibalises core rental inventory.
      properties:
        maxOccupants:
          type: integer
          description: 'People allowed in the whole flat. Must sit in [roomCount, roomCount x 3].'
          minimum: 1
        rooms:
          type: array
          minItems: 1
          description: 'Lettable rooms = bedrooms + hall. Max is bhk + 1; unbounded when bhk is "4" (meaning 4+), so only the flat cap binds.'
          items:
            type: object
            required: [roomKind, rent]
            properties:
              roomKind: { $ref: '#/components/schemas/RoomKind' }
              rent: { $ref: '#/components/schemas/Money' }
              deposit: { $ref: '#/components/schemas/Money', description: Defaults to 2x rent when omitted. }
              note: { type: string, maxLength: 600 }
    FlatSplitResult:
      type: object
      properties:
        count: { type: integer }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        pending: { type: boolean, description: True when the parent listing is not yet Ops-approved, so the rooms start unbadged. }
        flagged: { type: boolean, description: True when a different host already claimed this address. }
        rooms: { type: array, items: { $ref: '#/components/schemas/FlatmateRoom' } }
    FlatmateInterestCreate:
      type: object
      description: Express interest in a seeker, a room or a group.
      properties:
        share: { $ref: '#/components/schemas/ShareIntent', description: Rooms only — how many people are moving in. }
        message: { type: string, maxLength: 4000, description: Optional override; the server generates a share-intent-appropriate opener when absent. }
    FlatmateRequest:
      type: object
      description: >
        Host-facing inbox record. The seeker-side interest map is device-local; this is what the
        HOST sees in Dashboard -> Requests. Deduped by requester + target.
      properties:
        id: { type: string }
        kind: { type: string, enum: [flatmate, room, group] }
        action: { type: string, enum: [request, join], description: '`request` needs host approval; `join` is an open-policy group (already joined, informational).' }
        share: { $ref: '#/components/schemas/ShareIntent' }
        targetId: { type: string }
        targetTitle: { type: string }
        locality: { type: string }
        requesterName: { type: string }
        requesterMobile: { $ref: '#/components/schemas/Mobile' }
        status: { type: string, enum: [pending, accepted, declined] }
        requestedAt: { type: string, format: date-time }
        message: { type: [string, 'null'], description: "The requester's note to the host, written when the request was made." }
        decidedAt: { type: [string, 'null'], format: date-time }
    FlatmateReview:
      type: object
      description: >
        Ops agreement-review queue item. A tenant's "I have a registered rent agreement" is
        self-declared, so tenant-tier posts — plus any address a different host already claimed and
        any flat split whose parent listing is still pending — land here before the post earns a
        badge. One review per group, and one per flat (not per room).
      properties:
        id: { type: string }
        kind: { type: string, enum: [room, group] }
        roomId: { type: [string, 'null'] }
        groupId: { type: [string, 'null'] }
        host: { type: string }
        hostMobile: { $ref: '#/components/schemas/Mobile' }
        address: { type: string }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        flagForReview: { type: boolean, description: Contested address — a DIFFERENT host already claimed it. Fuzzy match, so flag-not-block. }
        ownerConsent: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string, description: Required on reject; shown to the host. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FlatmateAlertCriteria:
      type: object
      description: >
        A flatmates saved-search. Only records filters the active tab actually honours, mirroring
        the tab-gated FilterBar, so a stale value never rides along invisibly.
      properties:
        tab: { $ref: '#/components/schemas/FlatmateTab' }
        q: { type: string }
        locality: { type: string }
        budget: { $ref: '#/components/schemas/Money', description: Omitted when the slider sits at its 40000 "Any" sentinel. }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        gender: { type: string, enum: [male, female] }
        sharing: { type: string, description: '`team-up` only — group size.' }
        attachedBath: { type: boolean, description: '`move-in` only.' }
        verifiedOnly: { type: boolean }
        habits: { type: array, items: { type: string } }
        label: { type: string, readOnly: true, description: Short human summary, e.g. 'Move in now · Baner · Verified'. }
    GroupApplication:
      type: object
      description: A flatmate group applying to an owner's listing. Carries two independent statuses — the owner's decision and admin moderation.
      properties:
        id: { type: string }
        listingId: { type: string }
        listingTitle: { type: string }
        locality: { type: string }
        rent: { $ref: '#/components/schemas/Money' }
        perHead: { $ref: '#/components/schemas/Money' }
        groupTitle: { type: string }
        applicantName: { type: string }
        members: { type: integer }
        seatsTotal: { type: integer }
        status: { type: string, enum: [pending, accepted, declined], description: The OWNER's decision. Admin may never write this. }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        at: { type: string, format: date-time }
    HostEligibility:
      type: object
      description: >
        Anti-broker guardrails, evaluated on every supply-side create (room post, group, flat split).
        A hard block (cap hit, or the same host re-claiming an address) refuses the post; a soft flag
        (a different host already claimed it) still posts but routes to Ops.
      properties:
        blocked: { type: boolean }
        overCap: { type: boolean, description: True at 3 live non-owner-tier posts per identity. Owner-tier posts are exempt from the count but never from the dedupe. }
        duplicate: { type: boolean }
        flagForReview: { type: boolean }
        fingerprint: { type: string }
        reason: { type: string }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, description: 'Dotted domain event (e.g. `offer.received`) or a coarse surface tag: `share` (flatmates), `listing`, `service`.', example: offer.received }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: string }
        createdAt: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, success, warning] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    CmsService:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        description: { type: string }
        link: { type: string }
    Faq:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
    Banner:
      type: object
      properties:
        id: { type: string }
        image: { type: string, format: uri }
        link: { type: string }
        headline: { type: string }
        position: { type: integer }

    # ---- Admin & Analytics ----
    AdminKpis:
      type: object
      description: >
        The ops scorecard. Counts exclude soft-deleted rows. `pendingModeration` is listings
        awaiting a moderation decision (`status=pending`); the abuse-report queue is a separate
        surface and is not folded in here.
      properties:
        totalListings: { type: integer }
        activeListings: { type: integer }
        pendingModeration: { type: integer }
        totalUsers: { type: integer }
        newUsers7d: { type: integer }
        dealsClosed30d: { type: integer }
        revenue30d:
          # 3.1 spelling of a nullable $ref. `nullable: true` alongside an `allOf` was the 3.0
          # idiom; in 3.1 that keyword does not exist, so it said nothing and this field read as
          # non-nullable. A type array cannot express it either — the null has to be a branch.
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
          # S61: this endpoint is x-roles [staff, admin] but /admin/finance is [admin] only,
          # so serving staff a revenue figure here contradicts the very next operation. Null for
          # staff, populated for admin - ops keeps its scorecard without being handed the one
          # number the contract says it must not see.
          description: Platform revenue over the last 30 days. **Null for staff** - admin only.
    AnalyticsPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
    AdminFinance:
      type: object
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        payoutsDue: { $ref: '#/components/schemas/Money' }
        payoutsCompleted: { $ref: '#/components/schemas/Money' }
        refunds: { $ref: '#/components/schemas/Money' }
        breakdown:
          type: array
          items:
            type: object
            properties:
              source: { type: string, example: subscriptions }
              amount: { $ref: '#/components/schemas/Money' }
    AdminSettings:
      type: object
      description: Platform configuration document (SSOT for fees, feature flags and RBAC).
      properties:
        contactUnlockLimit: { type: integer }
        kycBadgeEnabled: { type: boolean, description: Whether the opt-in DigiLocker Verified-badge flow is available (ADR-019). Replaces the retired global Aadhaar gate. }
        listingExpiryDays: { type: integer }
        boostEnabled: { type: boolean }
        maintenanceMode: { type: boolean }
        site:
          type: object
          description: Branding / support contact block.
          additionalProperties: true
        fees:
          type: object
          description: Platform fee configuration (INR); read by the billing layer.
          properties:
            ownerPlanYearly: { type: integer }
            ownerProYearly: { type: integer }
            rentAgreementPlatform: { type: integer }
            seekerPlusTopup: { type: integer }
            featuredListing: { type: integer }
            gstPercent: { type: number, example: 18 }
            rentPayPercent: { type: number, example: 2 }
          additionalProperties: true
        movePack:
          type: object
          additionalProperties: true
        flags:
          type: object
          description: Feature toggles.
          additionalProperties: { type: boolean }
        adminFlags:
          type: object
          additionalProperties: { type: boolean }
        permissions:
          type: object
          description: Per-team permission map (team -> capability -> allowed).
          additionalProperties: true
        customRoles:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              permissions: { type: array, items: { type: string } }
    ContentItem:
      type: object
      description: >
        A CMS row of any of the four managed types. The endpoint is keyed by `{type}` in the path,
        so the caller already knows which fields apply; fields belonging to the other three types
        are null. Kept as one flat schema rather than a `oneOf` because the path parameter is
        already the discriminator, and four write schemas plus four read schemas would restate it
        eight more times.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [announcements, services, faqs, banners] }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        # announcements
        title: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        severity: { type: [string, 'null'] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        active: { type: [boolean, 'null'] }
        # services
        name: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        link: { type: [string, 'null'] }
        # faqs
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        # banners
        image: { type: [string, 'null'] }
        headline: { type: [string, 'null'] }
        position: { type: [integer, 'null'] }
    ContentItemWrite:
      type: object
      description: >
        Create or update payload. Every field is optional here because the required set depends on
        `{type}` and OpenAPI cannot express that against a path parameter; the server enforces it
        (announcements need `title`, services `name`, faqs `question`, banners `image`) and answers
        422 otherwise. On PATCH an absent field is left unchanged.
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 4000 }
        severity: { type: string, enum: [info, warning, critical] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        active: { type: boolean }
        name: { type: string, maxLength: 120 }
        icon: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        link: { type: string, maxLength: 500 }
        question: { type: string, maxLength: 300 }
        answer: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 60 }
        image: { type: string, maxLength: 500 }
        headline: { type: string, maxLength: 200 }
        position: { type: integer, minimum: 0, maximum: 999 }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actor: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string, example: property.approve }
        entity: { type: string, example: property }
        entityId: { type: string }
        checker: { type: [string, 'null'], description: Approver in maker-checker flows. }
        at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    SocietyLead:
      type: object
      properties:
        id: { type: string }
        societyName: { type: string }
        contactName: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        units: { type: integer }
        interest: { type: string, enum: [bulk-listing, society-services, partnership] }
        status: { type: string, enum: [new, contacted, qualified, won, lost] }
        note: { type: [string, 'null'], description: 'The ops working note. This surface is staff-only, so the note never reaches the lead it is about.' }
        createdAt: { type: string, format: date-time }
    SocietyLeadCreate:
      type: object
      required: [societyName, contactName, mobile]
      properties:
        societyName: { type: string }
        contactName: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        units: { type: integer }
        interest: { type: string, enum: [bulk-listing, society-services, partnership] }
