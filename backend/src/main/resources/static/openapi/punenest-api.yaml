components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token issued by the Identity & Access domain. Send as
        `Authorization: Bearer <token>`. Short-lived (15 min); refresh via
        `/auth/refresh`. Claims carry `sub`, `role`, and `mobileVerified`.
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.punenest.in/.well-known/openid-configuration
      description: >
        Target-state federation. The modular monolith issues its own JWTs today;
        an external OIDC provider (Keycloak/Auth0) can be adopted without changing
        resource-server contracts.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`field,(asc|desc)`; repeatable for multi-sort.'
      schema: { type: string, example: createdAt,desc }
    PropertyId:
      name: id
      in: path
      required: true
      description: Property slug or id.
      schema: { type: string, example: 3bhk-koregaon-park-xf12 }
    PropId:
      name: propId
      in: path
      required: true
      description: Property id.
      schema: { type: string }
    GenericId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReqId:
      name: reqId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID to make unsafe money/booking operations retry-safe.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: bad_request, message: Invalid query parameter 'size', status: 400 }
    Unauthorized:
      description: Missing/invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthorized, message: Authentication required, status: 401 }
    Forbidden:
      description: Authenticated but not permitted (RBAC / contact gate).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: forbidden, message: Contact details are gated until Aadhaar verification, status: 403 }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: Property not found, status: 404 }
    ValidationError:
      description: Semantic validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until retry is allowed. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: rate_limited, message: Too many requests, status: 429 }

  schemas:
    # ---- Common / primitives ----
    Error:
      type: object
      required: [error, message, status]
      properties:
        error: { type: string, description: Machine-readable code., example: not_found }
        message: { type: string, description: Human-readable detail. }
        status: { type: integer, description: HTTP status., example: 404 }
        traceId: { type: string, description: Correlation id for observability. }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: mobile }
                  message: { type: string, example: must be a 10-digit Indian mobile }
    PageEnvelope:
      type: object
      description: Envelope for paginated collections; `content` is supplied per endpoint.
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        sort: { type: string, example: createdAt,desc }
    Mobile:
      type: string
      pattern: '^[6-9][0-9]{9}$'
      example: '9876543210'
    Money:
      type: integer
      format: int64
      description: Amount in whole Indian rupees (INR). No decimals/paise.
      example: 2500000
    Deal:
      type: string
      description: Transaction intent.
      enum: [buy, rent]
    Furnishing:
      type: string
      enum: [unfurnished, semi-furnished, furnished]
    PropertyStatus:
      type: string
      enum: [draft, pending, active, rejected, on-hold, rented, sold, archived]
    Role:
      type: string
      enum: [user, owner, tenant, staff, moderator, finance, admin, superadmin]
    Team:
      type: string
      enum: [moderation, support, legal, field-ops, finance]
    Party:
      type: object
      description: A counterparty (buyer/tenant) on a deal, contact gated.
      properties:
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { type: string, enum: [buyer, tenant, owner] }
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        note: { type: string }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string }
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
        attachments:
          type: array
          items: { type: string, format: uri }
    Message:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    # ---- Identity & Access ----
    LoginRequest:
      type: object
      required: [mobile]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        otp: { type: string, description: Required on the verify step., example: '123456' }
        password: { type: string, description: Optional password path. }
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, default: Bearer }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        mobileVerified: { type: boolean }
        aadhaarVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string, format: uri }

    # ---- Catalog & Search ----
    PropertySummary:
      type: object
      description: Lightweight card projection for search/lists (no gated contact).
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        deal: { $ref: '#/components/schemas/Deal' }
        propertyType: { type: string, example: apartment }
        bhk: { type: number, example: 3 }
        price: { $ref: '#/components/schemas/Money' }
        priceUnit: { type: string, enum: [total, per-month], example: per-month }
        area: { type: number, example: 1180 }
        areaUnit: { type: string, example: sqft }
        furnishing: { $ref: '#/components/schemas/Furnishing' }
