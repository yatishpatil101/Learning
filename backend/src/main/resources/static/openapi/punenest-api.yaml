    post:
      tags: [Rentals & Payments]
      summary: Pay rent (tenant)
      operationId: payRent
      description: >
        Initiates a rent payment via the Cashfree Payment Gateway (ADR-017). The `201`
        records the payment as **pending**; its terminal state (`success` / `failed`) is
        confirmed asynchronously by Cashfree via the payment webhook (see `callbacks`).
        Treat the returned record as pending until the webhook confirms.
      externalDocs:
        description: Rent & tenancy payment flow
        url: docs/flows/consumer/rent-tenancy.md
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentPaymentCreate' }
      responses:
        '201':
          description: Payment initiated (pending until the webhook confirms).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentPayment' }
        '422': { $ref: '#/components/responses/ValidationError' }
      callbacks:
        paymentResult: { $ref: '#/components/callbacks/PaymentResult' }
