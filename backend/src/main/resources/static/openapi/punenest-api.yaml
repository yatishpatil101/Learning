  # ============================================================
  # 4. MODERATION (admin property/user moderation, verification, reports)
  # ============================================================
  /properties/{id}/status:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Approve / reject listing
      operationId: setPropertyStatus
      # S28: Approving/rejecting a listing is the core moderation task.
      description: >
        **Approving a listing with no `localitySlug` is refused with 409.** Publishing one puts a
        listing live that is absent from locality search facets, from its locality landing page, from
        saved-search alerts and from its society's home list — while its owner is told it is now
        visible to buyers. The remedy is `assignLocality`, or `createLocality` first if the area is
        genuinely missing from the catalogue; both are reachable with the same `properties:write`
        this route already requires, so the refusal always has a way out for whoever hits it.


        Only approval is blocked. Rejecting an unfiled listing, or sending one back to `pending`, is
        allowed: a listing that is obviously spam must be disposable without first being carefully
        filed, or a curation rule becomes a moderation deadlock. There is no override — one would
        reduce this back to the warning it replaced.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyStatusUpdate' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Approval refused — the listing has no locality yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /properties/{id}/toggle-featured:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Toggle featured flag
      operationId: toggleFeatured
      # S28: Merchandising a listing on the homepage.
      x-roles: [staff, admin]
      responses:
        '200': { description: Toggled }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/pipeline:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Move a staff-posted listing along the owner hand-back funnel
      operationId: advancePropertyPipeline
      description: >
        Staff sometimes create a listing *for* an owner who phoned it in. It goes live owned by an
        account its owner has never signed into, and this funnel is the record of handing it over:
        documents arrive, photographs are uploaded, identity is checked, a claim link goes out, and
        the owner claims the account.


        Stages may be walked **backwards**. They record what has actually come back from an owner,
        and that can be undone — a document turns out to be the wrong flat, a claim link goes to a
        stale number. A forward-only funnel would leave the desk no way to say so except to lie, and
        a board everyone knows is optimistic is worse than no board.


        `409` when the listing was posted by its own owner: it has already arrived where the funnel
        is trying to get to, so a stage on it would be an item that can never be cleared.


        Carries `postOnBehalf:write` rather than `properties:write`, matching
        `createListingOnBehalf`. The desk that may create a listing in a stranger's name is the desk
        that must report on handing it back; splitting the two across permissions would let somebody
        open that liability without being accountable for closing it.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  description: >
                    A point on either funnel. The two vocabularies are disjoint, so the value alone
                    says which one is meant: the first four move `pipelineStage`, the last four move
                    `handbackMilestone`. One field rather than two because the desk experiences it
                    as a single act — moving a listing along — and the response carries both back.


                    `under_review` and `live` are deliberately absent. They are `status` under
                    different names, and the moderation verbs own it; accepting them here would give
                    a listing two disagreeing opinions about whether it is public.
                  type: string
                  enum: [contacted, info_collected, listed, docs_submitted, photos_uploaded, aadhaar_verified, claim_sent, claimed]
      responses:
        '200':
          description: The listing, with its updated `adminPipeline`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /properties/{id}/outreach:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Prepare a WhatsApp message chasing this listing's owner
      operationId: prepareOwnerOutreach
      description: >
        Renders one of the approved templates against this listing, its owner and the calling staff
        member, records it, and returns a `wa.me` link that opens WhatsApp with the message already
        typed out.


        **The status is always `prepared`, and that is not a placeholder.** The send is WhatsApp
        click-to-chat from the staff member's own device — a real mechanism, needing no Business
        Solution Provider and no template approval, but one this server cannot witness. It knows the
        message was composed and handed to a human. Reporting `sent` would be the platform asserting
        delivery in the very record meant to be the evidence for it.


        The caller supplies a template id and nothing else. A request carrying the message body
        would let any staff account send arbitrary text to a member of the public over the
        platform's name, which is a materially larger power than choosing from a library. Variables
        are substituted server-side from the database; a placeholder with no value is left standing
        as literal text, so the gap is visible in the preview rather than silently swallowed.


        `409` when the owner has no mobile on file, because there is nowhere to send it. `400` for
        an unknown or retired template id.


        Carries `postOnBehalf:write` rather than `properties:write`: this puts a message on a
        member of the public's personal phone in the platform's name — the same power, aimed at the
        same people, as creating a listing under their number.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId:
                  type: string
                  description: An id from `GET /admin/message-templates`.
                  example: wa-photos
      responses:
        '200':
          description: The prepared message and the link that sends it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparedMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Moderation]
      summary: What this listing's owner has already been told
      operationId: listOwnerOutreach
      description: >
        Newest first. The reason this endpoint exists is collision: before it, two staff members
        chasing the same owner on the same morning had no way to discover each other, because the
        console counted reminders in the browser's own copy of the data and the WhatsApp panel
        recorded nothing at all.


        Ordering is by preparation time and is dependable to the message rather than to the
        transaction, which matters because the question being asked is "what was this owner told
        last?".
      x-roles: [staff, admin]
      responses:
        '200':
          description: The messages prepared for this listing's owner, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OutreachEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/flag:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Flag listing
      operationId: flagProperty
      # S28: Raising a moderation flag.
      x-roles: [staff, admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Flagged }
    delete:
      tags: [Moderation]
      summary: Clear flag
      operationId: clearFlag
      # S28: Clearing a moderation flag.
      x-roles: [staff, admin]
      responses:
        '204': { description: Cleared }
  /properties/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Archive listing (soft-delete)
      operationId: archiveProperty
      # S28: deliberately NO x-roles. DUAL AUDIENCE: the owner soft-deleting their own listing, or staff/admin taking one down. Role-gating this would remove an owner's ability to delete their own listing. Guard is owner-or-staff, enforced server-side.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived listing
      operationId: restoreProperty
      # S28: deliberately NO x-roles. DUAL AUDIENCE: see archiveProperty.
      responses:
        '200': { description: Restored (status reset to pending) }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/rooms:
    parameters: [ { $ref: '#/components/parameters/PropertyUuid' } ]
    get:
      tags: [Listings]
      summary: Rooms this flat is split into
      description: Returns the per-room supply plus the flat's occupancy ledger. Anonymous read, so the card projection — no host number.
      operationId: listPropertyRooms
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlatmateRoomFeed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/split:
    parameters: [ { $ref: '#/components/parameters/PropertyUuid' } ]
    post:
      tags: [Listings]
      summary: Let this flat room by room
      description: >
        Owner-only, rent-only, once-only. The whole-flat listing keeps existing. Rooms start at
        `identity` tier and unbadged while the parent listing is pending; they are promoted to
        `owner` tier when Ops approves the flat — the badge is earned from the parent's approval,
        never asserted by the act of splitting.
      operationId: splitFlat
      externalDocs: { description: Behaviour, url: docs/flows/consumer/list-property-wizard.md }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatSplitRequest' }
      responses:
        '201':
          description: Split created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatSplitResult' }
        '403': { description: Caller is not the listing's owner (`not_owner`) }
        '409':
          description: '`already_split`, `not_splittable` (sale listing), or blocked by the host-eligibility guardrails.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Stop letting this flat room by room
      description: Refused once anyone has moved in — deleting the rooms would erase a live tenancy.
      operationId: unsplitFlat
      responses:
        '204': { description: Split withdrawn }
        '409': { description: Someone has already moved in (`occupied`) }
  /properties/{id}/admin:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Admin update of property fields
      description: >
        Admin field-level update. NOTE — the source contract reuses
        `PATCH /properties/{id}`; disambiguated here from the public getter to
        avoid method/verb collision (documented assumption).
      operationId: adminUpdateProperty
      # S28: Editing another user's listing to correct it.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        # Slice-15 spec fix S67. The one path that edits a listing the caller does not own had
        # no failure documented at all, so "id does not exist" was undefined behaviour.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users:
    get:
      tags: [Moderation]
      summary: List all users (admin)
      operationId: listUsers
      # S28: Ops needs to find a user to help them; mobile is masked on the list.
      x-roles: [staff, admin]
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: q, in: query, schema: { type: string } }
        # `status` and `archived` are separate filters because they are separate columns: an account
        # can be suspended *and* archived, and the queue a moderator works is the suspended ones that
        # are still live. An unknown status is 422, not an empty page, so a console with a typo in a
        # dropdown fails loudly instead of reporting an empty platform.
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, archived] } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: User detail + listings
      operationId: getUser
      # S28: Ops needs the contact detail to act on a case; the reveal is audited.
      x-roles: [staff, admin]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Moderation]
      summary: Update user
      operationId: adminUpdateUser
      # S28: Editing another person's profile is not a daily ops action.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Archive user (soft-delete)
      operationId: archiveUser
      # S28: Suspending a person from the platform.
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
        '409':
          description: >-
            Refused by the last-administrator floor (D200): this account is the only one left that
            can still manage back-office access, so archiving it would lock the platform out of its
            own back office with no in-product recovery. Give another active administrator
            `users:write` first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived user
      operationId: restoreUser
      # S28: Reinstating a suspended person.
      x-roles: [admin]
      responses:
        '200': { description: Restored }
  /users/{id}/suspend:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Suspend a user
      description: >-
        Stops the account obtaining a session and nothing else: it stays in the directory, visibly
        marked, where the colleagues investigating it can see it. That is what distinguishes it from
        `archive`, which is the soft delete and hides the account from every read path on the
        platform.


        Existing sessions are ended as well as future ones refused. Refusing only at sign-in would
        leave the suspended person holding a valid access token until it expired, so the refresh
        family is revoked and the window closes to the access-token TTL.


        Idempotent: suspending a suspended account is a no-op, not a conflict.
      operationId: suspendUser
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Suspended }
        '403':
          description: >-
            You cannot suspend your own account. It is the one moderation action that removes the
            ability to undo itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Refused by the last-administrator floor (D200) — the same guard `archive` carries, for
            the same reason: this is the only account left that can manage back-office access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/reactivate:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Lift a suspension
      description: >-
        Returns a suspended account to `active`. Idempotent for an account that is already active,
        and deliberately refuses an archived one: that state belongs to `restore`, which carries a
        guard this route does not.
      operationId: reactivateUser
      x-roles: [admin]
      responses:
        '200': { description: Reactivated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account is archived, not suspended. Restore it instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/badge:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Grant or withdraw the Verified badge by hand
      description: >-
        The badge is normally earned through DigiLocker, which stays the only writer of
        `aadhaarVerified`. This route exists for the people that funnel cannot reach — an owner whose
        Aadhaar is not linked to the number they signed up with, a company account, someone whose
        documents an administrator has checked off-platform.


        A hand-granted badge is therefore distinguishable on the wire without any extra field:
        `verified && !aadhaarVerified` means "an administrator vouched for this person".


        Withdrawing an Aadhaar-derived badge is refused with 409, because nothing could restore it:
        the verification handler returns early on an already-verified record, so a replay would not
        undo the withdrawal.


        A grant or withdrawal propagates to every listing the person owns, so the badge on their
        profile and the badge buyers see on their flats can never disagree.
      operationId: setUserBadge
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBadgeRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This badge was earned through Aadhaar verification and cannot be withdrawn here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}/flag:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Raise or lower the internal review flag
      description: >-
        A note between back-office colleagues, never shown to the account holder and never returned
        on `GET /auth/me`. Flagging changes nothing the platform does — the person still signs in,
        their listings still show. It records that somebody noticed something and could not yet act
        on it, so the next moderator inherits the suspicion instead of rediscovering it.


        A reason is required to raise a flag and is enforced by a database constraint as well as
        here: a flag nobody can read the reason for is a smear the next moderator cannot act on.
        Clearing a flag forgets the reason; the history stays in the audit log.
      operationId: setUserFlag
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserFlagRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}/timeline:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: What this person has done, newest first
      description: >-
        Account creation, enquiries sent, visits booked, services requested, properties listed, and
        the moderation actions taken against the account — one chronological list, capped at the
        newest 50 events.


        Deliberately not paged. The ordering is across a union of six sources, so two rows written in
        the same millisecond in different tables have no defined order between them and a cursor
        could skip or repeat one. This answers "who is this" while an operator decides what to do;
        a full history belongs in an export.


        Every entry is joined on a real foreign key, never on a phone number. Entries carry facts,
        not sentences: `kind` and `status` are what the client words the line from, and `label` is
        whatever the source row already calls itself — a property title, a service type, an audit
        action. The server does not own English.


        `users:read`, and not audited: it exposes no contact detail, so logging every click of the
        modal would bury the reads that do.
      operationId: getUserTimeline
      x-roles: [admin]
      responses:
        '200':
          description: Newest first, at most 50
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserTimelineEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/permissions:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: Read one back-office account's permission document
      operationId: getBackOfficePermissions
      # S28 (tech debt D192/D13): reading who may do what is the same privilege as editing it.
      # Returns BOTH what is stored and what it resolves to. They differ whenever the document
      # names something the account's role can never hold, and a screen that echoed only the input
      # is how an administrator ends up believing they granted something.
      x-roles: [admin]
      responses:
        '200':
          description: The stored document and the access it actually resolves to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackOfficeAccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Moderation]
      summary: Replace one back-office account's permission document
      operationId: replaceBackOfficePermissions
      # S28 (tech debt D192/D13): PRIVILEGE. Guarded by `users:write`, the same atom as minting a
      # colleague, because editing who may do what is the same power.
      description: >
        Replaces the document wholesale — a merge could not express "take this away", which is the
        operation this endpoint exists for. **The document may only ever narrow.** What the account
        can do afterwards is the *intersection* of this list with the compiled-in baseline for its
        role, so a name the role cannot hold adds nothing; it is refused at write time (422) rather
        than stored to look meaningful. An empty list is legal and deliberate: it means "this
        account may reach no guarded back-office route", which is a different statement from having
        no document at all. Deleting the document (restoring the role baseline) is not offered
        here — see `back_office_permissions` in V65.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackOfficePermissionsRequest' }
      responses:
        '200':
          description: Stored. The body reports the outcome, not the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackOfficeAccess' }
        '403':
          description: >-
            An administrator cannot edit their own permissions. Otherwise the one account that can
            reach this endpoint could never be narrowed by anybody but itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Refused by the last-administrator floor (D200): the list omits `users:write` and this is
            the only account left that can still manage back-office access. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            The list names something this server does not enforce, or something the target's role
            can never hold. Nothing was written — resend without it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/staff:
    post:
      tags: [Moderation]
      summary: Add staff member
      operationId: addStaff
      # S28: PRIVILEGE ESCALATION. Only an admin may mint a colleague an account.
      x-roles: [admin]
      description: >
        Creates a staff or admin account. **The account cannot authenticate yet**, for two
        independent reasons.


        *Maker-checker (D200).* The account is held behind a second signature: it appears in
        `listPendingStaffApprovals` and every login path refuses it with 403 until an administrator
        *other than its creator* calls `approveStaffAccount`. Without that, an administrator
        narrowed to `users:write` could mint a fresh admin — which has no permission document and so
        resolves to the full role baseline — and sign in as it to recover everything it had been
        scoped out of. The one exception is the bootstrap case: when no other admin-role account
        exists at all, no approval is required, because a rule nobody can satisfy is a lockout
        rather than a control.


        *Activation (D206).* The account is created with **no usable password**, and a single-use,
        expiring invite is sent to the colleague's own mobile. They choose their own credential via
        `redeemStaffInvite`; until then the account is refused on every login path, including the
        OTP one — a passwordless account with a mobile number is not thereby unreachable. Neither
        the creating administrator nor the approving one is ever told that token, and there is no
        `password` field on this request. That is what makes the second signature attest to a
        person: before D206 the maker chose the credential, so the checker was vouching for a row
        while the maker walked away holding the session. This applies to the bootstrap case too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreate' }
      responses:
        '201':
          description: Created, and unable to sign in until approved and activated (see above)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/pending-approvals:
    get:
      tags: [Moderation]
      summary: List back-office accounts waiting for a second administrator
      operationId: listPendingStaffApprovals
      # S28 (tech debt D200): admin only, unlike the directory read, which staff may use. Who is
      # waiting for a second key is the state of the platform's own trust decisions.
      description: >
        The accounts created through `addStaff` that no second administrator has approved yet, oldest
        first. Unpaged — the list is bounded by the colleagues nobody has got round to approving.
        Mobiles are masked, as they are in `listUsers`; revealing one is a separate, individually
        audited act.
      x-roles: [admin]
      responses:
        '200':
          description: Accounts still awaiting approval
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
  /users/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Approve a newly created back-office account
      operationId: approveStaffAccount
      # S28 (tech debt D200): the checker half of maker-checker, on the same `users:write` atom as
      # minting a colleague — letting an account in is the same power as creating one.
      description: >
        Turns the second key, after which the account can sign in. **The approver may not be the
        account's creator**; that is the whole content of maker-checker and it is enforced both here
        and by a CHECK constraint in V67. Not idempotent: approving an already-approved account is a
        conflict rather than a repeat, because the second caller would otherwise believe they
        vouched for a decision somebody else made.
      x-roles: [admin]
      responses:
        '200':
          description: >-
            Approved. The account may now authenticate — once its holder has redeemed their invite
            and set a password (D206); the two gates are independent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403':
          description: >-
            The caller created this account. An account must be approved by a different
            administrator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The account is not waiting for approval — either it was never subject to maker-checker,
            or it has already been approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/verification/aadhaar:
    get:
      tags: [Moderation]
      summary: Get own verification badge status
      operationId: getAadhaarStatus
      # S28: deliberately NO x-roles. The caller's own KYC badge. /me/** self-scoping is the guard.
      description: >
        Returns the caller's **opt-in** identity-verification badge (L2). Absence of a
        badge never blocks browsing, posting or contacting owners (ADR-019).
      responses:
        '200':
          description: Badge status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AadhaarVerification' }
    post:
      tags: [Moderation]
      summary: Start DigiLocker verification (earn the Verified badge)
      operationId: submitAadhaar
      # S28: deliberately NO x-roles. The caller's own KYC submission. /me/** self-scoping is the guard.
      description: >
        Starts the **Cashfree Secure ID DigiLocker** consent flow (ADR-009/017). The
        server returns a short-lived `verificationUrl`; the user completes Aadhaar + OTP +
        consent **on DigiLocker** (never on PuneNest), and the result is delivered
        asynchronously to the Cashfree webhook below. We never receive the raw Aadhaar
        number; dedup uses a composite `identity_hash` (ADR-009b). This is opt-in and only
        awards a trust badge + ranking boost — it is **not** required to use the platform.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycStartRequest' }
      responses:
        '202':
          description: Verification started — redirect the user to `verificationUrl`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStart' }
              examples:
                started:
                  summary: Redirect the user to DigiLocker consent
                  value: { ref: kyc_9f2a, verificationUrl: 'https://verification.cashfree.com/dl/9f2a', expiresAt: '2026-07-26T20:10:00Z' }
          links:
            pollBadgeStatus: { $ref: '#/components/links/PollKycBadge' }
        '409':
          description: >
            This identity is already linked to another account (one Aadhaar = one badge,
            ADR-009b). Fires only inside this opt-in flow; never blocks posting/contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: aadhaar_already_registered, message: This Aadhaar is already verified on another account, status: 409 }
        '422': { $ref: '#/components/responses/ValidationError' }
      externalDocs:
        description: Aadhaar-badge (DigiLocker) sequence & ADRs
        url: docs/system/platform-architecture.md
      callbacks:
        verificationResult: { $ref: '#/components/callbacks/DigilockerVerificationResult' }
  /webhooks/cashfree/digilocker:
    post:
      tags: [Moderation]
      summary: Cashfree DigiLocker verification webhook (provider → backend)
      operationId: cashfreeDigilockerWebhook
      # S28: deliberately NO x-roles. security: [] — a server-to-server callback authenticated by HMAC, not a role.
      security: []
      description: >
        Server-to-server callback from Cashfree Secure ID delivering
        `DIGILOCKER_VERIFICATION_SUCCESS` / failure. Authenticity is verified via the
        HMAC-SHA256 signature over `x-webhook-timestamp + rawBody` (ADR-017); the outbound
        prod call itself is signed with an RSA public-key signature (`X-Cf-Signature`,
        ADR-018). The success payload additionally carries the Aadhaar-linked `mobile`,
        used for the soft mobile-match signal (ADR-009a). Handlers must verify the
        signature, be idempotent, and always return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DigilockerWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /webhooks/cashfree/payment:
    post:
      tags: [Rentals & Payments]
      summary: Cashfree Payment Gateway webhook (provider → backend)
      operationId: cashfreePaymentWebhook
      security: []
      description: >
        Server-to-server callback from the Cashfree PG delivering the **terminal** payment
        outcome (`PAYMENT_SUCCESS_WEBHOOK` / failure) for rent, subscription, boost and
        service-order payments (ADR-017). This is the source of truth for payment state —
        the synchronous `201` on the initiating call is only `pending`. Authenticity is
        verified via the HMAC-SHA256 signature over `x-webhook-timestamp + rawBody`.
        Handlers must verify the signature, be idempotent (dedupe on `orderId`), and always
        return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /properties/{id}/verification:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: Get property review thread
      operationId: getPropertyVerification
      # S28: deliberately NO x-roles. The owner<->ops clarification thread; the owner is a participant. Guard is participant-or-staff.
      responses:
        '200':
          description: Review thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
    post:
      tags: [Moderation]
      summary: Initiate property review
      operationId: initPropertyVerification
      # S28: deliberately NO x-roles. The owner submits their listing for review. Guard is participant-or-staff.
      responses:
        '201': { description: Initiated }
  /properties/{id}/verification/messages:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Add message to review
      operationId: addVerificationMessage
      # S28: deliberately NO x-roles. Both sides of the thread post here. Guard is participant-or-staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201': { description: Added }
  /properties/{id}/verification/read:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Mark review messages read
      operationId: markVerificationRead
      # S28: deliberately NO x-roles. Either participant marks their own side read. Guard is participant-or-staff.
      responses:
        '204': { description: Marked }
  /properties/{id}/verification/decision:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Approve / reject property (admin)
      operationId: verificationDecision
      # S28: The checker half of the maker-checker listing review.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200': { description: Decided }
        '403': { $ref: '#/components/responses/Forbidden' }
  # D218: the checklist gained a write. `property_review_checklist.pass` shipped in V5 and, like
  # `ownership_verified` before it, no code path ever wrote it — the reviewer's working record was
  # seeded and then frozen, so the console kept its ticks in browser storage where the next reviewer
  # to open the case could not see them. Staff-only, and refused to the listing's own owner: the
  # ticks are what the colleague who approves the listing reads before deciding.
  /properties/{id}/verification/checklist:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Tick or untick one verification checklist line (admin)
      operationId: setVerificationChecklist
      description: >
        Addresses the line by its `item` text rather than an id: the items are seeded from a fixed
        per-deal list and the column is immutable, so the text is as stable as a surrogate key and
        survives a client holding a cached case file. One line per call, deliberately — the console
        ticks items as the reviewer works down the list, and a whole-list PUT would make every tick
        a last-write-wins race against a second reviewer on the same case.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistUpdate' }
      responses:
        '200':
          description: Updated case file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # D190/Q15: the ownership gate. `properties.ownership_verified` shipped in V1 and no code path
  # ever wrote it — the badge the home page sells the product on was decorative. These writes are
  # how it is earned and withdrawn; the read is how an owner finds out what is missing. Every write
  # additionally refuses the listing's own owner: roles are additive, so the staff role alone would
  # otherwise let someone verify their own flat.
  /properties/{id}/verification/ownership:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: Ownership evidence and gate status
      operationId: getOwnershipVerification
      description: >
        The documentary case file behind the Ownership Verified badge, plus `missingKinds` — which
        of the three required facts (ownership, owner identity, site presence) has no current
        document. Deliberately NO `x-roles`: like the review thread this sits beside, the listing
        owner is a participant, and an owner who cannot see which document is missing has no way to
        send it. Guard is participant-or-staff, and a stranger gets 404 rather than 403.
        A non-staff caller sees `kind`, `current` and the dates but NOT `docType` or `documentId`:
        on an agent-posted listing the account reading this is not necessarily the person whose
        identity document was sighted, and which government ID an individual holds is personal data
        under the DPDP Act.
      responses:
        '200':
          description: Gate status and recorded evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
    post:
      tags: [Moderation]
      summary: Grant the Ownership Verified badge (staff)
      operationId: verifyOwnership
      description: >
        Accept the recorded evidence and grant the badge. Fails with 400 naming the missing facts if
        any of the three has no current document. The badge's expiry is derived from the evidence:
        the earliest expiry among the documents relied on, or never when all of them are registry or
        identity records. Re-running on an already-verified listing extends the expiry; running it
        after a lapse is a fresh transition and announces again.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Moderation]
      summary: Withdraw the Ownership Verified badge (staff)
      operationId: revokeOwnershipVerification
      description: >
        Withdraw a badge that should not have been granted — forged evidence, or a document that
        turned out to belong to a different flat. Distinct from a lapse, which needs no call at all.
        The recorded evidence is left in place on purpose: it is the record of what was accepted and
        by whom, which is exactly what an investigation into a wrongly granted badge needs to read.
        Idempotent.
      x-roles: [staff, admin]
      parameters:
        - name: reason
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: >
            Why the badge was withdrawn, recorded on the audit entry. Required, as it is for every
            other reversal in the product — stripping a public trust claim with no stated reason
            leaves the next investigator nothing to go on. A query parameter rather than a body
            because DELETE bodies are dropped by several proxies and clients, and a reason that
            silently vanishes in transit is worse than one never sent.
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /properties/{id}/verification/ownership/evidence:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Record one ownership document (staff)
      operationId: recordOwnershipEvidence
      description: >
        Record a document ops has sighted or received. Recording never grants the badge on its own —
        the gate is a judgement about a set of documents taken together, and a system where
        uploading the third file silently promotes a listing is one where nobody decided anything.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipEvidenceCreate' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # D91: GET /admin/property-reviews ADDED to the contract (D144-class defect — it shipped served
  # but undeclared, so no reviewer ever saw its `x-roles` line get written).
  /admin/property-reviews:
    get:
      tags: [Moderation]
      summary: Listing verification queue
      operationId: listPropertyReviews
      description: >
        Every listing verification case file, most recently updated first, so ops can work the
        thread that has been waiting longest. The four operations above all address a case by
        property id and none of them can produce one: `getPropertyVerification` is
        participant-scoped and answers 404 to anyone who is neither the owner nor staff, so without
        this the only way into a case nobody had messaged about was the database. Staff and admin
        only — unlike the thread itself there is no participant here to widen the guard for, since
        the queue spans every owner's listings at once.
      x-roles: [staff, admin]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged case files, most recently updated first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReviewQueuePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # D218: the owner's half of the same queue. Added with its first caller, not after it.
  /me/property-reviews:
    get:
      tags: [Moderation]
      summary: My listings under review
      operationId: listMyPropertyReviews
      description: >
        The caller's own verification case files, most recently updated first. Carries no `x-roles`
        and needs none: the query is scoped to the caller's user id, so there is no row it can
        return that the caller does not already own, and a user with no listings gets an empty page
        rather than a 403.


        It exists instead of N calls to `getPropertyVerification` because the owner dashboard
        renders a verification chip and an unread badge on every listing card at once — without it,
        a twenty-listing dashboard is twenty requests, and nineteen of them 404.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged case files for the caller's listings, most recently updated first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReviewQueuePage' }
  # S30 (slice 9): PATCH /reports/{id} ADDED.
  #
  # The contract shipped an abuse queue that could be written to (POST) and read (GET) but never
  # worked: there was no verb to move a report out of `open`. The Report schema has declared a
  # four-state `status` (open/reviewing/actioned/dismissed) since V7 and nothing could ever set it,
  # so the queue could only grow and two moderators had no way to avoid handling the same report
  # twice. Triage is the operation that makes the other two worth having.
  #
  # Scoped deliberately narrowly: this moves the *report's* state. Acting on the thing reported is
  # a separate, already-specified operation (PATCH /properties/{id}/status,
  # PATCH /users/{id}/archive, PATCH /reviews/{id}/status), so that a moderator's judgement on the
  # complaint and the takedown itself stay two auditable events rather than one hidden side effect.
  /reports/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Moderation]
      summary: Triage a report
      operationId: triageReport
      # S30: Working the abuse queue is the daily ops job.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportTriage' }
      responses:
        '200':
          description: Triaged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # S31 (slice 9): PATCH /reviews/{id}/status ADDED.
  #
  # Reviews were the one piece of user-generated content on the platform with no takedown at all.
  # A review can name a person, allege fraud, and sit permanently on their listing; `reports`
  # accepts `targetType: review`, so the contract already assumed a moderator could act on one, but
  # gave them nothing to act with. Slice 8 recorded this as its single accepted risk and handed it
  # here.
  #
  # No new column: `reviews.status` already carries moderation state, and every read filters
  # status = 'published' -- including the rating aggregate -- so 'rejected' removes the review from
  # the listing and from the score it was moving. See V18 for the reasoning in full.
  /admin/properties/summary:
    get:
      tags: [Moderation]
      summary: Moderation headline counts
      operationId: propertyModerationSummary
      description: >
        The console's KPI strip, counted by the database over every listing.


        A separate operation rather than a field on `listPropertiesForModeration`, because only one
        of the two pages. The queue read is clamped to 100 rows, and the console used to fold its
        counters out of whatever that returned — so "Total", "Pending" and "Flagged" all silently
        meant "of the newest hundred", and stopped moving at exactly the backlog size that makes
        them worth reading. An undrained queue looked identical to a calm one.


        Takes no filters, deliberately. These are the platform's totals, not the current query's: a
        moderator narrowed to one locality still needs to know that four hundred listings are
        waiting overall, and a strip that followed the filters would be a second rendering of the
        table's own row count.


        `total` covers every un-archived listing, `sold` and `rented` included — a closed deal is
        still inventory. `archived` is the one counter outside that floor. `recheck` counts the
        stays-live queue (Q14), which raises none of the other counters because those listings are
        approved and in search. There is no `Under Review` counter: `PropertyStatus` has no such
        value.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Counts over the whole table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyModerationSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/properties/duplicates:
    get:
      tags: [Moderation]
      summary: Listings that look like the same doorway, grouped
      operationId: listDuplicateClusters
      description: >
        The duplicates desk. Clusters are **derived on every request** from the same three signals
        the intake probe uses — a shared electricity meter, a shared address key within one
        locality, and a shared photograph — never stored. There is no `duplicateOf` column and no
        `duplicateFlag`: a duplicate is a relation between two rows, and writing it onto one of them
        would go stale the moment either is edited.


        Guarded by `properties:read` rather than a permission of its own. Everything in the response
        body is a listing the same caller may already read one at a time; what is added is the
        relation between them, which is strictly less than the rows themselves.


        Unpaged, and that is the reason for the report envelope. A truncated *list* is obviously
        partial — the operator sees rows and infers more. A truncated *clustering* is not: if the
        ceiling falls between two members of a genuine pair, that pair does not render as a partial
        cluster, it does not render at all, and the desk looks like a **cleaner** catalogue than it
        is. `truncated` exists so the console can say so out loud instead.


        Same-owner clusters are included and flagged, not filtered — see `sameOwner`.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The desk as it stands, dismissals already removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateClusterReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/properties/duplicates/merge:
    post:
      tags: [Moderation]
      summary: Keep one listing of a cluster, archive the rest
      operationId: mergeDuplicateCluster
      description: >
        Guarded by `properties:write`, not by a duplicates-specific atom: this archives listings,
        which is what that permission governs everywhere else it happens. Reaching the decision from
        the duplicates desk does not make it a smaller act than reaching it from the queue.


        The losers are named explicitly rather than inferred from the cluster, because the
        operator's screen and the server's derivation are two moments apart. A listing that joined
        the cluster in between is one the operator never saw, and inferring the losers would archive
        it on their behalf.


        `204`, with no body. The caller's next move is to re-read the desk — the merge changes which
        clusters exist, and returning the merged one would be returning the thing that no longer
        does.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateMergeRequest' }
      responses:
        '204': { description: Archived }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/properties/duplicates/dismiss:
    post:
      tags: [Moderation]
      summary: Record that a cluster is a coincidence
      operationId: dismissDuplicateCluster
      description: >
        "These are not the same flat." Guarded by `properties:write` although no listing is touched,
        because the effect is that a set of listings stops being shown to every future moderator —
        a suppression, and suppressions are writes. The read atom was the wrong instinct.


        The server derives the signature from the ids in the body rather than accepting one, so the
        verdict is recorded against the set that was actually on screen. A cluster that has since
        gained a member is a different set, and correctly comes back unanswered.


        Idempotent: a double-click, and two operators reaching the same verdict, both return `204`
        rather than one of them hitting the unique index.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateDismissRequest' }
      responses:
        '204': { description: Dismissed, or already dismissed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/properties/owner-standing:
    get:
      tags: [Moderation]
      summary: How much listing allowance one owner has left
      operationId: getOwnerStanding
      description: >
        The lookup an operator does **before** posting a listing on somebody's behalf, keyed by the
        owner's mobile number rather than by a user id -- because at the moment the question is
        asked, the owner may not have an account at all. That is the ordinary case for a
        post-on-behalf: somebody rang the office.


        Guarded by the post-on-behalf **write** permission even though it only reads, and that is
        deliberate rather than an oversight. The number an operator types is the whole input, so a
        read permission here would let anyone holding it probe arbitrary phone numbers for whether
        they belong to a PuneNest owner and how many flats they list. The only people who need the
        answer are the people already allowed to act on it.


        **200 even for a number with no account**, carrying `known: false` and the default
        allowance. A `404` would answer the probing question just as clearly as a `200` would, and
        the operator's real question -- "may I post this one?" -- has an answer either way.
      parameters:
        - { name: mobile, in: query, required: true, schema: { type: string }, description: "The owner's mobile number, as given over the phone" }
      responses:
        '200':
          description: >
            Where this number stands. `overAllowance` is the single field the composer branches on;
            `held` and `allowance` are there so the operator can explain the answer to the person
            on the call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerListingStanding' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/properties:
    get:
      tags: [Moderation]
      summary: Listing moderation queue
      operationId: listPropertiesForModeration
      description: >
        Listings of every status including archived, newest first. The moderation writes
        (`setPropertyStatus`, `toggleFeatured`, `flagProperty`, `clearFlag`, `adminUpdateProperty`)
        all address a listing by id and shipped without any read that could produce one for an
        unapproved listing: `searchProperties` pins `status='approved' AND archived=false`
        unconditionally — it takes no principal, so it cannot relax for staff — and `myListings` is
        scoped to the caller's own account. Unlike `searchProperties`, `status` here *widens*.


        **Owner contact is raw here, not masked**, and this endpoint changed its mind about that.
        It shipped masked, on the argument that a list leaks the whole catalogue's contacts at once
        rather than one at a time. The argument was right about the risk and wrong about the work:
        the desk reading this queue exists to ring owners whose listings are stuck, and a moderator
        denied the number here gets it from somewhere this platform cannot log. The mask never stood
        between the owner and staff — only between the disclosure and the audit trail.


        This is not the contact gate relaxing. The gate (`owner|approved|pending|declined|none`) is
        the owner's decision about one seeker, and no back-office role satisfies it. What applies
        here is `properties:read`, granted per account and revocable per account.
      x-roles: [staff, admin]
      parameters:
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string }, description: 'Locality *slug*, as on searchProperties' }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - { name: possession, in: query, schema: { $ref: '#/components/schemas/PropertyPossession' } }
        - name: q
          in: query
          schema: { type: string }
          description: |
            Free text over title, locality, **owner name, owner mobile and listing id**.

            Wider than the shopper-facing `q` on `searchProperties`, and deliberately a separate
            predicate rather than the same one behind a role check. A desk works from what the
            caller can say out loud: their name, or more reliably their number, because Indian
            names are transliterated inconsistently enough that Rajesh/Rajeshh is an ordinary
            support call. The public search must never gain those two axes — `?q=98234` without a
            login would answer "which owners' numbers start 98234 and what does each of them own",
            which is the directory the masked mobile on a listing card exists to prevent.

            The id is matched as **text, by substring**, so the tail of a uuid pasted out of a chat
            message resolves; an exact-uuid match would reject every one of those.
        - name: status
          in: query
          description: Narrow to one moderation status. Omit for every status.
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - name: archived
          in: query
          description: >
            Tri-state. Omit for both live and archived listings; `true` for archived only; `false`
            for live only. A separate axis from `status` — archiving preserves the moderation state
            the listing was archived from.
          schema: { type: boolean }
        - name: recheck
          in: query
          description: >
            Tri-state. `true` is the stays-live re-check queue (Q14): listings whose owner edited
            `price`, `furnishing` or `possession`, which are waiting for a moderator *while still
            approved and still in search*. `false` excludes them; omit for both. A third axis, for
            the same reason `archived` is one — a re-check does not move `status`, so
            `status=pending` cannot surface it, and `flagged` is not a substitute because flagging
            takes the listing off search, which is exactly the cost this outcome exists to avoid.
            `recheckReason` on each item names the fields to look at. Not sortable by queue age:
            `sort` is clamped to the catalogue's shared whitelist (createdAt/price/area/bhk), and
            widening that would expose the column to the public search too.
          schema: { type: boolean }
        - name: featured
          in: query
          description: >
            Tri-state. `true` is the curated shelf; `false` everything else; omit for both. Backed
            by the `featured` column, so it narrows the catalogue rather than a page — which is the
            reason it exists. The console's Featured tab evaluated this in the browser over the
            hundred listings it had already fetched, and on a 322-listing catalogue that rendered
            the tab **empty** while the summary tiles beside it, from `propertyModerationSummary`,
            said five.
          schema: { type: boolean }
        - name: postedByAdmin
          in: query
          description: >
            Tri-state. `true` is listings the concierge desk created on an owner's behalf via
            `createListingOnBehalf`; `false` owner-posted; omit for both. Filters the
            `posted_by_admin` column and not `adminPipeline.postedByStaff` — the two are written
            together, but the latter is a staff id inside a free-form map, and a queue should not
            depend on the shape of a blob.
          schema: { type: boolean }
        - name: unconfirmed
          in: query
          description: >
            Tri-state. `true` is listings whose owner has gone quiet — freshness `stale` or
            `dormant`, meaning no confirmation of availability for longer than the aging threshold.
            `false` is `active` or `aging`; omit for both. A *freshness* axis, not a status one: the
            rows it returns are approved, un-archived and live in search right now, earning
            impressions on a promise of availability nobody has renewed, which is precisely why the
            desk needs to enumerate them.


            Deliberately not an exact-tier filter (`freshness=stale`). The queue's question is "who
            should we ring", and the answer spans two tiers while excluding a third — `aging`
            listings already get an automated nudge, so putting them in a human's queue buries the
            calls that matter. A per-tier filter for the catalogue view remains a separate question.
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listings, every status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Property' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Moderation]
      summary: Post a listing on an owner's behalf
      operationId: createListingOnBehalf
      description: >
        Creates a listing **owned by the person named in `ownerMobile`**, not by the operator making
        the call. The back-office wizard previously called `createListing`, which attributes the
        listing to the authenticated caller — against a real server that would have made every
        phoned-in listing the operator's: invisible in the owner's own listings, uneditable by them,
        and gating buyers onto the office's number. Attribution is the whole feature, hence a
        separate operation rather than a flag.


        If no account holds that number one is provisioned, with `mobileVerified` **false** — an
        operator typing a number they were told over the phone has proved nothing, and the owner
        earns the flag on their own first sign-in. An existing account is adopted as-is; `ownerName`
        is ignored for it, because an operator's transcription must not overwrite what the owner
        typed themselves.


        The listing is born `pending` like any other. Owner contact comes back raw, which here is
        barely a disclosure: the operator typed that number into this very request a moment ago.
        Masking it on the way out would have hidden a value from the only person who already had it,
        and left this response disagreeing with the queue the listing lands in.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnBehalfListingCreate' }
      responses:
        '201':
          description: The created listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/enquiries:
    get:
      tags: [Moderation]
      summary: Demand board — contact requests across the marketplace
      operationId: listEnquiriesForOps
      description: >
        Every contact request on the platform, newest first. The back office's demand board.


        **There is no `enquiries` table.** The console's Enquiries page ran on a mock collection that
        was a client-side union of contact requests, chat threads, visits and deals under a `kind`
        discriminator. Three of those are real and get a route each — this one,
        `listVisitsForOps`, `listDealsForOps`, plus `getConversationForModeration` for chats. The
        fourth, `call`, never existed anywhere but in the mock: the platform places no calls and
        records none.


        **Read-only, deliberately.** The mock offered *mark responded* and *close* on a row. Every
        row here belongs to two other people — a contact request is the owner's to approve, a visit
        is the participants' to move, a deal is the owner's to close — and there is no column for
        "an operator considers this handled". The two actions are dropped rather than reproduced by
        letting ops write the owner's decision field.


        Requester mobiles are **masked on this list**, at every status — `ContactRequest` reveals the
        raw number to the owner once they approve, and that reveal rests on a relationship an
        operator does not have. No parameter unmasks them here. To reach one number, an
        administrator opens the row: `revealEnquiryForOps` returns the same object unmasked and
        writes an audit entry saying it did.
      x-roles: [staff, admin]
      parameters:
        - name: status
          in: query
          description: Narrow to one status. Omit for the whole board.
          schema: { type: string, enum: [pending, approved, declined] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged contact requests, requester mobiles masked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/OpsEnquiry' }
        '403': { $ref: '#/components/responses/Forbidden' }
