            application/json:
              schema: { $ref: '#/components/schemas/Report' }
  /me/erasure:
    post:
      tags: [Account]
      summary: Ask to be erased (DPDP right to erasure)
      description: >
        D177. Files a request under DPDP Act 2023 s.12(3). Nothing is erased here - erasure is the
        one destructive act on this platform that the person it was done to cannot appeal, because
        afterwards there is no account to appeal from, so a tapped button or a stolen session must
