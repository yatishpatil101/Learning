  /visits:
    get:
      tags: [Listings]
      # Was summarised "All visits (admin)" but carried no `x-roles`, so as written any
      # signed-in user could read every visit on the platform — visitor name, mobile,
      # property address and time. A privacy breach by omission. Rescoped in slice 4 to the
      # caller's own visits, which is what the frontend actually consumes (VisitsTab). A
      # genuine admin surface can be added later with an explicit `x-roles: [admin]`.
      summary: Visits the caller booked
      operationId: listVisits
      description: >
        Newest first, caller-scoped, paged - the mirror of `myVisitRequests` over the same table.
        Paged in step with it so the response shape does not depend on which end of a visit the
        caller is on. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Visit' }
    post:
      tags: [Listings]
      summary: Schedule visit
      operationId: scheduleVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitCreate' }
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
