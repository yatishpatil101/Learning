      operationId: myOffers
      description: >
        Newest first, caller-scoped, paged - the mirror of `offersOnMine` over the same table. Paged
        in step with it so the response shape does not depend on which side of a negotiation the
        caller is on. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged offers
