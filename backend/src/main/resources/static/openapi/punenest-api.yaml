openapi: 3.1.0
info:
  title: PuneNest API
  version: "1.0.0"
  summary: Pune-first real-estate marketplace backend API.
  description: |
    Enterprise API contract for **PuneNest**, a Pune-first real-estate marketplace
    (broker-optional listings, rentals, deals, services and back-office operations).

    This specification is reverse-engineered from the React frontend and the
    canonical design docs:
      - `docs/system/api-contract.md`   — endpoint catalogue (33 domains)
      - `docs/system/domain-model.md`   — entity/enum reference
      - `docs/system/api-architecture-review.md` — architecture-review narrative

    ## Conventions
    - Base path: `/api`
    - Auth: Bearer JWT (`Authorization: Bearer <token>`) unless marked public.
    - Pagination: `?page=0&size=20` (zero-indexed); responses use `PageEnvelope`.
    - Sort: `?sort=field,direction` (e.g. `sort=createdAt,desc`).
    - Dates: ISO-8601 UTC. Money: integer INR (paise-free rupees).
    - Errors: `{ "error": "code", "message": "human-readable", "status": 400 }`.
    - Soft-delete: archive/restore only — no hard DELETE for core aggregates.

    Tags map to **bounded contexts** to support future microservice decomposition.
  contact:
    name: PuneNest Platform Engineering
    url: https://punenest.example.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api
    description: Local development
  - url: https://staging.punenest.example.com/api
    description: Staging
  - url: https://api.punenest.example.com/api
    description: Production

tags:
  - name: Identity & Access
    description: Authentication, sessions, current-user profile, staff onboarding.
  - name: Catalog & Search
    description: Public property discovery, localities, cities, reference/fee data.
  - name: Listings
    description: Owner listing lifecycle (create, edit, deals, offers, visits).
  - name: Moderation
    description: Admin property/user moderation, verification, reports, audit.
  - name: Leads & Contact
    description: Contact-gate requests, enquiries, finalization (maker-checker).
  - name: Rentals & Payments
    description: Rent payments, mandates, payouts, tenancies, tenant profiles.
  - name: Documents
    description: Property documents, buyer document-access requests, sharing.
  - name: Services & Support
    description: Service tickets, support tickets, service workflows, agreements.
  - name: Billing & Growth
    description: Plans, boosts, service orders, referrals, fees.
  - name: Engagement
    description: Saved properties/searches, reviews, notifications, share-a-flat.
  - name: Admin & Analytics
    description: KPIs, analytics, platform settings, content/CMS, society leads.

security:
  - bearerAuth: []

paths:
  # ============================================================
  # 1. IDENTITY & ACCESS
  # ============================================================
  /auth/login:
    post:
      tags: [Identity & Access]
      summary: Login via OTP-verified mobile
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-login:
    post:
      tags: [Identity & Access]
      summary: Staff/admin login
      security: []
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Identity & Access]
      summary: Invalidate current session
      operationId: logout
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Identity & Access]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Identity & Access]
      summary: Update own profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ============================================================
  # 2. CATALOG & SEARCH (public discovery + reference data)
  # ============================================================
  /properties:
    get:
      tags: [Catalog & Search]
      summary: List / search properties
      description: Full-text + faceted search. N+1-safe; owner contact is masked.
      security: []
      operationId: searchProperties
      parameters:
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/Deal' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string } }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - { name: q, in: query, description: Free-text search, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PropertyStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged property summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertySummary' }
  /properties/featured:
    get:
      tags: [Catalog & Search]
      summary: Featured listings
      security: []
      operationId: featuredProperties
      responses:
        '200':
          description: Featured property summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertySummary' }
  /properties/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Catalog & Search]
      summary: Single property detail
      security: []
      operationId: getProperty
      responses:
        '200':
          description: Property detail (owner contact masked until contact gate passed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
  /localities:
    get:
      tags: [Catalog & Search]
      summary: All localities
      security: []
      operationId: listLocalities
      responses:
        '200':
          description: Localities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Locality' }
  /localities/{slug}:
    get:
      tags: [Catalog & Search]
      summary: Locality detail + listings
      security: []
      operationId: getLocality
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Locality detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cities:
    get:
      tags: [Catalog & Search]
      summary: Available cities
      security: []
      operationId: listCities
      responses:
        '200':
          description: Cities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
  /cities/waitlist:
    post:
      tags: [Catalog & Search]
      summary: Join city waitlist
      security: []
      operationId: joinCityWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityWaitlistRequest' }
      responses:
        '201': { description: Added to waitlist }
        '422': { $ref: '#/components/responses/ValidationError' }
  /fees:
    get:
      tags: [Catalog & Search]
      summary: Current fee structure
      security: []
      operationId: getFees
      responses:
        '200':
          description: Fee structure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fees' }
  # ============================================================
  # 3. LISTINGS (owner listing lifecycle)
  # ============================================================
  /me/listings:
    get:
      tags: [Listings]
      summary: My posted properties
      operationId: myListings
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Create new listing
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Created (status = pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/listings/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single listing detail
      operationId: getMyListing
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update listing (foundation-field changes revert status to pending)
      operationId: updateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals:
    get:
      tags: [Listings]
      summary: All deals for my properties
      operationId: myDeals
      responses:
        '200':
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Deal2' }
  /me/deals/{propId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
    get:
      tags: [Listings]
      summary: Deal status for a property
      operationId: getDeal
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal2' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/deals/{propId}/reserve:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Mark property under offer
      operationId: reserveDeal
      responses:
        '200': { description: Reserved }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/deals/{propId}/close:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Close deal (sold/rented)
      operationId: closeDeal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealCloseRequest' }
      responses:
        '200': { description: Closed }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}/reopen:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Reopen property
      operationId: reopenDeal
      responses:
        '200': { description: Reopened }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/deals/{propId}/parties:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Listings]
      summary: Under-offer parties
      operationId: listParties
      responses:
        '200':
          description: Parties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Party' }
    post:
      tags: [Listings]
      summary: Add party
      operationId: addParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Party' }
      responses:
        '201': { description: Added }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}/parties/{idx}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
      - { name: idx, in: path, required: true, schema: { type: integer, minimum: 0 } }
    delete:
      tags: [Listings]
      summary: Remove party
      operationId: removeParty
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/offers:
    get:
      tags: [Listings]
      summary: Offers on my properties
      operationId: offersOnMine
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }
  /offers/mine:
    get:
      tags: [Listings]
      summary: My submitted offers
      operationId: myOffers
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Offer' }
  /offers:
    post:
      tags: [Listings]
      summary: Submit offer
      operationId: submitOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferCreate' }
      responses:
        '201':
          description: Offer submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /offers/{id}/respond:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Listings]
      summary: Accept / decline / counter an offer
      operationId: respondOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferResponse' }
      responses:
        '200': { description: Responded }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /visits:
    get:
      tags: [Listings]
      summary: All visits (admin)
      operationId: listVisits
      responses:
        '200':
          description: Visits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Visit' }
    post:
      tags: [Listings]
      summary: Schedule visit
      operationId: scheduleVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitCreate' }
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/visit-requests:
    get:
      tags: [Listings]
      summary: Visit requests on my properties
      operationId: myVisitRequests
      responses:
        '200':
          description: Visit requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Visit' }
  /visit-requests:
    post:
      tags: [Listings]
      summary: Request a visit
      operationId: requestVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
  /visit-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Listings]
      summary: Confirm / cancel visit
      operationId: updateVisitStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
  # ============================================================
  # 4. MODERATION (admin property/user moderation, verification, reports)
  # ============================================================
  /properties/{id}/status:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Approve / reject listing
      operationId: setPropertyStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyStatusUpdate' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/toggle-featured:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Toggle featured flag
      operationId: toggleFeatured
      responses:
        '200': { description: Toggled }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/flag:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Flag listing
      operationId: flagProperty
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Flagged }
    delete:
      tags: [Moderation]
      summary: Clear flag
      operationId: clearFlag
      responses:
        '204': { description: Cleared }
  /properties/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Archive listing (soft-delete)
      operationId: archiveProperty
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived listing
      operationId: restoreProperty
      responses:
        '200': { description: Restored (status reset to pending) }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/admin:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Admin update of property fields
      description: >
        Admin field-level update. NOTE — the source contract reuses
        `PATCH /properties/{id}`; disambiguated here from the public getter to
        avoid method/verb collision (documented assumption).
      operationId: adminUpdateProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
  /users:
    get:
      tags: [Moderation]
      summary: List all users (admin)
      operationId: listUsers
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: User detail + listings
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Moderation]
      summary: Update user
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Archive user (soft-delete)
      operationId: archiveUser
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
  /users/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived user
      operationId: restoreUser
      responses:
        '200': { description: Restored }
  /users/staff:
    post:
      tags: [Moderation]
      summary: Add staff member
      operationId: addStaff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/verification/aadhaar:
    get:
      tags: [Moderation]
      summary: Check own Aadhaar status
      operationId: getAadhaarStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AadhaarVerification' }
    post:
      tags: [Moderation]
      summary: Submit Aadhaar verification
      operationId: submitAadhaar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AadhaarSubmit' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AadhaarVerification' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties/{id}/verification:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: Get property review thread
      operationId: getPropertyVerification
      responses:
        '200':
          description: Review thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
    post:
      tags: [Moderation]
      summary: Initiate property review
      operationId: initPropertyVerification
      responses:
        '201': { description: Initiated }
  /properties/{id}/verification/messages:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Add message to review
      operationId: addVerificationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201': { description: Added }
