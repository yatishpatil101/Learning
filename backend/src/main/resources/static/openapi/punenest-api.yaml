      tags: [Moderation]
      summary: Correct a locality
      operationId: updateLocality
      description: >
        Sparse patch — an omitted field is left alone. `active` is nullable for that reason: a
        non-nullable boolean would default to false, so a curator fixing a typo in `name` would
        silently retire the area and take its landing page off the site. There is no `slug` field;
