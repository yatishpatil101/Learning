        conversations — correct about the list, and incomplete as a rule. "Party to the conversation"
        is the right test for a user and the wrong one for the platform's own support desk: an agent
        working *a visit was booked and nobody came* is doing the job the product asked of them, and
        `98XXXXX210` does not let them do it.


        **Why this shape is safe.** One id, one row, one audit entry — never a `?reveal=true` on the
        list, which would make "every mobile on the platform" a single request and is the shape of an
