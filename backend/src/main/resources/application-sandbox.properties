# Sandbox profile: production configuration, with demo inventory.
#
# Activated as `SPRING_PROFILES_ACTIVE=prod,sandbox` — this file is a *delta* on top of
# application-prod.properties, not a replacement for it. Later profiles win in Spring, so everything
# prod declares (env-only secrets, Secure cookies, the OTP throttle, migration-only Flyway,
# structured logs) still applies; only the lines below are different. Activating `sandbox` alone
# would silently drop all of that and boot on the developer defaults, which is the failure
# ProdProfileContractTest exists to argue about — so it must always be named second, after prod.

# The demo catalogue, deliberately re-included.
#
# `prod` narrows Flyway to `classpath:db/migration` precisely so that a container called `staging`,
# `preview` or nothing at all cannot put 38 fabricated listings and 78 fabricated users into a live
# catalogue where a buyer cannot tell them apart from real inventory. The rule (D147/D155) is not
# "prod is special" — it is that the seed must be *asked for by name*. This file is that name.
#
# Two consequences to hold in mind when using this profile:
#   * `R__zz_DML_dev_demo_data.sql` is REPEATABLE. Flyway re-runs it on every boot where its
#     checksum has moved, so demo rows edited through the sandbox UI are liable to be overwritten by
#     the next deploy that touches the seed. That is acceptable for a demo and would not be for
#     anything anyone is relying on.
#   * A database that has been seeded cannot be promoted to production. Point production at its own
#     Supabase project — never at the sandbox one with the profile flipped off, because the seed's
#     rows are already committed and dropping the location does not remove them.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
