# Profile 3 of 4 (sandbox): the shared test environment -- production configuration, demo inventory.
# Activated as SPRING_PROFILES_ACTIVE=prod,sandbox, in that order: a delta on prod, not a replacement.
# Later profiles win, so naming `sandbox` alone silently drops prod's secrets, cookies and throttles.
# All four tiers: docs/system/profiles.md.

# The demo catalogue, re-included by name, because `prod` narrows Flyway to migrations deliberately.
# R__zz_DML_dev_demo_data.sql is REPEATABLE, so demo rows edited via the UI are overwritten on deploy.
# A seeded database can never be promoted to production: dropping this does not remove committed rows.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
