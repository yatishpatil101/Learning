# Prod profile: structured JSON logs for ingestion, and strictly env-driven secrets. Nothing
# sensitive is committed here — every secret is a ${ENV} lookup resolved at deploy time.
#
# Note this file is not what keeps the mock providers out: they are @DevOnly, so they require the
# `dev` profile to be named and are absent from every profile that does not, this one included. A
# deploy that misspells `prod` loses the settings below, which is loud; it no longer also gains a
# mock OTP sender, which was not (D147).

# Fail fast if the real secrets/datasource aren't provided by the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
draazy.security.jwt.secret=${JWT_SECRET}
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT}
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET}

# The refresh cookie is a 30-day credential; on the wire in clear it is the same credential. The
# base file leaves this off so http://localhost development works, which is exactly the kind of
# affordance that must not be inherited by a deploy. Hardcoded true rather than a ${ENV} lookup:
# there is no environment where sending it over plain HTTP is the right answer, so there is nothing
# to configure.
draazy.security.refresh-cookie.secure=true

# CorsConfig defaults to http://localhost:5173 so a developer needs no configuration. That default
# is harmless in dev and wrong everywhere else: a prod deploy that forgot this line would refuse
# every request from its own frontend, and the symptom (opaque CORS failures in the browser, with a
# healthy backend and 200s in the access log) points nowhere near the cause. Declared as a ${ENV}
# lookup like every other prod value so the container fails to start instead.
draazy.web.cors.allowed-origins=${WEB_ORIGINS}

# The other half of the same question, and required here for the same reason WEB_ORIGINS is: with it
# unset the delivery check has nothing to compare and skips, which is right in dev and useless in the
# one environment where getting the topology wrong signs every user out fifteen minutes after they
# log in. Set it to the origin the *browser* uses to reach this service -- https://draazy.com when
# a proxy fronts /api, https://api.draazy.com when the UI is on a sibling subdomain.
draazy.web.public-origin=${API_PUBLIC_ORIGIN}

# --- Supabase Postgres, reached through the connection pooler (ADR-007) ----------------------
# The database is Supabase in Mumbai, used as plain Postgres (its Auth/Realtime/Edge products are
# unused), and the app connects through Supavisor — Supabase's PgBouncer-compatible pooler — in
# TRANSACTION mode. That is not a preference: Cloud Run scales to zero and back, so every cold start
# would otherwise open a fresh set of real backends against a free-tier instance whose connection
# ceiling is measured in dozens.
#
# Transaction pooling hands a different backend to each transaction, and two things follow that are
# invisible until production.
#
# 1. Server-side prepared statements do not survive. The JDBC driver names a statement on the fifth
#    execution and re-uses the name on the sixth, by which point the pooler may have moved the
#    session — the driver then gets `prepared statement "S_1" does not exist`, from a query that has
#    already run successfully four times. It presents as an intermittent 500 on the busiest
#    endpoints and nowhere else. Setting the threshold to 0 keeps every statement unnamed; the cost
#    is one extra parse per execution, which is a rounding error next to the round trip to Mumbai.
# 2. Flyway cannot run here at all — see the separate connection below.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Small and allowed to drain to nothing. The pooler exists to multiplex many short-lived clients
# onto few backends, so a large per-instance pool defeats it: N instances each holding 10 idle
# slots exhausts the free tier before any of them is busy. `minimum-idle=0` lets the pool empty
# between requests, which is the right shape for a container that is frozen between them anyway.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Shorter than the pooler's own idle reaping. Hikari's 30-minute default outlives connections
# Supavisor has already closed from its side, and the app discovers that by handing a dead socket to
# a request — an "I/O error occurred" on a query that was fine a minute ago. Retiring connections
# first, on our schedule, turns that into a silent reconnect.
spring.datasource.hikari.max-lifetime=600000

# TLS to Postgres, not left to a string in an env var. Cloud Run (asia-south1) to Supabase (Mumbai)
# is a public-internet hop carrying password hashes, refresh-token rows and PII, and pgjdbc's
# default sslmode is `prefer`, which SILENTLY falls back to plaintext if the server does not offer
# TLS -- no error, no log line, nothing that distinguishes an encrypted link from a cleartext one.
# Hardcoded here for the same reason refresh-cookie.secure is: a deploy must not be able to inherit
# the insecure case by omission.
#
# `require` rather than `verify-full` is the floor, not the goal: it removes the plaintext fallback
# but does not authenticate the server, so it does not stop an active MITM. Raising it needs the
# Supabase CA baked into the image and `sslrootcert` pointed at it -- see docs/DEPLOY.md §6.
#
# A `sslmode=` already present in DB_URL wins over this, because pgjdbc lets URL parameters override
# the properties passed alongside them. That is the intended escape hatch, and the only way to go
# *stricter* per-deploy.
spring.datasource.hikari.data-source-properties.sslmode=require

# Flyway gets its own connection, and it is not the pooler above.
#
# Flyway serialises concurrent deploys with `pg_advisory_lock`, which is a SESSION-level lock, and a
# transaction-mode pooler returns the connection to the pool between statements — so the lock is
# taken on one backend and released against another. Flyway's own documentation states that
# PgBouncer transaction mode is unsupported for this reason. Left pointed at the app's datasource it
# does not fail cleanly: it hangs holding a lock nobody owns, and the container never passes its
# readiness probe.
#
# FLYWAY_DB_URL must therefore be a session-scoped connection to the same database — the Supavisor
# SESSION pooler (same host and credentials as DB_URL, port 5432 instead of 6543) or the direct
# connection. Only the URL is declared: Spring falls back to spring.datasource.username/password
# when spring.flyway.user is unset, which is correct for the session pooler because it takes the
# same `postgres.<project-ref>` credentials. A direct connection uses a different user, and that
# deploy supplies SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD as plain environment variables.
spring.flyway.url=${FLYWAY_DB_URL}

# Schema only. `classpath:db/seed` is declared by application-dev.properties (D147/D155), not by
# the base file, so `prod` on its own does not inherit it. This line is not therefore decorative:
# profiles are not mutually exclusive, and `spring.profiles.active=dev,prod` loads both files --
# this is what wins that collision. The seed inserts 38 demo listings and 78 fabricated users, and
# `R__` means *repeatable* -- Flyway would re-run it on every deploy where the checksum had changed,
# so this is not a one-time risk. Pinned by ProdProfileContractTest.
spring.flyway.locations=classpath:db/migration

# Structured (ECS) JSON logging to stdout for the log pipeline.
logging.structured.format.console=ecs

# Minimal actuator surface in prod. `health` only: Cloud Run's probes need nothing else, and `info`
# publishes build, git and Java-version detail to the public internet, which serves no one but an
# attacker choosing a CVE to try. `show-details` stays at its `never` default, so the health body is
# a bare status.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Re-pin the OTP send budget to its secure values. application-dev.properties loosens these to zero
# cooldown / 100-per-hour for local development (no real SMS gateway there); production sends real
# codes that cost money and ring a chosen victim's phone, so it must enforce the throttle that
# OtpService documents as its default. These equal the OtpService fallbacks — set explicitly here so
# that a `dev,prod` activation, which loads the loosened file too, does not run wide open.
draazy.otp.send-cooldown-seconds=60
draazy.otp.max-sends-per-window=5
# Pinned back to empty so an active `e2e` profile cannot hand a deployment a predictable login code
# (guard 2 of 3; see OtpService#fixedCode). A properties file cannot cover an environment variable
# supplied directly to the process, which is what OtpService#rejectFixedCodeInProduction is for.
draazy.otp.fixed-code=

# --- Client address resolution, behind the load balancer -------------------------------------
# The write rate limiter (D2) keys anonymous callers on the client address, so getting this wrong
# puts the entire internet into one bucket: one host sending 120 logins a minute would then 429
# every anonymous write on the platform for everyone, and the limiter becomes the outage it was
# added to prevent.
#
# INTERNAL_PROXIES must be the actual CIDR of the load balancer, as a Java regex — not Tomcat's
# permissive default, which trusts all RFC1918 space and would therefore trust anything that can
# reach the app over a private network. Declared with no default so a deploy that has not decided
# its topology fails to start; TrustedProxyConfig validates it and says which property is wrong
# rather than letting the failure surface as a regex error from inside Tomcat. The base
# application.properties sets `none`, which is the honest answer for a directly exposed instance
# and the wrong one here.
draazy.security.trusted-proxies=${INTERNAL_PROXIES}
