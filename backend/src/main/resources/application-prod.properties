# Prod profile: real provider impls (@Profile("prod")), structured JSON logs for ingestion, and
# strictly env-driven secrets. Nothing sensitive is committed here — every secret is a ${ENV} lookup
# resolved at deploy time.

# Fail fast if the real secrets/datasource aren't provided by the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
punenest.security.jwt.secret=${JWT_SECRET}

# Structured (ECS) JSON logging to stdout for the log pipeline.
logging.structured.format.console=ecs

# Minimal actuator surface in prod.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
punenest.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET}
