# Prod profile: structured JSON logs for ingestion, and strictly env-driven secrets. Nothing
# sensitive is committed here — every secret is a ${ENV} lookup resolved at deploy time.
#
# Note this file is not what keeps the mock providers out: they are @DevOnly, so they require the
# `dev` profile to be named and are absent from every profile that does not, this one included. A
# deploy that misspells `prod` loses the settings below, which is loud; it no longer also gains a
# mock OTP sender, which was not (D147).

# Fail fast if the real secrets/datasource aren't provided by the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
punenest.security.jwt.secret=${JWT_SECRET}
punenest.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET}

# CorsConfig defaults to http://localhost:5173 so a developer needs no configuration. That default
# is harmless in dev and wrong everywhere else: a prod deploy that forgot this line would refuse
# every request from its own frontend, and the symptom (opaque CORS failures in the browser, with a
# healthy backend and 200s in the access log) points nowhere near the cause. Declared as a ${ENV}
# lookup like every other prod value so the container fails to start instead.
punenest.web.cors.allowed-origins=${WEB_ORIGINS}

# Schema only. `classpath:db/seed` is declared by application-dev.properties (D147/D155), not by
# the base file, so `prod` on its own does not inherit it. This line is not therefore decorative:
# profiles are not mutually exclusive, and `spring.profiles.active=dev,prod` loads both files --
# this is what wins that collision. The seed inserts 38 demo listings and 78 fabricated users, and
# `R__` means *repeatable* -- Flyway would re-run it on every deploy where the checksum had changed,
# so this is not a one-time risk. Pinned by ProdProfileContractTest.
spring.flyway.locations=classpath:db/migration

# Structured (ECS) JSON logging to stdout for the log pipeline.
logging.structured.format.console=ecs

# Minimal actuator surface in prod.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Re-pin the OTP send budget to its secure values. application-dev.properties loosens these to zero
# cooldown / 100-per-hour for local development (no real SMS gateway there); production sends real
# codes that cost money and ring a chosen victim's phone, so it must enforce the throttle that
# OtpService documents as its default. These equal the OtpService fallbacks — set explicitly here so
# that a `dev,prod` activation, which loads the loosened file too, does not run wide open.
punenest.otp.send-cooldown-seconds=60
punenest.otp.max-sends-per-window=5

# --- Client address resolution, behind the load balancer -------------------------------------
# The write rate limiter (D2) keys anonymous callers on the client address, so getting this wrong
# puts the entire internet into one bucket: one host sending 120 logins a minute would then 429
# every anonymous write on the platform for everyone, and the limiter becomes the outage it was
# added to prevent.
#
# INTERNAL_PROXIES must be the actual CIDR of the load balancer, as a Java regex — not Tomcat's
# permissive default, which trusts all RFC1918 space and would therefore trust anything that can
# reach the app over a private network. Declared with no default so a deploy that has not decided
# its topology fails to start; TrustedProxyConfig validates it and says which property is wrong
# rather than letting the failure surface as a regex error from inside Tomcat. The base
# application.properties sets `none`, which is the honest answer for a directly exposed instance
# and the wrong one here.
punenest.security.trusted-proxies=${INTERNAL_PROXIES}
