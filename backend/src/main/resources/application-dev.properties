# Dev profile: keyless mock providers (selected by @DevOnly, which is @Profile("dev") — naming this
# profile is what switches them on, so no profile at all gets the real implementations), readable
# console logs, and a little extra visibility into our own package. Datasource/JWT secret fall back
# to the local defaults in application.properties.
#
# NAMING THE PROFILE IS NO LONGER SUFFICIENT (2026-08-09). DevProfileGuard also requires the
# PUNENEST_DEV_MACHINE environment variable, and refuses to finish booting without it. Do not add it
# here, or to any other properties file: the guard reads it with System.getenv precisely so that a
# properties entry cannot satisfy it, and the whole value of the second signal is that it cannot
# travel inside the repository. docs/LOCAL_DEV.md has the one-time setup.
logging.level.com.punenest.api=DEBUG

# Handy during local development; never enabled in prod.
management.endpoints.web.exposure.include=health,info

# --- Demo seed -------------------------------------------------------------------------------
# Adds db/seed on top of the migrations, so a local database comes up with 38 listings and the
# fixture accounts rather than empty. Deliberately here and not in the base file: this is an
# opt-in that naming the `dev` profile buys, so a deploy under any other name — or none — gets
# migrations only and cannot mix fabricated listings into a live catalogue.
#
# `classpath:db/migration` must be repeated: this property replaces Flyway's locations rather than
# adding to them. src/test/resources/application-dev.properties overrides it back to migration-only,
# because 126 test assertions are exact row counts; TestDatabaseIsolationTest fails if that slips.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# --- OTP send budget (local-development loosening) -------------------------------------------
# OtpService caps codes per mobile: a cooldown between consecutive sends and a per-hour ceiling.
# Those defaults (60s / 5-per-hour, baked into OtpService as the secure fallback) exist to stop a
# real SMS gateway being turned into a billing tap and a harassment doorbell. Under `dev` there is
# no gateway — MockOtpSender just logs the code — so the only thing the production limits achieve
# is to make repeated logins, parity harnesses and live e2e runs trip a 429 after a handful of
# sign-ins.
#
# Here rather than in the base file for the same reason as the seed: this used to be a denylist that
# only `prod` narrowed, so a staging box with a real sender wired would have offered 100 messages an
# hour aimed at any chosen handset. A profile that does not ask for the loosening now keeps
# OtpService's own secure defaults.
punenest.otp.send-cooldown-seconds=0
punenest.otp.max-sends-per-window=100
