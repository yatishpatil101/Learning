# Profile 2 of 4 (e2e): the Playwright suite. Activate ALONGSIDE local (`local,e2e`), never instead:
# `local` binds MockOtpSender, and `e2e` alone gets UnconfiguredOtpSender so every login throws.

# Its own database: the Java suite rolls back against an empty schema, this suite commits, because a
# user registered here must still log in after a backend restart.
spring.datasource.url=${E2E_DB_URL:jdbc:postgresql://localhost:5432/draazy_e2e}

# db/seed already holds the named fixture contract this suite asserts against (fixture-registry.md).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Deterministic OTP, so a spec can type the code rather than scrape a log shared across workers.
# Still generated, hashed, single-use and expiring. Prod pins it empty and OtpService refuses to start.
draazy.otp.fixed-code=${E2E_OTP_CODE:000000}

# Restated rather than inherited, so a run without `local` still gets permissive values.
draazy.otp.send-cooldown-seconds=0
draazy.otp.max-sends-per-window=1000

# Keyed on nothing, so unlike the two above it is not spread across the suite's unique mobiles: at
# the production 500/hour a run exhausts it and every later sign-in stalls. See OtpPlatformSendCapTest.
draazy.otp.max-platform-sends-per-window=100000

# Hundreds of writes per run through a handful of fixture accounts; 120/min would throttle the runner.
draazy.security.rate-limit.writes-per-window=100000

# Outreach links should open on the box that wrote them, so a hard-coded host is visible as a failure.
draazy.app.base-url=${E2E_APP_BASE_URL:http://localhost:5173}

logging.level.com.draazy.api=INFO
