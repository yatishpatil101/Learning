# The browser suite's profile: a persistent database plus a deterministic OTP.
#
# ASCII only, deliberately. A .properties file is read by java.util.Properties as ISO-8859-1 unless
# every reader agrees otherwise, and this repo has already lost a day to encoding; there is nothing
# here that needs a character outside ASCII, so the question is closed by not asking it.
#
# ## Activate it ALONGSIDE dev, never instead of it
#
#   -Dspring-boot.run.profiles=dev,e2e
#
# `dev` is what binds MockOtpSender (it is @DevOnly, and DevProfileGuard additionally demands the
# DRAAZY_DEV_MACHINE environment variable). Booting `e2e` on its own gets SmsOtpSender, which
# throws on every login, so the suite would fail with a timeout that names nothing. This profile
# only overrides what differs from dev; the two are layered, and `e2e` is listed last so it wins.
#
# ## Why a separate database rather than a schema in draazy_test
#
# Opposite isolation needs. The Java suite rolls every row back and asserts 126 exact global counts
# against an empty database (TestDatabaseIsolationTest); this suite commits, and the owner
# requirement is that a user registered here still logs in after a backend restart. Those two cannot
# share storage. See docs/migration/03-e2e-database-and-users.md.
spring.datasource.url=${E2E_DB_URL:jdbc:postgresql://localhost:5432/draazy_e2e}

# ## Why db/seed and not a dedicated db/e2e location
#
# The plan sketched a separate e2e seed location. It is not worth having: `db/seed` already contains
# the named fixture contract this suite asserts against (the `f1c7...` actors, their saved searches,
# tenancy, deal and rent ledger - see docs/system/fixture-registry.md), and a second copy of those
# rows is a second thing to keep in step. One copy cannot drift from itself.
#
# The plan's actual concern - "so it does not leak into draazy or draazy_test" - is already
# satisfied without a new location: draazy_test excludes db/seed in
# src/test/resources/application.properties, which is what keeps it empty, and draazy is the dev
# database, which is *supposed* to have this data. So the leak the separate location was protecting
# against cannot happen.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ## The deterministic OTP
#
# Logging in is the first thing almost every spec does, and today each one scrapes the code out of
# the backend's console (BACKEND_LOG). That works - the existing live-*.spec.js files do it - but it
# forces `workers: 1`, because a single shared log cannot tell two concurrent logins whose code is
# whose. A fixed code removes the scrape and with it the reason the suite must run serially.
#
# The flow stays genuine: the code is still generated, still hashed into `otp_codes`, still consumed
# single-use, still expires, and the send budget and per-code attempt cap are untouched. Only the
# choice of digits becomes predictable, so a spec can type them without reading a log.
#
# Guarded three ways, because this is a login bypass wearing a properties key:
#   1. It is empty by default in application.properties, so no profile gets it by inheritance.
#   2. application-prod.properties pins it back to empty, so `prod,e2e` cannot enable it.
#   3. OtpService refuses to start if it is set while `prod` is active - the fail-closed backstop
#      for the case where someone supplies it as an environment variable rather than a file.
draazy.otp.fixed-code=${E2E_OTP_CODE:000000}

# Restated rather than inherited from dev. A spec logs in far more often than a human does, and if
# this profile is ever run without `dev` these values must still be the permissive ones - otherwise
# the failure is a 429 halfway through a run, which reads as a flaky test rather than a config gap.
draazy.otp.send-cooldown-seconds=0
draazy.otp.max-sends-per-window=1000

# The suite drives hundreds of writes per run through the same handful of fixture accounts; the
# production write budget (120/min) would throttle the runner rather than an attacker.
draazy.security.rate-limit.writes-per-window=100000

# Where this box thinks it lives, for the links outreach messages carry. The default is
# https://draazy.com, and inheriting it here would make this suite unable to tell a template that
# builds its link from configuration apart from one that hard-codes the production host - the two
# render the same string. Pointed at the dev server the browser suite is already driving, which is
# also the honest answer: a link written by this box should open on this box. Same reasoning as
# src/test/resources/application.properties, which pins it for the Java suite.
draazy.app.base-url=${E2E_APP_BASE_URL:http://localhost:5173}

logging.level.com.draazy.api=INFO
