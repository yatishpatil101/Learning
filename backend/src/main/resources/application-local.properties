# Profile 1 of 4 (local): keyless @LocalOnly mocks, demo data, readable logs. Setup: docs/LOCAL_DEV.md.
# Also needs DRAAZY_DEV_MACHINE; LocalProfileGuard reads it via System.getenv, so no file satisfies it.
logging.level.com.draazy.api=DEBUG

management.endpoints.web.exposure.include=health,info

# Adds the demo seed on top of the migrations, opt-in by name so no other profile inherits it.
# db/migration must be repeated: this property REPLACES Flyway's locations rather than adding to them.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# The cooldown matches a deployment, so the sign-in countdown is exercised here too. The window stays
# loose: MockOtpSender only writes to the console. -Ddraazy.otp.send-cooldown-seconds=0 to resend freely.
draazy.otp.send-cooldown-seconds=60
draazy.otp.max-sends-per-window=100
draazy.otp.max-caller-sends-per-window=100

# Empty by default, so you read a random code from the console; non-empty *is* the enable. Living in
# this file is the guard: `sandbox` is standalone, so it cannot inherit a predictable code.
draazy.otp.fixed-code=${LOCAL_OTP_CODE:}

# A browser never stores a Secure cookie on http://localhost, so every local session would die on
# refresh. Naming this profile is the act that asks for the insecure cookie.
draazy.security.refresh-cookie.secure=false
