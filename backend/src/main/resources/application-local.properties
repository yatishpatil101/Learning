# Profile 1 of 4 (local): a developer's machine -- keyless @LocalOnly mocks, demo data, readable logs.
# Also needs DRAAZY_DEV_MACHINE; LocalProfileGuard reads it via System.getenv, so no file satisfies it.
# Setup: docs/LOCAL_DEV.md. All four tiers: docs/system/profiles.md.
logging.level.com.draazy.api=DEBUG

# Handy locally; prod exposes health only.
management.endpoints.web.exposure.include=health,info

# Adds the demo seed on top of the migrations. Opt-in by name, so no other profile can inherit it.
# db/migration must be repeated: this property REPLACES Flyway's locations rather than adding to them.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# MockOtpSender only logs the code, so there is no gateway to protect and 60s/5 would 429 normal logins.
draazy.otp.send-cooldown-seconds=0
draazy.otp.max-sends-per-window=100

# Predictable login code, opt-in: empty here, so this profile behaves as before by default and you
# read a random code from the console. Set LOCAL_OTP_CODE=000000 in .env.local to skip that, which
# is worth it while WhatsApp delivery is blocked on Meta business verification.
#
# Non-empty *is* the enable, mirroring e2e's `${E2E_OTP_CODE:000000}` - a separate boolean would add
# two unreachable wrong states (flag on with no code, code set with flag off) and buy nothing.
#
# Living in this file is itself a guard: `sandbox` is a standalone profile and never loads it, so the
# shared environment cannot pick this up by inheritance. Sandbox's own pin and OtpService's boot check
# still backstop the environment-variable route. Only the choice of digits is weakened - the code is
# still hashed, single-use, TTL-bound, and a wrong one still fails.
draazy.otp.fixed-code=${LOCAL_OTP_CODE:}

# A browser never stores a Secure cookie on http://localhost, so every local session would die on
# refresh. Naming this profile is the act that asks for the insecure cookie.
draazy.security.refresh-cookie.secure=false
