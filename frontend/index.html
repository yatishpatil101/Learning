<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: the keyboard resizes the layout viewport, as iOS already does, so fixed bottom bars stay above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0d1a" />
    <!-- Same geometry as src/components/brand/LogoMark.jsx, e2e/scripts/gen-app-icons.mjs and
         frontend/scripts/logo-preview.html. data-light is the light-theme variant; keep both in step. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f0d1a'/><g transform='translate(-0.64 1.28) scale(0.96)'><path fill='%2314b8a6' fill-rule='evenodd' d='M17 8 H32 A24 24 0 0 1 32 56 H17 A5 5 0 0 1 12 51 V13 A5 5 0 0 1 17 8 Z M17.5 12.5 H32 A19.5 19.5 0 0 1 32 51.5 H17.5 A1 1 0 0 1 16.5 50.5 V13.5 A1 1 0 0 1 17.5 12.5 Z'/><path fill='%2314b8a6' stroke='%2314b8a6' stroke-width='4' stroke-linejoin='round' d='M23.2 19.45 L30.7 23.17 V40.83 L23.2 44.55 Z'/></g></svg>"
      data-light="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f3f7f6'/><g transform='translate(-0.64 1.28) scale(0.96)'><path fill='%230d9488' fill-rule='evenodd' d='M17 8 H32 A24 24 0 0 1 32 56 H17 A5 5 0 0 1 12 51 V13 A5 5 0 0 1 17 8 Z M17.5 12.5 H32 A19.5 19.5 0 0 1 32 51.5 H17.5 A1 1 0 0 1 16.5 50.5 V13.5 A1 1 0 0 1 17.5 12.5 Z'/><path fill='%230d9488' stroke='%230d9488' stroke-width='4' stroke-linejoin='round' d='M23.2 19.45 L30.7 23.17 V40.83 L23.2 44.55 Z'/></g></svg>" />
    <!-- Before first paint, or a light-theme visitor sees a dark flash. Mirrors applyAppPrefs in src/lib/localPrefs.js. -->
    <script>try { if (JSON.parse(localStorage.getItem('dzAppPrefs') || '{}').theme === 'light') { document.documentElement.classList.add('light'); document.querySelector('meta[name="color-scheme"]').content = 'light'; document.querySelector('meta[name="theme-color"]').content = '#f3f7f6'; var f = document.querySelector('link[rel="icon"]'); f.dataset.dark = f.href; f.href = f.dataset.light; } } catch (e) {}</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Cashfree hosted checkout: the SDK is a loader, and the modal POSTs a form from THIS
         document into an iframe on the checkout host. Keep in step with public/_headers. -->
     <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://www.googletagmanager.com https://us-assets.i.posthog.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://i.ytimg.com; connect-src 'self' ws: wss: https://images.unsplash.com https://maps.googleapis.com https://maps.gstatic.com https://places.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://us.i.posthog.com https://us-assets.i.posthog.com https://sandbox.cashfree.com https://payments-test.cashfree.com https://api.cashfree.com https://payments.cashfree.com; frame-src 'self' data: blob: https://sandbox.cashfree.com https://api.cashfree.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <title>Draazy — Flats, Commercial & Plots in Pune | Zero Brokerage</title>
    <meta name="description" content="Draazy is Pune's broker-free real-estate marketplace. Buy, rent or list flats, villas, plots, commercial spaces and PGs — deal directly with verified owners, zero brokerage." />

    <!-- Apple has never supported SVG touch icons; it falls back to the PNG. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Draazy" />
    <meta property="og:title" content="Draazy — Flats, Commercial & Plots in Pune | Zero Brokerage" />
    <meta property="og:description" content="Pune's broker-free property marketplace for flats, commercial spaces and plots. Verified owners, zero brokerage, direct contact." />
    <meta property="og:url" content="https://draazy.com" />
    <meta property="og:image" content="https://draazy.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@draazy" />
    <meta name="twitter:title" content="Draazy — Flats, Commercial & Plots in Pune | Zero Brokerage" />
    <meta name="twitter:description" content="Pune's broker-free property marketplace for flats, commercial spaces and plots. Verified owners, zero brokerage, direct contact." />
    <meta name="twitter:image" content="https://draazy.com/og-image.jpg" />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- `preconnect` warms the socket but cannot remove the hop, and on a 4G phone Outfit ships 400/500/600/700/800 — the five weights the app actually uses. -->
    <link rel="preload" href="/fonts/outfit-600-2.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Starts the reference-data read before the bundle loads; services/http.js adopts it. A <link rel="preload"> was blocked
         by the CSP after the first load, so this is a fetch whose body is buffered: an unread one keeps the request open. -->
    <script>window.__dzBootstrap = fetch('__API_BASE__/bootstrap', { credentials: 'include', headers: { Accept: 'application/json' } }).then(function (r) { return r.blob().then(function (b) { return new Response(b, { status: r.status, statusText: r.statusText, headers: r.headers }); }); }).catch(function () { return null; });</script>
  </head>
  <body>
    <!-- Netlify Forms: hidden static declaration so the deploy bot registers the "pmf-lead" form at build time (the React SPA posts to it via fetch). This -->
    <form name="pmf-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="context" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <input type="text" name="property" />
      <input type="text" name="owner" />
      <input type="text" name="message" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
