<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real values on
         notched / gesture-bar devices. Without it every safe-area rule in the app is a no-op
         and fixed bottom bars sit under the home indicator. Desktop is unaffected (insets are 0). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d1a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Content-Security-Policy: restricts scripts to self + the Google Maps SDK so an
         injected <script src="evil"> can't run. 'unsafe-inline'/'unsafe-eval' are kept for
         Vite HMR and the Maps loader; ws:/wss: cover the dev HMR socket.
         Keep connect-src in step with netlify.toml — images.unsplash.com must be listed
         there (not only in img-src) because the service worker fetch()es listing photos,
         and a worker fetch is governed by connect-src. -->
    <!-- style-src/font-src still allow fonts.googleapis.com / fonts.gstatic.com even though
         OUR web fonts are self-hosted: the Maps SDK injects its own <link> for Google Sans
         and Material Symbols at runtime, and blocking them strips the icons off the map's
         zoom / fullscreen controls. Removing the two origins looked like dead-allowance
         cleanup and silently broke the map chrome — `consumer/property/infotips.spec.js`
         catches it by failing on any CSP console error. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://images.unsplash.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <title>PuneNest — Flats, Commercial & Plots in Pune | Zero Brokerage</title>
    <meta name="description" content="PuneNest is Pune's broker-free real-estate marketplace. Buy, rent or list flats, villas, plots, commercial spaces and PGs — deal directly with verified owners, zero brokerage." />

    <!-- Favicon — the Draazy "D" mark, inline so it costs no request and can never
         404 behind a stale cache. Same geometry as src/components/brand/LogoMark.jsx,
         e2e/scripts/gen-app-icons.mjs and frontend/scripts/logo-preview.html; if you
         change one, change all four.

         The counter is knocked out with fill-rule=evenodd, so the ink tile shows
         through it rather than being painted — which is why this needs no <mask> and
         no per-instance id. translate/scale centres the art box (12..56, 8..56) on
         the tile and leaves optical padding at 16px. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f0d1a'/><g transform='translate(-0.64 1.28) scale(0.96)'><path fill='%2314b8a6' fill-rule='evenodd' d='M17 8 H32 A24 24 0 0 1 32 56 H17 A5 5 0 0 1 12 51 V13 A5 5 0 0 1 17 8 Z M17.5 12.5 H32 A19.5 19.5 0 0 1 32 51.5 H17.5 A1 1 0 0 1 16.5 50.5 V13.5 A1 1 0 0 1 17.5 12.5 Z'/><path fill='%2314b8a6' stroke='%2314b8a6' stroke-width='4' stroke-linejoin='round' d='M23.2 19.45 L30.7 23.17 V40.83 L23.2 44.55 Z'/></g></svg>" />
    <!-- Apple has never supported SVG touch icons; it falls back to the PNG. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PuneNest" />
    <meta property="og:title" content="PuneNest — Flats, Commercial & Plots in Pune | Zero Brokerage" />
    <meta property="og:description" content="Pune's broker-free property marketplace for flats, commercial spaces and plots. Verified owners, zero brokerage, direct contact." />
    <meta property="og:url" content="https://punenest.com" />
    <meta property="og:image" content="https://punenest.com/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@punenest" />
    <meta name="twitter:title" content="PuneNest — Flats, Commercial & Plots in Pune | Zero Brokerage" />
    <meta name="twitter:description" content="Pune's broker-free property marketplace for flats, commercial spaces and plots. Verified owners, zero brokerage, direct contact." />
    <meta name="twitter:image" content="https://punenest.com/og-image.jpg" />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Fonts are self-hosted (public/fonts, generated by scripts/fetch-fonts.mjs
         into src/styles/fonts.css). The old <link> to fonts.googleapis.com sat on
         the critical path and cost a full third-party round trip — DNS + TLS + the
         CSS — before the browser even learned which font file to ask for.
         `preconnect` warms the socket but cannot remove the hop, and on a 4G phone
         (~80% of this audience) that was the largest render-blocking item here.

         Outfit ships 400/500/600/700/800 — the five weights the app actually uses.
         300 and 900 were requested for a long time and used nowhere: zero
         `font-light`/`font-black` utilities, zero `font-weight: 300|900`, zero
         inline `fontWeight`. Verified by grep, not assumed — 500 (16 uses) and 700
         (39 uses) look droppable at a glance and are not. If you add `font-light`
         or `font-black`, add the weight to the script or the browser will
         synthesise it and the type will look subtly wrong.

         Noto Sans Devanagari is still split behind its own unicode-range, so an
         English visitor never downloads it — Outfit carries no Devanagari glyphs,
         and without it Hindi/Marathi fell back to whatever the OS supplied
         (Nirmala UI / Noto / Devanagari Sangam MN), giving three different
         typographic voices for the same page.

         Only 600 is preloaded: it is the most-used weight (40 declarations) and
         appears in the first paint. Preloading all five would put ~157 KB on the
         critical path to save a font that may never render. -->
    <link rel="preload" href="/fonts/outfit-600-2.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Netlify Forms: hidden static declaration so the deploy bot registers the
         "pmf-lead" form at build time (the React SPA posts to it via fetch). This
         is inert markup — harmless when not deployed on Netlify. -->
    <form name="pmf-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="context" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <input type="text" name="property" />
      <input type="text" name="owner" />
      <input type="text" name="message" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
